      type: happy_path
      priority: P1
      automation_candidate: true
    - scenario: EX2
      type: happy_path
      priority: P2
      automation_candidate: true
    - scenario: EX3
      type: boundary
      priority: P1
      automation_candidate: true
    - scenario: EX4
      type: negative
      priority: P1
      automation_candidate: true
    - scenario: EX5
      type: negative
      priority: P1
      automation_candidate: true
    - scenario: EX6
      type: negative
      priority: P2
      automation_candidate: true
    - scenario: EX7
      type: negative
      priority: P2
      automation_candidate: true
    - scenario: EX8
      type: error_handling
      priority: P1
      automation_candidate: true
    - scenario: EX9
      type: happy_path
      priority: P2
      automation_candidate: true
    - scenario: EX10
      type: error_handling
      priority: P2
      automation_candidate: true
    - scenario: EX11
