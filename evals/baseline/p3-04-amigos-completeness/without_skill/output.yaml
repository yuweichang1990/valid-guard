    - scenario: EX13
      type: boundary
      priority: P3
      automation_candidate: true

  session_outcomes:
    total_rules: 8
    total_examples: 13
    total_ambiguities: 15
    high_impact_ambiguities: 6
    recommended_actions:
      - action: Resolve AMB1 (approval thresholds) before development begins
        owner: business_analyst
        priority: high
      - action: Resolve AMB3 (accounting notification mechanism) before development begins
        owner: developer
        priority: high
      - action: Resolve AMB6 (segregation of duties) with compliance team
        owner: business_analyst
        priority: high
      - action: Resolve AMB9 (approval atomicity with notifications) in architecture review
        owner: developer
        priority: high
      - action: Resolve AMB15 (ERP integration) with IT and accounting stakeholders
        owner: developer
        priority: high
      - action: Define vendor notification email template with business stakeholders
        owner: business_analyst
        priority: medium
      - action: Define notification retry policy with infrastructure team
        owner: developer
        priority: medium
      - action: Schedule follow-up Three Amigos session after ambiguities are resolved
        owner: quality_engineer
        priority: medium
