    examples:
      - input:
          a: 2
          b: 3
        expected:
          sum: 5
        description: "Two positive integers produce their arithmetic sum."
    test_ref: "CalculatorAddTest::add_twoPositiveIntegers_returnsCorrectSum"
    status: covered
    priority: 1
    tags:
      - "happy-path"
      - "assertion-fix"

  - name: "Identity property — adding zero"
    description: "Verifies that adding zero to any number returns that number unchanged."
    type: edge_case
    risk: medium
    risk_rationale: "Impact: 3, Frequency: 2, Consequence: 2, Detectability: 1. Average: 2.0 -> medium."
    techniques:
      - equivalence_partitioning
      - boundary_value
    technique_rationale: "Zero is both an equivalence class boundary and the additive identity — it must be tested explicitly."
    preconditions:
      - "Calculator instance is initialized"
    examples:
      - input:
          a: 0
          b: 0
        expected:
          sum: 0
        description: "Zero plus zero equals zero."
      - input:
          a: 0
          b: 5
        expected:
          sum: 5
        description: "Zero plus positive equals the positive number."
      - input:
          a: 5
          b: 0
        expected:
          sum: 5
        description: "Positive plus zero equals the positive number."
    test_ref: "CalculatorAddTest::add_variousInputCombinations_returnsExpectedSum (rows 1-3)"
    status: covered
    priority: 2
    tags:
      - "identity-property"
      - "edge-case"

  - name: "Commutativity — operand order independence"
    description: "Verifies add(a, b) == add(b, a) for the same inputs."
    type: happy_path
    risk: medium
    risk_rationale: "Impact: 3, Frequency: 3, Consequence: 2, Detectability: 1. Average: 2.25 -> medium."
    techniques:
      - equivalence_partitioning
      - error_guessing
    technique_rationale: "Commutativity is a mathematical invariant. Error guessing targets the common bug where operand order matters due to incorrect implementation."
    preconditions:
      - "Calculator instance is initialized"
    examples:
      - input:
          a: 2
          b: 3
        expected:
          sum: 5
        description: "add(2, 3) equals 5."
      - input:
          a: 3
          b: 2
        expected:
          sum: 5
        description: "add(3, 2) also equals 5 — confirming commutativity."
    test_ref: "CalculatorAddTest::add_variousInputCombinations_returnsExpectedSum (rows 4-5)"
    status: covered
    priority: 2
    tags:
      - "commutativity"
      - "mathematical-property"

  - name: "Negative number addition"
    description: "Verifies correct behavior when one or both operands are negative."
    type: edge_case
    risk: medium
    risk_rationale: "Impact: 3, Frequency: 2, Consequence: 2, Detectability: 1. Average: 2.0 -> medium."
    techniques:
      - equivalence_partitioning
    technique_rationale: "Negative numbers form distinct equivalence classes: (neg, neg), (neg, pos), (pos, neg)."
    preconditions:
      - "Calculator instance is initialized"
    examples:
      - input:
          a: -1
          b: -1
        expected:
          sum: -2
        description: "Negative plus negative yields more negative."
      - input:
          a: -3
          b: 5
        expected:
          sum: 2
        description: "Negative plus larger positive yields positive."
      - input:
          a: 5
          b: -3
        expected:
          sum: 2
        description: "Positive plus negative yields correct difference."
    test_ref: "CalculatorAddTest::add_variousInputCombinations_returnsExpectedSum (rows 6-8)"
    status: covered
    priority: 2
    tags:
      - "negative-numbers"
      - "equivalence-class"

  - name: "Integer boundary — MAX_VALUE and MIN_VALUE"
    description: "Verifies behavior at the extreme edges of the integer range."
    type: boundary
    risk: high
    risk_rationale: "Impact: 3, Frequency: 1, Consequence: 3, Detectability: 2. Average: 2.25 -> medium, elevated to high due to silent data corruption risk at boundaries."
    techniques:
      - boundary_value
    technique_rationale: "BVA is the primary technique for testing at the extreme limits of numeric input domains."
    preconditions:
      - "Calculator instance is initialized"
    examples:
      - input:
          a: 2147483647
          b: 0
        expected:
          sum: 2147483647
        description: "MAX_VALUE + 0 should return MAX_VALUE."
      - input:
          a: -2147483648
          b: 0
        expected:
          sum: -2147483648
        description: "MIN_VALUE + 0 should return MIN_VALUE."
    test_ref: "CalculatorAddTest::add_maxIntPlusZero_returnsMaxInt, add_minIntPlusZero_returnsMinInt"
    status: covered
    priority: 1
    tags:
      - "boundary"
      - "integer-limits"

  - name: "Integer overflow behavior"
    description: "Verifies defined behavior when addition causes integer overflow."
    type: boundary
    risk: high
    risk_rationale: "Impact: 3, Frequency: 1, Consequence: 3, Detectability: 3. Average: 2.5 -> high. Silent overflow produces wrong results without any error signal."
    techniques:
      - boundary_value
      - error_guessing
    technique_rationale: "BVA tests the boundary at MAX_VALUE+1. Error guessing anticipates that overflow is a common source of silent data corruption."
    preconditions:
      - "Calculator instance is initialized"
      - "Overflow behavior is defined (wrap-around vs exception)"
    examples:
      - input:
          a: 2147483647
          b: 1
        expected:
          behavior: "wrap-around to MIN_VALUE (Java default) OR throw ArithmeticException"
        description: "MAX_VALUE + 1 must exhibit the documented overflow behavior."
    test_ref: "CalculatorAddTest::add_maxIntPlusOne_overflowBehavior"
    status: covered
    priority: 1
    tags:
      - "overflow"
      - "boundary"
      - "high-risk"

