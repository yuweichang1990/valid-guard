  # ==========================================================================
  # ERROR HANDLING — Scanning Errors
  # ==========================================================================
  - name: "Ticket scan on wrong day"
    description: >
      A booked ticket is scanned on a day that is not the event day.
      The scan should be rejected.
    type: error_handling
    risk: medium
    risk_rationale: >
      Impact: 2, Frequency: 1, Consequence: 2, Detectability: 1.
      Average: 1.50 -> medium. Unlikely scenario but could cause
      confusion at venue if not handled clearly.
    techniques:
      - equivalence_partitioning
      - error_guessing
    technique_rationale: >
      Equivalence partitioning separates event-day from non-event-day
      scan attempts. Error guessing anticipates early and late scan
      attempts.
    preconditions:
      - "Ticket is in booked state"
      - "Current date is not event day"
    examples:
      - input:
          ticket_id: "TKT-201"
          scan_date: "2026-04-14"
          event_date: "2026-04-15"
        expected:
          error: "EVENT_NOT_TODAY"
          entry_denied: true
          state_unchanged: true
        description: "Scan one day before event — rejected."
      - input:
          ticket_id: "TKT-202"
          scan_date: "2026-04-16"
          event_date: "2026-04-15"
        expected:
          error: "EVENT_ALREADY_PASSED"
          entry_denied: true
        description: "Scan one day after event — rejected."
    test_ref: ""
    status: uncovered
    priority: 2
    tags:
      - scanning
      - error-handling
      - event-day

  - name: "Scan of a cancelled ticket"
    description: >
      A ticket that was booked and subsequently cancelled is presented
      at the venue scanner. The scan must be rejected.
    type: error_handling
    risk: medium
    risk_rationale: >
      Impact: 2, Frequency: 1, Consequence: 2, Detectability: 1.
      Average: 1.50 -> medium. Cancelled ticket scan is an obvious
      error to detect, but granting entry would be a policy violation.
    techniques:
      - equivalence_partitioning
      - error_guessing
    technique_rationale: >
      Equivalence partitioning classifies cancelled as an invalid ticket
      state for scanning. Error guessing anticipates attempted use of
      cancelled tickets.
    preconditions:
      - "Ticket was booked and then cancelled"
      - "Current date is event day"
    examples:
      - input:
          ticket_id: "TKT-300"
          ticket_state: "cancelled"
          scan_date: "2026-04-15"
          event_date: "2026-04-15"
        expected:
          error: "TICKET_CANCELLED"
          entry_denied: true
        description: "Cancelled ticket scanned on event day — entry denied."
    test_ref: ""
    status: uncovered
    priority: 2
    tags:
      - scanning
      - cancelled
      - error-handling

  - name: "Duplicate scan of an already-used ticket"
    description: >
      A ticket that has already been scanned and marked as used is
      scanned again. The system must reject the duplicate scan to
      prevent ticket sharing.
    type: error_handling
    risk: high
    risk_rationale: >
      Impact: 3, Frequency: 2, Consequence: 3, Detectability: 1.
      Average: 2.25 -> medium, but upgraded to high due to direct
      revenue and security implications. Allowing duplicate scans
      enables ticket fraud.
    techniques:
      - state_transition
      - error_guessing
    technique_rationale: >
      State transition confirms that used is a terminal state with no
      valid outgoing transitions. Error guessing anticipates the
      ticket-sharing attack vector.
    preconditions:
      - "Ticket is already in used state"
    examples:
      - input:
          ticket_id: "TKT-400"
          ticket_state: "used"
          scan_attempt: 2
        expected:
          error: "TICKET_ALREADY_USED"
          entry_denied: true
          first_scan_timestamp_shown: true
        description: "Second scan attempt — rejected with info about first scan."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - scanning
      - fraud-prevention
      - security

  # ==========================================================================
  # ERROR HANDLING — Payment Failures
  # ==========================================================================
  - name: "Payment failure during reservation window"
    description: >
      User attempts payment while the ticket is reserved but the payment
      is declined. The ticket should remain reserved until the timer
      expires, allowing the user to retry with another payment method.
    type: error_handling
    risk: high
    risk_rationale: >
      Impact: 3, Frequency: 2, Consequence: 2, Detectability: 1.
      Average: 2.00 -> medium, but upgraded due to direct revenue
      impact. Poor handling causes customer abandonment.
    techniques:
      - equivalence_partitioning
      - error_guessing
    technique_rationale: >
      Equivalence partitioning groups payment failures by type (declined,
      timeout, invalid card). Error guessing covers uncommon failure modes.
    preconditions:
      - "Ticket is in reserved state"
      - "Reservation timer has not expired"
    examples:
      - input:
          ticket_state: "reserved"
          payment_result: "declined"
          minutes_remaining: 7
        expected:
          ticket_state: "reserved"
          error: "PAYMENT_DECLINED"
          retry_allowed: true
          timer_continues: true
        description: "Payment declined — ticket stays reserved, user can retry."
      - input:
          ticket_state: "reserved"
          payment_result: "gateway_timeout"
          minutes_remaining: 3
        expected:
          ticket_state: "reserved"
          error: "PAYMENT_GATEWAY_TIMEOUT"
          retry_allowed: true
        description: "Payment gateway timeout — user can retry before timer expires."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - payment
      - error-handling
      - reservation

  # ==========================================================================
  # EDGE CASE — Cancellation After Event Has Started
  # ==========================================================================
  - name: "Cancellation attempt after event has started"
    description: >
      User attempts to cancel a booked ticket after the event start
      time has passed (but the ticket has not been scanned). The system
      should either reject the cancellation entirely or apply the
      no-refund policy.
    type: edge_case
    risk: medium
    risk_rationale: >
      Impact: 2, Frequency: 1, Consequence: 2, Detectability: 1.
      Average: 1.50 -> medium. Uncommon scenario but requires clear
      policy enforcement to avoid disputes.
    techniques:
      - boundary_value
      - error_guessing
    technique_rationale: >
      Boundary value tests the event-start-time threshold. Error guessing
      anticipates post-event cancellation attempts.
    preconditions:
      - "Ticket is booked"
      - "Event has already started or passed"
    examples:
      - input:
          ticket_state: "booked"
          hours_after_event_start: 1
        expected:
          cancellation_allowed: true
          refund_type: "none"
          refund_amount: 0.00
        description: "Cancel 1 hour after event started — allowed but no refund."
      - input:
          ticket_state: "booked"
          hours_after_event_end: 24
        expected:
          error: "CANCELLATION_WINDOW_CLOSED"
          cancellation_allowed: false
        description: "Cancel 24 hours after event ended — rejected entirely."
    test_ref: ""
    status: uncovered
    priority: 3
    tags:
      - cancellation
      - edge-case
      - post-event

  # ==========================================================================
  # EDGE CASE — Reservation When No Tickets Are Available
  # ==========================================================================
  - name: "Reservation attempt when ticket is already reserved by another user"
    description: >
      User attempts to reserve a ticket that is currently in reserved
      state (held by another user). The system should indicate the
      ticket is unavailable.
    type: edge_case
    risk: medium
    risk_rationale: >
      Impact: 2, Frequency: 2, Consequence: 2, Detectability: 1.
      Average: 1.75 -> medium. Expected scenario during high-demand
      events. Poor messaging confuses users.
    techniques:
      - equivalence_partitioning
      - error_guessing
    technique_rationale: >
      Equivalence partitioning classifies already-reserved as an invalid
      input class. Error guessing anticipates timing-dependent availability.
    preconditions:
      - "Ticket is in reserved state by another user"
    examples:
      - input:
          ticket_id: "TKT-600"
          ticket_state: "reserved"
          requesting_user: "USR-77"
          reserved_by: "USR-42"
        expected:
          error: "TICKET_UNAVAILABLE"
          suggested_action: "browse_alternatives"
        description: "Ticket reserved by another user — clearly indicated as unavailable."
    test_ref: ""
    status: uncovered
    priority: 2
    tags:
      - availability
      - edge-case
      - user-experience

  # ==========================================================================
  # SECURITY — Ticket Forgery / Invalid Ticket Scan
  # ==========================================================================
  - name: "Scan of a forged or non-existent ticket"
    description: >
      A QR code or barcode that does not correspond to any ticket in the
      system is scanned at the venue. The system must reject it.
    type: security
    risk: high
    risk_rationale: >
      Impact: 3, Frequency: 1, Consequence: 3, Detectability: 1.
      Average: 2.00 -> medium, but upgraded to high due to security
      implications. Accepting forged tickets causes direct revenue loss.
    techniques:
      - error_guessing
    technique_rationale: >
      Error guessing anticipates forgery and invalid input attack
      vectors against the scanning endpoint.
    preconditions:
      - "Scanning system is active"
    examples:
      - input:
          scanned_code: "FORGED-XYZ-999"
        expected:
          error: "TICKET_NOT_FOUND"
          entry_denied: true
          security_alert_raised: true
        description: "Non-existent ticket ID scanned — rejected with security alert."
      - input:
          scanned_code: ""
        expected:
          error: "INVALID_SCAN_DATA"
          entry_denied: true
        description: "Empty scan data — rejected."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - security
      - scanning
      - fraud-prevention

  # ==========================================================================
  # EDGE CASE — Cancellation and Immediate Re-reservation
  # ==========================================================================
  - name: "Ticket cancelled and immediately re-reserved by another user"
    description: >
      After a ticket is cancelled and returns to available, another user
      immediately reserves it. Verifies the full cycle:
      booked -> cancelled -> available -> reserved by new user.
    type: edge_case
    risk: medium
    risk_rationale: >
      Impact: 2, Frequency: 2, Consequence: 2, Detectability: 1.
      Average: 1.75 -> medium. Tests the complete lifecycle recycling
      to ensure no stale state lingers from the previous booking.
    techniques:
      - state_transition
      - error_guessing
    technique_rationale: >
      State transition verifies the full cycle through all intermediate
      states. Error guessing checks for stale booking data leaking
      into the new reservation.
    preconditions:
      - "Ticket was previously booked and then cancelled"
    examples:
      - input:
          ticket_id: "TKT-700"
          original_user: "USR-10"
          new_user: "USR-20"
          action_sequence: ["cancel", "wait_for_available", "reserve"]
        expected:
          final_state: "reserved"
          reserved_by: "USR-20"
          original_booking_data_cleared: true
          new_reservation_timer_started: true
        description: "Cancelled ticket re-reserved by new user — clean state."
    test_ref: ""
    status: uncovered
    priority: 2
    tags:
      - lifecycle
      - state-machine
      - data-integrity

  # ==========================================================================
  # PERFORMANCE — High-Demand Concurrent Reservations
  # ==========================================================================
  - name: "High-demand event with many concurrent reservation attempts"
    description: >
      A popular event with limited tickets receives hundreds of
      simultaneous reservation requests. The system must handle the
      load without data corruption or excessive latency.
    type: performance
    risk: medium
    risk_rationale: >
      Impact: 2, Frequency: 1, Consequence: 2, Detectability: 1.
      Average: 1.50 -> medium. Occurs during high-profile event
      launches. Failures cause lost sales and negative press.
    techniques:
      - boundary_value
      - error_guessing
    technique_rationale: >
      Boundary value tests the system at maximum expected concurrent
      load. Error guessing anticipates thundering-herd problems and
      deadlocks under contention.
    preconditions:
      - "Event has 100 available tickets"
      - "500 users attempt to reserve simultaneously"
    examples:
      - input:
          available_tickets: 100
          concurrent_requests: 500
        expected:
          successful_reservations: 100
          rejected_with_unavailable: 400
          no_double_bookings: true
          p99_latency_ms: "<3000"
        description: "500 concurrent requests for 100 tickets — exactly 100 reserved, 400 rejected cleanly."
    test_ref: ""
    status: uncovered
    priority: 2
    tags:
      - performance
      - load-test
      - concurrency

# ===========================================================================
# Example Mapping
# ===========================================================================
example_mapping:
  story: >
    As an event attendee, I want to browse, reserve, pay for, and use
    event tickets so that I can attend events I am interested in, with
    clear rules for cancellation and refunds.
  rules:
    - rule_name: "An available ticket can be reserved by selecting it"
      examples:
        - "User selects an available ticket -> ticket moves to reserved, 10-minute timer starts"
        - "User selects an already-reserved ticket -> error TICKET_UNAVAILABLE"
        - "Two users select the same ticket simultaneously -> only one succeeds"
        - "User selects a booked ticket -> error TICKET_UNAVAILABLE"

    - rule_name: "A reserved ticket must be paid for within 10 minutes"
      examples:
        - "Payment at 3 minutes -> ticket moves to booked, confirmation issued"
        - "Payment at 9 min 59 sec -> ticket moves to booked (just in time)"
        - "Payment at 10 min 1 sec -> reservation expired, ticket returns to available"
        - "Payment declined at 5 minutes -> ticket stays reserved, retry allowed"
        - "No payment and timer expires at 10 minutes -> ticket returns to available"

    - rule_name: "A booked ticket can be cancelled with tiered refund"
      examples:
        - "Cancel 48h before event -> full refund (100%)"
        - "Cancel 24h 1min before event -> full refund (boundary)"
        - "Cancel 23h 59min before event -> partial refund (50%)"
        - "Cancel 12h before event -> partial refund (50%)"
        - "Cancel 2h 1min before event -> partial refund (boundary)"
        - "Cancel 1h 59min before event -> no refund"
        - "Cancel 30min before event -> no refund"

    - rule_name: "A cancelled ticket returns to available for others to book"
      examples:
        - "Cancelled ticket -> state changes to available"
        - "Another user immediately reserves the newly available ticket -> clean state, no stale data"

    - rule_name: "A booked ticket becomes used when scanned on event day"
      examples:
        - "Scan booked ticket on event day -> moves to used, entry granted"
        - "Scan booked ticket day before event -> rejected, EVENT_NOT_TODAY"
        - "Scan cancelled ticket on event day -> rejected, TICKET_CANCELLED"
        - "Scan already-used ticket -> rejected, TICKET_ALREADY_USED"
        - "Scan forged/nonexistent ticket -> rejected, TICKET_NOT_FOUND"

    - rule_name: "Used is a terminal state — no further transitions"
      examples:
        - "Attempt to cancel a used ticket -> error INVALID_STATE_TRANSITION"
        - "Attempt to scan a used ticket again -> error TICKET_ALREADY_USED"

