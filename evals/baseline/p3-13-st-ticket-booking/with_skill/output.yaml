  - name: "Refund tier boundary at 2 hours before event"
    description: >
      Tests the exact boundary between partial refund and no refund at
      the 2-hour mark. Cancellation at 2h 1min should receive partial
      refund; at exactly 2h is the boundary; at 1h 59min should receive
      no refund.
    type: boundary
    risk: high
    risk_rationale: >
      Impact: 3, Frequency: 2, Consequence: 3, Detectability: 2.
      Average: 2.50 -> high. Incorrect tier assignment at this boundary
      either grants undeserved partial refunds or denies rightful ones.
    techniques:
      - boundary_value
      - decision_table
    technique_rationale: >
      Boundary value analysis tests the exact 2-hour threshold and its
      immediate neighbors. Decision table maps each side of the boundary
      to the correct refund action.
    preconditions:
      - "Ticket is booked"
      - "Event start time is known"
    examples:
      - input:
          hours_before_event: 2.02
          ticket_price: 100.00
        expected:
          refund_type: "partial"
          refund_amount: 50.00
        description: "2 hours and 1 minute before — partial refund."
      - input:
          hours_before_event: 2.00
          ticket_price: 100.00
        expected:
          refund_type: "partial"
          refund_amount: 50.00
        description: "Exactly 2 hours before — boundary, partial refund."
      - input:
          hours_before_event: 1.98
          ticket_price: 100.00
        expected:
          refund_type: "none"
          refund_amount: 0.00
        description: "1 hour 59 minutes before — just past boundary, no refund."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - boundary
      - refund
      - financial

  # ==========================================================================
  # EDGE CASE — Reservation Expiry Race Condition
  # ==========================================================================
  - name: "Payment submitted at exact moment of reservation expiry"
    description: >
      Race condition where the payment completion arrives at the same
      instant the 10-minute timer fires. The system must handle this
      atomically — either the payment wins or the timer wins, but never
      both.
    type: edge_case
    risk: high
    risk_rationale: >
      Impact: 3, Frequency: 1, Consequence: 3, Detectability: 3.
      Average: 2.50 -> high. Rare but catastrophic: if both fire, the
      ticket could be charged but released, or booked but also re-listed,
      leading to double-booking or orphaned charges.
    techniques:
      - error_guessing
      - state_transition
    technique_rationale: >
      Error guessing targets the known concurrency pitfall at timer
      expiry. State transition verifies that only one path wins
      atomically.
    preconditions:
      - "Ticket is in reserved state"
      - "Reservation timer is at exactly 10 minutes"
    examples:
      - input:
          current_state: "reserved"
          payment_received_at: "10:00.000"
          timer_fires_at: "10:00.000"
        expected:
          final_state_is_one_of: ["booked", "available"]
          no_double_state: true
          charge_matches_state: true
        description: "Simultaneous payment and timer — system resolves atomically."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - concurrency
      - race-condition
      - timer

  # ==========================================================================
  # EDGE CASE — Concurrent Reservation Attempt
  # ==========================================================================
  - name: "Two users attempt to reserve the same ticket simultaneously"
    description: >
      Two users click 'reserve' on the same ticket at the same time.
      Only one should succeed; the other should receive an error
      indicating the ticket is no longer available.
    type: edge_case
    risk: high
    risk_rationale: >
      Impact: 3, Frequency: 2, Consequence: 3, Detectability: 2.
      Average: 2.50 -> high. Without proper concurrency control,
      both users could reserve the same ticket, leading to double-booking.
    techniques:
      - error_guessing
      - state_transition
    technique_rationale: >
      Error guessing anticipates the classic double-reservation race
      condition. State transition confirms the available->reserved
      transition is atomic.
    preconditions:
      - "Ticket is in available state"
      - "Two concurrent reservation requests arrive"
    examples:
      - input:
          ticket_id: "TKT-500"
          user_a: "USR-01"
          user_b: "USR-02"
          request_timing: "simultaneous"
        expected:
          one_user_reserved: true
          other_user_error: "TICKET_UNAVAILABLE"
          ticket_state: "reserved"
          reserved_by_count: 1
        description: "Only one user wins the reservation; the other gets an error."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - concurrency
      - race-condition
      - critical-path

