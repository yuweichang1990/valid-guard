    type: happy_path
    risk: high
    risk_rationale: >
      Impact: 3, Frequency: 3, Consequence: 3, Detectability: 1.
      Average: 2.50 -> high. Scanning failure at the venue entrance
      blocks legitimate attendees and causes immediate customer distress.
    techniques:
      - equivalence_partitioning
      - state_transition
    technique_rationale: >
      Equivalence partitioning validates the primary valid-class input
