  # ==========================================================================
  # BOUNDARY — 10-Minute Reservation Timer
  # ==========================================================================
  - name: "Reservation timer boundary at 10 minutes"
    description: >
      Tests the exact boundary of the 10-minute reservation window.
      Payment at exactly 10:00 should succeed; payment at 10:01 should
      fail because the reservation has expired.
    type: boundary
    risk: high
    risk_rationale: >
      Impact: 3, Frequency: 2, Consequence: 3, Detectability: 2.
      Average: 2.50 -> high. An off-by-one error at the timer boundary
      could either expire reservations prematurely (lost sales) or hold
      them too long (blocking other buyers).
    techniques:
      - boundary_value
      - state_transition
    technique_rationale: >
      Boundary value analysis tests the exact 10-minute threshold and
      its immediate neighbors. State transition confirms the timer-guard
      correctly routes to booked vs. available.
    preconditions:
      - "Ticket is in reserved state"
      - "System clock is accurate"
    examples:
      - input:
          current_state: "reserved"
          trigger: "payment_completed"
          minutes_since_reservation: 9
        expected:
          new_state: "booked"
          payment_accepted: true
        description: "Payment at 9 minutes — well within window, accepted."
      - input:
          current_state: "reserved"
          trigger: "payment_completed"
          minutes_since_reservation: 9.99
        expected:
          new_state: "booked"
          payment_accepted: true
        description: "Payment at 9 min 59 sec — just within window, accepted."
      - input:
          current_state: "reserved"
          trigger: "payment_completed"
          minutes_since_reservation: 10
        expected:
          new_state: "booked"
          payment_accepted: true
        description: "Payment at exactly 10 minutes — boundary, accepted."
      - input:
          current_state: "reserved"
          trigger: "payment_completed"
          minutes_since_reservation: 10.02
        expected:
          error: "RESERVATION_EXPIRED"
          new_state: "available"
          payment_rejected: true
        description: "Payment at 10 min 1 sec — just past window, reservation expired."
      - input:
          current_state: "reserved"
          trigger: "reservation_timer_expired"
          minutes_since_reservation: 10
        expected:
          new_state: "available"
          user_notified: true
        description: "Timer fires at exactly 10 minutes — ticket released."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - boundary
      - timer
      - critical-path

  # ==========================================================================
  # DECISION TABLE — Cancellation Refund Rules
  # ==========================================================================
  - name: "Cancellation refund decision table"
    description: >
      When a booked ticket is cancelled, the refund amount depends on how
      far in advance the cancellation occurs relative to the event start
      time. Three tiers: full refund (> 24h before), partial refund
      (2-24h before), and no refund (< 2h before). This decision table
      captures all meaningful combinations.
    type: combinatorial
    risk: high
    risk_rationale: >
      Impact: 3, Frequency: 2, Consequence: 3, Detectability: 2.
      Average: 2.50 -> high. Incorrect refund calculations directly cause
      financial loss (over-refunding) or regulatory/customer trust issues
      (under-refunding). Refund disputes are costly to resolve manually.
    techniques:
      - decision_table
      - boundary_value
    technique_rationale: >
      Decision table enumerates the three refund tiers as distinct business
      rules mapping time-to-event to refund outcome. Boundary value
      analysis tests the exact thresholds at 24h and 2h.
    preconditions:
      - "Ticket is in booked state"
      - "Event has a known start time"
    decision_table:
      conditions:
        - "time_before_event"
        - "ticket_state"
      actions:
        - "refund_type"
        - "refund_percentage"
        - "ticket_new_state"
      rules:
        - description: "Cancellation more than 24 hours before event — full refund"
          condition_values:
            time_before_event: "> 24 hours"
            ticket_state: "booked"
          expected_actions:
            refund_type: "full"
            refund_percentage: 100
            ticket_new_state: "cancelled"

        - description: "Cancellation between 2 and 24 hours before event — partial refund"
          condition_values:
            time_before_event: "2-24 hours"
            ticket_state: "booked"
          expected_actions:
            refund_type: "partial"
            refund_percentage: 50
            ticket_new_state: "cancelled"

        - description: "Cancellation less than 2 hours before event — no refund"
          condition_values:
            time_before_event: "< 2 hours"
            ticket_state: "booked"
          expected_actions:
            refund_type: "none"
            refund_percentage: 0
            ticket_new_state: "cancelled"

        - description: "Cancellation of non-booked ticket — rejected"
          condition_values:
            time_before_event: "any"
            ticket_state: "available"
          expected_actions:
            refund_type: "N/A"
            refund_percentage: 0
            ticket_new_state: "unchanged"

        - description: "Cancellation of already-used ticket — rejected"
          condition_values:
            time_before_event: "any"
            ticket_state: "used"
          expected_actions:
            refund_type: "N/A"
            refund_percentage: 0
            ticket_new_state: "unchanged"
    examples:
      - input:
          ticket_id: "TKT-100"
          ticket_price: 80.00
          hours_before_event: 48
        expected:
          refund_amount: 80.00
          refund_type: "full"
          new_state: "cancelled"
        description: "48 hours before event — full refund of $80.00."
      - input:
          ticket_id: "TKT-101"
          ticket_price: 80.00
          hours_before_event: 12
        expected:
          refund_amount: 40.00
          refund_type: "partial"
          new_state: "cancelled"
        description: "12 hours before event — partial refund of $40.00 (50%)."
      - input:
          ticket_id: "TKT-102"
          ticket_price: 80.00
          hours_before_event: 1
        expected:
          refund_amount: 0.00
          refund_type: "none"
          new_state: "cancelled"
        description: "1 hour before event — no refund, ticket still cancelled."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - refund
      - decision-table
      - financial
      - critical-path

