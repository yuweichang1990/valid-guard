          ticket_price: 100.00
        expected:
          refund_type: "full"
          refund_amount: 100.00
        description: "24 hours and 1 minute before — full refund."
      - input:
          hours_before_event: 24.00
          ticket_price: 100.00
        expected:
          refund_type: "full"
