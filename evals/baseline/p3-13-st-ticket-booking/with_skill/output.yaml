# Valid Guard Test Plan — Ticket Booking System
# Generated: 2026-03-14T09:00:00Z
# Source: natural language

feature: "Ticket Booking System"

feature_description: >
  Event ticket booking workflow with a five-state lifecycle: available,
  reserved, booked, cancelled, and used. Reservation holds a ticket for
  10 minutes pending payment. Booked tickets may be cancelled with a
  tiered refund policy based on time remaining before the event (full
  refund > 24h, partial refund 2-24h, no refund < 2h). On event day,
  booked tickets transition to used upon scanning.

risk_level: high

entry_point: greenfield

source:
  type: natural_language
  path: ""

scenarios:
  # ==========================================================================
  # STATE TRANSITION — Full Lifecycle
  # ==========================================================================
  - name: "Ticket lifecycle — complete state machine"
    description: >
      Models the entire ticket state machine with all five states (available,
      reserved, booked, cancelled, used) and every valid transition including
      guards for the 10-minute reservation timer, payment completion,
      cancellation, and event-day scanning.
    type: state_transition
    risk: high
    risk_rationale: >
      Impact: 3, Frequency: 3, Consequence: 3, Detectability: 2.
      Average: 2.75 -> high. Invalid state transitions can cause double-booking,
      lost revenue, or tickets stuck in unrecoverable states. Every user
      interacts with this lifecycle on every purchase.
    techniques:
      - state_transition
    technique_rationale: >
      The ticket lifecycle is a classic finite state machine with five distinct
      states and event-driven transitions governed by time-based guards.
      State transition testing is the primary technique to ensure every valid
      transition fires correctly and every invalid transition is rejected.
    preconditions:
      - "Ticket exists in the system with a valid event association"
      - "System clock is reliable for timer-based guards"
    state_transition:
      states:
        - available
        - reserved
        - booked
        - cancelled
        - used
      transitions:
        - from: available
          to: reserved
          trigger: "user_selects_ticket"
          guard: "Ticket is not already reserved or booked by another user"
        - from: reserved
          to: booked
          trigger: "payment_completed"
          guard: "Payment received within 10-minute reservation window"
        - from: reserved
          to: available
          trigger: "reservation_timer_expired"
          guard: "10 minutes elapsed since reservation without payment"
        - from: booked
          to: cancelled
          trigger: "user_cancels_ticket"
          guard: "Ticket has not already been used"
        - from: cancelled
          to: available
          trigger: "cancellation_processed"
          guard: "Refund (if applicable) has been resolved"
        - from: booked
          to: used
          trigger: "ticket_scanned"
          guard: "Current date is the event day and ticket is valid"
    examples:
      - input:
          current_state: "available"
          trigger: "user_selects_ticket"
        expected:
          new_state: "reserved"
          reservation_timer_started: true
          timer_duration_minutes: 10
        description: "User selects an available ticket, it moves to reserved with a 10-minute timer."
      - input:
          current_state: "reserved"
          trigger: "payment_completed"
          minutes_since_reservation: 5
        expected:
          new_state: "booked"
          confirmation_issued: true
        description: "Payment within 10-minute window moves ticket to booked."
      - input:
          current_state: "reserved"
          trigger: "reservation_timer_expired"
          minutes_since_reservation: 10
        expected:
          new_state: "available"
          reservation_released: true
        description: "Reservation expires after 10 minutes, ticket returns to available."
      - input:
          current_state: "booked"
          trigger: "user_cancels_ticket"
        expected:
          new_state: "cancelled"
          cancellation_recorded: true
        description: "User cancels a booked ticket."
      - input:
          current_state: "cancelled"
          trigger: "cancellation_processed"
        expected:
          new_state: "available"
          ticket_relisted: true
        description: "Cancelled ticket returns to available pool."
      - input:
          current_state: "booked"
          trigger: "ticket_scanned"
          is_event_day: true
        expected:
          new_state: "used"
          entry_granted: true
        description: "Booked ticket scanned on event day transitions to used."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - state-machine
      - critical-path
      - lifecycle

  # ==========================================================================
  # STATE TRANSITION — Invalid Transitions
  # ==========================================================================
  - name: "Invalid state transitions are rejected"
    description: >
      Verifies that all illegal state transitions are blocked. For example,
      a ticket cannot jump from available directly to booked, from used to
      any other state, or from cancelled directly to booked.
    type: state_transition
    risk: high
    risk_rationale: >
      Impact: 3, Frequency: 2, Consequence: 3, Detectability: 2.
      Average: 2.50 -> high. Allowing invalid transitions could permit
      double-booking, usage of cancelled tickets, or tickets bypassing
      payment entirely.
    techniques:
      - state_transition
      - error_guessing
    technique_rationale: >
      State transition covers the N-switch invalid path analysis. Error
      guessing anticipates specific abuse patterns like direct
      available-to-booked jumps or re-using a used ticket.
    preconditions:
      - "Ticket exists in a known state"
    examples:
      - input:
          current_state: "available"
          trigger: "payment_completed"
        expected:
          error: "INVALID_STATE_TRANSITION"
          state_unchanged: true
        description: "Cannot pay for a ticket that has not been reserved."
      - input:
          current_state: "available"
          trigger: "ticket_scanned"
        expected:
          error: "INVALID_STATE_TRANSITION"
        description: "Cannot scan a ticket that has not been booked."
      - input:
          current_state: "used"
          trigger: "user_cancels_ticket"
        expected:
          error: "INVALID_STATE_TRANSITION"
        description: "Cannot cancel a ticket that has already been used."
      - input:
          current_state: "used"
          trigger: "ticket_scanned"
        expected:
          error: "TICKET_ALREADY_USED"
        description: "Cannot scan a ticket twice."
      - input:
          current_state: "cancelled"
          trigger: "payment_completed"
        expected:
          error: "INVALID_STATE_TRANSITION"
        description: "Cannot pay for a cancelled ticket directly."
      - input:
          current_state: "reserved"
          trigger: "ticket_scanned"
        expected:
          error: "INVALID_STATE_TRANSITION"
        description: "Cannot scan a ticket that is only reserved, not booked."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - state-machine
      - negative-testing
      - security

  # ==========================================================================
