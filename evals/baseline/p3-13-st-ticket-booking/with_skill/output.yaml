      the booked->used transition.
    preconditions:
      - "Ticket is in booked state"
      - "Current date is the event day"
    examples:
      - input:
          ticket_id: "TKT-200"
          scan_date: "2026-04-15"
          event_date: "2026-04-15"
          ticket_state: "booked"
        expected:
          new_state: "used"
          entry_granted: true
