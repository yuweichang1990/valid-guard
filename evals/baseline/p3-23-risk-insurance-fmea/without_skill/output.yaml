  # ===========================================================================
  # TEST PRIORITY ORDER
  # ===========================================================================
  test_priority_order:
    description: >
      Recommended test execution priority based on RPN ranking, adjusted for
      severity-weighted risk. Failure modes with severity 9-10 are elevated
      even if their RPN is moderate, because the consequences are catastrophic
      or involve regulatory exposure.

    priority_tiers:

      - tier: "P0 — Critical (test immediately, block release)"
        rationale: "RPN >= 270 or severity = 10 regardless of RPN. These represent catastrophic financial, legal, or security risks."
        test_items:
          - id: "C3-FM01"
            rpn: 504
            test_focus: "Fraud false negative detection — red team with synthetic fraud scenarios, recall benchmarking"
          - id: "C3-FM04"
            rpn: 400
            test_focus: "Fraud ring graph traversal — multi-hop collusion detection, retrospective analysis"
          - id: "C2-FM07"
            rpn: 392
            test_focus: "PII metadata stripping — EXIF/PDF metadata removal validation on all file types"
          - id: "C3-FM07"
            rpn: 336
            test_focus: "Model drift monitoring — feature distribution shift detection, accuracy benchmarking"
          - id: "C2-FM01"
            rpn: 300
            test_focus: "Malicious upload prevention — OWASP file upload attacks, MIME validation, antivirus integration"
          - id: "C3-FM03"
            rpn: 270
            test_focus: "Cross-channel duplicate detection — fuzzy matching across web/phone/agent channels"
          - id: "C1-FM02"
            rpn: 120
            test_focus: "Coverage limit enforcement — boundary value analysis at policy cap thresholds"
          - id: "C1-FM04"
            rpn: 120
            test_focus: "Policy type mapping — exhaustive enum contract tests"
          - id: "C2-FM03"
            rpn: 120
            test_focus: "Medical records encryption at rest — infrastructure compliance scan"
          - id: "C3-FM06"
            rpn: 120
            test_focus: "Fraud algorithm crash resilience — fuzz testing, fail-closed verification"
          - id: "C4-FM01"
            rpn: 160
            test_focus: "Authorization bypass / IDOR — multi-tenant isolation, penetration testing"
          - id: "C5-FM01"
