  # ===========================================================================
  # COMPONENT RISK SUMMARY
  # ===========================================================================
  component_risk_summary:
    description: "Aggregate risk per component based on total and average RPN across all identified failure modes"
    components:
      - component: "Fraud Detection Algorithm"
        component_id: "C3"
        failure_mode_count: 7
        total_rpn: 2092
        average_rpn: 298.9
        max_rpn: 504
        risk_level: "CRITICAL"
        assessment: >
          Highest aggregate and average RPN of all components. Fraud detection failures
          have severe financial consequences and are inherently difficult to detect because
          missed fraud is only discovered after payout. Model drift and evolving fraud
          patterns make this a continuously high-risk area requiring ongoing investment
          in testing, monitoring, and retraining.

      - component: "Document Upload Service"
        component_id: "C2"
        failure_mode_count: 7
        total_rpn: 1416
        average_rpn: 202.3
        max_rpn: 392
        risk_level: "HIGH"
        assessment: >
          Second highest risk driven by security concerns (malicious uploads, PII leakage)
          and compliance requirements (HIPAA encryption). The combination of external input
          handling and sensitive data storage creates a large attack surface that demands
          thorough security and privacy testing.

      - component: "Claim Calculation Engine"
        component_id: "C1"
        failure_mode_count: 7
        total_rpn: 1212
        average_rpn: 173.1
        max_rpn: 294
        risk_level: "HIGH"
        assessment: >
          Core financial calculation component where errors directly translate to monetary
          loss or regulatory exposure. While individual failure modes are somewhat more
          detectable than fraud issues, the severity of incorrect payouts (both over and
          under) makes this a high-priority testing area. Precision, boundary, and
          regression testing are essential.

      - component: "Claims Dashboard"
        component_id: "C4"
        failure_mode_count: 7
        total_rpn: 899
        average_rpn: 128.4
        max_rpn: 180
        risk_level: "MEDIUM"
        assessment: >
          Primary risk vectors are authorization bypass (IDOR) and XSS, both of which
          carry high severity. Functional display errors are less critical but affect
          user trust. Security-focused testing should be prioritized over UI accuracy
          testing for this component.

      - component: "Notification Service"
        component_id: "C5"
        failure_mode_count: 7
        total_rpn: 1018
        average_rpn: 145.4
        max_rpn: 180
        risk_level: "MEDIUM"
        assessment: >
          The most critical failure mode is sending notifications to the wrong recipient
          (privacy breach). Other failure modes primarily affect operational quality rather
          than causing direct financial or legal harm. Compliance testing for opt-out
          enforcement and channel preferences is important due to regulatory requirements.

  # ===========================================================================
  # RECOMMENDED TEST STRATEGY
  # ===========================================================================
  recommended_test_strategy:
    execution_order:
      - step: 1
        description: "Security and compliance test suite"
        covers:
          - "C2-FM01 (malicious uploads)"
          - "C2-FM03 (encryption at rest)"
          - "C2-FM07 (PII metadata)"
          - "C4-FM01 (authorization bypass)"
          - "C4-FM05 (XSS)"
          - "C5-FM01 (wrong recipient)"
        rationale: "Security and compliance failures have the highest potential impact and often carry regulatory penalties"

      - step: 2
        description: "Fraud detection validation suite"
        covers:
          - "C3-FM01 (false negatives)"
          - "C3-FM03 (cross-channel duplicates)"
          - "C3-FM04 (fraud rings)"
          - "C3-FM05 (static thresholds)"
          - "C3-FM06 (crash on bad input)"
          - "C3-FM07 (model drift)"
        rationale: "Fraud detection has the highest aggregate RPN and failures are hardest to detect post-deployment"

      - step: 3
        description: "Financial calculation accuracy suite"
        covers:
          - "C1-FM01 (deductible)"
          - "C1-FM02 (coverage limit)"
          - "C1-FM03 (depreciation)"
          - "C1-FM04 (policy mapping)"
          - "C1-FM05 (precision)"
          - "C1-FM07 (zero payout)"
        rationale: "Direct monetary impact; calculation errors cause financial loss or customer disputes"

      - step: 4
        description: "Data integrity and reliability suite"
        covers:
          - "C2-FM04 (wrong claim association)"
          - "C2-FM06 (file loss)"
          - "C5-FM02 (missed notifications)"
          - "C5-FM03 (duplicates)"
          - "C5-FM04 (wrong content)"
        rationale: "Data integrity failures erode trust and cause operational overhead"

      - step: 5
        description: "Performance and resilience suite"
        covers:
          - "C1-FM06 (calculation timeout)"
          - "C4-FM04 (dashboard load)"
          - "C5-FM05 (provider outage)"
          - "C5-FM07 (notification latency)"
        rationale: "Performance failures degrade user experience but are typically less severe than correctness failures"

      - step: 6
        description: "UI and usability validation suite"
        covers:
          - "C4-FM02 (status display)"
          - "C4-FM03 (filter accuracy)"
          - "C4-FM06 (currency format)"
          - "C4-FM07 (session timeout)"
          - "C2-FM02 (oversized file)"
          - "C2-FM05 (unsupported format)"
          - "C3-FM02 (false positives)"
          - "C5-FM06 (opt-out compliance)"
        rationale: "Functional correctness and usability issues that affect daily operations"

    continuous_monitoring:
      - "Fraud model accuracy metrics (precision, recall, F1) tracked weekly"
      - "Calculation audit comparing approved payouts to policy limits daily"
      - "File storage encryption compliance scan daily"
      - "Notification delivery success rate and latency p95 real-time"
      - "Dashboard error rate and response time percentiles real-time"
      - "Dead letter queue depth alerting with 15-minute check interval"
