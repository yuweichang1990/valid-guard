fmea_analysis:
  title: "Insurance Claims Processing System - Failure Mode and Effects Analysis"
  system: "Insurance Claims Processing Platform"
  date: "2026-03-14"
  methodology: "FMEA (Failure Mode and Effects Analysis)"
  rating_scales:
    severity:
      description: "Impact of the failure on the end user, business, or regulatory compliance"
      scale:
        1: "No noticeable effect"
        2: "Very minor impact, cosmetic only"
        3: "Minor impact, slight inconvenience"
        4: "Low impact, workaround available"
        5: "Moderate impact, degraded functionality"
        6: "Significant impact, partial loss of function"
        7: "High impact, major function affected"
        8: "Very high impact, system partially inoperable"
        9: "Critical impact, regulatory or financial exposure"
        10: "Catastrophic, total system failure or legal liability"
    occurrence:
      description: "Likelihood the failure mode will occur"
      scale:
        1: "Nearly impossible (< 1 in 1,000,000)"
        2: "Remote (1 in 100,000)"
        3: "Very low (1 in 10,000)"
        4: "Low (1 in 1,000)"
        5: "Moderate (1 in 200)"
        6: "Moderately high (1 in 50)"
        7: "High (1 in 20)"
        8: "Very high (1 in 10)"
        9: "Extremely high (1 in 5)"
        10: "Almost certain (> 1 in 2)"
    detection:
      description: "Ability of current controls to detect the failure before it reaches the user"
      scale:
        1: "Almost certain detection before release"
        2: "Very high detection probability"
        3: "High detection probability"
        4: "Moderately high detection"
        5: "Moderate detection"
        6: "Low detection probability"
        7: "Very low detection probability"
        8: "Remote detection probability"
        9: "Very remote detection probability"
        10: "No detection mechanism exists"

  components:

    # =========================================================================
    # COMPONENT 1: CLAIM CALCULATION ENGINE
    # =========================================================================
    - component_id: "C1"
      component_name: "Claim Calculation Engine"
      description: "Computes payout amounts based on policy type, deductible, coverage limits, and depreciation"
      failure_modes:

        - id: "C1-FM01"
          failure_mode: "Incorrect deductible subtraction"
          cause: "Logic error in deductible application order or double-deduction bug"
          effect: "Claimant receives incorrect payout amount — overpayment causes financial loss to insurer, underpayment causes regulatory complaints"
          severity: 9
          occurrence: 5
          detection: 4
          rpn: 180
          recommended_controls:
            - "Unit tests for every policy type with known deductible scenarios"
            - "Property-based testing: payout + deductible <= claim amount"
            - "Golden-file regression tests against actuarial reference outputs"

        - id: "C1-FM02"
          failure_mode: "Coverage limit not enforced"
          cause: "Missing or incorrect boundary check when claim exceeds policy coverage cap"
          effect: "Payouts exceed contractual limits, direct financial loss to insurer"
          severity: 10
          occurrence: 4
          detection: 3
          rpn: 120
          recommended_controls:
            - "Boundary value tests at exactly coverage limit, limit minus one cent, limit plus one cent"
            - "Integration test asserting payout <= coverage_limit for all policy types"
            - "Automated audit report comparing approved payouts against policy caps"

        - id: "C1-FM03"
          failure_mode: "Depreciation calculated incorrectly"
          cause: "Wrong depreciation schedule applied, rounding errors, or stale depreciation tables"
          effect: "Incorrect actual cash value computation leading to over- or under-payment"
          severity: 8
          occurrence: 6
          detection: 5
          rpn: 240
          recommended_controls:
            - "Parameterized tests across asset categories with known depreciation curves"
            - "Cross-validation against independent depreciation calculator"
            - "Rounding consistency tests (half-up vs. bankers rounding)"

        - id: "C1-FM04"
          failure_mode: "Wrong policy type mapping"
          cause: "Enum mismatch or data migration error causes homeowner policy to be processed as auto policy"
          effect: "Entirely wrong calculation logic applied, producing nonsensical payout"
          severity: 10
          occurrence: 3
          detection: 4
          rpn: 120
          recommended_controls:
            - "Contract tests between policy service and calculation engine"
            - "Exhaustive enum mapping tests for all policy types"
            - "Smoke tests on each policy type after every deployment"

        - id: "C1-FM05"
          failure_mode: "Floating-point precision errors in currency calculations"
          cause: "Using IEEE 754 floating-point instead of fixed-point or decimal types for monetary values"
          effect: "Accumulated rounding errors produce incorrect totals, audit discrepancies"
          severity: 7
          occurrence: 7
          detection: 6
          rpn: 294
          recommended_controls:
            - "Static analysis rule enforcing decimal/BigDecimal types for all monetary fields"
            - "Unit tests with known-problematic floating-point values (e.g., 0.1 + 0.2)"
            - "End-to-end calculation tests verifying cent-level accuracy"

        - id: "C1-FM06"
          failure_mode: "Calculation engine timeout on complex claims"
          cause: "Recursive sub-claim aggregation or large itemized lists cause excessive computation time"
          effect: "Claim processing stalls, user receives timeout error, SLA breach"
          severity: 6
          occurrence: 5
          detection: 3
          rpn: 90
          recommended_controls:
            - "Performance tests with maximum-size itemized claims"
            - "Circuit breaker with configurable timeout threshold"
            - "Load testing under concurrent claim submission"

        - id: "C1-FM07"
          failure_mode: "Negative or zero payout computed for valid claim"
          cause: "Edge case where depreciation exceeds replacement cost or sign error in formula"
          effect: "Valid claim denied or shows zero payout, customer complaint and potential lawsuit"
          severity: 9
          occurrence: 4
          detection: 3
          rpn: 108
          recommended_controls:
            - "Invariant assertion: payout >= 0 for all approved claims"
            - "Test cases with fully depreciated assets"
            - "Business rule validation layer before final payout output"

    # =========================================================================
    # COMPONENT 2: DOCUMENT UPLOAD SERVICE
    # =========================================================================
    - component_id: "C2"
      component_name: "Document Upload Service"
      description: "Accepts photos, PDFs, and medical records as claim evidence"
      failure_modes:

        - id: "C2-FM01"
          failure_mode: "Malicious file upload (malware or script injection)"
          cause: "Insufficient file validation allows executable or script-embedded files"
          effect: "Server compromise, data breach, HIPAA violation for medical records"
          severity: 10
          occurrence: 6
          detection: 5
          rpn: 300
          recommended_controls:
            - "Antivirus scanning on every uploaded file before storage"
            - "Strict allowlist-based MIME type and magic-byte validation"
            - "Penetration tests with OWASP file upload attack payloads"
            - "Content-Disposition headers forcing download, never inline execution"

        - id: "C2-FM02"
          failure_mode: "Upload of oversized file causes service crash"
          cause: "Missing or misconfigured file size limit, memory exhaustion on large file buffering"
          effect: "Service outage, other users unable to upload documents"
          severity: 7
          occurrence: 5
          detection: 2
          rpn: 70
          recommended_controls:
            - "Enforce maximum file size at reverse proxy and application layer"
            - "Streaming upload with chunked processing"
            - "Test with files at 0 bytes, 1 byte, max limit, and max limit + 1 byte"

        - id: "C2-FM03"
          failure_mode: "Medical records stored without encryption"
          cause: "Encryption-at-rest not enabled on storage bucket, or key rotation failure"
          effect: "HIPAA/PHI compliance violation, regulatory fines, reputational damage"
          severity: 10
          occurrence: 3
          detection: 4
          rpn: 120
          recommended_controls:
            - "Infrastructure-as-code tests asserting encryption-at-rest on all storage"
            - "Compliance scan detecting unencrypted PHI in storage"
            - "Key rotation integration test"

        - id: "C2-FM04"
          failure_mode: "Document associated with wrong claim"
          cause: "Race condition in concurrent uploads or incorrect claim ID binding"
          effect: "Evidence attached to wrong claim, incorrect adjudication, privacy violation"
          severity: 9
          occurrence: 4
          detection: 6
          rpn: 216
          recommended_controls:
            - "Concurrency tests simulating simultaneous uploads to different claims"
            - "Idempotency key validation on upload requests"
            - "Audit trail linking upload timestamp, user, and claim ID"

        - id: "C2-FM05"
          failure_mode: "Unsupported file format silently accepted but unreadable"
          cause: "File extension check passes but content is corrupt or format is not actually supported"
          effect: "Adjuster cannot view evidence, claim processing delayed"
          severity: 5
          occurrence: 6
          detection: 5
          rpn: 150
          recommended_controls:
            - "Content-based format validation (not just extension check)"
            - "Preview generation test for each supported format"
            - "Negative tests with renamed extensions (e.g., .exe renamed to .pdf)"

        - id: "C2-FM06"
          failure_mode: "Upload service loses file after accepting it"
          cause: "Storage write failure after HTTP 200 returned, eventual consistency issue"
          effect: "Claimant believes upload succeeded but evidence is missing"
          severity: 8
          occurrence: 3
          detection: 7
          rpn: 168
          recommended_controls:
            - "Write-then-verify pattern: read-back after write before confirming"
            - "Chaos engineering test: simulate storage failures during upload"
            - "Background consistency checker comparing upload log to storage inventory"

        - id: "C2-FM07"
          failure_mode: "Personally identifiable information exposed in file metadata"
          cause: "EXIF data in photos or PDF metadata not stripped before storage/display"
          effect: "PII leakage, privacy regulation violation"
          severity: 8
          occurrence: 7
          detection: 7
          rpn: 392
          recommended_controls:
            - "Automated metadata stripping on all uploaded files"
            - "Test that EXIF GPS coordinates, author fields are removed post-upload"
            - "Privacy audit scanning stored files for residual metadata"

    # =========================================================================
    # COMPONENT 3: FRAUD DETECTION ALGORITHM
    # =========================================================================
    - component_id: "C3"
      component_name: "Fraud Detection Algorithm"
      description: "Flags suspicious patterns including duplicate claims, known fraud rings, and inflated amounts"
      failure_modes:

        - id: "C3-FM01"
          failure_mode: "False negative — fraudulent claim not flagged"
          cause: "Detection rules too narrow, new fraud pattern not in training data, threshold too high"
          effect: "Fraudulent payout approved, direct financial loss"
          severity: 9
          occurrence: 7
          detection: 8
          rpn: 504
          recommended_controls:
            - "Red team exercises with synthetic fraud scenarios"
            - "Recall metric monitoring on labeled fraud dataset"
            - "Regular model retraining with latest confirmed fraud cases"
            - "Manual review sampling of approved high-value claims"

        - id: "C3-FM02"
          failure_mode: "False positive — legitimate claim flagged as fraud"
          cause: "Overly aggressive rules, bias in training data, legitimate pattern resembles fraud"
          effect: "Claim processing delayed, customer dissatisfaction, potential discrimination complaints"
          severity: 7
          occurrence: 6
          detection: 4
          rpn: 168
          recommended_controls:
            - "Precision metric monitoring with acceptable false-positive rate threshold"
            - "Bias audit across demographic groups"
            - "Test suite with known-legitimate edge cases (e.g., multiple valid claims after natural disaster)"

        - id: "C3-FM03"
          failure_mode: "Duplicate claim detection fails on cross-channel submissions"
          cause: "Deduplication logic only checks within single channel (web vs. phone vs. agent)"
          effect: "Same claim paid twice, financial loss"
          severity: 9
          occurrence: 5
          detection: 6
          rpn: 270
          recommended_controls:
            - "Cross-channel deduplication integration tests"
            - "Fuzzy matching tests on name/address/date variations"
            - "Daily batch report of potential duplicate payouts"

        - id: "C3-FM04"
          failure_mode: "Fraud ring detection misses colluding parties"
          cause: "Graph analysis limited to direct connections, misses indirect links"
          effect: "Organized fraud ring operates undetected, large cumulative losses"
          severity: 10
          occurrence: 5
          detection: 8
          rpn: 400
          recommended_controls:
            - "Graph traversal tests with multi-hop fraud ring topologies"
            - "Social network analysis covering 2nd and 3rd degree connections"
            - "Periodic retrospective analysis of paid claims for ring patterns"

        - id: "C3-FM05"
          failure_mode: "Inflated amount detection threshold is static and outdated"
          cause: "Hardcoded threshold not updated for inflation or regional cost differences"
          effect: "Moderately inflated claims pass detection, systematic overpayment"
          severity: 7
          occurrence: 7
          detection: 6
          rpn: 294
          recommended_controls:
            - "Dynamic threshold tests using current market data feeds"
            - "Configuration-driven threshold with automated staleness alerts"
            - "A/B comparison of static vs. dynamic threshold detection rates"

        - id: "C3-FM06"
          failure_mode: "Algorithm crashes on malformed input data"
          cause: "Null fields, unexpected data types, or missing policy records in input"
          effect: "Fraud check bypassed entirely, claim processed without screening"
          severity: 10
          occurrence: 4
          detection: 3
          rpn: 120
          recommended_controls:
            - "Fuzz testing with malformed and null-filled claim payloads"
            - "Fail-closed design: claim held if fraud check errors out"
            - "Circuit breaker with alert when fraud service is unreachable"

        - id: "C3-FM07"
          failure_mode: "Model drift degrades detection accuracy over time"
          cause: "Fraud patterns evolve but model is not retrained, feature distributions shift"
          effect: "Gradually increasing false negatives, undetected fraud losses grow"
          severity: 8
          occurrence: 6
          detection: 7
          rpn: 336
          recommended_controls:
            - "Automated drift detection monitoring on input feature distributions"
            - "Monthly accuracy benchmark against holdout fraud dataset"
            - "Canary deployment comparing old and new model scores in parallel"

    # =========================================================================
    # COMPONENT 4: CLAIMS DASHBOARD
    # =========================================================================
    - component_id: "C4"
      component_name: "Claims Dashboard"
      description: "Shows claim status, filters by date/type/status"
      failure_modes:

        - id: "C4-FM01"
          failure_mode: "Dashboard displays another user's claims (authorization bypass)"
          cause: "Broken access control, missing tenant isolation, IDOR vulnerability"
          effect: "Privacy breach, regulatory violation, loss of customer trust"
          severity: 10
          occurrence: 4
          detection: 4
          rpn: 160
          recommended_controls:
            - "Authorization tests: user A must never see user B's claims"
            - "Penetration testing for IDOR on claim ID parameters"
            - "Row-level security enforcement tests at database layer"

        - id: "C4-FM02"
          failure_mode: "Incorrect claim status displayed"
          cause: "Stale cache, event processing lag, or status enum mapping error"
          effect: "Customer sees wrong status, calls support, loses trust in system"
          severity: 6
          occurrence: 5
          detection: 4
          rpn: 120
          recommended_controls:
            - "End-to-end test: update claim status and verify dashboard reflects change"
            - "Cache invalidation tests on status transitions"
            - "Event ordering tests for rapid status changes"

        - id: "C4-FM03"
          failure_mode: "Filter returns incorrect or incomplete results"
          cause: "SQL query bug, index missing, off-by-one in date range filter"
          effect: "User cannot find their claims, assumes they are missing"
          severity: 5
          occurrence: 6
          detection: 3
          rpn: 90
          recommended_controls:
            - "Parameterized filter tests for all combinations of date/type/status"
            - "Boundary tests on date filters (start of day, end of day, timezone edges)"
            - "Empty result set and single result edge case tests"

        - id: "C4-FM04"
          failure_mode: "Dashboard fails to load under high traffic"
          cause: "Unoptimized queries, no pagination, excessive DOM rendering"
          effect: "Dashboard unusable during peak hours (e.g., after major weather event)"
          severity: 7
          occurrence: 5
          detection: 3
          rpn: 105
          recommended_controls:
            - "Load testing simulating post-disaster claim surge (10x normal volume)"
            - "Pagination enforcement test for users with many claims"
            - "Database query performance benchmarks with large datasets"

        - id: "C4-FM05"
          failure_mode: "Cross-site scripting (XSS) via claim description or notes"
          cause: "User-supplied text rendered without output encoding"
          effect: "Session hijacking, data theft, malicious actions on behalf of user"
          severity: 9
          occurrence: 5
          detection: 4
          rpn: 180
          recommended_controls:
            - "XSS payload injection tests in all user-input rendered fields"
            - "Content Security Policy header validation"
            - "Automated DAST scanning of all dashboard endpoints"

        - id: "C4-FM06"
          failure_mode: "Claim amounts displayed in wrong currency or format"
          cause: "Locale handling error, missing currency conversion, format string bug"
          effect: "Customer misinterprets payout amount, disputes or compliance issue"
          severity: 7
          occurrence: 4
          detection: 3
          rpn: 84
          recommended_controls:
            - "Locale-specific rendering tests for all supported currencies"
            - "Snapshot tests for amount formatting across locales"
            - "Test with extreme values (very large amounts, fractional cents)"

        - id: "C4-FM07"
          failure_mode: "Session timeout not enforced, stale session remains active"
          cause: "Missing or misconfigured session expiry, token not invalidated"
          effect: "Unauthorized access to claims data from shared or public device"
          severity: 8
          occurrence: 4
          detection: 5
          rpn: 160
          recommended_controls:
            - "Session expiry tests verifying automatic logout after inactivity"
            - "Token invalidation test after explicit logout"
            - "Concurrent session limit enforcement test"

    # =========================================================================
    # COMPONENT 5: NOTIFICATION SERVICE
    # =========================================================================
    - component_id: "C5"
      component_name: "Notification Service"
      description: "Sends email/SMS updates on claim status changes"
      failure_modes:

        - id: "C5-FM01"
          failure_mode: "Notification sent to wrong recipient"
          cause: "Recipient lookup error, data join on wrong key, contact info mismatch"
          effect: "Privacy breach — claim details disclosed to unauthorized person"
          severity: 10
          occurrence: 3
          detection: 6
          rpn: 180
          recommended_controls:
            - "Integration test verifying recipient address matches claim owner"
            - "Pre-send validation comparing notification target to policy holder record"
            - "Audit log test confirming every notification logs recipient identity"

        - id: "C5-FM02"
          failure_mode: "Notification not sent after status change"
          cause: "Message queue failure, event consumer crash, dead letter queue not monitored"
          effect: "Customer unaware of claim decision, delayed response, increased support calls"
          severity: 6
          occurrence: 5
          detection: 5
          rpn: 150
          recommended_controls:
            - "End-to-end test: trigger status change and verify notification delivery"
            - "Dead letter queue monitoring with alerting"
            - "Chaos test: kill consumer mid-processing and verify retry"

        - id: "C5-FM03"
          failure_mode: "Duplicate notifications sent for same event"
          cause: "At-least-once delivery without idempotency, retry storm after timeout"
          effect: "Customer confusion, perceived system unreliability, potential spam complaints"
          severity: 4
          occurrence: 7
          detection: 5
          rpn: 140
          recommended_controls:
            - "Idempotency key tests verifying same event ID produces single notification"
            - "Deduplication window tests under retry conditions"
            - "Rate limiting tests preventing burst of identical messages"

        - id: "C5-FM04"
          failure_mode: "Notification contains incorrect claim details"
          cause: "Template rendering bug, stale data in event payload, variable substitution error"
          effect: "Customer receives misleading information about their claim"
          severity: 7
          occurrence: 5
          detection: 4
          rpn: 140
          recommended_controls:
            - "Template rendering tests for each notification type with known data"
            - "Snapshot tests comparing rendered output to approved reference"
            - "Variable substitution tests with special characters and edge-case values"

        - id: "C5-FM05"
          failure_mode: "SMS/email provider outage causes total notification failure"
          cause: "Single provider dependency, no failover, provider API breaking change"
          effect: "All notifications silently fail, customers uninformed for extended period"
          severity: 8
          occurrence: 4
          detection: 4
          rpn: 128
          recommended_controls:
            - "Failover integration test: simulate primary provider failure, verify secondary takes over"
            - "Health check monitoring on provider API endpoints"
            - "Contract tests against provider API specification"

        - id: "C5-FM06"
          failure_mode: "Notification sent outside customer's preferred channel or opt-out violated"
          cause: "Preference lookup failure, opt-out flag not checked before send"
          effect: "Regulatory violation (CAN-SPAM, TCPA), fines, customer complaints"
          severity: 8
          occurrence: 4
          detection: 5
          rpn: 160
          recommended_controls:
            - "Opt-out enforcement tests: opted-out user must receive zero notifications"
            - "Channel preference tests: SMS-only user must not receive email"
            - "Compliance regression suite for CAN-SPAM and TCPA requirements"

        - id: "C5-FM07"
          failure_mode: "Notification delivery latency exceeds SLA"
          cause: "Queue backlog, throttling by provider, inefficient batching"
          effect: "Customer receives stale updates, time-sensitive decisions delayed"
          severity: 5
          occurrence: 6
          detection: 4
          rpn: 120
          recommended_controls:
            - "Latency benchmark tests under normal and peak load"
            - "SLA monitoring with alerting on p95 delivery time"
            - "Queue depth monitoring with auto-scaling triggers"

