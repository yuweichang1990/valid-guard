          - id: "C1-FM03"
            rpn: 240
            test_focus: "Depreciation calculation accuracy — parameterized tests across asset categories"
          - id: "C2-FM04"
            rpn: 216
            test_focus: "Document-claim binding under concurrency — race condition and idempotency tests"
          - id: "C1-FM01"
            rpn: 180
            test_focus: "Deductible subtraction correctness — per-policy-type golden-file regression"
          - id: "C4-FM05"
            rpn: 180
            test_focus: "XSS prevention — injection payload tests in all rendered fields, CSP validation"
          - id: "C2-FM06"
            rpn: 168
            test_focus: "Upload durability — write-then-verify, chaos engineering on storage failures"
          - id: "C3-FM02"
            rpn: 168
