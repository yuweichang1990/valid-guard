  # FM-5.2: Notification Sent to Wrong Recipient (Severity=9, Occurrence=2, Detection=5, RPN=90)
  - name: "FM-5.2 Notification sent to wrong recipient — privacy breach"
    description: >
      A notification about a claim is sent to the wrong person, disclosing claim
      details (amount, status, policy information) to an unauthorized recipient.
      FMEA: Severity=9, Occurrence=2, Detection=5, RPN=90.
    type: security
    risk: high
    risk_rationale: >
      Impact: 3 (security — sending claim details to wrong person is a data breach).
      Frequency: 1 (rare but possible through data mapping errors or race conditions).
      Consequence: 3 (privacy violation, regulatory fines, loss of trust).
      Detectability: 2 (wrong recipient may not report it; actual claimant may not know).
      Average: 2.25 -> medium. Overridden to high due to security severity.
    techniques:
      - equivalence_partitioning
      - error_guessing
      - cause_effect
    technique_rationale: >
      EP partitions by recipient lookup method (claim-to-contact mapping, batch
      notifications). EG anticipates race conditions where contact info changes
      between lookup and send, batch notification ordering errors, and template
      variable injection. CE maps the causal chain from claim event to recipient
      resolution.
    preconditions:
      - "Notification service has access to claimant contact database"
      - "Multiple claimants exist in the system"
    examples:
      - input:
          claim_id: "CLM-001"
          claimant_id: "C-100"
          claimant_email: "alice@example.com"
          notification_type: "status_update"
        expected:
          recipient_email: "alice@example.com"
          notification_contains_claim_id: "CLM-001"
          no_cross_contamination: true
        description: "Correct recipient receives notification for their claim"
      - input:
          batch_notifications:
            - claim_id: "CLM-001"
              claimant_email: "alice@example.com"
            - claim_id: "CLM-002"
              claimant_email: "bob@example.com"
          processing: "parallel"
        expected:
          alice_receives_only: "CLM-001 details"
          bob_receives_only: "CLM-002 details"
          no_cross_contamination: true
        description: "Batch notifications — each recipient gets only their own claim details"
      - input:
          claim_id: "CLM-001"
          claimant_email_changed_during_send: true
          old_email: "alice@old.com"
          new_email: "alice@new.com"
          change_timing: "between lookup and send"
        expected:
          sent_to: "alice@new.com"
          note: "Contact update must be atomic with notification send"
        description: "Contact info changes between lookup and send — race condition"
