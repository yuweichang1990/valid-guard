  # FM-4.1: Incorrect Claim Status Displayed (Severity=7, Occurrence=4, Detection=2, RPN=56)
  - name: "FM-4.1 Incorrect claim status displayed — dashboard shows stale or wrong state"
    description: >
      The claims dashboard displays an incorrect status for a claim (e.g., showing
      "approved" when the claim is still "under review" or showing a previous
      status after a state change). This misleads claimants and adjusters.
      FMEA: Severity=7, Occurrence=4, Detection=2, RPN=56.
    type: state_transition
    risk: medium
    risk_rationale: >
      Impact: 2 (dashboard is a secondary feature — actual claim processing is unaffected).
      Frequency: 3 (every user views the dashboard; status updates happen frequently).
      Consequence: 2 (misleading display causes confusion and support calls but no financial impact).
      Detectability: 1 (users and adjusters notice wrong status quickly).
      Average: 2.00 -> medium.
    techniques:
      - state_transition
      - equivalence_partitioning
      - error_guessing
    technique_rationale: >
      ST models the claim lifecycle states and verifies dashboard reflects each
      transition correctly. EP partitions by claim status categories. EG anticipates
      caching issues, race conditions between status update and dashboard refresh,
      and eventual consistency delays.
    preconditions:
      - "Dashboard is accessible to the user"
      - "Claims exist in various statuses"
    examples:
      - input:
          claim_id: "CLM-001"
          actual_status: "approved"
          last_status_change: "2026-03-14T10:00:00Z"
          dashboard_query_time: "2026-03-14T10:00:05Z"
        expected:
          displayed_status: "approved"
          status_matches_actual: true
        description: "Dashboard reflects status change within 5 seconds"
      - input:
          claim_id: "CLM-002"
          status_changed_from: "under_review"
          status_changed_to: "approved"
          cache_ttl_seconds: 60
          dashboard_query_time: "30 seconds after change"
        expected:
          displayed_status: "approved"
          note: "Cache should be invalidated on status change, not rely on TTL"
        description: "Status change must invalidate cache — not wait for TTL expiry"
      - input:
          claim_id: "CLM-003"
          concurrent_status_updates:
            - update_1: "under_review -> approved"
            - update_2: "under_review -> denied"
          timing: "simultaneous"
        expected:
          final_status: "one of approved or denied"
          no_stuck_state: true
          note: "Concurrent updates must resolve deterministically"
        description: "Race condition — concurrent status updates must resolve cleanly"
    state_transition:
      states:
        - "submitted"
        - "under_review"
        - "additional_info_requested"
        - "approved"
        - "denied"
        - "paid"
        - "closed"
        - "appealed"
      transitions:
