  # FM-X.2: Data Consistency Across Components (Severity=8, Occurrence=3, Detection=5, RPN=120)
  - name: "FM-X.2 Data consistency failure — components have conflicting claim data"
    description: >
      Different components hold different versions of claim data due to eventual
      consistency, failed synchronization, or partial updates. For example, the
      dashboard shows "approved" but the calculation engine has a different payout
      amount than what was displayed, or notification service sends the old amount.
      FMEA: Severity=8, Occurrence=3, Detection=5, RPN=120.
    type: edge_case
    risk: high
    risk_rationale: >
      Impact: 3 (data integrity — inconsistent data across components undermines trust).
      Frequency: 2 (eventual consistency issues surface under load or during failures).
      Consequence: 3 (conflicting data leads to incorrect payouts, wrong notifications, compliance issues).
      Detectability: 3 (inconsistencies may not be detected until reconciliation or audit).
      Average: 2.75 -> high.
    techniques:
      - error_guessing
      - cause_effect
    technique_rationale: >
      EG anticipates distributed system failure modes (network partitions, partial
      writes, message ordering issues, stale caches). CE maps the data flow
      dependencies between components to identify consistency requirements.
    preconditions:
      - "All components share claim data through a data store or event bus"
      - "System operates with eventual consistency model"
    examples:
      - input:
          claim_id: "CLM-001"
          calculation_engine_payout: 15000
          dashboard_displayed_payout: 14500
          notification_sent_payout: 15000
        expected:
          all_components_agree: true
          discrepancy_detected: true
