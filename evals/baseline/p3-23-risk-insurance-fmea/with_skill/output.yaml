# FMEA (Failure Mode and Effects Analysis) for Insurance Claims Processing System

feature: "Insurance Claims Processing System FMEA"

feature_description: >
  Failure Mode and Effects Analysis for a 5-component insurance claims processing
  system. Components: (1) Claim Calculation Engine — computes payout amounts based
  on policy type, deductible, coverage limits, and depreciation; (2) Document Upload
  Service — accepts photos, PDFs, and medical records as claim evidence;
  (3) Fraud Detection Algorithm — flags suspicious patterns including duplicate
  claims, known fraud rings, and inflated amounts; (4) Claims Dashboard — shows
  claim status with filters by date, type, and status; (5) Notification Service —
  sends email/SMS updates on claim status changes. For each component, failure modes
  are identified, rated by FMEA dimensions (Severity 1-10, Occurrence 1-10,
  Detection 1-10), RPN computed, and test priority recommended.

risk_level: high

entry_point: greenfield

source:
  type: natural_language
  path: ""

scenarios:
  # ===========================================================================
  # COMPONENT 1: CLAIM CALCULATION ENGINE
  # Failure Modes: Incorrect payout, rounding errors, depreciation miscalculation,
  #   coverage limit bypass, deductible not applied, policy type mismatch
  # ===========================================================================

  # FM-1.1: Incorrect Payout Computation (Severity=9, Occurrence=5, Detection=4, RPN=180)
  - name: "FM-1.1 Incorrect payout computation due to wrong formula application"
    description: >
      The claim calculation engine applies an incorrect formula for the policy type,
      resulting in overpayment or underpayment. This is the highest-severity failure
      mode for the calculation engine because it directly causes financial loss.
      FMEA: Severity=9, Occurrence=5, Detection=4, RPN=180.
    type: combinatorial
    risk: high
    risk_rationale: >
      Impact: 3 (core business logic — financial calculation directly affects payouts).
      Frequency: 3 (every claim submission triggers this logic).
      Consequence: 3 (financial loss — overpayment hurts insurer, underpayment causes disputes/litigation).
      Detectability: 2 (incorrect amounts may not be noticed until audit or customer complaint).
      Average: 2.75 -> high.
    techniques:
      - equivalence_partitioning
      - boundary_value
      - decision_table
      - cause_effect
      - error_guessing
    technique_rationale: >
      EP partitions by policy type (auto, home, health, life). BVA tests boundary
      values of coverage limits and deductibles. DT covers the combinatorial matrix
      of policy type x deductible x coverage limit x depreciation. CE maps the
      logical dependencies between these inputs and the computed payout. EG anticipates
      floating-point rounding errors and off-by-one in depreciation schedules.
    preconditions:
      - "Active policy exists in the system"
      - "Claim has been submitted with valid loss amount"
      - "Policy type, deductible, coverage limit, and depreciation schedule are configured"
    examples:
      - input:
          policy_type: "auto"
          loss_amount: 15000
          deductible: 500
          coverage_limit: 50000
          depreciation_rate: 0.10
          asset_age_years: 3
        expected:
          payout: 10050
          formula_applied: "(loss_amount - deductible) * (1 - depreciation_rate * asset_age_years)"
        description: "Auto policy with standard deductible and 30% cumulative depreciation"
      - input:
          policy_type: "home"
          loss_amount: 200000
          deductible: 1000
          coverage_limit: 150000
          depreciation_rate: 0.05
          asset_age_years: 10
        expected:
          payout: 75000
          formula_applied: "min(loss_amount - deductible, coverage_limit) * (1 - depreciation_rate * asset_age_years)"
          capped_at_coverage_limit: true
        description: "Home policy where loss exceeds coverage limit; payout capped then depreciated"
      - input:
          policy_type: "health"
          loss_amount: 5000
          deductible: 5000
          coverage_limit: 100000
          depreciation_rate: 0.0
          asset_age_years: 0
        expected:
          payout: 0
          reason: "Loss amount equals deductible"
        description: "Health policy where loss exactly equals deductible — zero payout boundary"
      - input:
          policy_type: "unknown_type"
          loss_amount: 10000
          deductible: 500
          coverage_limit: 50000
          depreciation_rate: 0.05
          asset_age_years: 2
        expected:
          error: "InvalidPolicyTypeError"
          payout: null
        description: "Invalid policy type triggers error — no payout should be computed"
    decision_table:
      conditions:
        - "policy_type"
        - "loss_amount > deductible"
        - "net_amount > coverage_limit"
        - "depreciation_applicable"
      actions:
        - "compute_payout"
        - "cap_at_coverage_limit"
        - "apply_depreciation"
        - "reject_claim"
      rules:
        - description: "Auto claim under limit with depreciation"
          condition_values:
            policy_type: "auto"
            loss_amount_exceeds_deductible: true
            net_amount_exceeds_coverage_limit: false
            depreciation_applicable: true
          expected_actions:
            compute_payout: true
            cap_at_coverage_limit: false
            apply_depreciation: true
            reject_claim: false
        - description: "Home claim exceeding coverage limit"
          condition_values:
            policy_type: "home"
            loss_amount_exceeds_deductible: true
            net_amount_exceeds_coverage_limit: true
            depreciation_applicable: true
          expected_actions:
            compute_payout: true
            cap_at_coverage_limit: true
            apply_depreciation: true
            reject_claim: false
        - description: "Health claim with loss equal to deductible"
          condition_values:
            policy_type: "health"
            loss_amount_exceeds_deductible: false
            net_amount_exceeds_coverage_limit: false
            depreciation_applicable: false
          expected_actions:
            compute_payout: false
            cap_at_coverage_limit: false
            apply_depreciation: false
            reject_claim: false
        - description: "Invalid policy type"
          condition_values:
            policy_type: "invalid"
            loss_amount_exceeds_deductible: true
            net_amount_exceeds_coverage_limit: false
            depreciation_applicable: false
          expected_actions:
            compute_payout: false
            cap_at_coverage_limit: false
            apply_depreciation: false
            reject_claim: true
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - "fmea"
      - "claim-calculation"
      - "financial"
      - "rpn-180"
      - "severity-9"
      - "component-1"

  # FM-1.2: Rounding Errors in Currency Calculations (Severity=7, Occurrence=6, Detection=5, RPN=210)
  - name: "FM-1.2 Rounding errors in currency calculations"
    description: >
      Floating-point arithmetic causes rounding errors in payout calculations,
      leading to penny discrepancies that accumulate over thousands of claims
      and cause financial reconciliation failures. FMEA: Severity=7, Occurrence=6,
      Detection=5, RPN=210.
    type: boundary
    risk: high
    risk_rationale: >
      Impact: 3 (financial calculations — even small rounding errors compound at scale).
      Frequency: 3 (every claim with non-integer amounts triggers this path).
      Consequence: 2 (individual impact is small but aggregate impact causes audit failures).
      Detectability: 3 (silent — rounding errors are not immediately visible and only found during reconciliation).
      Average: 2.75 -> high.
    techniques:
      - boundary_value
      - equivalence_partitioning
      - error_guessing
    technique_rationale: >
      BVA tests boundary values that trigger rounding (e.g., amounts ending in .005,
      .995). EP partitions by currency precision requirements. EG anticipates
      IEEE 754 floating-point issues with specific problematic values like 0.1 + 0.2.
    preconditions:
      - "Calculation engine is initialized"
      - "Currency is configured (USD, EUR, etc.)"
    examples:
      - input:
          loss_amount: 1000.005
          deductible: 0.00
          coverage_limit: 50000
        expected:
          payout: 1000.01
          rounding_mode: "HALF_UP"
        description: "Amount at half-cent boundary — should round up"
      - input:
          loss_amount: 0.01
          deductible: 0.00
          coverage_limit: 50000
        expected:
          payout: 0.01
        description: "Minimum representable currency amount"
      - input:
          loss_amount: 99999.99
          deductible: 0.01
          coverage_limit: 100000
        expected:
          payout: 99999.98
        description: "Near-maximum amount just under coverage limit"
      - input:
          loss_amount: 33.33
          deductible: 0.00
          coverage_limit: 50000
          quantity: 3
        expected:
          total_payout: 99.99
          note: "3 * 33.33 must equal 99.99, not 100.00 or 99.98"
        description: "Repeating decimal multiplication — precision test"
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - "fmea"
      - "claim-calculation"
      - "rounding"
      - "rpn-210"
      - "severity-7"
      - "component-1"

  # FM-1.3: Depreciation Miscalculation (Severity=8, Occurrence=4, Detection=5, RPN=160)
  - name: "FM-1.3 Depreciation miscalculation produces negative or excessive payout"
    description: >
      The depreciation calculation produces a negative value (when cumulative
      depreciation exceeds 100%) or fails to apply depreciation correctly for
      different asset types and ages. FMEA: Severity=8, Occurrence=4, Detection=5,
      RPN=160.
    type: boundary
    risk: high
    risk_rationale: >
      Impact: 3 (directly affects payout amount — core financial logic).
      Frequency: 2 (occurs for property/auto claims, not all claim types).
      Consequence: 3 (negative payout or excessive payout causes financial loss or legal issues).
      Detectability: 2 (depreciation logic errors may pass basic validation but fail on edge cases).
      Average: 2.50 -> high.
    techniques:
      - boundary_value
      - equivalence_partitioning
      - error_guessing
    technique_rationale: >
      BVA tests boundaries of asset age (0 years, maximum age where depreciation
      reaches 100%). EP partitions by asset type with different depreciation schedules.
      EG anticipates negative payout from over-depreciation and division-by-zero
      for zero-value assets.
    preconditions:
      - "Asset information is provided with the claim"
      - "Depreciation schedule is configured for the policy type"
    examples:
      - input:
          asset_value: 10000
          depreciation_rate: 0.10
          asset_age_years: 11
        expected:
          depreciation_factor: 0.0
          payout_modifier: 0.0
          note: "Cumulative depreciation exceeds 100% — should floor at 0, not go negative"
        description: "Asset fully depreciated — payout modifier must not go negative"
      - input:
          asset_value: 10000
          depreciation_rate: 0.10
          asset_age_years: 10
        expected:
          depreciation_factor: 0.0
          payout_modifier: 0.0
        description: "Asset at exactly 100% depreciation boundary"
      - input:
          asset_value: 10000
          depreciation_rate: 0.10
          asset_age_years: 0
        expected:
          depreciation_factor: 1.0
          payout_modifier: 1.0
        description: "Brand new asset — no depreciation applied"
      - input:
          asset_value: 0
          depreciation_rate: 0.10
          asset_age_years: 5
        expected:
          error: "ZeroValueAssetError"
        description: "Zero-value asset — edge case that may cause division errors"
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - "fmea"
      - "claim-calculation"
      - "depreciation"
      - "rpn-160"
      - "severity-8"
      - "component-1"

  # FM-1.4: Coverage Limit Bypass (Severity=9, Occurrence=3, Detection=6, RPN=162)
  - name: "FM-1.4 Coverage limit bypass allows payout exceeding policy maximum"
    description: >
      A defect in the cap-checking logic allows a payout that exceeds the policy's
      coverage limit. This can occur through split claims, concurrent claim
      submissions, or calculation ordering errors (applying depreciation before
      capping instead of after). FMEA: Severity=9, Occurrence=3, Detection=6, RPN=162.
    type: security
    risk: high
    risk_rationale: >
      Impact: 3 (coverage limit is a core financial safeguard).
      Frequency: 2 (edge case but exploitable through split claims or race conditions).
      Consequence: 3 (financial loss — paying beyond contractual limits).
      Detectability: 2 (may not be detected until aggregate payout exceeds limit across multiple claims).
      Average: 2.50 -> high.
    techniques:
      - boundary_value
      - decision_table
      - error_guessing
      - cause_effect
    technique_rationale: >
      BVA tests amounts at, just below, and just above coverage limits. DT covers
      combinations of split claims and coverage remaining. EG anticipates race
      conditions in concurrent claim submissions against the same policy. CE maps
      the logical relationship between claim amount, prior payouts, and remaining
      coverage.
    preconditions:
      - "Policy has a defined coverage limit"
      - "Prior claim payouts may exist against the same policy"
    examples:
      - input:
          coverage_limit: 50000
          prior_payouts: 49000
          current_claim: 5000
          deductible: 0
        expected:
          payout: 1000
          remaining_coverage: 0
          note: "Payout capped at remaining coverage"
        description: "Claim amount exceeds remaining coverage — must cap at remainder"
      - input:
          coverage_limit: 50000
          concurrent_claims:
            - claim_amount: 30000
            - claim_amount: 30000
          submission_timing: "simultaneous"
        expected:
          total_payout_max: 50000
          note: "Concurrent claims must not exceed coverage limit in aggregate"
        description: "Race condition — two simultaneous claims must not bypass limit"
      - input:
          coverage_limit: 50000
          claim_amount: 50001
          deductible: 0
        expected:
          payout: 50000
          capped: true
        description: "Single claim exceeding limit by $1 — boundary test"
    decision_table:
      conditions:
        - "claim_amount > remaining_coverage"
        - "prior_payouts_exist"
        - "concurrent_claims_pending"
      actions:
        - "cap_payout_at_remaining"
        - "lock_policy_for_concurrent_check"
        - "pay_full_claim_amount"
      rules:
        - description: "Claim within remaining coverage, no concurrency"
          condition_values:
            claim_exceeds_remaining: false
            prior_payouts_exist: false
            concurrent_claims_pending: false
          expected_actions:
            cap_payout_at_remaining: false
            lock_policy_for_concurrent_check: false
            pay_full_claim_amount: true
        - description: "Claim exceeds remaining coverage"
          condition_values:
            claim_exceeds_remaining: true
            prior_payouts_exist: true
            concurrent_claims_pending: false
          expected_actions:
            cap_payout_at_remaining: true
            lock_policy_for_concurrent_check: false
            pay_full_claim_amount: false
        - description: "Concurrent claims detected"
          condition_values:
            claim_exceeds_remaining: false
            prior_payouts_exist: false
            concurrent_claims_pending: true
          expected_actions:
            cap_payout_at_remaining: false
            lock_policy_for_concurrent_check: true
            pay_full_claim_amount: false
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - "fmea"
      - "claim-calculation"
      - "coverage-limit"
      - "concurrency"
      - "rpn-162"
      - "severity-9"
      - "component-1"

  # FM-1.5: Deductible Not Applied (Severity=8, Occurrence=3, Detection=4, RPN=96)
  - name: "FM-1.5 Deductible not applied or applied incorrectly"
    description: >
      The deductible is either skipped entirely (paying the full loss amount) or
      applied multiple times (double-deducting). This may occur when deductible
      type varies by policy (flat vs percentage-based). FMEA: Severity=8,
      Occurrence=3, Detection=4, RPN=96.
    type: combinatorial
    risk: high
    risk_rationale: >
      Impact: 3 (deductible is a core financial component of every claim).
      Frequency: 3 (every claim should have a deductible applied).
      Consequence: 3 (financial loss — not applying deductible means overpayment).
      Detectability: 2 (may slip through if only the final payout is validated, not the formula steps).
      Average: 2.75 -> high.
    techniques:
      - equivalence_partitioning
      - boundary_value
      - decision_table
      - error_guessing
    technique_rationale: >
      EP partitions by deductible type (flat, percentage, zero, maximum). BVA tests
      deductible at zero, at minimum, equal to loss, exceeding loss. DT covers
      combinations of deductible type and policy type. EG anticipates double-deduction
      bugs and negative result from percentage deductible exceeding 100%.
    preconditions:
      - "Policy with configured deductible exists"
      - "Claim has been submitted"
    examples:
      - input:
          loss_amount: 10000
          deductible_type: "flat"
          deductible_amount: 500
        expected:
          net_loss: 9500
          deductible_applied: true
        description: "Standard flat deductible applied correctly"
      - input:
          loss_amount: 10000
          deductible_type: "percentage"
          deductible_percentage: 20
        expected:
          net_loss: 8000
          deductible_applied: true
        description: "Percentage-based deductible (20% of loss)"
      - input:
          loss_amount: 300
          deductible_type: "flat"
          deductible_amount: 500
        expected:
          net_loss: 0
          payout: 0
          note: "Loss less than deductible — no payout"
        description: "Loss amount less than deductible — boundary case"
      - input:
          loss_amount: 500
          deductible_type: "flat"
          deductible_amount: 500
        expected:
          net_loss: 0
          payout: 0
        description: "Loss exactly equals deductible — zero payout boundary"
    decision_table:
      conditions:
        - "deductible_type"
        - "loss_amount > deductible_effective"
        - "deductible_amount == 0"
      actions:
        - "subtract_flat_deductible"
        - "subtract_percentage_deductible"
        - "skip_deductible"
        - "zero_payout"
      rules:
        - description: "Flat deductible, loss exceeds deductible"
          condition_values:
            deductible_type: "flat"
            loss_exceeds_deductible: true
            deductible_is_zero: false
          expected_actions:
            subtract_flat_deductible: true
            subtract_percentage_deductible: false
            skip_deductible: false
            zero_payout: false
        - description: "Percentage deductible, loss exceeds deductible"
          condition_values:
            deductible_type: "percentage"
            loss_exceeds_deductible: true
            deductible_is_zero: false
          expected_actions:
            subtract_flat_deductible: false
            subtract_percentage_deductible: true
            skip_deductible: false
            zero_payout: false
        - description: "Zero deductible"
          condition_values:
            deductible_type: "flat"
            loss_exceeds_deductible: true
            deductible_is_zero: true
          expected_actions:
            subtract_flat_deductible: false
            subtract_percentage_deductible: false
            skip_deductible: true
            zero_payout: false
        - description: "Loss does not exceed deductible"
          condition_values:
            deductible_type: "flat"
            loss_exceeds_deductible: false
            deductible_is_zero: false
          expected_actions:
            subtract_flat_deductible: false
            subtract_percentage_deductible: false
            skip_deductible: false
            zero_payout: true
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - "fmea"
      - "claim-calculation"
      - "deductible"
      - "rpn-96"
      - "severity-8"
      - "component-1"

  # ===========================================================================
  # COMPONENT 2: DOCUMENT UPLOAD SERVICE
  # Failure Modes: Upload corruption, malicious file, oversized file,
  #   unsupported format, metadata loss, HIPAA violation
  # ===========================================================================

  # FM-2.1: Uploaded File Corruption (Severity=7, Occurrence=4, Detection=3, RPN=84)
  - name: "FM-2.1 Uploaded file corruption — data lost or truncated during upload"
    description: >
      Files uploaded as claim evidence become corrupted during transfer or storage,
      rendering them unreadable. This affects claim adjudication because evidence
      cannot be reviewed. FMEA: Severity=7, Occurrence=4, Detection=3, RPN=84.
    type: error_handling
    risk: high
    risk_rationale: >
      Impact: 3 (data integrity — corrupted evidence affects claim adjudication).
      Frequency: 2 (occurs on network issues, large files, or interrupted uploads).
      Consequence: 3 (claim cannot be processed, potential data loss of irreplaceable documents).
      Detectability: 2 (corruption may not be detected until adjuster tries to open the file).
      Average: 2.50 -> high.
    techniques:
      - equivalence_partitioning
      - boundary_value
      - error_guessing
    technique_rationale: >
      EP partitions by file type (photo/JPEG, PDF, medical records/DICOM). BVA tests
      file size boundaries (0 bytes, max allowed, just over max). EG anticipates
      network interruption mid-upload, partial writes, and encoding corruption.
    preconditions:
      - "User is authenticated and has an active claim"
      - "Document upload endpoint is available"
    examples:
      - input:
          file_type: "application/pdf"
          file_size_bytes: 10485760
          network_condition: "stable"
        expected:
          upload_status: "success"
          checksum_verified: true
        description: "10 MB PDF upload under stable conditions — happy path"
      - input:
          file_type: "image/jpeg"
          file_size_bytes: 5242880
          network_condition: "interrupted_at_50_percent"
        expected:
          upload_status: "failed"
          error: "UploadInterruptedError"
          partial_file_cleaned_up: true
        description: "Network interruption mid-upload — partial file must be cleaned up"
      - input:
          file_type: "application/pdf"
          file_size_bytes: 0
        expected:
          upload_status: "rejected"
          error: "EmptyFileError"
        description: "Zero-byte file upload — should be rejected"
      - input:
          file_type: "image/jpeg"
          file_size_bytes: 104857600
        expected:
          upload_status: "rejected"
          error: "FileTooLargeError"
          max_allowed_bytes: 52428800
        description: "100 MB file exceeding 50 MB limit — rejected at boundary"
    test_ref: ""
    status: uncovered
    priority: 2
    tags:
      - "fmea"
      - "document-upload"
      - "data-integrity"
      - "rpn-84"
      - "severity-7"
      - "component-2"

  # FM-2.2: Malicious File Upload (Severity=10, Occurrence=4, Detection=5, RPN=200)
  - name: "FM-2.2 Malicious file upload — executable or malware disguised as document"
    description: >
      An attacker uploads a malicious file (e.g., executable disguised as PDF, file
      with embedded scripts, polyglot file) that could compromise the server or
      downstream systems when processed. FMEA: Severity=10, Occurrence=4,
      Detection=5, RPN=200.
    type: security
    risk: high
    risk_rationale: >
      Impact: 3 (security vulnerability — server compromise, data breach).
      Frequency: 2 (targeted attacks occur; automated scanners probe upload endpoints).
      Consequence: 3 (security breach, data exfiltration, ransomware, compliance violation).
      Detectability: 3 (sophisticated attacks bypass basic extension checks; requires deep content inspection).
      Average: 2.75 -> high.
    techniques:
      - equivalence_partitioning
      - error_guessing
      - cause_effect
    technique_rationale: >
      EP partitions by file content type vs extension mismatch categories. EG anticipates
      known attack vectors (path traversal in filename, zip bombs, polyglot files,
      embedded JavaScript in PDFs). CE maps the logical chain from file characteristics
      to detection and blocking actions.
    preconditions:
      - "Upload endpoint is publicly accessible to authenticated users"
      - "File validation and antivirus scanning pipeline is configured"
    examples:
      - input:
          filename: "claim_photo.jpg.exe"
          content_type_header: "image/jpeg"
          actual_content: "PE executable"
        expected:
          upload_status: "rejected"
          error: "MaliciousFileDetected"
          scan_result: "executable_content"
        description: "Double-extension executable disguised as JPEG"
      - input:
          filename: "../../etc/passwd"
          content_type_header: "text/plain"
          actual_content: "text"
        expected:
          upload_status: "rejected"
          error: "InvalidFilenameError"
          sanitized_filename: true
        description: "Path traversal attack in filename"
      - input:
          filename: "medical_record.pdf"
          content_type_header: "application/pdf"
          actual_content: "PDF with embedded JavaScript"
        expected:
          upload_status: "quarantined"
          warning: "EmbeddedScriptDetected"
          script_stripped: true
        description: "PDF with embedded JavaScript — should be sanitized or quarantined"
      - input:
          filename: "evidence.zip"
          content_type_header: "application/zip"
          actual_content: "zip bomb (42.zip pattern)"
          decompressed_size: 4503599627370496
        expected:
          upload_status: "rejected"
          error: "ZipBombDetected"
        description: "Zip bomb attack — decompression ratio check"
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - "fmea"
      - "document-upload"
      - "security"
      - "rpn-200"
      - "severity-10"
      - "component-2"

  # FM-2.3: Medical Records HIPAA Violation (Severity=10, Occurrence=3, Detection=6, RPN=180)
  - name: "FM-2.3 Medical records exposed without proper access control — HIPAA violation"
    description: >
      Medical records uploaded as claim evidence are stored or transmitted without
      proper encryption, access controls, or audit logging, violating HIPAA
      regulations. Unauthorized personnel can access PHI (Protected Health
      Information). FMEA: Severity=10, Occurrence=3, Detection=6, RPN=180.
    type: security
    risk: high
    risk_rationale: >
      Impact: 3 (security and compliance — PHI exposure violates federal regulations).
      Frequency: 2 (health claims are a significant portion of claims; access controls are checked on every access).
      Consequence: 3 (HIPAA violations carry massive fines, lawsuits, and reputational damage).
      Detectability: 3 (unauthorized access may go undetected without proper audit logging).
      Average: 2.75 -> high.
    techniques:
      - equivalence_partitioning
      - decision_table
      - error_guessing
    technique_rationale: >
      EP partitions by user role (adjuster, admin, claimant, unauthorized). DT covers
      role x document-type x action permission matrix. EG anticipates missing
      encryption at rest, audit log gaps, and IDOR (Insecure Direct Object Reference)
      vulnerabilities.
    preconditions:
