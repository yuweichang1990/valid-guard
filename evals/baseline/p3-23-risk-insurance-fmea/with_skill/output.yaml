  # FM-X.1: End-to-End Claim Processing Failure (Severity=9, Occurrence=3, Detection=4, RPN=108)
  - name: "FM-X.1 End-to-end claim processing failure — component integration breakdown"
    description: >
      A failure at the integration boundary between components causes the entire
      claim processing pipeline to break. For example: calculation engine computes
      payout but fraud detection is not invoked, or status changes but notification
      service is not triggered, or documents are uploaded but not linked to the
      claim in the calculation engine. FMEA: Severity=9, Occurrence=3, Detection=4,
      RPN=108.
    type: error_handling
    risk: high
    risk_rationale: >
      Impact: 3 (core business process — end-to-end claim processing is the primary system function).
      Frequency: 2 (integration issues may surface under specific conditions or race conditions).
      Consequence: 3 (claim is stuck, incorrectly processed, or approved without fraud check).
      Detectability: 2 (integration failures may be silent — each component thinks it succeeded).
      Average: 2.50 -> high.
    techniques:
      - state_transition
      - cause_effect
      - error_guessing
    technique_rationale: >
      ST models the end-to-end claim lifecycle across all 5 components. CE maps
      the causal dependencies between components (calculation depends on documents,
      notification depends on status change, fraud detection must precede approval).
      EG anticipates message bus failures, distributed transaction issues, and
      partial completions.
    preconditions:
      - "All 5 components are deployed and integrated"
      - "Message bus or integration layer is operational"
    examples:
      - input:
          claim_submitted: true
          documents_uploaded: true
          fraud_check_completed: false
          fraud_service_status: "down"
          calculation_engine_status: "ready"
        expected:
          claim_approved: false
          claim_status: "pending_fraud_review"
          note: "Claim must not be approved if fraud check was not completed"
        description: "Fraud service down — claim must not bypass fraud detection"
      - input:
          claim_approved: true
          payout_calculated: true
          notification_service_status: "down"
        expected:
          payout_processed: true
          notification_queued: true
          note: "Payout should proceed even if notification fails — notification is async"
        description: "Notification service down — payout should not be blocked"
      - input:
          documents_uploaded: true
          document_linked_to_claim: false
          calculation_triggered: true
        expected:
          calculation_halted: true
          error: "MissingDocumentLinkError"
        description: "Documents uploaded but not linked to claim — calculation should not proceed"
    state_transition:
      states:
        - "claim_submitted"
        - "documents_attached"
        - "fraud_check_in_progress"
        - "fraud_check_passed"
        - "fraud_check_failed"
