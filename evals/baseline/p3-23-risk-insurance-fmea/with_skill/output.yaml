          guard: "Documents uploaded successfully"
        - from: "under_review"
          to: "approved"
          trigger: "Adjuster approves claim"
          guard: "All evidence reviewed and valid"
        - from: "under_review"
          to: "denied"
          trigger: "Adjuster denies claim"
          guard: "Denial reason documented"
        - from: "approved"
          to: "paid"
          trigger: "Payment processed"
          guard: "Payment method verified"
        - from: "paid"
          to: "closed"
          trigger: "Claim finalized"
          guard: "No appeals within appeal window"
        - from: "denied"
          to: "appealed"
          trigger: "Claimant files appeal"
          guard: "Within appeal deadline"
        - from: "appealed"
