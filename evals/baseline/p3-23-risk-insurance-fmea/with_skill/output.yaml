  # FM-3.3: Fraud Ring Detection Failure (Severity=9, Occurrence=3, Detection=8, RPN=216)
  - name: "FM-3.3 Fraud ring detection failure — coordinated fraud network not identified"
    description: >
      The algorithm fails to detect coordinated fraud where multiple claimants,
      providers, or adjusters are part of a fraud ring. Each individual claim may
      appear legitimate, but the pattern across the network reveals fraud.
      FMEA: Severity=9, Occurrence=3, Detection=8, RPN=216.
    type: error_handling
    risk: high
    risk_rationale: >
      Impact: 3 (core fraud prevention — fraud rings cause massive aggregate losses).
      Frequency: 2 (fraud rings are less common than individual fraud but cause larger losses).
      Consequence: 3 (cumulative financial loss from undetected ring can be millions of dollars).
      Detectability: 3 (fraud rings are designed to evade detection; individual claims look normal).
      Average: 2.75 -> high.
    techniques:
      - cause_effect
      - decision_table
      - error_guessing
    technique_rationale: >
      CE maps the graph relationships (shared addresses, phone numbers, providers,
      attorneys) that indicate ring membership. DT covers combinations of ring
      indicators. EG anticipates sophisticated evasion (using slightly different
      addresses, VoIP numbers, nominee claimants).
    preconditions:
      - "Fraud ring database and graph analysis engine are operational"
      - "Sufficient historical data exists for pattern matching"
    examples:
      - input:
          claims:
            - claimant: "A"
              address: "123 Main St"
              provider: "Dr. X"
              attorney: "Law Firm Y"
            - claimant: "B"
              address: "125 Main St"
              provider: "Dr. X"
              attorney: "Law Firm Y"
            - claimant: "C"
              address: "127 Main St"
              provider: "Dr. X"
              attorney: "Law Firm Z"
        expected:
          ring_detected: true
          ring_members: ["A", "B", "C"]
          shared_indicators: ["proximity_address", "same_provider"]
        description: "Three claimants at adjacent addresses with same provider — ring pattern"
      - input:
          claims:
            - claimant: "D"
              phone: "+1-555-0100"
              incident_date: "2026-01-15"
            - claimant: "E"
              phone: "+1-555-0101"
              incident_date: "2026-01-15"
          phone_numbers_from_same_voip_provider: true
        expected:
          ring_detected: true
          confidence: ">= 0.75"
          indicators: ["sequential_phone_numbers", "same_incident_date", "voip_numbers"]
        description: "Sequential VoIP phone numbers and same incident date — coordinated fraud"
      - input:
          claims:
            - claimant: "F"
              address: "456 Oak Ave"
              provider: "Dr. Z"
            - claimant: "G"
              address: "789 Pine Rd"
              provider: "Dr. W"
        expected:
          ring_detected: false
          note: "No shared indicators — independent claims"
        description: "Independent claims with no shared indicators — no ring"
