example_mapping:
  story: >
    As an insurance company, I need a claims processing system that accurately
    calculates payouts, securely handles documents, detects fraud, provides
    transparent status visibility, and notifies claimants of changes — so that
    claims are processed correctly, efficiently, and compliantly.
  rules:
    - rule_name: "Payout Calculation Accuracy"
      examples:
        - "Auto policy claim with $500 deductible and 10% annual depreciation over 3 years yields correct payout"
        - "Home policy claim exceeding coverage limit is capped at limit before depreciation"
        - "Health claim where loss equals deductible produces zero payout"
        - "Claim with invalid policy type returns InvalidPolicyTypeError"
        - "Currency calculations use banker's rounding (HALF_UP) to avoid penny discrepancies"
        - "Cumulative depreciation exceeding 100% floors at zero, never goes negative"
        - "Concurrent claims against same policy cannot exceed aggregate coverage limit"
    - rule_name: "Deductible Application"
      examples:
        - "Flat deductible is subtracted from loss amount once"
        - "Percentage deductible computes correct percentage of loss amount"
        - "Loss amount less than flat deductible results in zero payout"
        - "Loss amount exactly equal to deductible results in zero payout"
        - "Zero deductible policy skips deduction step entirely"
    - rule_name: "Document Upload Security"
      examples:
        - "Valid JPEG, PNG, and PDF files are accepted with checksum verification"
        - "Files with mismatched content-type header and magic bytes are rejected"
        - "Executable files disguised with double extensions (.jpg.exe) are blocked"
        - "Path traversal in filenames (../../etc/passwd) is sanitized"
        - "Zip bombs detected by decompression ratio check"
        - "Zero-byte files are rejected"
        - "Files exceeding 50 MB limit are rejected"
    - rule_name: "Medical Records HIPAA Compliance"
      examples:
        - "Only authorized adjusters assigned to a claim can view its medical records"
        - "Unauthorized access attempts are logged and trigger security alerts"
        - "Medical records must be encrypted at rest"
        - "All access to medical records creates audit log entries"
    - rule_name: "Fraud Detection Effectiveness"
      examples:
        - "Duplicate claims filed within 90 days are flagged with >= 90% confidence"
        - "Claims from known fraud ring members are always flagged regardless of amount"
        - "Repair estimates exceeding vehicle market value by > 40% are flagged as inflated"
        - "Just-below-threshold amounts are monitored as potential evasion"
        - "Legitimate high-value claims with no other indicators are not flagged (false positive prevention)"
        - "Multiple claims during declared natural disasters are treated as legitimate"
    - rule_name: "Fraud Ring Network Detection"
      examples:
        - "Claimants at adjacent addresses with same provider are identified as potential ring"
        - "Sequential VoIP phone numbers with same incident date trigger ring detection"
        - "Independent claims with no shared indicators do not trigger ring alert"
    - rule_name: "Dashboard Status Accuracy"
      examples:
        - "Dashboard reflects status changes within 5 seconds"
        - "Cache is invalidated on status change, not relying on TTL expiry"
        - "Each claimant sees only their own claims — no data leakage"
        - "IDOR attacks via direct claim ID manipulation are blocked"
        - "Query parameter manipulation (user_id override) is rejected"
    - rule_name: "Dashboard Filtering"
      examples:
        - "Date range filter returns all claims within specified range"
        - "Multiple filters AND together (not OR)"
        - "Invalid date range (from > to) returns warning or empty result"
        - "Filter results are consistent during concurrent status changes"
    - rule_name: "Notification Delivery Reliability"
      examples:
        - "Both email and SMS are sent on every status change for configured channels"
        - "Provider failures trigger exponential backoff retry (up to 5 retries)"
        - "Failed notifications are dead-lettered after max retries, not silently dropped"
        - "SMS unavailable (no phone) falls back to email"
        - "Rate-limited requests respect retry-after header"
    - rule_name: "Notification Recipient Integrity"
      examples:
        - "Notification is sent only to the claimant who owns the claim"
        - "Batch notifications do not cross-contaminate recipient data"
        - "Contact info changes during send are handled atomically"
    - rule_name: "Notification Content Correctness"
      examples:
        - "Notification status matches actual claim status at time of send"
        - "Missing template variables prevent notification send (not render blank)"
        - "Payout amount in notification matches calculation engine output"
    - rule_name: "Notification Idempotency"
      examples:
        - "Duplicate events are deduplicated — only one notification per event"
        - "Concurrent identical events produce only one notification"
    - rule_name: "End-to-End Integration Integrity"
      examples:
        - "Claim cannot be approved if fraud check was not completed"
        - "Payment proceeds even if notification service is down (async notification)"
        - "Documents must be linked to claim before calculation can proceed"
        - "Out-of-order events are handled correctly with consistent final state"
        - "All components agree on claim data (payout, status) — no discrepancies"

