  # ===========================================================================

  # FM-3.1: False Negative — Fraudulent Claim Not Detected (Severity=10, Occurrence=4, Detection=7, RPN=280)
  - name: "FM-3.1 False negative — fraudulent claim passes without detection"
    description: >
      The fraud detection algorithm fails to flag a genuinely fraudulent claim,
      allowing it to be processed and paid. This is the highest-RPN failure mode
      in the entire system. FMEA: Severity=10, Occurrence=4, Detection=7, RPN=280.
    type: error_handling
    risk: high
    risk_rationale: >
      Impact: 3 (core business logic — fraud detection is the primary financial safeguard).
      Frequency: 2 (fraud attempts are ongoing; detection runs on every claim).
      Consequence: 3 (direct financial loss from paying fraudulent claims; enables fraud rings).
      Detectability: 3 (by definition, false negatives are the hardest to detect — silent failures).
      Average: 2.75 -> high.
    techniques:
      - equivalence_partitioning
      - decision_table
      - cause_effect
      - error_guessing
    technique_rationale: >
      EP partitions fraud types (duplicate claims, inflated amounts, staged accidents,
      fraud rings). DT covers combinations of fraud indicators and detection
      thresholds. CE maps the logical relationships between fraud signals and
      detection outcomes. EG anticipates evasion techniques (slightly-below-threshold
      amounts, time-delayed duplicates, distributed fraud ring patterns).
    preconditions:
      - "Fraud detection algorithm is active"
      - "Historical claim data and fraud patterns are loaded"
      - "Known fraud ring database is current"
    examples:
      - input:
          claim_type: "auto"
          claim_amount: 49999
          threshold: 50000
          prior_claims_same_policy: 0
          known_fraud_ring_member: false
          claim_filed_days_after_incident: 1
        expected:
          fraud_flagged: false
          note: "Just-below-threshold claim — may be evasion tactic but algorithm may miss"
        description: "Amount just below fraud threshold — evasion pattern test"
      - input:
          claim_type: "auto"
          claimant_id: "C123"
          claim_amount: 15000
          identical_claim_exists: true
          identical_claim_filed_days_ago: 45
        expected:
          fraud_flagged: true
          fraud_type: "duplicate_claim"
          confidence: ">= 0.90"
        description: "Duplicate claim filed 45 days apart — must be detected"
      - input:
          claim_type: "home"
          claimant_id: "C456"
          known_fraud_ring_member: true
          claim_amount: 5000
        expected:
          fraud_flagged: true
          fraud_type: "fraud_ring_association"
          escalation: "special_investigations_unit"
        description: "Low-amount claim from known fraud ring member — must still flag"
      - input:
          claim_type: "auto"
          repair_estimate: 12000
          market_value_vehicle: 8000
          claim_amount: 12000
        expected:
          fraud_flagged: true
          fraud_type: "inflated_amount"
          reason: "Repair estimate exceeds vehicle market value by 50%"
        description: "Inflated repair estimate exceeding vehicle value — amount inflation detection"
    decision_table:
      conditions:
        - "duplicate_claim_detected"
        - "known_fraud_ring_member"
        - "amount_exceeds_threshold"
        - "amount_exceeds_asset_value"
      actions:
        - "flag_as_fraud"
        - "escalate_to_SIU"
        - "auto_approve"
        - "manual_review"
      rules:
        - description: "Duplicate claim from fraud ring member"
          condition_values:
            duplicate_claim_detected: true
            known_fraud_ring_member: true
            amount_exceeds_threshold: true
            amount_exceeds_asset_value: false
          expected_actions:
            flag_as_fraud: true
            escalate_to_SIU: true
            auto_approve: false
            manual_review: false
        - description: "No fraud indicators"
          condition_values:
            duplicate_claim_detected: false
            known_fraud_ring_member: false
            amount_exceeds_threshold: false
            amount_exceeds_asset_value: false
          expected_actions:
            flag_as_fraud: false
            escalate_to_SIU: false
            auto_approve: true
            manual_review: false
        - description: "Only amount exceeds threshold"
          condition_values:
            duplicate_claim_detected: false
            known_fraud_ring_member: false
            amount_exceeds_threshold: true
            amount_exceeds_asset_value: false
          expected_actions:
            flag_as_fraud: false
            escalate_to_SIU: false
            auto_approve: false
            manual_review: true
        - description: "Amount exceeds asset value"
          condition_values:
            duplicate_claim_detected: false
            known_fraud_ring_member: false
            amount_exceeds_threshold: false
            amount_exceeds_asset_value: true
          expected_actions:
            flag_as_fraud: true
            escalate_to_SIU: false
            auto_approve: false
            manual_review: true
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
