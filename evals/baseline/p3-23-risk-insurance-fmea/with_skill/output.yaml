  # FM-5.5: Channel Failure — Email/SMS Provider Outage (Severity=5, Occurrence=4, Detection=2, RPN=40)
  - name: "FM-5.5 Channel failure — email or SMS provider outage causes notification loss"
    description: >
      The email or SMS provider experiences an outage, and the notification service
