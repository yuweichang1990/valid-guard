  # FM-5.1: Notification Not Sent on Status Change (Severity=6, Occurrence=4, Detection=4, RPN=96)
  - name: "FM-5.1 Notification not sent when claim status changes"
    description: >
      A claim status change occurs but the notification service fails to send the
      corresponding email or SMS update. The claimant is unaware of the status
      change. FMEA: Severity=6, Occurrence=4, Detection=4, RPN=96.
    type: state_transition
    risk: medium
    risk_rationale: >
      Impact: 2 (secondary feature — notification is informational, not transactional).
      Frequency: 3 (every status change should trigger a notification).
      Consequence: 2 (claimant misses update, calls support, but claim processing is unaffected).
      Detectability: 2 (claimant notices absence of notification eventually, but may not report it immediately).
      Average: 2.25 -> medium.
    techniques:
      - state_transition
      - equivalence_partitioning
      - error_guessing
    technique_rationale: >
      ST verifies that each claim state transition triggers the correct notification.
      EP partitions by notification channel (email, SMS) and status change type.
      EG anticipates message queue failures, dead letter queue scenarios, and
      notification service downtime during status changes.
    preconditions:
      - "Notification service is configured with email and SMS providers"
      - "Claimant has valid contact information on file"
      - "Claim exists and undergoes a status change"
    examples:
      - input:
          claim_id: "CLM-001"
          status_change: "submitted -> under_review"
          notification_channels: ["email", "sms"]
          claimant_email: "user@example.com"
          claimant_phone: "+1-555-0123"
        expected:
          email_sent: true
          sms_sent: true
          notification_content_includes: "Your claim CLM-001 is now under review"
        description: "Both email and SMS sent on status change — happy path"
      - input:
          claim_id: "CLM-002"
          status_change: "under_review -> approved"
          notification_channels: ["email"]
          email_provider_status: "down"
        expected:
          email_sent: false
          retry_scheduled: true
          retry_count_max: 3
          dead_letter_after_retries: true
        description: "Email provider down — notification must be retried, not silently dropped"
      - input:
          claim_id: "CLM-003"
          status_change: "approved -> paid"
          notification_channels: ["sms"]
          claimant_phone: null
        expected:
          sms_sent: false
          fallback_channel: "email"
          notification_sent_via_fallback: true
        description: "SMS channel unavailable (no phone) — should fall back to email"
    state_transition:
      states:
        - "notification_pending"
        - "notification_sending"
        - "notification_sent"
        - "notification_failed"
        - "notification_retrying"
        - "notification_dead_lettered"
      transitions:
        - from: "notification_pending"
          to: "notification_sending"
          trigger: "Notification service picks up message from queue"
          guard: "Provider is available"
        - from: "notification_sending"
          to: "notification_sent"
          trigger: "Provider confirms delivery"
          guard: "Delivery acknowledgment received"
        - from: "notification_sending"
          to: "notification_failed"
          trigger: "Provider returns error"
          guard: "Error response received"
        - from: "notification_failed"
          to: "notification_retrying"
          trigger: "Retry policy triggered"
          guard: "Retry count < max retries"
        - from: "notification_retrying"
          to: "notification_sending"
          trigger: "Retry timer expires"
          guard: "Backoff period elapsed"
        - from: "notification_failed"
          to: "notification_dead_lettered"
          trigger: "Max retries exceeded"
          guard: "Retry count >= max retries"
    test_ref: ""
    status: uncovered
    priority: 2
    tags:
      - "fmea"
      - "notification-service"
      - "delivery-failure"
