      - equivalence_partitioning
    technique_rationale: >
      Error guessing targets the use of null bytes to truncate log entries and
      inject fake log lines. Equivalence partitioning classifies input by null
      byte position (beginning, middle, end) and its effect on logging.
    preconditions:
      - "Application logs user input in server-side log files"
      - "Logs are used for security monitoring and audit trails"
