    risk: medium
    risk_rationale: "Impact: 2, Frequency: 2, Consequence: 2, Detectability: 3. Average: 2.25 -> medium. Log injection can hide attack evidence, forge audit trails, or inject false entries that mislead incident responders. While not directly exploitable for code execution, it undermines security monitoring."
    techniques:
