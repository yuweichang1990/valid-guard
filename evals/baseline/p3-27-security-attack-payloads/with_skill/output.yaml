  # ==========================================================================
  # CSRF — Token Validation
  # ==========================================================================
  - name: "CSRF-01: Request without CSRF token is rejected"
    description: >
      Tests that state-changing requests (POST, PUT, DELETE) submitted without
      a CSRF token are rejected by the server. This is the fundamental CSRF
      defense test.
    type: security
    risk: high
    risk_rationale: "Impact: 3, Frequency: 3, Consequence: 3, Detectability: 2. Average: 2.75 -> high. Missing CSRF protection allows attackers to perform any action on behalf of authenticated users by tricking them into visiting a malicious page. This affects all authenticated users."
    techniques:
      - equivalence_partitioning
      - error_guessing
      - decision_table
    technique_rationale: >
      Equivalence partitioning classifies requests by CSRF token presence (present/valid,
      present/invalid, absent). Decision table maps token presence x HTTP method x
      authentication state to access decisions.
    preconditions:
      - "User is authenticated with a valid session"
      - "Target endpoint performs a state-changing operation"
    examples:
      - input:
          field: "comment"
          payload: "Legitimate comment text"
          method: "POST"
          endpoint: "/api/comments"
          csrf_token: null
          session_cookie: "valid-session"
        expected:
          http_status: 403
          error: "CSRF_TOKEN_MISSING"
          message: "CSRF token is required for this request"
          comment_created: false
        description: "POST request without CSRF token must be rejected with 403. No state change must occur."
      - input:
          field: "comment"
          payload: "Legitimate comment text"
          method: "POST"
          endpoint: "/api/comments"
          csrf_token: "invalid-or-expired-token"
          session_cookie: "valid-session"
        expected:
          http_status: 403
          error: "CSRF_TOKEN_INVALID"
          message: "Invalid or expired CSRF token"
          comment_created: false
        description: "POST request with invalid CSRF token must also be rejected."
      - input:
          field: "comment"
          payload: "Legitimate comment text"
          method: "POST"
          endpoint: "/api/comments"
          csrf_token: "valid-csrf-token"
          session_cookie: "valid-session"
        expected:
          http_status: 201
          comment_created: true
        description: "POST request with valid CSRF token must succeed."
    decision_table:
      conditions:
        - "CSRF token present"
        - "CSRF token valid"
        - "Session authenticated"
        - "HTTP method is state-changing (POST/PUT/DELETE)"
      actions:
        - "Request accepted"
        - "Error response code"
      rules:
        - description: "No token, authenticated, state-changing -> reject"
          condition_values:
            CSRF token present: false
            CSRF token valid: "N/A"
            Session authenticated: true
            HTTP method is state-changing (POST/PUT/DELETE): true
          expected_actions:
            Request accepted: false
            Error response code: 403
        - description: "Invalid token, authenticated, state-changing -> reject"
          condition_values:
            CSRF token present: true
            CSRF token valid: false
            Session authenticated: true
            HTTP method is state-changing (POST/PUT/DELETE): true
          expected_actions:
            Request accepted: false
            Error response code: 403
        - description: "Valid token, authenticated, state-changing -> accept"
          condition_values:
            CSRF token present: true
            CSRF token valid: true
            Session authenticated: true
            HTTP method is state-changing (POST/PUT/DELETE): true
          expected_actions:
            Request accepted: true
            Error response code: "N/A"
        - description: "GET request (safe method) -> accept without token"
          condition_values:
            CSRF token present: false
            CSRF token valid: "N/A"
            Session authenticated: true
            HTTP method is state-changing (POST/PUT/DELETE): false
          expected_actions:
            Request accepted: true
            Error response code: "N/A"
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - csrf
      - token-validation
      - critical-path

  - name: "CSRF-02: CSRF token bound to user session"
    description: >
      Tests that CSRF tokens are bound to the specific user session and cannot
      be reused across different sessions. An attacker should not be able to
      use their own valid CSRF token to forge requests for another user.
    type: security
    risk: high
    risk_rationale: "Impact: 3, Frequency: 2, Consequence: 3, Detectability: 3. Average: 2.75 -> high. If CSRF tokens are not session-bound, an attacker can obtain a valid token from their own session and use it in a cross-site attack targeting another user's session."
    techniques:
      - error_guessing
      - equivalence_partitioning
    technique_rationale: >
      Error guessing targets the common implementation flaw of using global or
      non-session-bound CSRF tokens. Equivalence partitioning separates same-session
      tokens from cross-session tokens.
    preconditions:
      - "Two distinct user sessions exist (user A and user B)"
      - "Both sessions have valid CSRF tokens"
    examples:
      - input:
          field: "comment"
          payload: "Cross-session comment"
          method: "POST"
          endpoint: "/api/comments"
          csrf_token: "user-A-valid-csrf-token"
          session_cookie: "user-B-session"
        expected:
          http_status: 403
          error: "CSRF_TOKEN_INVALID"
          message: "CSRF token does not match current session"
          comment_created: false
        description: "User A's CSRF token must not work with User B's session. Token-session binding prevents cross-session token reuse."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - csrf
      - token-binding
      - session-security

  - name: "CSRF-03: CSRF token single-use or time-limited"
    description: >
      Tests that CSRF tokens expire after use or after a reasonable time window,
      preventing replay attacks with captured tokens.
    type: security
    risk: medium
    risk_rationale: "Impact: 2, Frequency: 2, Consequence: 2, Detectability: 2. Average: 2.0 -> medium. Token replay is a secondary attack that requires prior token capture. Time-limited tokens reduce but do not eliminate this risk window."
    techniques:
      - boundary_value
      - error_guessing
    technique_rationale: >
      Boundary value analysis tests the token expiry threshold. Error guessing
      targets the possibility of token replay within the validity window.
    preconditions:
      - "CSRF token has been issued to the user"
      - "Token has a defined expiry time or single-use policy"
    examples:
      - input:
          field: "comment"
          payload: "Replay comment"
          method: "POST"
          endpoint: "/api/comments"
          csrf_token: "previously-used-csrf-token"
          token_already_consumed: true
        expected:
          http_status: 403
          error: "CSRF_TOKEN_ALREADY_USED"
          comment_created: false
        description: "Already-consumed CSRF token must be rejected on second use (if single-use policy)."
      - input:
          field: "comment"
          payload: "Expired token comment"
          method: "POST"
          endpoint: "/api/comments"
          csrf_token: "expired-csrf-token"
          token_age_minutes: 61
          token_max_age_minutes: 60
        expected:
          http_status: 403
          error: "CSRF_TOKEN_EXPIRED"
          comment_created: false
        description: "CSRF token submitted after expiry window (e.g., 60 minutes) must be rejected."
    test_ref: ""
    status: uncovered
    priority: 2
    tags:
      - csrf
      - token-expiry
      - replay-prevention

  # ==========================================================================
  # CSRF — SameSite Cookie Enforcement
  # ==========================================================================
  - name: "CSRF-04: SameSite cookie attribute enforcement"
    description: >
      Tests that session cookies are set with the SameSite attribute (Strict or
      Lax) to prevent browsers from sending them in cross-origin requests,
      providing defense-in-depth against CSRF.
    type: security
    risk: high
    risk_rationale: "Impact: 3, Frequency: 3, Consequence: 3, Detectability: 2. Average: 2.75 -> high. SameSite cookies are a browser-enforced CSRF defense. Without this attribute, older browsers or misconfigured clients may send cookies with cross-origin requests."
    techniques:
      - equivalence_partitioning
      - decision_table
    technique_rationale: >
      Equivalence partitioning classifies cookie configurations (SameSite=Strict,
      Lax, None, absent). Decision table maps SameSite value x request origin x
      HTTP method to cookie-sending behavior.
    preconditions:
      - "Application sets session cookies on authentication"
      - "SameSite attribute is configured on cookies"
    examples:
      - input:
          action: "login"
          method: "POST"
          endpoint: "/api/auth/login"
          credentials: "valid"
        expected:
          set_cookie_header_contains: "SameSite=Lax"
          set_cookie_header_contains_secure: true
          set_cookie_header_contains_httponly: true
        description: "Session cookie must include SameSite=Lax (or Strict), Secure, and HttpOnly flags."
      - input:
          action: "cross-origin-post"
          origin: "https://evil.example.com"
          method: "POST"
          endpoint: "/api/comments"
          target_origin: "https://app.example.com"
          samesite_policy: "Lax"
        expected:
          session_cookie_sent: false
          http_status: 401
          authenticated: false
        description: "Cross-origin POST with SameSite=Lax must not include session cookie. Server sees unauthenticated request."
    decision_table:
      conditions:
        - "SameSite attribute value"
        - "Request type"
        - "Request origin"
      actions:
        - "Cookie sent by browser"
        - "CSRF protection level"
      rules:
        - description: "SameSite=Strict, any cross-site request"
          condition_values:
            SameSite attribute value: "Strict"
            Request type: "any"
            Request origin: "cross-site"
          expected_actions:
            Cookie sent by browser: false
            CSRF protection level: "full"
        - description: "SameSite=Lax, cross-site POST"
          condition_values:
            SameSite attribute value: "Lax"
            Request type: "POST"
            Request origin: "cross-site"
          expected_actions:
            Cookie sent by browser: false
            CSRF protection level: "state-changing protected"
        - description: "SameSite=Lax, cross-site GET (top-level navigation)"
          condition_values:
            SameSite attribute value: "Lax"
            Request type: "GET (top-level)"
            Request origin: "cross-site"
          expected_actions:
            Cookie sent by browser: true
            CSRF protection level: "GET only — safe if GET has no side effects"
        - description: "SameSite=None, any cross-site request"
          condition_values:
            SameSite attribute value: "None"
            Request type: "any"
            Request origin: "cross-site"
          expected_actions:
            Cookie sent by browser: true
            CSRF protection level: "none — requires CSRF token defense"
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - csrf
      - samesite
      - cookie-security

  # ==========================================================================
  # CSRF — Referrer / Origin Checking
  # ==========================================================================
  - name: "CSRF-05: Origin and Referer header validation"
    description: >
      Tests that the server validates the Origin and/or Referer headers on
      state-changing requests to reject cross-origin submissions as a
      secondary CSRF defense layer.
    type: security
    risk: medium
    risk_rationale: "Impact: 2, Frequency: 2, Consequence: 3, Detectability: 2. Average: 2.25 -> medium. Origin/Referer checking is defense-in-depth. These headers can be stripped by privacy proxies, so it is not the primary defense, but it catches attacks when tokens fail."
    techniques:
      - equivalence_partitioning
      - decision_table
      - error_guessing
    technique_rationale: >
      Equivalence partitioning classifies requests by origin header value (same-origin,
      cross-origin, missing, null). Decision table maps origin/referer combinations
      to acceptance decisions. Error guessing targets the "null" origin bypass.
    preconditions:
      - "Server is configured to check Origin/Referer headers"
      - "Application has a defined list of allowed origins"
    examples:
      - input:
          field: "comment"
          payload: "Cross-origin comment"
          method: "POST"
          endpoint: "/api/comments"
          origin_header: "https://evil.example.com"
          referer_header: "https://evil.example.com/attack-page"
          csrf_token: "valid-token"
        expected:
          http_status: 403
          error: "ORIGIN_NOT_ALLOWED"
          message: "Request origin is not in the allowed list"
          comment_created: false
        description: "Request from unauthorized origin must be rejected even if CSRF token is valid."
      - input:
          field: "comment"
          payload: "No origin comment"
          method: "POST"
          endpoint: "/api/comments"
          origin_header: null
          referer_header: null
          csrf_token: "valid-token"
        expected:
          http_status: 403
          error: "ORIGIN_HEADER_MISSING"
          comment_created: false
        description: "Request with missing Origin and Referer headers must be rejected for state-changing operations."
      - input:
          field: "comment"
          payload: "Null origin comment"
          method: "POST"
          endpoint: "/api/comments"
          origin_header: "null"
          referer_header: null
          csrf_token: "valid-token"
        expected:
          http_status: 403
          error: "ORIGIN_NOT_ALLOWED"
          comment_created: false
        description: "Origin: null (from sandboxed iframes, data: URIs) must not be treated as same-origin. Must be explicitly rejected."
    decision_table:
      conditions:
        - "Origin header value"
        - "Referer header value"
        - "CSRF token valid"
      actions:
        - "Request accepted"
        - "Error code"
      rules:
        - description: "Same origin + valid token -> accept"
          condition_values:
            Origin header value: "same-origin"
            Referer header value: "same-origin"
            CSRF token valid: true
          expected_actions:
            Request accepted: true
            Error code: "N/A"
        - description: "Cross origin + valid token -> reject"
          condition_values:
            Origin header value: "cross-origin"
            Referer header value: "cross-origin"
            CSRF token valid: true
          expected_actions:
            Request accepted: false
            Error code: 403
        - description: "Missing origin + valid token -> reject"
          condition_values:
            Origin header value: "missing"
            Referer header value: "missing"
            CSRF token valid: true
          expected_actions:
            Request accepted: false
            Error code: 403
        - description: "Null origin + valid token -> reject"
          condition_values:
            Origin header value: "null"
            Referer header value: "missing"
            CSRF token valid: true
          expected_actions:
            Request accepted: false
            Error code: 403
    test_ref: ""
    status: uncovered
    priority: 2
    tags:
      - csrf
      - origin-check
      - referer-check

  # ==========================================================================
  # Null Byte Injection — File Upload Path Traversal
  # ==========================================================================
  - name: "NullByte-01: Null byte in file upload name for extension bypass"
    description: >
      Tests whether a null byte (%00) in the uploaded filename can truncate
      the filename at the filesystem level, bypassing file extension validation.
      For example, uploading "malware.php%00.jpg" may pass a .jpg extension
      check but be saved as "malware.php" on the filesystem.
    type: security
    risk: high
    risk_rationale: "Impact: 3, Frequency: 1, Consequence: 3, Detectability: 3. Average: 2.5 -> high. Null byte extension bypass can lead to arbitrary code execution on the server if a web shell is uploaded. While the attack surface is limited to file upload, the consequence is complete server compromise."
    techniques:
      - error_guessing
      - equivalence_partitioning
    technique_rationale: >
      Error guessing targets the null byte truncation vulnerability in languages
      that use C-style strings. Equivalence partitioning classifies filenames by
      the presence and position of null bytes.
    preconditions:
      - "Application has a file upload endpoint"
      - "Server-side extension validation is in place"
      - "Uploaded files are stored on a filesystem"
    examples:
      - input:
          field: "file_upload"
          filename: "shell.php%00.jpg"
          content_type: "image/jpeg"
          method: "POST"
          endpoint: "/api/upload"
        expected:
          http_status: 400
          error: "INVALID_FILENAME"
          message: "Filename contains illegal characters"
          file_saved: false
          null_byte_stripped: true
        description: "Null byte in filename must be detected and rejected. File must not be saved with the truncated name."
      - input:
          field: "file_upload"
          filename: "../../etc/passwd%00.png"
          content_type: "image/png"
          method: "POST"
          endpoint: "/api/upload"
        expected:
          http_status: 400
          error: "INVALID_FILENAME"
          message: "Filename contains illegal path characters"
          file_saved: false
          path_traversal_blocked: true
        description: "Combined path traversal and null byte injection. Both the ../ traversal and null byte must be rejected."
      - input:
          field: "file_upload"
          filename: "report.pdf\x00.exe"
          content_type: "application/pdf"
          method: "POST"
          endpoint: "/api/upload"
        expected:
          http_status: 400
          error: "INVALID_FILENAME"
          file_saved: false
        description: "Raw null byte (not URL-encoded) in filename must also be caught."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - null-byte
      - file-upload
      - path-traversal
      - critical-path

  - name: "NullByte-02: Null byte in file upload path for directory traversal"
