feature: "Web Application Input Security"

feature_description: >
  Comprehensive security testing of web application user input fields (name,
  email, search, comment) against common attack vectors: Cross-Site Scripting
  (XSS) including reflected, stored, and DOM-based variants; SQL Injection
  targeting authentication bypass, data exfiltration, and blind injection;
  Cross-Site Request Forgery (CSRF) covering token validation, SameSite cookie
  enforcement, and referrer checking; and Null Byte Injection for file upload
  path traversal and log injection. Each scenario specifies exact payloads,
  target input fields, and expected defensive responses.

risk_level: high

entry_point: greenfield

source:
  type: natural_language
  path: ""

scenarios:
  # ==========================================================================
  # XSS — Reflected XSS Payloads
  # ==========================================================================
  - name: "XSS-01: Reflected XSS via basic script tag in search field"
    description: >
      Tests whether a basic <script>alert(1)</script> payload injected into
      the search query parameter is reflected back in the response without
      sanitization. This is the most fundamental reflected XSS test.
    type: security
    risk: high
    risk_rationale: "Impact: 3, Frequency: 3, Consequence: 3, Detectability: 3. Average: 3.0 -> high. Search fields are used by every user on every session. A reflected XSS can steal session cookies silently, leading to account takeover with no visible indicator to the user."
    techniques:
      - equivalence_partitioning
      - error_guessing
    technique_rationale: >
      Equivalence partitioning classifies input into safe text vs. HTML/script
      content. Error guessing anticipates the most common developer oversight
      — failing to escape angle brackets in reflected output.
    preconditions:
      - "Web application is accessible and the search endpoint is functional"
      - "No WAF is blocking requests (test against application-level defenses)"
    examples:
      - input:
          field: "search"
          payload: "<script>alert('XSS')</script>"
          method: "GET"
          parameter: "q"
        expected:
          http_status: 200
          response_body_contains: "&lt;script&gt;alert(&#x27;XSS&#x27;)&lt;/script&gt;"
          response_body_not_contains: "<script>alert('XSS')</script>"
          content_type_header: "text/html; charset=utf-8"
          x_xss_protection_header: "1; mode=block"
        description: "Basic script tag must be HTML-entity encoded in the reflected output. Raw script tags must never appear."
      - input:
          field: "search"
          payload: "<script>alert('XSS')</script>"
          method: "GET"
          parameter: "q"
        expected:
          http_status: 400
          error: "INVALID_INPUT"
          message: "Search query contains disallowed characters"
        description: "Alternative defensive response — reject the input entirely with 400 status."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - xss
      - reflected
      - search
      - critical-path

  - name: "XSS-02: Reflected XSS via event handler injection in name field"
    description: >
      Tests injection of an onerror event handler within an img tag into the
      name field. This bypasses simple script-tag-only filters while still
      executing JavaScript.
    type: security
    risk: high
    risk_rationale: "Impact: 3, Frequency: 2, Consequence: 3, Detectability: 3. Average: 2.75 -> high. Event handler XSS bypasses naive script tag filters. Name fields are displayed on profile pages and in admin panels, amplifying reach."
    techniques:
      - equivalence_partitioning
      - error_guessing
    technique_rationale: >
      Equivalence partitioning separates plain text names from names containing
      HTML attributes. Error guessing targets the common mistake of only filtering
      <script> tags while ignoring event handlers.
    preconditions:
      - "Name field accepts and displays user input on profile or listing pages"
    examples:
      - input:
          field: "name"
          payload: '<img src=x onerror=alert("XSS")>'
          method: "POST"
          parameter: "name"
        expected:
          http_status: 200
          sanitized_output: "&lt;img src=x onerror=alert(&quot;XSS&quot;)&gt;"
          script_executed: false
        description: "Img tag with onerror handler must be fully HTML-encoded. No JavaScript execution on page render."
      - input:
          field: "name"
          payload: '<img src=x onerror=alert("XSS")>'
          method: "POST"
          parameter: "name"
        expected:
          http_status: 422
          error: "VALIDATION_ERROR"
          message: "Name field contains invalid characters"
        description: "Alternative: reject input containing HTML tags in name field."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - xss
      - reflected
      - event-handler
      - name-field

  # ==========================================================================
  # XSS — Stored XSS Payloads
  # ==========================================================================
  - name: "XSS-03: Stored XSS via SVG onload in comment field"
    description: >
      Tests whether an SVG element with an onload event handler is stored in
      the comments database and rendered without sanitization to other users.
      Stored XSS is higher severity than reflected because it persists and
      affects all viewers.
    type: security
    risk: high
    risk_rationale: "Impact: 3, Frequency: 3, Consequence: 3, Detectability: 3. Average: 3.0 -> high. Stored XSS in comments affects every user who views the page. The payload persists in the database, enabling mass session hijacking silently."
    techniques:
      - equivalence_partitioning
      - error_guessing
      - cause_effect
    technique_rationale: >
      Equivalence partitioning classifies comment content (plain text vs. HTML/SVG).
      Error guessing targets SVG as a commonly overlooked vector. Cause-effect maps
      the relationship between stored payload and rendering behavior.
    preconditions:
      - "Comment submission endpoint is functional"
      - "Comments are displayed to other users on the page"
    examples:
      - input:
          field: "comment"
          payload: '<svg onload=alert("StoredXSS")>'
          method: "POST"
          parameter: "comment_body"
        expected:
          http_status: 201
          stored_value_sanitized: true
          rendered_output: "&lt;svg onload=alert(&quot;StoredXSS&quot;)&gt;"
          rendered_output_not_contains: '<svg onload=alert("StoredXSS")>'
          content_security_policy: "script-src 'self'"
        description: "SVG tag with onload must be sanitized before storage or at render time. CSP header must prevent inline script execution as defense-in-depth."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - xss
      - stored
      - svg
      - comment
      - critical-path

