          name_stored: true
          storage_is_safe: true
        description: "Stage 1: Payload is stored as a literal string value via parameterized query."
      - input:
          field: "name"
          trigger: "Admin searches for user by name"
          endpoint: "/api/admin/users?search=Robert"
          stage: "retrieval"
        expected:
          results_contain_only_user_data: true
          credit_card_data_leaked: false
          sql_error_exposed: false
          retrieval_query_parameterized: true
        description: "Stage 2: When stored name is used in admin search query, it must be treated as a literal value, not SQL code."
