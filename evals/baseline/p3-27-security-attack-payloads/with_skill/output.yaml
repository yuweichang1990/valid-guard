    risk: high
    risk_rationale: "Impact: 3, Frequency: 2, Consequence: 3, Detectability: 3. Average: 2.75 -> high. Polyglot payloads bypass context-specific filters. Successful injection in a stored context results in persistent compromise."
    techniques:
      - error_guessing
      - equivalence_partitioning
    technique_rationale: >
      Error guessing draws on known polyglot patterns that defeat incomplete
      sanitization. Equivalence partitioning tests whether multi-context payloads
      are handled differently from single-context ones.
    preconditions:
      - "Comment field accepts multi-line text input"
      - "Application uses context-dependent output encoding"
    examples:
      - input:
          field: "comment"
          payload: "jaVasCript:/*-/*`/*\\`/*'/*\"/**/(/* */oNcliCk=alert() )//%0telerik%0telerik/telerik/telerik/telerik/*</stYle/</telerik/</titLe/</telerik/</sVg/</sCripT/--!>\\x3csVg/<sVg/oNloAd=alert()//>\\x3e"
          method: "POST"
          parameter: "comment_body"
        expected:
          http_status: 400
          error: "MALICIOUS_INPUT_DETECTED"
          message: "Input contains potentially malicious content"
          payload_stored: false
        description: "Polyglot payload must be rejected outright. This complex payload should trigger input validation before reaching storage."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - xss
      - stored
      - polyglot
      - comment

  # ==========================================================================
  # XSS — DOM-based XSS Payloads
  # ==========================================================================
  - name: "XSS-05: DOM-based XSS via URL fragment in search field"
    description: >
      Tests whether the application's client-side JavaScript reads the URL
      hash/fragment and injects it into the DOM without sanitization. DOM-based
      XSS occurs entirely on the client side and may not be visible in
      server-side logs.
    type: security
    risk: high
    risk_rationale: "Impact: 3, Frequency: 2, Consequence: 3, Detectability: 3. Average: 2.75 -> high. DOM-based XSS is invisible to server-side defenses and WAFs. Exploitation is silent — no server log evidence — making detection extremely difficult."
    techniques:
      - error_guessing
      - cause_effect
    technique_rationale: >
      Error guessing targets the common pattern of using document.location.hash
      or innerHTML with unsanitized URL data. Cause-effect maps the relationship
      between URL fragment content and DOM manipulation behavior.
    preconditions:
      - "Application uses client-side JavaScript to read URL parameters or hash fragments"
      - "Client-side code uses innerHTML, document.write, or eval with URL-sourced data"
    examples:
      - input:
          field: "search"
          payload_url: "https://app.example.com/search#<img src=x onerror=alert('DOM-XSS')>"
          delivery: "URL fragment"
          parameter: "location.hash"
        expected:
          dom_injection: false
          sanitization_method: "DOMPurify or textContent assignment"
          csp_header: "script-src 'self'; object-src 'none'"
          script_executed: false
        description: "URL fragment content must be sanitized before DOM insertion. Application must use safe DOM APIs (textContent) instead of innerHTML."
      - input:
          field: "search"
          payload_url: "https://app.example.com/search?q=test#<script>document.cookie</script>"
          delivery: "URL fragment"
          parameter: "location.hash"
        expected:
          dom_injection: false
          cookie_exfiltrated: false
          httponly_cookie_flag: true
        description: "Even if DOM injection occurs, HttpOnly cookies must not be accessible to JavaScript."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - xss
      - dom-based
      - client-side
      - search

  - name: "XSS-06: DOM-based XSS via javascript: protocol in email field"
    description: >
      Tests whether a javascript: protocol URI injected into the email field
      is rendered as a clickable link or href attribute, enabling script
      execution on click.
    type: security
    risk: high
    risk_rationale: "Impact: 3, Frequency: 2, Consequence: 3, Detectability: 2. Average: 2.5 -> high. JavaScript protocol URIs in href attributes execute on user click. If the email field value is rendered in a mailto: link context, this is exploitable."
    techniques:
      - error_guessing
      - equivalence_partitioning
    technique_rationale: >
      Error guessing targets the oversight of allowing javascript: URIs where
      mailto: is expected. Equivalence partitioning separates valid email formats
      from URI-scheme injections.
    preconditions:
      - "Email field value is displayed elsewhere in the application (profile page, admin view)"
      - "Application renders user-supplied values in link contexts"
    examples:
      - input:
          field: "email"
          payload: "javascript:alert('XSS')//user@example.com"
          method: "POST"
          parameter: "email"
        expected:
          http_status: 422
          error: "INVALID_EMAIL_FORMAT"
          message: "Please provide a valid email address"
          value_stored: false
        description: "Email validation must reject javascript: protocol URIs. Input must match RFC 5322 email format."
      - input:
          field: "email"
          payload: "&#106;&#97;&#118;&#97;&#115;&#99;&#114;&#105;&#112;&#116;&#58;alert(1)"
          method: "POST"
          parameter: "email"
        expected:
          http_status: 422
          error: "INVALID_EMAIL_FORMAT"
          message: "Please provide a valid email address"
          html_entity_decoded_before_validation: true
        description: "HTML-entity-encoded javascript: URI must also be rejected. Validation must decode entities before checking."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - xss
      - dom-based
      - javascript-protocol
      - email

  - name: "XSS-07: XSS via encoded tag bypass in name field"
    description: >
      Tests whether URL-encoded and double-encoded XSS payloads bypass
      input validation in the name field. Many filters only check the raw
      input without decoding first.
    type: security
    risk: high
    risk_rationale: "Impact: 3, Frequency: 2, Consequence: 3, Detectability: 3. Average: 2.75 -> high. Encoding bypasses defeat blacklist-based filters. If the application decodes after validation, the payload executes in the rendered output."
    techniques:
      - error_guessing
      - equivalence_partitioning
    technique_rationale: >
      Error guessing targets the common mistake of validating before URL-decoding.
      Equivalence partitioning classifies payloads by encoding type (raw, single-encoded,
      double-encoded).
    preconditions:
      - "Application performs URL-decoding of input parameters"
      - "Name field output is rendered in HTML context"
    examples:
      - input:
          field: "name"
          payload: "%3Cscript%3Ealert('XSS')%3C%2Fscript%3E"
          encoding: "URL-encoded"
          method: "POST"
          parameter: "name"
        expected:
          http_status: 422
          error: "VALIDATION_ERROR"
          message: "Name field contains invalid characters"
          decoded_before_validation: true
        description: "URL-encoded script tag must be decoded and then rejected or sanitized. Validation must happen after all decoding steps."
      - input:
          field: "name"
          payload: "%253Cscript%253Ealert('XSS')%253C%252Fscript%253E"
          encoding: "double-URL-encoded"
          method: "POST"
          parameter: "name"
        expected:
          http_status: 422
          error: "VALIDATION_ERROR"
          message: "Name field contains invalid characters"
          multiple_decode_passes: true
        description: "Double-encoded payload must also be caught. Application must recursively decode or reject multiply-encoded input."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - xss
      - encoding-bypass
      - name-field

  # ==========================================================================
  # SQL Injection — Authentication Bypass
  # ==========================================================================
  - name: "SQLi-01: Authentication bypass via tautology in email field"
    description: >
      Tests whether a classic SQL tautology payload (OR '1'='1') in the email
      field can bypass authentication by making the WHERE clause always true.
      This is the most fundamental SQL injection test.
    type: security
    risk: high
    risk_rationale: "Impact: 3, Frequency: 3, Consequence: 3, Detectability: 3. Average: 3.0 -> high. Successful authentication bypass grants unauthorized access to any account. This affects the core security boundary and can lead to complete system compromise."
    techniques:
      - equivalence_partitioning
      - error_guessing
    technique_rationale: >
      Equivalence partitioning separates valid emails from SQL-metacharacter-containing
      strings. Error guessing anticipates the most common SQLi vulnerability — string
      concatenation in login queries.
    preconditions:
      - "Login endpoint accepts email and password parameters"
      - "Application uses a SQL database for authentication"
    examples:
      - input:
          field: "email"
          payload: "admin'--"
          password: "anything"
          method: "POST"
          endpoint: "/api/auth/login"
        expected:
          http_status: 401
          error: "INVALID_CREDENTIALS"
          message: "Email or password is incorrect"
          authenticated: false
          sql_error_exposed: false
        description: "Comment injection (--) must not bypass password check. No SQL error details in response."
      - input:
          field: "email"
          payload: "' OR '1'='1' --"
          password: "anything"
          method: "POST"
          endpoint: "/api/auth/login"
        expected:
          http_status: 401
          error: "INVALID_CREDENTIALS"
          authenticated: false
          sql_error_exposed: false
        description: "Classic tautology must not bypass authentication. Parameterized queries must prevent SQL interpretation."
      - input:
          field: "email"
          payload: "admin' OR 1=1#"
          password: "anything"
          method: "POST"
          endpoint: "/api/auth/login"
        expected:
          http_status: 401
          error: "INVALID_CREDENTIALS"
          authenticated: false
        description: "MySQL comment-style injection (#) must also be prevented."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - sqli
      - authentication-bypass
      - email
      - critical-path

  - name: "SQLi-02: Authentication bypass via UNION-based injection in email field"
    description: >
      Tests whether a UNION SELECT payload can inject a fabricated result row
      into the authentication query, returning a controlled password hash that
      matches the attacker-supplied password.
    type: security
    risk: high
    risk_rationale: "Impact: 3, Frequency: 2, Consequence: 3, Detectability: 3. Average: 2.75 -> high. UNION injection in auth queries can return attacker-controlled credentials, granting access to any account or fabricated admin accounts."
    techniques:
      - error_guessing
      - equivalence_partitioning
    technique_rationale: >
      Error guessing targets UNION injection which is a well-known attack pattern.
      Equivalence partitioning separates normal email strings from those containing
      SQL keywords.
    preconditions:
      - "Login endpoint queries a SQL database"
      - "Application does not use parameterized queries (vulnerability condition)"
    examples:
      - input:
          field: "email"
          payload: "' UNION SELECT 1,'admin','$2b$12$fakehashedpassword',1 --"
          password: "knownpassword"
          method: "POST"
          endpoint: "/api/auth/login"
        expected:
          http_status: 401
          error: "INVALID_CREDENTIALS"
          authenticated: false
          sql_error_exposed: false
          union_result_returned: false
        description: "UNION injection must not return fabricated credential rows. Parameterized queries prevent SQL keyword interpretation."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - sqli
      - union-injection
      - authentication-bypass
      - email

  # ==========================================================================
  # SQL Injection — Data Exfiltration
  # ==========================================================================
  - name: "SQLi-03: Data exfiltration via UNION SELECT in search field"
    description: >
      Tests whether a UNION SELECT payload in the search field can extract
      database metadata (table names, column names) or sensitive data from
      other tables (e.g., users, credentials).
    type: security
    risk: high
    risk_rationale: "Impact: 3, Frequency: 3, Consequence: 3, Detectability: 3. Average: 3.0 -> high. Data exfiltration via search exposes all database contents including user credentials, personal data, and business secrets. Search is used frequently, maximizing exposure window."
    techniques:
      - error_guessing
      - equivalence_partitioning
    technique_rationale: >
      Error guessing targets the common search-to-SQL-query pipeline where user input
      is interpolated into LIKE clauses. Equivalence partitioning classifies search
      input as safe text vs. SQL metacharacter content.
    preconditions:
      - "Search endpoint queries a SQL database"
      - "Search results are displayed in the response"
    examples:
      - input:
          field: "search"
          payload: "' UNION SELECT username, password FROM users --"
          method: "GET"
          parameter: "q"
          endpoint: "/api/search"
        expected:
          http_status: 200
          results_contain_user_data: false
          results_contain_only_search_entities: true
          sql_error_exposed: false
        description: "UNION SELECT must not extract data from other tables. Only legitimate search results should be returned."
      - input:
          field: "search"
          payload: "' UNION SELECT table_name, NULL FROM information_schema.tables --"
          method: "GET"
          parameter: "q"
          endpoint: "/api/search"
        expected:
          http_status: 200
          results_contain_schema_info: false
          sql_error_exposed: false
        description: "information_schema extraction attempt must be blocked. No database metadata in response."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - sqli
      - data-exfiltration
      - union-injection
      - search

  - name: "SQLi-04: Data exfiltration via error-based injection in name field"
    description: >
      Tests whether SQL error messages containing database structure information
      are leaked to the client when malformed SQL is injected into the name field
      during profile update or registration.
    type: security
    risk: high
    risk_rationale: "Impact: 3, Frequency: 2, Consequence: 3, Detectability: 2. Average: 2.5 -> high. Error-based SQLi reveals database engine, table structure, and column names. This information enables targeted follow-up attacks."
    techniques:
      - error_guessing
      - equivalence_partitioning
    technique_rationale: >
      Error guessing targets verbose error handling that leaks SQL details.
      Equivalence partitioning separates inputs that cause SQL syntax errors
      from valid inputs.
    preconditions:
      - "Name field value is stored in a SQL database"
      - "Application has error handling for database operations"
    examples:
      - input:
          field: "name"
          payload: "Robert'); DROP TABLE users; --"
          method: "POST"
          parameter: "name"
          endpoint: "/api/users/profile"
        expected:
          http_status: 422
          error: "VALIDATION_ERROR"
          message: "Name contains invalid characters"
          sql_error_exposed: false
          error_contains_table_name: false
          error_contains_sql_syntax: false
        description: "Bobby Tables attack must not execute DROP TABLE. Error response must not contain SQL syntax or database object names."
      - input:
          field: "name"
          payload: "' AND 1=CONVERT(int, (SELECT TOP 1 table_name FROM information_schema.tables)) --"
          method: "POST"
          parameter: "name"
          endpoint: "/api/users/profile"
        expected:
          http_status: 422
          error: "VALIDATION_ERROR"
          sql_error_exposed: false
          database_engine_revealed: false
        description: "CONVERT-based error injection must not leak table names via error messages. Generic error message only."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - sqli
      - error-based
      - data-exfiltration
      - name-field

  # ==========================================================================
  # SQL Injection — Blind Injection
  # ==========================================================================
  - name: "SQLi-05: Boolean-based blind SQL injection in search field"
    description: >
      Tests whether different boolean conditions injected into the search field
      produce observably different responses (different result counts or page
      content), enabling data extraction one bit at a time.
    type: security
    risk: high
    risk_rationale: "Impact: 3, Frequency: 3, Consequence: 3, Detectability: 3. Average: 3.0 -> high. Blind SQLi is harder to detect than error-based but equally dangerous. Attackers can extract entire databases given enough requests, and the attack leaves minimal evidence."
    techniques:
      - error_guessing
      - cause_effect
    technique_rationale: >
      Error guessing targets the subtle behavioral differences that enable blind
      injection. Cause-effect maps the relationship between injected boolean
      conditions and observable response differences.
    preconditions:
      - "Search endpoint returns different result sets based on query"
      - "Application uses SQL backend for search"
    examples:
      - input:
          field: "search"
          payload_true: "test' AND 1=1 --"
          payload_false: "test' AND 1=2 --"
          method: "GET"
          parameter: "q"
        expected:
          response_identical: true
          result_count_true: "same as uninjected 'test' query"
          result_count_false: "same as uninjected 'test' query"
          no_behavioral_difference: true
        description: "True and false conditions must produce identical responses. No observable difference means parameterized queries are in use."
      - input:
          field: "search"
          payload: "test' AND SUBSTRING((SELECT password FROM users LIMIT 1),1,1)='a' --"
          method: "GET"
          parameter: "q"
        expected:
          response_identical_to_normal_search: true
          data_leaked: false
          sql_error_exposed: false
        description: "Character-by-character extraction attempt must not produce distinguishable responses."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - sqli
      - blind-injection
      - boolean-based
      - search

  - name: "SQLi-06: Time-based blind SQL injection in comment field"
    description: >
      Tests whether a SLEEP/WAITFOR DELAY payload injected into the comment
      field causes measurably delayed responses, confirming SQL injection
      even when no data is returned directly.
    type: security
    risk: high
    risk_rationale: "Impact: 3, Frequency: 2, Consequence: 3, Detectability: 3. Average: 2.75 -> high. Time-based blind injection is the last-resort SQLi technique and works even when error messages and boolean differences are suppressed. If this succeeds, the entire database is extractable."
    techniques:
      - error_guessing
      - cause_effect
    technique_rationale: >
      Error guessing anticipates time-based injection as a stealth technique.
      Cause-effect maps the relationship between injected delay functions
      and response timing.
    preconditions:
      - "Comment submission processes the input through SQL operations"
      - "Response time can be measured accurately"
    examples:
      - input:
          field: "comment"
          payload: "test'; WAITFOR DELAY '0:0:5' --"
          method: "POST"
          parameter: "comment_body"
          database_engine: "MSSQL"
        expected:
          response_time_ms: "<1000"
          no_artificial_delay: true
          http_status: 201
          sql_error_exposed: false
        description: "MSSQL WAITFOR DELAY must not cause response delay. Response within normal latency range confirms parameterized queries."
      - input:
          field: "comment"
          payload: "test' AND SLEEP(5) --"
          method: "POST"
          parameter: "comment_body"
          database_engine: "MySQL"
        expected:
          response_time_ms: "<1000"
          no_artificial_delay: true
          http_status: 201
        description: "MySQL SLEEP function must not cause delay. Normal response time confirms injection is not interpreted."
      - input:
          field: "comment"
          payload: "test'; SELECT pg_sleep(5); --"
          method: "POST"
          parameter: "comment_body"
          database_engine: "PostgreSQL"
        expected:
          response_time_ms: "<1000"
          no_artificial_delay: true
          http_status: 201
        description: "PostgreSQL pg_sleep must not execute. Response time must remain within normal bounds."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - sqli
      - blind-injection
      - time-based
      - comment

  - name: "SQLi-07: Second-order SQL injection via name field"
    description: >
      Tests whether a SQL payload stored in the name field during registration
      is later executed when the name is retrieved and used in a different SQL
      query (e.g., admin search, reporting, or export).
    type: security
    risk: high
    risk_rationale: "Impact: 3, Frequency: 1, Consequence: 3, Detectability: 3. Average: 2.5 -> high. Second-order injection is extremely difficult to detect because the payload is harmless at insertion time and only triggers during a later operation, often in a privileged context like admin panels."
    techniques:
      - error_guessing
      - cause_effect
    technique_rationale: >
      Error guessing targets the assumption that stored data is safe for use
      in subsequent queries. Cause-effect maps the two-stage relationship between
      initial storage and later execution contexts.
    preconditions:
      - "Name field value is stored in database during registration"
      - "Stored name is later used in another SQL query (admin panel, search, export)"
    examples:
