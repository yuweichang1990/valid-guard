    risk: high
    risk_rationale: "Impact: 3, Frequency: 1, Consequence: 3, Detectability: 3. Average: 2.5 -> high. Directory traversal via null byte can overwrite critical system files or place web shells in executable directories. The server could be fully compromised."
    techniques:
