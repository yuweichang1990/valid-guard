  # ==========================================================================
  # Cross-cutting: Input validation state machine
  # ==========================================================================
  - name: "INPUT-01: Input validation pipeline state transitions"
    description: >
      Tests the complete input validation pipeline as a state machine: raw input
      arrives, passes through decoding, normalization, validation, sanitization,
      and finally storage or rendering. Verifies that attack payloads are caught
      at the appropriate stage.
    type: state_transition
    risk: high
    risk_rationale: "Impact: 3, Frequency: 3, Consequence: 3, Detectability: 2. Average: 2.75 -> high. The validation pipeline is the primary defense boundary. If any stage is skipped, misordered, or implemented incorrectly, all attack vectors become exploitable."
    techniques:
      - state_transition
      - cause_effect
    technique_rationale: >
      State transition models the validation pipeline stages. Cause-effect maps
      how different payload types interact with each pipeline stage.
    preconditions:
      - "Application has a multi-stage input processing pipeline"
    state_transition:
      states:
        - "raw_input"
        - "decoded"
        - "normalized"
        - "validated"
        - "sanitized"
        - "rejected"
        - "stored"
        - "rendered"
      transitions:
        - from: "raw_input"
          to: "decoded"
          trigger: "URL decode, HTML entity decode, Unicode normalization"
          guard: "Input received by the server"
        - from: "decoded"
          to: "normalized"
          trigger: "Whitespace trimming, case normalization, Unicode NFKC"
          guard: "Decoding completed without error"
        - from: "normalized"
          to: "validated"
          trigger: "Schema validation, type checking, length limits, format checks"
          guard: "Input passes all validation rules"
        - from: "normalized"
          to: "rejected"
          trigger: "Validation failure"
          guard: "Input violates any validation rule"
        - from: "validated"
          to: "sanitized"
          trigger: "HTML encoding, SQL parameterization, null byte stripping"
          guard: "Input passed validation but may contain special characters"
        - from: "sanitized"
          to: "stored"
          trigger: "Parameterized query execution"
          guard: "Database write succeeds"
        - from: "sanitized"
          to: "rendered"
          trigger: "Output encoding applied, CSP headers set"
          guard: "Response is being generated"
    examples:
      - input:
          field: "comment"
          payload: "<script>alert('xss')</script>"
          pipeline_stages_traversed:
            - "raw_input -> decoded (HTML entities resolved)"
            - "decoded -> normalized (whitespace trimmed)"
            - "normalized -> rejected (HTML tags in comment not allowed)"
        expected:
          final_state: "rejected"
          http_status: 422
          pipeline_completed: false
          rejected_at_stage: "validation"
        description: "XSS payload caught at validation stage. Pipeline correctly rejects before sanitization or storage."
      - input:
          field: "name"
          payload: "John O'Brien"
          pipeline_stages_traversed:
            - "raw_input -> decoded"
            - "decoded -> normalized"
            - "normalized -> validated (apostrophe allowed in names)"
            - "validated -> sanitized (SQL parameterization)"
            - "sanitized -> stored"
        expected:
          final_state: "stored"
          stored_value: "John O'Brien"
          sql_injection_prevented: true
          apostrophe_preserved: true
        description: "Legitimate input with special characters (apostrophe in name) passes through the full pipeline. Parameterization prevents SQL injection while preserving the value."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - input-validation
      - pipeline
      - state-machine
      - defense-in-depth

  # ==========================================================================
  # Cross-cutting: Security header validation
  # ==========================================================================
  - name: "HEADERS-01: Security response headers present on all responses"
    description: >
      Tests that all HTTP responses include the required security headers that
      provide defense-in-depth against XSS, CSRF, clickjacking, and content
      type sniffing attacks.
    type: security
    risk: high
    risk_rationale: "Impact: 3, Frequency: 3, Consequence: 2, Detectability: 1. Average: 2.25 -> medium. Security headers are passive defenses that reduce attack surface. Missing headers do not directly cause vulnerabilities but remove important defense layers. However, upgrading to high because they affect every response."
    techniques:
      - equivalence_partitioning
      - error_guessing
    technique_rationale: >
      Equivalence partitioning classifies responses by endpoint type (HTML page,
      API JSON, file download) to verify headers are set appropriately. Error
      guessing targets commonly missing headers.
    preconditions:
      - "Application is deployed and serving HTTP responses"
    examples:
      - input:
          request: "GET /api/search?q=test"
          method: "GET"
        expected:
          headers_present:
            Content-Security-Policy: "script-src 'self'; object-src 'none'; base-uri 'self'"
            X-Content-Type-Options: "nosniff"
            X-Frame-Options: "DENY"
            Strict-Transport-Security: "max-age=31536000; includeSubDomains"
            Referrer-Policy: "strict-origin-when-cross-origin"
            Permissions-Policy: "camera=(), microphone=(), geolocation=()"
          headers_absent:
            - "X-Powered-By"
            - "Server (or generic value)"
        description: "All security headers must be present. Server identification headers must be removed or genericized."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - security-headers
      - csp
      - defense-in-depth

  # ==========================================================================
  # Combinatorial: Multi-vector combined attacks
  # ==========================================================================
  - name: "COMBO-01: Combined XSS and SQL injection in same request"
    description: >
      Tests defense against a request that combines multiple attack vectors
      simultaneously — XSS in one field and SQL injection in another — to
      test whether validation is applied independently per field.
    type: combinatorial
    risk: high
    risk_rationale: "Impact: 3, Frequency: 1, Consequence: 3, Detectability: 3. Average: 2.5 -> high. Combined attacks test whether per-field validation is truly independent. If one field's processing affects another's, a combined attack could bypass defenses."
    techniques:
      - pairwise
      - error_guessing
    technique_rationale: >
      Pairwise testing covers combinations of attack vectors across multiple input
      fields. Error guessing targets the possibility that processing one malicious
      field may affect validation of another.
    preconditions:
      - "Endpoint accepts multiple input fields simultaneously"
    examples:
      - input:
          name: "<script>alert('XSS')</script>"
          email: "' OR 1=1 --"
          comment: "Normal comment text"
          method: "POST"
          endpoint: "/api/comments"
        expected:
          http_status: 422
          errors:
            - field: "name"
              error: "VALIDATION_ERROR"
              message: "Name contains invalid characters"
            - field: "email"
              error: "INVALID_EMAIL_FORMAT"
              message: "Please provide a valid email address"
          comment_created: false
          all_fields_validated: true
          validation_short_circuit: false
        description: "Both XSS in name and SQLi in email must be caught. Validation must not short-circuit after the first invalid field — all fields must be validated and all errors reported."
      - input:
          name: "Test User"
          email: "test@example.com"
          search: "' UNION SELECT * FROM users --"
          comment: "<svg onload=alert(document.cookie)>"
          method: "POST"
          endpoint: "/api/comments"
        expected:
          http_status: 422
          errors_count: 2
          all_malicious_fields_rejected: true
          legitimate_fields_preserved: true
        description: "In a request with mixed legitimate and malicious fields, all malicious fields must be identified. Legitimate fields must not be falsely rejected."
    test_ref: ""
    status: uncovered
    priority: 2
    tags:
      - combined-attack
      - multi-vector
      - pairwise

# ===========================================================================
# Example Mapping
# ===========================================================================
example_mapping:
  story: >
    As a security engineer, I want all user input fields (name, email, search,
    comment) to be protected against XSS, SQL injection, CSRF, and null byte
    injection attacks so that the web application maintains confidentiality,
    integrity, and availability for all users.
  rules:
    - rule_name: "All user input must be sanitized or rejected before processing"
      examples:
        - "XSS script tag in search field -> HTML-entity encoded output or 400 rejection"
        - "XSS event handler in name field -> sanitized output or 422 rejection"
        - "XSS SVG onload in comment -> sanitized before storage and rendering"
        - "XSS polyglot payload in comment -> rejected with 400 as malicious input"
        - "XSS DOM-based via URL fragment -> client-side sanitization via DOMPurify/textContent"
        - "XSS javascript: protocol in email -> rejected as invalid email format"
        - "XSS encoded tag bypass in name -> decoded then rejected/sanitized"
    - rule_name: "SQL queries must use parameterized statements for all user input"
      examples:
        - "SQLi tautology in email -> 401 generic credential error, no auth bypass"
        - "SQLi UNION SELECT in email -> no fabricated credential rows returned"
        - "SQLi UNION SELECT in search -> only legitimate search results returned"
        - "SQLi error-based in name -> generic error, no SQL details leaked"
        - "SQLi boolean-blind in search -> true/false conditions produce identical responses"
        - "SQLi time-based blind in comment -> no measurable response delay"
        - "SQLi second-order via stored name -> parameterized on retrieval too"
    - rule_name: "CSRF defenses must prevent cross-origin state changes"
      examples:
        - "POST without CSRF token -> 403 rejection"
        - "POST with invalid CSRF token -> 403 rejection"
        - "CSRF token from different user session -> 403 rejection"
        - "Expired or already-used CSRF token -> 403 rejection"
        - "Session cookie without SameSite attribute -> must have SameSite=Lax or Strict"
        - "Cross-origin request with wrong Origin header -> 403 rejection"
        - "Request with null or missing Origin header -> 403 rejection"
    - rule_name: "Null bytes must be stripped or rejected in all input contexts"
      examples:
        - "Null byte in filename (extension bypass) -> 400 rejection, file not saved"
        - "Null byte in upload path (directory traversal) -> 400 rejection"
        - "Null byte in user input (log injection) -> sanitized, no fake log entries"
        - "Null byte between SQL keywords (filter bypass) -> detected and blocked"
        - "Null byte before XSS payload (filter bypass) -> both null byte and XSS caught"
    - rule_name: "Error responses must not leak implementation details"
      examples:
        - "SQL error -> generic 'validation error' message, no SQL syntax exposed"
        - "Database table names -> never present in any error response"
        - "Server technology stack -> X-Powered-By and Server headers removed"
        - "File system paths -> never exposed in error messages"

