  # ==========================================================================
  # COMPARISON SCENARIOS — Decision table for c7, c8, c9 (all inputs valid)
  # ==========================================================================

  - name: "x is the unique largest (x>y and x>z)"
    description: >
      When all inputs are valid and x is strictly greater than both y and z,
      x is returned as the largest. Decision table rule: c7=true, c8=true,
      c9=don't-care.
    type: combinatorial
    risk: high
    risk_rationale: >
      Impact: 3, Frequency: 3, Consequence: 3, Detectability: 2. Average: 2.75 -> high.
      Core comparison logic — returning the wrong maximum is the primary defect.
    techniques:
      - decision_table
      - equivalence_partitioning
    technique_rationale: >
      Decision table captures the comparison rule combination; equivalence
      partitioning selects a representative from the x-is-largest class.
    preconditions:
      - "All inputs are in range [1, 300]"
      - "x > y and x > z"
    examples:
      - input:
          x: 250
          y: 100
          z: 200
        expected:
          result: 250
          largest: "x"
        description: "x=250 > y=100 and x=250 > z=200, so x is largest."
      - input:
          x: 300
          y: 1
          z: 299
        expected:
          result: 300
          largest: "x"
        description: "x at upper bound, y at lower bound — x is clearly largest."
    decision_table:
      conditions:
        - "c7: x>y"
        - "c8: x>z"
        - "c9: y>z"
      actions:
        - "return_largest"
      rules:
        - description: "x>y, x>z, y>z => x is largest (permutation x>y>z)"
          condition_values:
            "c7: x>y": true
            "c8: x>z": true
            "c9: y>z": true
          expected_actions:
            return_largest: "x"
        - description: "x>y, x>z, y<=z => x is largest (permutation x>z>=y)"
          condition_values:
            "c7: x>y": true
            "c8: x>z": true
            "c9: y>z": false
          expected_actions:
            return_largest: "x"
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - comparison
      - decision-table
      - core-logic

