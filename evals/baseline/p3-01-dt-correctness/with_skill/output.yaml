feature_description: >
  Determine the largest value among three positive integers (x, y, z) where
  each must be in the range [1, 300]. Inputs are validated for range compliance
  before comparison. If any input falls outside the valid range, the operation
  is rejected. When all inputs are valid, the function returns the largest
  value, handling ties by returning the tied value.

risk_level: medium

