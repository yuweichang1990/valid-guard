    preconditions:
      - "All inputs are in range [1, 300]"
      - "z >= x and z >= y"
    examples:
      - input:
          x: 100
          y: 200
          z: 250
        expected:
          result: 250
          largest: "z"
        description: "z=250 > x=100 and z=250 > y=200, so z is largest."
      - input:
          x: 1
          y: 299
          z: 300
        expected:
          result: 300
          largest: "z"
        description: "z at upper bound — z is clearly largest."
    decision_table:
      conditions:
        - "c7: x>y"
        - "c8: x>z"
        - "c9: y>z"
      actions:
        - "return_largest"
      rules:
        - description: "x>y, x<=z, y<=z => z is largest (permutation z>=x>y)"
          condition_values:
            "c7: x>y": true
            "c8: x>z": false
            "c9: y>z": false
          expected_actions:
            return_largest: "z"
        - description: "x<=y, x<=z, y<=z => z is largest (permutation z>=y>=x)"
          condition_values:
            "c7: x>y": false
            "c8: x>z": false
            "c9: y>z": false
          expected_actions:
            return_largest: "z"
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - comparison
      - decision-table
      - core-logic

  # ==========================================================================
  # COMPLETE DECISION TABLE — All 8 combinations of c7, c8, c9
  # ==========================================================================

  - name: "Full comparison decision table — all 8 rule combinations"
    description: >
      Exhaustive decision table for the three comparison conditions c7 (x>y),
      c8 (x>z), c9 (y>z). With 3 boolean conditions there are 2^3 = 8
      combinations. Two combinations are infeasible due to transitivity
      constraints. The remaining 6 feasible rules are enumerated with their
      expected outcomes.
      Infeasible: c7=true (x>y), c8=false (x<=z), c9=true (y>z) implies
      x>y>z>=x which is a contradiction. Similarly c7=false (x<=y),
      c8=true (x>z), c9=false (y<=z) implies x<=y<=z<x, also a contradiction.
    type: combinatorial
    risk: high
    risk_rationale: >
      Impact: 3, Frequency: 3, Consequence: 3, Detectability: 3. Average: 3.00 -> high.
      This is the complete truth table for the core algorithm. Missing any rule
      means a silent wrong answer for certain inputs.
    techniques:
      - decision_table
      - cause_effect
    technique_rationale: >
      Decision table enumerates all condition combinations. Cause-effect graphing
      identifies the two infeasible combinations due to transitivity constraints
      (x>y AND y>z implies x>z; x<=y AND y<=z implies x<=z).
    preconditions:
      - "All inputs are in range [1, 300]"
    examples:
      - input:
          x: 200
          y: 150
          z: 100
        expected:
          result: 200
          largest: "x"
        description: "Rule R1: x>y>z => x is largest."
      - input:
          x: 200
          y: 100
          z: 150
        expected:
          result: 200
          largest: "x"
        description: "Rule R2: x>z>y => x is largest."
      - input:
          x: 150
          y: 200
          z: 100
        expected:
          result: 200
          largest: "y"
        description: "Rule R3: y>x>z => y is largest."
      - input:
          x: 100
          y: 200
          z: 150
        expected:
          result: 200
          largest: "y"
        description: "Rule R5: y>z>x => y is largest."
      - input:
          x: 150
          y: 100
          z: 200
        expected:
          result: 200
          largest: "z"
        description: "Rule R6: z>x>y => z is largest."
      - input:
          x: 100
          y: 150
          z: 200
        expected:
          result: 200
          largest: "z"
        description: "Rule R7: z>y>x => z is largest."
    decision_table:
      conditions:
        - "c7: x>y"
        - "c8: x>z"
        - "c9: y>z"
      actions:
        - "return_largest"
        - "feasible"
      rules:
        - description: "R1: x>y, x>z, y>z (x>y>z) => largest is x"
          condition_values:
            "c7: x>y": true
            "c8: x>z": true
            "c9: y>z": true
          expected_actions:
            return_largest: "x"
            feasible: true
        - description: "R2: x>y, x>z, y<=z (x>z>=y) => largest is x"
          condition_values:
            "c7: x>y": true
            "c8: x>z": true
            "c9: y>z": false
          expected_actions:
            return_largest: "x"
            feasible: true
        - description: "R3: x>y, x<=z, y<=z (z>=x>y) => largest is z"
          condition_values:
            "c7: x>y": true
            "c8: x>z": false
            "c9: y>z": false
          expected_actions:
            return_largest: "z"
            feasible: true
        - description: "R4: x>y, x<=z, y>z — INFEASIBLE (x>y>z>=x is a contradiction)"
          condition_values:
            "c7: x>y": true
            "c8: x>z": false
            "c9: y>z": true
          expected_actions:
            return_largest: "N/A"
            feasible: false
        - description: "R5: x<=y, x>z, y>z (y>=x>z) => largest is y"
          condition_values:
            "c7: x>y": false
            "c8: x>z": true
            "c9: y>z": true
          expected_actions:
            return_largest: "y"
            feasible: true
        - description: "R6: x<=y, x>z, y<=z — INFEASIBLE (y<=z<x<=y is a contradiction)"
          condition_values:
            "c7: x>y": false
            "c8: x>z": true
            "c9: y>z": false
          expected_actions:
            return_largest: "N/A"
            feasible: false
        - description: "R7: x<=y, x<=z, y>z (y>=x, y>z) => largest is y"
          condition_values:
            "c7: x>y": false
            "c8: x>z": false
            "c9: y>z": true
          expected_actions:
            return_largest: "y"
            feasible: true
        - description: "R8: x<=y, x<=z, y<=z (z>=y>=x) => largest is z"
          condition_values:
            "c7: x>y": false
            "c8: x>z": false
            "c9: y>z": false
          expected_actions:
            return_largest: "z"
            feasible: true
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - comparison
      - decision-table
      - exhaustive
      - core-logic

  # ==========================================================================
  # TIE HANDLING SCENARIOS
  # ==========================================================================

  - name: "Two-way tie: x equals y, both greater than z"
    description: >
      When x = y and both are greater than z, the function should return the
      tied value. This exercises the boundary between c7=true and c7=false
      (x>y vs x=y). Falls under rule R8/R3 boundary where c7 flips.
    type: edge_case
    risk: medium
    risk_rationale: >
      Impact: 2, Frequency: 2, Consequence: 2, Detectability: 2. Average: 2.00 -> medium.
      Ties are less common but a classic source of off-by-one errors in comparison logic.
    techniques:
      - boundary_value
      - decision_table
      - error_guessing
    technique_rationale: >
      Boundary value tests the transition point where x>y becomes x=y;
      decision table verifies the rule; error guessing targets classic tie-handling bugs.
    preconditions:
      - "All inputs are in range [1, 300]"
      - "x == y and x > z"
    examples:
      - input:
          x: 200
          y: 200
          z: 100
        expected:
          result: 200
        description: "x=y=200 > z=100. Tied value 200 returned."
      - input:
          x: 300
          y: 300
          z: 1
        expected:
          result: 300
        description: "x=y at upper bound, z at lower bound. Tied value 300 returned."
    test_ref: ""
    status: uncovered
    priority: 2
    tags:
      - comparison
      - tie-handling
      - edge-case

  - name: "Two-way tie: x equals z, both greater than y"
    description: >
      When x = z and both are greater than y, the function should return the
      tied value. This exercises the boundary where c8 (x>z) flips.
    type: edge_case
    risk: medium
    risk_rationale: >
      Impact: 2, Frequency: 2, Consequence: 2, Detectability: 2. Average: 2.00 -> medium.
      Symmetric tie case — exercises x-z equality boundary.
    techniques:
      - boundary_value
      - decision_table
      - error_guessing
    technique_rationale: >
      Boundary value tests the x=z transition; error guessing targets
      comparison operator mistakes (> vs >=).
    preconditions:
      - "All inputs are in range [1, 300]"
      - "x == z and x > y"
    examples:
      - input:
          x: 200
          y: 100
          z: 200
        expected:
          result: 200
        description: "x=z=200 > y=100. Tied value 200 returned."
    test_ref: ""
    status: uncovered
    priority: 2
    tags:
      - comparison
      - tie-handling
      - edge-case

  - name: "Two-way tie: y equals z, both greater than x"
    description: >
      When y = z and both are greater than x, the function should return the
      tied value. This exercises the boundary where c9 (y>z) flips.
    type: edge_case
    risk: medium
    risk_rationale: >
      Impact: 2, Frequency: 2, Consequence: 2, Detectability: 2. Average: 2.00 -> medium.
      Symmetric tie case — exercises y-z equality boundary.
    techniques:
      - boundary_value
      - decision_table
      - error_guessing
    technique_rationale: >
      Boundary value tests the y=z transition; error guessing targets
      comparison operator mistakes.
    preconditions:
      - "All inputs are in range [1, 300]"
      - "y == z and y > x"
    examples:
      - input:
          x: 100
          y: 200
          z: 200
        expected:
          result: 200
        description: "y=z=200 > x=100. Tied value 200 returned."
    test_ref: ""
    status: uncovered
    priority: 2
    tags:
      - comparison
      - tie-handling
      - edge-case

  - name: "Three-way tie: x equals y equals z"
    description: >
      When all three inputs are equal, the function should return that value.
      This is the corner case where c7=false, c8=false, c9=false and all
      equalities hold simultaneously.
    type: edge_case
    risk: medium
    risk_rationale: >
      Impact: 2, Frequency: 1, Consequence: 2, Detectability: 1. Average: 1.50 -> medium.
      Three-way ties are rare but represent the ultimate boundary of all comparison conditions.
    techniques:
      - boundary_value
      - error_guessing
    technique_rationale: >
      Boundary value tests the triple-equality corner; error guessing
      anticipates issues where comparison logic fails when no value is strictly greater.
    preconditions:
      - "All inputs are in range [1, 300]"
      - "x == y == z"
    examples:
      - input:
          x: 150
          y: 150
          z: 150
        expected:
          result: 150
        description: "x=y=z=150. Triple tie returns the common value."
      - input:
          x: 1
          y: 1
          z: 1
        expected:
          result: 1
        description: "x=y=z=1. Triple tie at lower bound."
      - input:
          x: 300
          y: 300
          z: 300
        expected:
          result: 300
        description: "x=y=z=300. Triple tie at upper bound."
    test_ref: ""
    status: uncovered
    priority: 2
    tags:
      - comparison
      - tie-handling
      - edge-case
      - corner-case

  # ==========================================================================
  # ALL SIX STRICT ORDERINGS — Permutation coverage
  # ==========================================================================

  - name: "Permutation coverage — all 6 strict orderings of x, y, z"
    description: >
      Exhaustively tests all 6 permutations where x, y, z are strictly distinct
      to confirm the correct largest is returned in each ordering. This ensures
      the comparison logic works regardless of which position holds the largest
      value. Permutations: x>y>z, x>z>y, y>x>z, y>z>x, z>x>y, z>y>x.
    type: combinatorial
    risk: high
    risk_rationale: >
      Impact: 3, Frequency: 3, Consequence: 3, Detectability: 2. Average: 2.75 -> high.
      Covering all orderings is essential to verify the algorithm is symmetric
      and does not have position-dependent bugs.
    techniques:
      - equivalence_partitioning
      - decision_table
    technique_rationale: >
      Each permutation is an equivalence class for the comparison logic.
      Decision table maps each ordering to the expected output.
    preconditions:
      - "All inputs are in range [1, 300]"
      - "x, y, z are all distinct"
    examples:
      - input:
          x: 200
          y: 150
          z: 100
        expected:
          result: 200
          largest: "x"
        description: "Permutation 1: x>y>z (200>150>100) => x."
      - input:
          x: 200
          y: 100
          z: 150
        expected:
          result: 200
          largest: "x"
        description: "Permutation 2: x>z>y (200>150>100) => x."
      - input:
          x: 150
          y: 200
          z: 100
        expected:
          result: 200
          largest: "y"
        description: "Permutation 3: y>x>z (200>150>100) => y."
      - input:
          x: 100
          y: 200
          z: 150
        expected:
          result: 200
          largest: "y"
        description: "Permutation 4: y>z>x (200>150>100) => y."
      - input:
          x: 150
          y: 100
          z: 200
        expected:
          result: 200
          largest: "z"
        description: "Permutation 5: z>x>y (200>150>100) => z."
      - input:
          x: 100
          y: 150
          z: 200
        expected:
          result: 200
          largest: "z"
        description: "Permutation 6: z>y>x (200>150>100) => z."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - comparison
      - permutation
      - exhaustive

  # ==========================================================================
  # ERROR GUESSING — Anticipated defect scenarios
  # ==========================================================================

  - name: "Adjacent values differing by 1 — near-tie detection"
    description: >
      Inputs differ by exactly 1 to detect off-by-one errors in the comparison
      operators (e.g., > vs >= confusion).
    type: edge_case
    risk: medium
    risk_rationale: >
      Impact: 2, Frequency: 2, Consequence: 2, Detectability: 3. Average: 2.25 -> medium.
      Adjacent values are where > vs >= bugs manifest. Silent wrong answer.
    techniques:
      - error_guessing
      - boundary_value
    technique_rationale: >
      Error guessing targets the classic off-by-one in comparisons;
      boundary value analyzes the point where relative ordering changes.
    preconditions:
      - "All inputs are in range [1, 300]"
    examples:
      - input:
          x: 101
          y: 100
          z: 99
        expected:
          result: 101
          largest: "x"
        description: "Consecutive descending values, differ by 1."
      - input:
          x: 100
          y: 101
          z: 100
        expected:
          result: 101
          largest: "y"
        description: "y is 1 greater than x and z which are tied."
      - input:
          x: 100
          y: 99
          z: 101
        expected:
          result: 101
          largest: "z"
        description: "z is 1 greater, x in middle, y smallest — all differ by 1."
    test_ref: ""
    status: uncovered
    priority: 2
    tags:
      - comparison
      - error-guessing
      - off-by-one

  - name: "Extreme boundary combination — all inputs at bounds"
    description: >
      Tests with inputs at the extreme ends of the valid range simultaneously.
      Worst-case BVA: all three parameters at boundary values.
    type: boundary
    risk: medium
    risk_rationale: >
      Impact: 2, Frequency: 1, Consequence: 2, Detectability: 2. Average: 1.75 -> medium.
      Rare in practice but exercises worst-case paths.
    techniques:
      - boundary_value
      - error_guessing
    technique_rationale: >
      Worst-case boundary value analysis tests all parameters at limits
      simultaneously; error guessing anticipates overflow or edge interactions.
    preconditions:
      - "All inputs at boundary values 1 or 300"
    examples:
      - input:
          x: 300
          y: 300
          z: 1
        expected:
          result: 300
        description: "Two at upper bound, one at lower bound."
      - input:
          x: 1
          y: 300
          z: 300
        expected:
          result: 300
        description: "One at lower bound, two at upper bound (different positions)."
      - input:
          x: 1
          y: 1
          z: 300
        expected:
          result: 300
        description: "Two at lower bound, one at upper bound."
      - input:
          x: 300
          y: 1
          z: 1
        expected:
          result: 300
        description: "x at upper bound, y and z at lower bound."
    test_ref: ""
    status: uncovered
    priority: 2
    tags:
      - boundary
      - worst-case-bva
      - extreme

# ===========================================================================
# Example Mapping
# ===========================================================================
example_mapping:
  story: >
    As a user, I want to determine the largest of three positive integers
    (x, y, z) within the range [1, 300] so that I get the correct maximum value.
  rules:
    - rule_name: "Each input must be in range [1, 300]"
      examples:
        - "x=150, y=100, z=200 -> all valid, proceed to comparison"
        - "x=0, y=100, z=200 -> x below minimum, reject"
        - "x=301, y=100, z=200 -> x above maximum, reject"
        - "x=150, y=0, z=200 -> y below minimum, reject"
        - "x=150, y=301, z=200 -> y above maximum, reject"
        - "x=150, y=100, z=0 -> z below minimum, reject"
        - "x=150, y=100, z=301 -> z above maximum, reject"
        - "x=0, y=0, z=0 -> all below minimum, reject with all violations"

    - rule_name: "The function returns the value of the largest input"
      examples:
        - "x=200, y=150, z=100 -> returns 200 (x is largest)"
        - "x=100, y=200, z=150 -> returns 200 (y is largest)"
        - "x=100, y=150, z=200 -> returns 200 (z is largest)"

    - rule_name: "All 6 strict orderings produce correct results"
      examples:
        - "x>y>z: x=200, y=150, z=100 -> 200"
        - "x>z>y: x=200, y=100, z=150 -> 200"
        - "y>x>z: x=150, y=200, z=100 -> 200"
        - "y>z>x: x=100, y=200, z=150 -> 200"
        - "z>x>y: x=150, y=100, z=200 -> 200"
        - "z>y>x: x=100, y=150, z=200 -> 200"

    - rule_name: "Ties return the tied value"
      examples:
        - "x=y=200, z=100 -> returns 200 (two-way tie, x=y)"
        - "x=z=200, y=100 -> returns 200 (two-way tie, x=z)"
        - "y=z=200, x=100 -> returns 200 (two-way tie, y=z)"
        - "x=y=z=150 -> returns 150 (three-way tie)"

    - rule_name: "Boundary values at range limits [1, 300] are accepted"
      examples:
        - "x=1 (lower bound) -> accepted"
        - "x=300 (upper bound) -> accepted"
        - "x=0 (below lower bound) -> rejected"
        - "x=301 (above upper bound) -> rejected"
        - "x=1, y=1, z=1 -> returns 1 (all at minimum)"
        - "x=300, y=300, z=300 -> returns 300 (all at maximum)"

    - rule_name: "Infeasible condition combinations are identified"
      examples:
        - "c7=true (x>y), c8=false (x<=z), c9=true (y>z) is infeasible: x>y>z>=x contradiction"
        - "c7=false (x<=y), c8=true (x>z), c9=false (y<=z) is infeasible: y<=z<x<=y contradiction"

