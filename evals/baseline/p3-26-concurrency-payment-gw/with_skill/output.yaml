  # ===========================================================================
  # SCENARIO 7: Graceful Degradation When Approaching Capacity
  # ===========================================================================
  - name: "Graceful degradation with load shedding at capacity threshold"
    description: >
      As the system approaches its capacity limit, verify that it begins
      shedding lower-priority traffic while continuing to process high-priority
      transactions. The system should return appropriate HTTP status codes
      (429 or 503) for shed requests and never silently drop transactions.
    type: performance
    risk: high
    risk_rationale: >
      Impact: 3 - Degradation behavior directly affects payment availability.
      Frequency: 2 - Capacity approach happens during traffic spikes.
      Consequence: 3 - Ungraceful degradation means complete outage instead of partial.
      Detectability: 2 - Degradation metrics should be visible in dashboards.
      Average: 2.5 -> high.
    techniques:
      - boundary_value
      - decision_table
      - equivalence_partitioning
    technique_rationale: >
      BVA tests at exact capacity thresholds (80%, 90%, 95%, 100%, 110%).
      DT covers the combination of load level and request priority to determine
      accept/reject decisions. EP partitions requests into priority classes.
    preconditions:
      - "Load shedding thresholds configured (e.g., start shedding at 80% capacity)"
      - "Request priority classification is implemented"
      - "Rate limiting and backpressure mechanisms are active"
    examples:
      - input:
          current_load_percent: 79
          incoming_request_priority: "normal"
        expected:
          request_accepted: true
          processing_normal: true
        description: "79% capacity with normal priority - all requests accepted"
      - input:
          current_load_percent: 85
          incoming_request_priority: "low"
        expected:
          request_rejected: true
          http_status: 429
          retry_after_header_present: true
        description: "85% capacity - low priority requests shed"
      - input:
          current_load_percent: 85
          incoming_request_priority: "high"
        expected:
          request_accepted: true
          processing_normal: true
        description: "85% capacity - high priority requests still accepted"
      - input:
          current_load_percent: 95
          incoming_request_priority: "normal"
        expected:
          request_rejected: true
          http_status: 429
          retry_after_header_present: true
        description: "95% capacity - only critical requests accepted"
      - input:
          current_load_percent: 100
          incoming_request_priority: "critical"
        expected:
          request_accepted: true
          latency_may_be_elevated: true
        description: "100% capacity - only critical priority accepted"
      - input:
          current_load_percent: 110
          incoming_request_priority: "critical"
        expected:
          request_queued_or_rejected: true
          system_does_not_crash: true
        description: "110% capacity - even critical requests may be queued"
    decision_table:
      conditions:
        - "load_percentage_bracket"
        - "request_priority"
      actions:
        - "accept_request"
        - "http_response_code"
        - "queue_or_process"
      rules:
        - description: "Under 80% - accept all"
          condition_values:
            load_percentage_bracket: "<80%"
            request_priority: "any"
          expected_actions:
            accept_request: true
            http_response_code: 200
            queue_or_process: "process_immediately"
        - description: "80-90% - shed low priority"
          condition_values:
            load_percentage_bracket: "80-90%"
            request_priority: "low"
          expected_actions:
            accept_request: false
            http_response_code: 429
            queue_or_process: "rejected"
        - description: "80-90% - accept normal and above"
          condition_values:
            load_percentage_bracket: "80-90%"
            request_priority: "normal_or_higher"
          expected_actions:
            accept_request: true
            http_response_code: 200
            queue_or_process: "process_immediately"
        - description: "90-100% - shed normal and below"
          condition_values:
            load_percentage_bracket: "90-100%"
            request_priority: "normal_or_lower"
          expected_actions:
            accept_request: false
            http_response_code: 429
            queue_or_process: "rejected"
        - description: "90-100% - accept high and critical"
          condition_values:
            load_percentage_bracket: "90-100%"
            request_priority: "high_or_critical"
          expected_actions:
            accept_request: true
            http_response_code: 200
            queue_or_process: "process_with_elevated_timeout"
        - description: "Over 100% - emergency mode"
          condition_values:
            load_percentage_bracket: ">100%"
            request_priority: "any"
          expected_actions:
            accept_request: "critical_only"
            http_response_code: "503_for_non_critical"
            queue_or_process: "emergency_queue_for_critical"
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
