# Valid Guard Test Plan
# Generated: 2026-03-14T00:00:00Z
# Source: natural language

feature: "Payment Gateway Concurrency and Resilience"

feature_description: >
  A payment gateway handling hundreds of concurrent transactions must maintain
  data consistency, prevent double-charges, and meet SLA requirements (p99 < 500ms).
  Testing covers 500 concurrent payment submissions, transaction isolation under load,
  response time degradation patterns, connection pool exhaustion, deadlock detection
  and recovery, partial failure handling (gateway up, bank down), and graceful
  degradation when approaching capacity. The system must remain correct under all
  load profiles and degrade predictably rather than catastrophically.

risk_level: high

entry_point: greenfield

source:
  type: natural_language
  path: ""

scenarios:
  # ===========================================================================
  # SCENARIO 1: 500 Concurrent Payment Submissions
  # ===========================================================================
  - name: "500 concurrent payment submissions - all unique transactions"
    description: >
      Submit 500 unique, valid payment requests simultaneously. Every transaction
      must be processed exactly once, with no duplicates, no lost transactions,
      and all results returned within SLA. Verifies the system's ability to handle
      peak concurrent load without data loss or corruption.
    type: performance
    risk: high
    risk_rationale: >
      Impact: 3 - Core payment processing, direct financial operations.
      Frequency: 3 - Peak load scenario expected during sales events.
      Consequence: 3 - Financial loss if transactions are lost or duplicated.
      Detectability: 3 - Silent data loss may go unnoticed until reconciliation.
      Average: 3.0 -> high.
    techniques:
      - boundary_value
      - error_guessing
    technique_rationale: >
      BVA applied to the concurrency threshold (500 is the specified peak).
      EG applied because concurrent payment processing is a known area for
      race conditions, lost updates, and silent failures.
    preconditions:
      - "Payment gateway is running and healthy"
      - "Database connection pool is configured for at least 500 connections"
      - "Bank simulator/mock is configured to accept all valid payments"
      - "Each payment has a unique idempotency key"
    examples:
      - input:
          concurrent_requests: 500
          payment_amount_range: [1.00, 9999.99]
          all_unique_idempotency_keys: true
        expected:
          successful_transactions: 500
          duplicate_charges: 0
          lost_transactions: 0
          p99_latency_ms: "<500"
        description: "All 500 concurrent unique payments processed exactly once within SLA"
      - input:
          concurrent_requests: 500
          payment_amount_range: [1.00, 9999.99]
          include_duplicate_idempotency_keys: 50
        expected:
          successful_transactions: 450
          deduplicated_responses: 50
          duplicate_charges: 0
        description: "500 requests with 50 duplicate idempotency keys - duplicates rejected gracefully"
      - input:
          concurrent_requests: 500
          payment_amount_range: [0.01, 0.01]
          all_unique_idempotency_keys: true
        expected:
          successful_transactions: 500
          total_charged: 5.00
        description: "500 concurrent minimum-amount payments to verify small transaction handling under load"
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - concurrency
      - load-test
      - peak-capacity
      - data-consistency

  - name: "Concurrent submissions at boundary thresholds"
    description: >
      Test concurrency at boundary levels around the 500 target: below capacity,
      at capacity, and above capacity. Verifies the system behavior at each
      threshold and identifies the exact point where degradation begins.
    type: boundary
    risk: high
    risk_rationale: >
      Impact: 3 - Core payment path under stress.
      Frequency: 2 - Boundary conditions occur during scaling events.
      Consequence: 3 - Missed boundary handling causes cascading failures.
      Detectability: 2 - Degradation may be gradual and hard to pinpoint.
      Average: 2.5 -> high.
    techniques:
      - boundary_value
      - equivalence_partitioning
    technique_rationale: >
      BVA tests the exact concurrency limits (499, 500, 501, and beyond).
      EP partitions the concurrency space into under-capacity, at-capacity,
      and over-capacity classes.
    preconditions:
      - "Payment gateway is running and healthy"
      - "Monitoring and metrics collection is active"
    examples:
      - input:
          concurrent_requests: 1
          scenario: "single request baseline"
        expected:
          success_rate: 100
          p99_latency_ms: "<100"
        description: "Single request baseline for latency comparison"
      - input:
          concurrent_requests: 100
          scenario: "well below capacity"
        expected:
          success_rate: 100
          p99_latency_ms: "<200"
        description: "100 concurrent requests - well within capacity"
      - input:
          concurrent_requests: 499
          scenario: "just below stated capacity"
        expected:
          success_rate: 100
          p99_latency_ms: "<500"
        description: "499 concurrent requests - one below stated capacity"
      - input:
          concurrent_requests: 500
          scenario: "at stated capacity"
        expected:
          success_rate: 100
          p99_latency_ms: "<500"
        description: "500 concurrent requests - at stated capacity, must meet SLA"
      - input:
          concurrent_requests: 501
          scenario: "one above stated capacity"
        expected:
          success_rate: ">=99"
          graceful_rejection: true
          p99_latency_ms: "<750"
        description: "501 concurrent requests - one above capacity, graceful handling expected"
      - input:
          concurrent_requests: 750
          scenario: "50% over capacity"
        expected:
          accepted_requests_handled_correctly: true
          rejected_requests_get_429_or_503: true
          no_data_corruption: true
        description: "750 concurrent requests - significantly over capacity, verify graceful degradation"
      - input:
          concurrent_requests: 1000
          scenario: "double capacity"
        expected:
          system_remains_stable: true
          no_crash: true
          recovery_within_seconds: "<30"
        description: "1000 concurrent requests - double capacity, verify system does not crash"
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - concurrency
      - boundary
      - capacity-planning

  # ===========================================================================
  # SCENARIO 2: Transaction Isolation Under Load
  # ===========================================================================
  - name: "Transaction isolation - no cross-contamination under concurrent load"
    description: >
      Verify that concurrent transactions maintain strict isolation. Each
      transaction's amount, customer ID, merchant ID, and payment method
      must not leak into or corrupt another concurrent transaction. This tests
      database isolation levels and application-level data handling.
    type: happy_path
    risk: high
    risk_rationale: >
      Impact: 3 - Data integrity of financial transactions.
      Frequency: 3 - Every concurrent operation tests isolation.
      Consequence: 3 - Cross-contamination means charging wrong customer or wrong amount.
      Detectability: 3 - Silent corruption may go undetected until audit.
      Average: 3.0 -> high.
    techniques:
      - equivalence_partitioning
      - error_guessing
    technique_rationale: >
      EP partitions transactions into different customer/merchant combinations
      to detect cross-contamination. EG anticipates common isolation failures
      like shared mutable state, incorrect thread-local storage, and connection reuse bugs.
    preconditions:
      - "Payment gateway is running with production-equivalent isolation settings"
      - "Database transaction isolation level is READ COMMITTED or higher"
      - "Each transaction uses distinct customer and merchant identifiers"
    examples:
      - input:
          concurrent_requests: 200
          distinct_customers: 200
          distinct_amounts: true
        expected:
          each_transaction_charged_to_correct_customer: true
          each_transaction_has_correct_amount: true
          no_cross_customer_data_leakage: true
        description: "200 concurrent transactions for 200 different customers - verify no cross-contamination"
      - input:
          concurrent_requests: 100
          same_customer: true
          distinct_idempotency_keys: true
          distinct_amounts: true
        expected:
          all_transactions_recorded_individually: true
          customer_balance_equals_sum_of_amounts: true
        description: "100 concurrent transactions for same customer - verify all recorded correctly"
      - input:
          concurrent_requests: 300
          mix_of_currencies: ["USD", "EUR", "GBP", "JPY"]
          distinct_amounts: true
        expected:
          each_transaction_uses_correct_currency: true
          no_currency_mixing: true
        description: "300 concurrent multi-currency transactions - verify currency isolation"
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - concurrency
      - data-integrity
      - isolation
      - financial-correctness

  - name: "Read-write conflict during concurrent balance updates"
    description: >
      When multiple transactions update the same account balance simultaneously,
      verify that the final balance reflects all successful transactions without
      lost updates or phantom reads. Tests optimistic/pessimistic locking behavior.
    type: edge_case
    risk: high
    risk_rationale: >
      Impact: 3 - Direct financial impact on account balances.
      Frequency: 3 - Common in shared-account or merchant settlement scenarios.
      Consequence: 3 - Lost updates mean money disappears silently.
      Detectability: 3 - Balance discrepancies may only surface during reconciliation.
      Average: 3.0 -> high.
    techniques:
      - state_transition
      - error_guessing
    technique_rationale: >
      ST models the account balance state through concurrent modification attempts.
      EG anticipates lost-update anomalies, phantom reads, and dirty reads
      that are common under concurrent write load.
    preconditions:
      - "Shared test account with known initial balance"
      - "Concurrent transactions targeting the same account"
    examples:
      - input:
          initial_balance: 10000.00
          concurrent_debits: 10
          debit_amount_each: 100.00
        expected:
          final_balance: 9000.00
          successful_debits: 10
          lost_updates: 0
        description: "10 concurrent $100 debits from $10000 account - verify no lost updates"
      - input:
          initial_balance: 500.00
          concurrent_debits: 10
          debit_amount_each: 100.00
        expected:
          successful_debits: 5
          rejected_debits_insufficient_funds: 5
          final_balance: 0.00
          no_negative_balance: true
        description: "10 concurrent $100 debits from $500 account - verify correct rejection and no overdraft"
    state_transition:
      states:
        - "sufficient_balance"
        - "partial_balance"
        - "zero_balance"
        - "overdraft_attempted"
      transitions:
        - from: "sufficient_balance"
          to: "sufficient_balance"
          trigger: "debit processed"
          guard: "remaining balance >= debit amount"
        - from: "sufficient_balance"
          to: "partial_balance"
          trigger: "debit processed"
          guard: "remaining balance < next debit amount but > 0"
        - from: "partial_balance"
          to: "zero_balance"
          trigger: "final debit clears remaining balance"
          guard: "remaining balance == debit amount"
        - from: "partial_balance"
          to: "overdraft_attempted"
          trigger: "debit request exceeds balance"
          guard: "remaining balance < debit amount"
        - from: "overdraft_attempted"
          to: "partial_balance"
          trigger: "debit rejected"
          guard: "balance unchanged after rejection"
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - concurrency
      - isolation
      - lost-update
      - balance-integrity

  # ===========================================================================
  # SCENARIO 3: Response Time Degradation Patterns
  # ===========================================================================
  - name: "Response time degradation under increasing load"
    description: >
      Gradually increase concurrent load from 10% to 150% of capacity and
      measure p50, p95, and p99 response times at each step. Identify the
      inflection point where latency begins to degrade, and verify that
      degradation is linear (not exponential) up to capacity.
    type: performance
    risk: high
    risk_rationale: >
      Impact: 3 - SLA compliance directly affects business contracts.
      Frequency: 3 - Load varies continuously in production.
      Consequence: 3 - SLA breach triggers financial penalties and customer churn.
      Detectability: 2 - Latency degradation is measurable but requires monitoring.
      Average: 2.75 -> high.
    techniques:
      - boundary_value
      - equivalence_partitioning
    technique_rationale: >
      BVA tests at specific load thresholds where degradation is expected.
      EP partitions load levels into under-capacity, near-capacity, at-capacity,
      and over-capacity equivalence classes with distinct expected behaviors.
    preconditions:
      - "Load generation tool configured (e.g., k6, Locust, Gatling)"
      - "Metrics collection active for p50, p95, p99 latencies"
      - "Warm-up period completed before measurement begins"
      - "Stable baseline latency established"
    examples:
      - input:
          load_profile: "step_increase"
          steps: [50, 100, 200, 300, 400, 450, 500]
          duration_per_step_seconds: 60
          ramp_up_seconds: 10
        expected:
          p99_at_50_concurrent: "<150ms"
          p99_at_200_concurrent: "<250ms"
          p99_at_400_concurrent: "<400ms"
          p99_at_500_concurrent: "<500ms"
          degradation_pattern: "linear_or_sublinear"
        description: "Step-increase load test measuring latency degradation curve"
      - input:
          load_profile: "sustained_peak"
          concurrent_requests: 500
          duration_seconds: 300
        expected:
          p99_remains_below: "500ms"
          no_latency_spikes_above: "1000ms"
          latency_variance_coefficient: "<0.3"
        description: "5-minute sustained peak load - verify latency stability over time"
      - input:
          load_profile: "spike"
          baseline_concurrent: 100
          spike_concurrent: 500
          spike_duration_seconds: 30
          return_to_baseline: true
        expected:
          spike_p99: "<500ms"
          recovery_p99_within: "10s"
          post_spike_p99: "<150ms"
        description: "Traffic spike from 100 to 500 and back - verify recovery time"
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - performance
      - latency
      - sla
      - degradation-pattern

  - name: "SLA breach detection at p99 threshold"
    description: >
      Verify that the system accurately detects when p99 latency exceeds
      the 500ms SLA threshold and triggers appropriate alerts. Test that
      the monitoring system correctly calculates p99 under various load
      distributions and does not produce false positives or false negatives.
    type: boundary
    risk: high
    risk_rationale: >
      Impact: 3 - SLA breach detection is critical for contractual compliance.
      Frequency: 2 - Monitoring runs continuously but breaches are occasional.
      Consequence: 3 - Undetected SLA breach means contract violations.
      Detectability: 2 - The monitoring system itself must be validated.
      Average: 2.5 -> high.
    techniques:
      - boundary_value
      - decision_table
    technique_rationale: >
      BVA tests the exact 500ms boundary (499ms, 500ms, 501ms).
      DT covers the combination of load level, latency percentile, and alert action.
    preconditions:
      - "Alerting system is configured with 500ms p99 threshold"
      - "Metrics pipeline has sub-second granularity"
    examples:
      - input:
          p99_latency_ms: 499
          load_concurrent: 500
        expected:
          sla_breach_alert: false
          status: "healthy"
        description: "p99 at 499ms - just below SLA threshold, no alert"
      - input:
          p99_latency_ms: 500
          load_concurrent: 500
        expected:
          sla_breach_alert: false
          status: "healthy"
        description: "p99 at exactly 500ms - at SLA boundary, no breach"
      - input:
          p99_latency_ms: 501
          load_concurrent: 500
        expected:
          sla_breach_alert: true
          status: "warning"
        description: "p99 at 501ms - just above SLA threshold, alert triggered"
    decision_table:
      conditions:
        - "p99_latency_vs_sla"
        - "load_level_vs_capacity"
        - "sustained_duration"
      actions:
        - "alert_level"
        - "auto_scale_trigger"
        - "traffic_shed"
      rules:
        - description: "Under SLA, under capacity - all clear"
          condition_values:
            p99_latency_vs_sla: "below"
            load_level_vs_capacity: "under"
            sustained_duration: "any"
          expected_actions:
            alert_level: "none"
            auto_scale_trigger: false
            traffic_shed: false
        - description: "Over SLA, under capacity - investigate latency"
          condition_values:
            p99_latency_vs_sla: "above"
            load_level_vs_capacity: "under"
            sustained_duration: ">60s"
          expected_actions:
            alert_level: "warning"
            auto_scale_trigger: false
            traffic_shed: false
        - description: "Over SLA, at capacity - scale up"
          condition_values:
            p99_latency_vs_sla: "above"
            load_level_vs_capacity: "at"
            sustained_duration: ">30s"
          expected_actions:
            alert_level: "critical"
            auto_scale_trigger: true
            traffic_shed: false
        - description: "Over SLA, over capacity - scale and shed"
          condition_values:
            p99_latency_vs_sla: "above"
            load_level_vs_capacity: "over"
            sustained_duration: ">10s"
          expected_actions:
            alert_level: "critical"
            auto_scale_trigger: true
            traffic_shed: true
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - sla
      - monitoring
      - alerting
      - boundary

  # ===========================================================================
  # SCENARIO 4: Connection Pool Exhaustion
  # ===========================================================================
  - name: "Connection pool exhaustion under sustained high load"
    description: >
      Verify system behavior when the database connection pool is fully
      exhausted. Transactions should queue with bounded wait times,
      return appropriate errors after timeout, and the pool should recover
      once load decreases. No connection leaks should occur.
    type: error_handling
    risk: high
    risk_rationale: >
      Impact: 3 - Connection pool exhaustion halts all payment processing.
      Frequency: 2 - Occurs during sustained peak load or connection leaks.
      Consequence: 3 - Complete service outage for payment processing.
      Detectability: 2 - Pool exhaustion is detectable via metrics but impact is immediate.
      Average: 2.5 -> high.
    techniques:
      - boundary_value
      - state_transition
      - error_guessing
    technique_rationale: >
      BVA tests at pool size boundaries (pool_size-1, pool_size, pool_size+1 requests).
      ST models pool states (available, partial, exhausted, recovering).
      EG anticipates connection leaks, zombie connections, and failure to return connections.
    preconditions:
      - "Database connection pool configured with known max size (e.g., 50)"
      - "Connection pool metrics are exposed (active, idle, waiting counts)"
      - "Connection acquisition timeout is configured (e.g., 5 seconds)"
    examples:
      - input:
          pool_max_size: 50
          concurrent_long_running_transactions: 50
          additional_requests: 10
          transaction_duration_ms: 2000
        expected:
          first_50_transactions: "processed"
          additional_10: "queued then processed after pool frees"
          error_rate: 0
        description: "Pool fully utilized with 10 queued requests - verify queuing works"
      - input:
          pool_max_size: 50
          concurrent_long_running_transactions: 50
          additional_requests: 100
          transaction_duration_ms: 10000
          acquisition_timeout_ms: 5000
        expected:
          first_50_transactions: "processed"
          timed_out_requests: ">0"
          error_code: 503
          error_message_contains: "service temporarily unavailable"
          connection_leak_count: 0
        description: "Pool exhausted with long transactions - verify timeout and error response"
      - input:
          pool_max_size: 50
          concurrent_requests: 100
          transaction_duration_ms: 1000
          test_duration_seconds: 60
        expected:
          pool_recovers_after_burst: true
          no_connection_leaks: true
          idle_connections_at_end: 50
        description: "Sustained load above pool capacity - verify pool recovers without leaks"
    state_transition:
      states:
        - "pool_available"
        - "pool_partial"
        - "pool_exhausted"
        - "pool_recovering"
      transitions:
        - from: "pool_available"
          to: "pool_partial"
          trigger: "connections acquired"
          guard: "active connections > 0 AND active connections < max_size"
        - from: "pool_partial"
          to: "pool_exhausted"
          trigger: "all connections acquired"
          guard: "active connections == max_size"
        - from: "pool_exhausted"
          to: "pool_partial"
          trigger: "connections released"
          guard: "active connections < max_size"
        - from: "pool_partial"
          to: "pool_available"
          trigger: "all connections released"
          guard: "active connections == 0"
        - from: "pool_exhausted"
          to: "pool_recovering"
          trigger: "stale connections detected and evicted"
          guard: "eviction policy triggered"
        - from: "pool_recovering"
          to: "pool_partial"
          trigger: "new connections established"
          guard: "healthy connections available > 0"
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - connection-pool
      - resource-exhaustion
      - resilience
      - error-handling

  - name: "Connection leak detection under error conditions"
    description: >
      Verify that connections are properly returned to the pool even when
      transactions fail with exceptions. Simulate various failure modes
      (timeout, constraint violation, network error) and confirm that
      the connection is always released back to the pool.
    type: error_handling
    risk: high
    risk_rationale: >
      Impact: 3 - Connection leaks cause progressive pool exhaustion.
      Frequency: 2 - Error conditions are common in production.
      Consequence: 3 - Leaked connections eventually halt all processing.
      Detectability: 3 - Leaks accumulate silently until pool is exhausted.
      Average: 2.75 -> high.
    techniques:
      - equivalence_partitioning
      - error_guessing
    technique_rationale: >
      EP partitions error types (timeout, constraint, network, application)
      to test connection return across all failure classes.
      EG anticipates specific leak scenarios like unreleased connections
      in exception handlers and half-closed connections.
    preconditions:
      - "Connection pool monitoring enabled"
      - "Error injection capability available"
      - "Pool size is known and observable"
    examples:
      - input:
          pool_max_size: 20
          error_type: "query_timeout"
          error_count: 50
          sequential: true
        expected:
          pool_active_connections_after: 0
          pool_idle_connections_after: 20
          connection_leak_count: 0
        description: "50 sequential query timeouts - verify all connections returned to pool"
      - input:
          pool_max_size: 20
          error_type: "constraint_violation"
          error_count: 50
          sequential: true
        expected:
          pool_active_connections_after: 0
          connection_leak_count: 0
        description: "50 constraint violations - verify connections are not leaked"
      - input:
          pool_max_size: 20
          error_type: "network_disconnect_mid_transaction"
          error_count: 10
        expected:
          stale_connections_evicted: true
          new_connections_created: true
          pool_healthy_after_recovery: true
        description: "Network disconnects mid-transaction - verify pool heals stale connections"
    test_ref: ""
    status: uncovered
    priority: 2
    tags:
      - connection-pool
      - connection-leak
      - error-handling
      - resource-management

  # ===========================================================================
  # SCENARIO 5: Deadlock Detection and Recovery
  # ===========================================================================
  - name: "Deadlock detection under concurrent opposing transactions"
    description: >
      Create scenarios where two or more transactions acquire locks in
      opposing order (A locks row 1 then row 2, B locks row 2 then row 1).
      Verify that the database or application detects the deadlock, aborts
      one transaction, and allows the other to complete. The aborted
      transaction should be retried automatically.
    type: error_handling
    risk: high
    risk_rationale: >
      Impact: 3 - Deadlocks halt payment processing for affected transactions.
      Frequency: 2 - Deadlocks occur under specific concurrent access patterns.
      Consequence: 3 - Unresolved deadlocks can cascade and freeze the system.
      Detectability: 2 - Deadlocks are detectable but require specific monitoring.
      Average: 2.5 -> high.
    techniques:
      - state_transition
      - error_guessing
      - cause_effect
    technique_rationale: >
      ST models the lock acquisition and deadlock lifecycle states.
      EG anticipates specific deadlock patterns from payment processing experience.
      CE maps the cause (opposing lock order) to effect (deadlock detection and resolution).
    preconditions:
      - "Database deadlock detection is enabled (innodb_deadlock_detect or equivalent)"
      - "Application has retry logic for deadlock errors"
      - "Deadlock monitoring and logging is active"
      - "At least two accounts/rows that can be locked in opposing order"
    examples:
      - input:
          transaction_a: {lock_order: ["account_1", "account_2"], operation: "transfer"}
          transaction_b: {lock_order: ["account_2", "account_1"], operation: "transfer"}
          concurrent: true
        expected:
          deadlock_detected: true
          one_transaction_aborted: true
          other_transaction_completed: true
          aborted_transaction_retried: true
          both_eventually_succeed: true
        description: "Classic AB-BA deadlock between two transfer transactions"
      - input:
          concurrent_transfers: 10
          account_pairs: "random from pool of 5 accounts"
          transfer_amount: 10.00
        expected:
          deadlock_count: ">0"
          all_transfers_eventually_complete: true
          account_balances_consistent: true
          retry_count_logged: true
        description: "10 random transfers across 5 accounts - verify deadlocks are resolved"
      - input:
          concurrent_transfers: 50
          account_pairs: "random from pool of 10 accounts"
          max_retries: 3
        expected:
          all_transfers_complete_or_fail_gracefully: true
          no_infinite_retry_loops: true
          max_retry_count_per_transaction: "<=3"
        description: "50 transfers with retry limit - verify no infinite retry loops"
    state_transition:
      states:
        - "lock_acquired_partial"
        - "lock_acquired_full"
        - "deadlock_detected"
        - "transaction_aborted"
        - "retry_scheduled"
        - "transaction_completed"
      transitions:
        - from: "lock_acquired_partial"
          to: "lock_acquired_full"
          trigger: "second lock acquired"
          guard: "no conflicting lock held by another transaction"
        - from: "lock_acquired_partial"
          to: "deadlock_detected"
          trigger: "lock wait timeout or cycle detection"
          guard: "circular dependency exists in lock graph"
        - from: "deadlock_detected"
          to: "transaction_aborted"
          trigger: "victim transaction selected"
          guard: "deadlock resolution policy applied (youngest, lowest cost)"
        - from: "transaction_aborted"
          to: "retry_scheduled"
          trigger: "retry policy triggered"
          guard: "retry count < max retries"
        - from: "retry_scheduled"
          to: "lock_acquired_partial"
          trigger: "retry attempt begins"
          guard: "backoff period elapsed"
        - from: "lock_acquired_full"
          to: "transaction_completed"
          trigger: "commit"
          guard: "all operations successful"
        - from: "transaction_aborted"
          to: "transaction_completed"
          trigger: "max retries exceeded"
          guard: "retry count >= max retries, return error to caller"
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
