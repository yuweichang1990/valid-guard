          locks_released: true
          connection_returned_to_pool: true
          customer_receives_timeout_error: true
        description: "Transaction exceeds timeout - verify complete cleanup"
      - input:
          concurrent_transactions: 100
          timeout_percentage: 20
          healthy_transactions: 80
        expected:
          healthy_transactions_unaffected: true
          timed_out_transactions_cleaned_up: true
          no_resource_starvation: true
        description: "20% of concurrent transactions timeout - verify no impact on healthy ones"
    state_transition:
      states:
        - "transaction_started"
        - "processing"
        - "timeout_triggered"
        - "cleanup_in_progress"
        - "cleanup_complete"
        - "error_returned"
      transitions:
        - from: "transaction_started"
          to: "processing"
          trigger: "begin processing"
          guard: "resources acquired"
        - from: "processing"
          to: "timeout_triggered"
          trigger: "timeout elapsed"
          guard: "processing duration > configured timeout"
        - from: "timeout_triggered"
          to: "cleanup_in_progress"
          trigger: "interrupt processing"
          guard: "timeout handler activated"
        - from: "cleanup_in_progress"
          to: "cleanup_complete"
          trigger: "rollback, release locks, return connection"
          guard: "all resources accounted for"
        - from: "cleanup_complete"
          to: "error_returned"
          trigger: "send error response to caller"
          guard: "cleanup verified"
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - timeout
      - resource-cleanup
      - concurrency
      - resilience

  - name: "Circuit breaker activation and recovery"
    description: >
      Verify that the circuit breaker opens after a configured number of
      consecutive failures to the bank, fast-fails subsequent requests during
      the open period, transitions to half-open to test recovery, and fully
      closes when the bank is healthy again. Verify correct behavior under
      concurrent load during each circuit breaker state.
    type: state_transition
    risk: high
    risk_rationale: >
      Impact: 3 - Circuit breaker controls access to the bank integration.
      Frequency: 2 - Activates during bank outages, a known production event.
      Consequence: 3 - Stuck-open circuit breaker blocks all payments; stuck-closed hammers a failing bank.
      Detectability: 2 - Circuit breaker state is observable in metrics.
      Average: 2.5 -> high.
    techniques:
      - state_transition
      - boundary_value
      - error_guessing
    technique_rationale: >
      ST models the circuit breaker states (closed, open, half-open) and transitions.
      BVA tests at the failure count threshold that triggers opening.
      EG anticipates edge cases like concurrent requests during state transitions.
    preconditions:
      - "Circuit breaker configured (failure_threshold=5, timeout=30s, half_open_max=3)"
      - "Bank failure injection available"
      - "Circuit breaker state observable via metrics/API"
    examples:
      - input:
          consecutive_bank_failures: 4
          circuit_breaker_threshold: 5
        expected:
          circuit_state: "closed"
          requests_forwarded_to_bank: true
        description: "4 failures (below threshold of 5) - circuit stays closed"
      - input:
          consecutive_bank_failures: 5
          circuit_breaker_threshold: 5
        expected:
          circuit_state: "open"
          subsequent_requests_fast_fail: true
          fast_fail_response_time_ms: "<10"
        description: "5th failure triggers circuit open"
      - input:
          circuit_state: "open"
          time_elapsed_seconds: 30
          bank_now_healthy: true
        expected:
          circuit_state: "half_open"
          probe_request_sent_to_bank: true
          probe_succeeds: true
          circuit_transitions_to: "closed"
        description: "Circuit open timeout elapsed, bank recovered - verify transition to closed via half-open"
      - input:
          circuit_state: "half_open"
          probe_request_fails: true
        expected:
          circuit_transitions_to: "open"
          timer_reset: true
        description: "Half-open probe fails - circuit returns to open"
    state_transition:
      states:
        - "closed"
        - "open"
        - "half_open"
      transitions:
        - from: "closed"
          to: "open"
          trigger: "failure count reaches threshold"
          guard: "consecutive_failures >= failure_threshold"
        - from: "open"
          to: "half_open"
          trigger: "timeout period elapsed"
          guard: "time since open > circuit_breaker_timeout"
        - from: "half_open"
          to: "closed"
          trigger: "probe request succeeds"
          guard: "successful_probes >= half_open_success_threshold"
        - from: "half_open"
          to: "open"
          trigger: "probe request fails"
          guard: "any probe failure during half-open"
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - circuit-breaker
      - resilience
      - bank-integration
      - state-machine

  - name: "Data consistency verification via reconciliation"
    description: >
      After a test run with concurrent transactions, mixed failures, and
      recovery scenarios, perform end-to-end reconciliation: verify that
      the sum of all successful charges matches the sum of all balance
      changes, all failed transactions are fully rolled back, and the
      audit log is complete and consistent.
    type: happy_path
    risk: high
    risk_rationale: >
      Impact: 3 - Reconciliation is the ultimate consistency check.
      Frequency: 3 - Must run after every batch of transactions.
      Consequence: 3 - Undetected inconsistencies lead to financial discrepancies.
      Detectability: 1 - Reconciliation explicitly detects problems (that is its purpose).
      Average: 2.5 -> high.
    techniques:
      - equivalence_partitioning
      - error_guessing
    technique_rationale: >
      EP partitions transactions into success/failure/pending groups for
      independent reconciliation. EG anticipates orphaned records, phantom
      entries, and mismatched timestamps.
    preconditions:
      - "All test transactions completed or timed out"
      - "Audit log is complete"
      - "Bank settlement records available (from simulator)"
    examples:
      - input:
          total_transactions_attempted: 1000
          expected_successful: 800
          expected_failed: 200
        expected:
          gateway_successful_count_matches: 800
          bank_charge_count_matches: 800
          sum_of_charges_matches_sum_of_balance_changes: true
          failed_transactions_have_no_bank_charge: true
          audit_log_entries: 1000
          orphaned_records: 0
        description: "Post-test reconciliation of 1000 transactions with mixed outcomes"
      - input:
          include_deadlock_scenarios: true
          include_timeout_scenarios: true
          include_partial_failures: true
        expected:
          money_in_equals_money_out: true
          no_phantom_transactions: true
          all_pending_resolved: true
        description: "Full reconciliation after complex failure scenario mix"
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - reconciliation
      - data-consistency
      - audit
      - financial-correctness

# ===========================================================================
# Example Mapping
# ===========================================================================
example_mapping:
  story: >
    As a payment platform operator, I need the payment gateway to handle
    hundreds of concurrent transactions while maintaining data consistency,
    preventing double-charges, and meeting SLA requirements (p99 < 500ms),
    so that customers are charged correctly, merchants receive accurate
    settlements, and the platform meets its contractual obligations.
  rules:
    - rule_name: "Concurrent transaction processing"
      examples:
        - "500 unique concurrent payments all processed exactly once within p99 < 500ms"
        - "500 concurrent payments with 50 duplicate idempotency keys - duplicates rejected"
        - "Load at boundary thresholds (499, 500, 501, 750, 1000) shows predictable behavior"
        - "Single request baseline establishes latency floor for comparison"
    - rule_name: "Transaction isolation"
      examples:
        - "200 concurrent transactions for 200 different customers - no cross-contamination"
        - "100 concurrent transactions for same customer - all recorded individually"
        - "300 concurrent multi-currency transactions - no currency mixing"
        - "10 concurrent debits from shared account - no lost updates, correct final balance"
        - "10 concurrent $100 debits from $500 account - exactly 5 succeed, no overdraft"
    - rule_name: "SLA compliance"
      examples:
        - "Step-increase load (50-500) shows linear or sublinear latency degradation"
        - "5-minute sustained 500 concurrent: p99 stays below 500ms throughout"
        - "Spike from 100 to 500 and back: recovery within 10 seconds"
        - "p99 at 499ms: no SLA alert; p99 at 501ms: SLA alert triggered"
    - rule_name: "Connection pool management"
      examples:
        - "Pool fully utilized with 10 queued requests: all eventually processed"
        - "Pool exhausted with long transactions: timed-out requests get 503"
        - "50 sequential query timeouts: all connections returned, no leaks"
        - "Network disconnects mid-transaction: pool heals stale connections"
    - rule_name: "Deadlock handling"
      examples:
        - "Classic AB-BA deadlock: detected, one victim retried, both eventually succeed"
        - "50 random transfers with retry limit: no infinite retry loops"
        - "Bidirectional transfers with forced deadlock: total money conserved"
        - "100 random transfers across 5 accounts with deadlocks: total balance unchanged"
    - rule_name: "Partial failure resilience"
      examples:
        - "Bank timeout: transaction marked pending, no charge without confirmation"
        - "Bank connection refused: clean failure, 502 response, no charge"
        - "Bank approves after gateway timeout: no double charge, reconciliation entry created"
        - "200 concurrent with 50% bank timeout: clean separation of success/failure"
        - "100% bank failure: circuit breaker opens, fast-fail for subsequent requests"
    - rule_name: "Double-charge prevention"
      examples:
        - "Bank charges but response lost: retry returns cached result, no duplicate charge"
        - "5 concurrent retries with same idempotency key: exactly one charge"
        - "Missing idempotency key on retry: flagged for manual review, auto-charge blocked"
        - "Expired idempotency key: treated as new request"
    - rule_name: "Graceful degradation"
      examples:
        - "79% capacity: all requests accepted regardless of priority"
        - "85% capacity: low priority shed (429), high priority accepted"
        - "95% capacity: only critical requests accepted"
        - "110% capacity: even critical may be queued, system does not crash"
        - "Sustained overload 5 minutes: no memory leak, queue depth bounded"
        - "Recovery from overload: traffic readmission is gradual, no thundering herd"
    - rule_name: "Circuit breaker behavior"
      examples:
        - "4 consecutive bank failures: circuit stays closed"
        - "5th failure: circuit opens, subsequent requests fast-fail in < 10ms"
        - "Open circuit timeout + healthy bank: transitions closed via half-open"
        - "Half-open probe fails: circuit returns to open"
    - rule_name: "Post-transaction reconciliation"
      examples:
        - "1000 mixed-outcome transactions: gateway count matches bank count, zero orphans"
        - "Complex failure mix (deadlocks + timeouts + partial failures): money in equals money out"

