      Consequence: 3 - Indeterminate transaction state risks double charges.
      Detectability: 2 - Timeout failures are detectable but state may be ambiguous.
      Average: 2.75 -> high.
    techniques:
      - decision_table
      - state_transition
      - error_guessing
    technique_rationale: >
      DT covers combinations of gateway state and bank state to determine
      the correct outcome. ST models the transaction lifecycle through
      partial failure states. EG anticipates edge cases like bank responding
      after gateway timeout.
    preconditions:
      - "Bank simulator with configurable failure modes"
      - "Gateway timeout configured (e.g., 10 seconds)"
      - "Transaction state store (for pending/retry tracking)"
      - "Idempotency keys enabled for all transactions"
    examples:
      - input:
          payment_amount: 100.00
          bank_response_delay_ms: 15000
          gateway_timeout_ms: 10000
        expected:
          customer_response: "payment_pending_or_failed"
          transaction_state: "pending_verification"
          no_charge_without_confirmation: true
          retry_scheduled: true
        description: "Bank timeout - verify transaction marked as pending, not charged"
      - input:
          payment_amount: 100.00
