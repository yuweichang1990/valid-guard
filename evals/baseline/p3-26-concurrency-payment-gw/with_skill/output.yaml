          money_not_captured: true
        description: "Bank connection refused - verify clean failure, no charge"
      - input:
          payment_amount: 100.00
          bank_responds_after_gateway_timeout: true
          bank_response_delay_ms: 12000
          gateway_timeout_ms: 10000
          bank_response: "approved"
        expected:
          late_approval_handled: true
          no_double_charge: true
          reconciliation_entry_created: true
        description: "Bank approves AFTER gateway timeout - verify no double charge on retry"
    state_transition:
      states:
        - "payment_initiated"
        - "bank_request_sent"
        - "bank_timeout"
        - "bank_error"
        - "bank_approved"
        - "bank_declined"
        - "pending_verification"
        - "payment_completed"
        - "payment_failed"
        - "payment_refunded"
      transitions:
        - from: "payment_initiated"
          to: "bank_request_sent"
          trigger: "gateway sends authorization to bank"
          guard: "request validation passed"
        - from: "bank_request_sent"
          to: "bank_timeout"
          trigger: "bank does not respond within timeout"
          guard: "elapsed time > gateway_timeout"
        - from: "bank_request_sent"
          to: "bank_error"
          trigger: "bank returns error or connection fails"
          guard: "HTTP 5xx or connection error"
        - from: "bank_request_sent"
          to: "bank_approved"
          trigger: "bank returns approval"
          guard: "HTTP 200 with approved status"
        - from: "bank_request_sent"
          to: "bank_declined"
          trigger: "bank declines transaction"
          guard: "HTTP 200 with declined status"
        - from: "bank_timeout"
          to: "pending_verification"
          trigger: "gateway marks for async verification"
          guard: "retry policy allows"
        - from: "bank_error"
          to: "payment_failed"
          trigger: "gateway marks as failed"
          guard: "non-retryable error or max retries exceeded"
        - from: "bank_approved"
          to: "payment_completed"
          trigger: "gateway confirms payment"
          guard: "idempotency check passes"
        - from: "bank_declined"
          to: "payment_failed"
          trigger: "gateway marks as declined"
          guard: "decline reason is final"
        - from: "pending_verification"
          to: "payment_completed"
          trigger: "async verification confirms charge"
          guard: "bank confirms the charge was applied"
        - from: "pending_verification"
          to: "payment_refunded"
          trigger: "async verification finds charge applied but customer was told failure"
          guard: "charge confirmed after customer received error"
    decision_table:
      conditions:
        - "gateway_status"
        - "bank_status"
        - "network_connectivity"
      actions:
        - "customer_response"
        - "transaction_final_state"
        - "retry_action"
        - "reconciliation_required"
      rules:
        - description: "Gateway up, bank up, network ok - normal processing"
          condition_values:
            gateway_status: "healthy"
            bank_status: "responding"
            network_connectivity: "stable"
          expected_actions:
            customer_response: "success_or_decline"
            transaction_final_state: "completed_or_declined"
            retry_action: "none"
            reconciliation_required: false
        - description: "Gateway up, bank timeout, network ok"
          condition_values:
            gateway_status: "healthy"
            bank_status: "timeout"
            network_connectivity: "stable"
          expected_actions:
            customer_response: "pending"
            transaction_final_state: "pending_verification"
            retry_action: "async_retry"
            reconciliation_required: true
        - description: "Gateway up, bank down, network ok"
          condition_values:
            gateway_status: "healthy"
            bank_status: "down"
            network_connectivity: "stable"
          expected_actions:
            customer_response: "service_unavailable"
            transaction_final_state: "failed"
            retry_action: "customer_retry_later"
            reconciliation_required: false
        - description: "Gateway up, bank up, network degraded"
          condition_values:
            gateway_status: "healthy"
            bank_status: "responding"
            network_connectivity: "degraded"
          expected_actions:
            customer_response: "may_be_delayed"
            transaction_final_state: "depends_on_timeout"
            retry_action: "automatic_retry_with_backoff"
            reconciliation_required: true
        - description: "Gateway up, bank intermittent, network ok"
