  - name: "OTP resend on user request"
    description: >
      User requests a new OTP. The previous OTP is invalidated and a fresh one
      is generated and delivered. Resend is rate-limited.
    type: happy_path
    risk: medium
    risk_rationale: >
      Impact: 2, Frequency: 2, Consequence: 2, Detectability: 2.
      Average: 2.0 -> medium. Resend is a common recovery flow but not on every
