  - name: "Cancellation window boundary at exactly 30 minutes"
    description: >
      Tests the exact boundary of the 30-minute cancellation window. The guard
      condition is time_since_confirm < 30 minutes (strict less-than), so
      exactly 30 minutes should be rejected while 29 minutes 59 seconds should
      be the last acceptable moment.
    type: boundary
    risk: high
    risk_rationale: "Impact: 3, Frequency: 2, Consequence: 3, Detectability: 1. Average: 2.25 -> medium. Upgrading to high because incorrect boundary handling could allow late cancellations or deny valid ones, both having financial impact."
    techniques:
      - boundary_value
      - state_transition
    technique_rationale: >
      Boundary value analysis at the 30-minute threshold: 29m59s (last valid),
      30m00s (first invalid), 30m01s (just beyond). Tests the strict less-than
      guard semantics.
    preconditions:
      - "Order is in confirmed state"
    examples:
      - input:
          current_state: "confirmed"
          trigger: "customer_cancel_request"
          time_since_confirm_seconds: 1799
        expected:
          new_state: "cancelled"
          refund_initiated: true
        description: "BVA: 29 minutes 59 seconds (last valid second before boundary)."
      - input:
          current_state: "confirmed"
          trigger: "customer_cancel_request"
          time_since_confirm_seconds: 1800
        expected:
          error: "CANCELLATION_WINDOW_EXPIRED"
          state_unchanged: true
        description: "BVA: Exactly 30 minutes (on-point for boundary, guard fails with strict <)."
      - input:
          current_state: "confirmed"
          trigger: "customer_cancel_request"
          time_since_confirm_seconds: 1801
        expected:
          error: "CANCELLATION_WINDOW_EXPIRED"
          state_unchanged: true
        description: "BVA: 30 minutes 1 second (just past boundary, clearly rejected)."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - boundary
      - cancellation
      - time-constraint
      - critical-path

