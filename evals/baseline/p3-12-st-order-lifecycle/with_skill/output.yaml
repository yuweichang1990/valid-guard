# Valid Guard Test Plan — Order Lifecycle State Machine
# Generated: 2026-03-14T09:00:00Z
# Source: natural language

feature: "Order Lifecycle State Machine"

feature_description: >
  Complete order lifecycle management for an online store. Orders progress
  through a linear state machine: cart -> pending_payment -> payment_processing
  -> confirmed -> preparing -> shipped -> delivered. The system supports
  cancellation from the confirmed state within a 30-minute window, refund
  requests from the delivered state within 30 days, and automatic payment
  retry with up to 3 attempts before auto-cancellation. Guard conditions
  constrain time-limited and retry-limited transitions.

risk_level: high

entry_point: greenfield

source:
  type: natural_language
  path: ""

scenarios:
  # ==========================================================================
  # HAPPY PATH — Forward State Transitions
  # ==========================================================================
  - name: "Complete order lifecycle from cart to delivered"
    description: >
      Verifies the full happy-path progression through every state in sequence:
      cart -> pending_payment -> payment_processing -> confirmed -> preparing
      -> shipped -> delivered. Each transition fires on its correct trigger
      event and the order arrives at the terminal delivered state.
    type: state_transition
    risk: high
    risk_rationale: "Impact: 3, Frequency: 3, Consequence: 3, Detectability: 2. Average: 2.75 -> high. This is the core revenue path; every successful order must traverse these states."
    techniques:
      - state_transition
      - equivalence_partitioning
    technique_rationale: >
      State transition covers the sequential state machine traversal. Equivalence
      partitioning validates a representative order from the valid-order class
      traversing the entire chain.
    preconditions:
      - "Customer is authenticated"
      - "Cart contains at least one in-stock item"
      - "Payment method is valid and funded"
    state_transition:
      states:
        - cart
        - pending_payment
        - payment_processing
        - confirmed
        - preparing
        - shipped
        - delivered
      transitions:
        - from: cart
          to: pending_payment
          trigger: "checkout_initiated"
          guard: "cart is non-empty and all items are in stock"
        - from: pending_payment
          to: payment_processing
          trigger: "payment_submitted"
          guard: "valid payment method provided"
        - from: payment_processing
          to: confirmed
          trigger: "payment_captured"
          guard: "payment gateway returns success"
        - from: confirmed
          to: preparing
          trigger: "warehouse_acknowledged"
          guard: "warehouse confirms inventory allocation"
        - from: preparing
          to: shipped
          trigger: "tracking_number_assigned"
          guard: "carrier accepts package and issues tracking number"
        - from: shipped
          to: delivered
          trigger: "delivery_confirmed"
          guard: "delivery proof obtained (signature or photo)"
    examples:
      - input:
          initial_state: "cart"
          events:
            - "checkout_initiated"
            - "payment_submitted"
            - "payment_captured"
            - "warehouse_acknowledged"
            - "tracking_number_assigned"
            - "delivery_confirmed"
        expected:
          final_state: "delivered"
          transitions_count: 6
        description: "Full happy-path traversal from cart to delivered with all 6 transitions."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - state-machine
      - critical-path
      - smoke
      - happy-path

