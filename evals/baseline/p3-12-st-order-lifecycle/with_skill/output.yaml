  # ==========================================================================
  # PAYMENT FAILURE & RETRY MECHANISM
  # ==========================================================================
  - name: "Payment failure with retry (payment_processing to pending_payment, retry_count < 3)"
    description: >
      When payment fails and the retry count is below the maximum of 3,
      the order transitions back to pending_payment, allowing the customer
      to retry. The guard condition enforces retry_count < 3.
    type: state_transition
    risk: high
    risk_rationale: "Impact: 3, Frequency: 2, Consequence: 3, Detectability: 2. Average: 2.50 -> high. Payment retry logic directly impacts revenue recovery and customer experience."
    techniques:
      - state_transition
      - boundary_value
    technique_rationale: >
      State transition models the retry loop. Boundary value analysis tests
      the retry_count threshold at 0, 1, 2 (valid retries) and 3 (auto-cancel boundary).
    preconditions:
      - "Order is in payment_processing state"
      - "Payment attempt has failed"
    state_transition:
      states:
        - payment_processing
        - pending_payment
        - cancelled
      transitions:
        - from: payment_processing
          to: pending_payment
          trigger: "payment_failed"
          guard: "retry_count < 3"
        - from: payment_processing
          to: cancelled
          trigger: "payment_failed"
          guard: "retry_count >= 3"
    examples:
      - input:
          current_state: "payment_processing"
          trigger: "payment_failed"
          retry_count: 0
          failure_reason: "insufficient_funds"
        expected:
          new_state: "pending_payment"
          retry_count_after: 1
          retry_allowed: true
          customer_notified: true
        description: "First payment failure (retry_count=0) -> returns to pending_payment for retry."
      - input:
          current_state: "payment_processing"
          trigger: "payment_failed"
          retry_count: 1
          failure_reason: "card_declined"
        expected:
          new_state: "pending_payment"
          retry_count_after: 2
          retry_allowed: true
        description: "Second payment failure (retry_count=1) -> still allowed to retry."
      - input:
          current_state: "payment_processing"
          trigger: "payment_failed"
          retry_count: 2
          failure_reason: "gateway_error"
        expected:
          new_state: "pending_payment"
          retry_count_after: 3
          retry_allowed: true
        description: "Third payment failure (retry_count=2, boundary on-point for < 3) -> last retry allowed."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - state-machine
      - payment
      - retry
      - boundary

  - name: "Payment failure auto-cancellation (retry_count >= 3)"
    description: >
      When payment fails and the retry count has reached or exceeded 3,
      the order is automatically cancelled. The guard condition retry_count >= 3
      triggers the transition to the cancelled terminal state.
    type: state_transition
    risk: high
    risk_rationale: "Impact: 3, Frequency: 2, Consequence: 3, Detectability: 1. Average: 2.25 -> medium. But upgrading to high because auto-cancellation is a silent terminal action; the customer may not realize the order was lost."
    techniques:
      - state_transition
      - boundary_value
      - error_guessing
    technique_rationale: >
      State transition models the auto-cancel path. Boundary value tests the
      exact threshold (retry_count=3 as on-point). Error guessing considers
      edge cases like retry_count exceeding 3 due to race conditions.
    preconditions:
      - "Order is in payment_processing state"
      - "retry_count has reached 3"
    state_transition:
      states:
        - payment_processing
        - cancelled
      transitions:
        - from: payment_processing
          to: cancelled
          trigger: "payment_failed"
          guard: "retry_count >= 3"
    examples:
      - input:
          current_state: "payment_processing"
          trigger: "payment_failed"
          retry_count: 3
        expected:
          new_state: "cancelled"
          cancellation_reason: "payment_failures_exhausted"
          customer_notified: true
          payment_holds_released: true
        description: "Exactly 3 retries exhausted (boundary on-point for >= 3) -> auto-cancelled."
      - input:
          current_state: "payment_processing"
          trigger: "payment_failed"
          retry_count: 4
        expected:
          new_state: "cancelled"
          cancellation_reason: "payment_failures_exhausted"
        description: "retry_count=4 (above threshold, guard still satisfied) -> auto-cancelled."
      - input:
          current_state: "payment_processing"
          trigger: "payment_failed"
          retry_count: 100
        expected:
          new_state: "cancelled"
          cancellation_reason: "payment_failures_exhausted"
        description: "Extreme retry count (error guessing: possible race condition) -> still auto-cancels cleanly."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - state-machine
      - payment
      - auto-cancel
      - boundary

  - name: "Payment retry boundary at threshold (retry_count = 2 vs 3)"
    description: >
      Tests the exact boundary between retry-allowed and auto-cancel behavior.
      At retry_count=2, the next failure should allow one more retry. At
      retry_count=3, the next failure should auto-cancel. This is the critical
      off-by-one boundary in the retry logic.
    type: boundary
    risk: high
    risk_rationale: "Impact: 3, Frequency: 2, Consequence: 3, Detectability: 1. Average: 2.25 -> medium. Upgrading to high because an off-by-one in retry logic could silently cancel orders one attempt too early or allow infinite retries."
    techniques:
      - boundary_value
      - state_transition
    technique_rationale: >
      Boundary value analysis targets the exact threshold. The retry_count=2
      is the last on-point for the < 3 guard, and retry_count=3 is the first
      on-point for the >= 3 guard.
    preconditions:
      - "Order is in payment_processing state"
    examples:
      - input:
          current_state: "payment_processing"
          trigger: "payment_failed"
          retry_count: 2
        expected:
          new_state: "pending_payment"
          can_retry: true
        description: "BVA on-point for < 3: retry_count=2 allows retry (last chance)."
      - input:
          current_state: "payment_processing"
          trigger: "payment_failed"
          retry_count: 3
        expected:
          new_state: "cancelled"
          can_retry: false
        description: "BVA on-point for >= 3: retry_count=3 triggers auto-cancel."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - boundary
      - payment
      - retry
      - critical-path

  # ==========================================================================
  # CANCELLATION (from confirmed, within 30 minutes)
  # ==========================================================================
  - name: "Order cancellation within 30-minute window"
    description: >
      A customer can cancel a confirmed order within 30 minutes of confirmation.
      The guard condition time_since_confirm < 30min must be satisfied. Upon
      cancellation, the order transitions to cancelled state and a refund is
      initiated.
    type: state_transition
    risk: high
    risk_rationale: "Impact: 3, Frequency: 2, Consequence: 3, Detectability: 2. Average: 2.50 -> high. Cancellation directly impacts financial transactions and customer satisfaction."
    techniques:
      - state_transition
      - boundary_value
    technique_rationale: >
      State transition models the cancellation path from confirmed to cancelled.
      Boundary value analysis tests the 30-minute time window at its edges.
    preconditions:
      - "Order is in confirmed state"
      - "Customer is authenticated and is the order owner"
    state_transition:
      states:
        - confirmed
        - cancelled
      transitions:
        - from: confirmed
          to: cancelled
          trigger: "customer_cancel_request"
          guard: "time_since_confirm < 30 minutes"
    examples:
      - input:
          current_state: "confirmed"
          trigger: "customer_cancel_request"
          time_since_confirm_minutes: 0
        expected:
          new_state: "cancelled"
          refund_initiated: true
        description: "Immediate cancellation (0 minutes) -> allowed."
      - input:
          current_state: "confirmed"
          trigger: "customer_cancel_request"
          time_since_confirm_minutes: 15
        expected:
