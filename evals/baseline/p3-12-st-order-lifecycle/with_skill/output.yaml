    techniques:
      - state_transition
    technique_rationale: "State transition testing validates individual state changes with correct trigger and guard evaluation."
    preconditions:
      - "Order is in cart state"
      - "Cart has at least one valid in-stock item"
    state_transition:
      states:
        - cart
        - pending_payment
      transitions:
        - from: cart
          to: pending_payment
          trigger: "checkout_initiated"
          guard: "cart is non-empty and all items are in stock"
    examples:
      - input:
          current_state: "cart"
          trigger: "checkout_initiated"
          cart_items: 3
          all_in_stock: true
