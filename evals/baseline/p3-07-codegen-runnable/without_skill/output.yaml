  # TestConstants
  # =========================================================================

  class TestConstants:
      """Verify module-level constants."""

      def test_tax_rate(self):
          assert OrderProcessor.TAX_RATE == Decimal("0.08")

      def test_free_shipping_threshold(self):
          assert OrderProcessor.FREE_SHIPPING_THRESHOLD == Decimal("50.00")

      def test_shipping_fee(self):
          assert OrderProcessor.SHIPPING_FEE == Decimal("5.99")

      def test_max_items_per_order(self):
          assert OrderProcessor.MAX_ITEMS_PER_ORDER == 100

      def test_refund_window_days(self):
          assert OrderProcessor.REFUND_WINDOW_DAYS == 30


  # =========================================================================
  # TestEdgeCases
  # =========================================================================

  class TestEdgeCases:
      """Additional edge-case and integration scenarios."""

      def test_multiple_orders_independent(self, processor):
          processor.create_order("ORD-1", {"widget": 1})
          processor.create_order("ORD-2", {"gadget": 1})
          processor.transition_status("ORD-1", OrderStatus.CANCELLED)
          assert processor.orders["ORD-2"]["status"] == OrderStatus.PENDING

      def test_create_order_depletes_then_restores_on_cancel(self, processor):
          processor.create_order("ORD-1", {"widget": 10})
          assert processor.inventory["widget"] == 0
          with pytest.raises(InsufficientStockError):
              processor.create_order("ORD-2", {"widget": 1})
          processor.transition_status("ORD-1", OrderStatus.CANCELLED)
          assert processor.inventory["widget"] == 10
          # Now can create order again
          order = processor.create_order("ORD-2", {"widget": 5})
          assert order["status"] == OrderStatus.PENDING

      def test_refund_restores_inventory_for_reuse(self, delivered_order):
          orig = delivered_order.inventory.get("gadget", 0)
          delivered_order.request_refund("ORD-1")
          assert delivered_order.inventory["gadget"] == orig + 3
          # Inventory is available for new orders
          order = delivered_order.create_order("ORD-2", {"gadget": 1})
          assert order["status"] == OrderStatus.PENDING

      def test_order_with_single_item_quantity_one(self, processor):
          order = processor.create_order("ORD-1", {"gizmo": 1})
          assert order["subtotal"] == Decimal("3.50")
          assert order["shipping"] == Decimal("5.99")
          expected_total = Decimal("3.50") + Decimal("3.50") * Decimal("0.08") + Decimal("5.99")
          assert order["total"] == expected_total

      def test_discount_then_verify_total_with_shipping(self, processor):
          """Apply a discount that drops subtotal below threshold, verify full recalc."""
          processor.create_order("ORD-1", {"gadget": 2})  # subtotal=50, free shipping
          order = processor.apply_discount("ORD-1", Decimal("50"))
          # new subtotal = 25, below threshold
          assert order["subtotal"] == Decimal("25.000")
          assert order["shipping"] == Decimal("5.99")
          expected = Decimal("25.000") + Decimal("25.000") * Decimal("0.08") + Decimal("5.99")
          assert order["total"] == expected
