  # ==========================================================================
  # S6 — Order State Transition (Cross-Cutting)
  # ==========================================================================
  - name: "Order state transitions across all payment failure types"
    description: >
      Comprehensive state transition testing for the order lifecycle covering
      all five failure types and their respective state outcomes. Validates
      that each failure type transitions the order to the correct state and
      that invalid transitions are rejected.
    type: state_transition
    risk: high
    risk_rationale: >
      Impact: 3 — order integrity across all failure types.
      Frequency: 3 — every payment failure triggers a state transition.
      Consequence: 3 — invalid states cause data corruption and stuck orders.
      Detectability: 2 — some invalid states are caught by monitoring, others are silent.
      Average: 2.75 → high.
    techniques:
      - state_transition
      - decision_table
    technique_rationale: >
      State transition provides 0-switch and 1-switch coverage of the order
      state machine. Decision table maps failure type to expected state.
    preconditions:
      - "Order exists in the system"
    examples:
      - input:
          current_state: "payment_processing"
          failure_type: "insufficient_funds"
        expected:
          new_state: "payment_failed"
          can_retry: true
        description: "Insufficient funds → payment_failed (retryable)."
      - input:
          current_state: "payment_processing"
          failure_type: "declined_card"
        expected:
          new_state: "payment_failed"
          can_retry: true
        description: "Declined card → payment_failed (retryable)."
      - input:
          current_state: "payment_processing"
          failure_type: "network_timeout"
          retry_count: 0
        expected:
          new_state: "retry_pending"
          can_retry: true
        description: "Network timeout (first) → retry_pending."
      - input:
          current_state: "payment_processing"
          failure_type: "network_timeout"
          retry_count: 3
        expected:
          new_state: "payment_timeout"
          can_retry: false
        description: "Network timeout (max retries) → payment_timeout."
      - input:
          current_state: "payment_processing"
          failure_type: "threeds_auth_failure"
        expected:
          new_state: "awaiting_authentication"
          can_retry: true
        description: "3DS failure → awaiting_authentication (re-auth allowed)."
      - input:
          current_state: "payment_processing"
          failure_type: "fraud_rejection"
        expected:
          new_state: "manual_review"
          can_retry: false
        description: "Fraud rejection → manual_review (not retryable by user)."
      - input:
          current_state: "confirmed"
          failure_type: "insufficient_funds"
        expected:
          error: "INVALID_STATE_TRANSITION"
          state_unchanged: true
        description: "Invalid transition — cannot fail payment on an already confirmed order."
    state_transition:
      states:
        - "cart"
        - "pending_payment"
        - "payment_processing"
        - "payment_failed"
        - "retry_pending"
        - "payment_timeout"
        - "awaiting_authentication"
        - "manual_review"
        - "confirmed"
        - "cancelled"
      transitions:
        - from: "cart"
          to: "pending_payment"
          trigger: "checkout_initiated"
        - from: "pending_payment"
          to: "payment_processing"
          trigger: "payment_submitted"
        - from: "payment_processing"
          to: "payment_failed"
          trigger: "insufficient_funds_or_card_declined"
        - from: "payment_processing"
          to: "retry_pending"
          trigger: "network_timeout"
          guard: "retry_count < 3"
        - from: "retry_pending"
          to: "payment_processing"
          trigger: "backoff_elapsed"
        - from: "payment_processing"
          to: "payment_timeout"
          trigger: "network_timeout"
          guard: "retry_count >= 3"
        - from: "payment_processing"
          to: "awaiting_authentication"
          trigger: "threeds_auth_failure"
        - from: "awaiting_authentication"
          to: "payment_processing"
          trigger: "user_re_authenticates"
        - from: "payment_processing"
          to: "manual_review"
          trigger: "fraud_check_rejected"
        - from: "payment_failed"
          to: "payment_processing"
          trigger: "user_retries_payment"
        - from: "payment_processing"
          to: "confirmed"
          trigger: "payment_captured"
        - from: "payment_timeout"
          to: "cancelled"
          trigger: "timeout_expiry"
          guard: "no pending charges found"
    decision_table:
      conditions:
        - "failure_type"
        - "retry_count"
      actions:
        - "target_state"
        - "user_can_retry"
        - "backend_action"
      rules:
        - description: "Insufficient funds failure"
          condition_values:
            failure_type: "insufficient_funds"
            retry_count: "any"
          expected_actions:
            target_state: "payment_failed"
            user_can_retry: true
            backend_action: "rollback"
        - description: "Declined card failure"
          condition_values:
            failure_type: "declined_card"
            retry_count: "any"
          expected_actions:
            target_state: "payment_failed"
            user_can_retry: true
            backend_action: "rollback"
        - description: "Network timeout — retries remaining"
          condition_values:
            failure_type: "network_timeout"
            retry_count: "<3"
          expected_actions:
            target_state: "retry_pending"
            user_can_retry: false
            backend_action: "retry_with_backoff"
        - description: "Network timeout — max retries exhausted"
          condition_values:
            failure_type: "network_timeout"
            retry_count: ">=3"
          expected_actions:
            target_state: "payment_timeout"
            user_can_retry: false
            backend_action: "rollback"
        - description: "3DS authentication failure"
          condition_values:
            failure_type: "threeds_auth_failure"
            retry_count: "any"
          expected_actions:
            target_state: "awaiting_authentication"
            user_can_retry: true
            backend_action: "hold_for_re_auth"
        - description: "Fraud check rejection"
          condition_values:
            failure_type: "fraud_rejection"
            retry_count: "any"
          expected_actions:
            target_state: "manual_review"
            user_can_retry: false
            backend_action: "flag_for_review"
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - payment
      - state-machine
      - critical-path
      - cross-cutting

  # ==========================================================================
  # S7 — No Double Charges (Cross-Cutting)
  # ==========================================================================
  - name: "No double charges during payment retries"
    description: >
      Across all retry scenarios (network timeout retries, user-initiated
      retries after decline, 3DS re-authentication), the system must guarantee
      that at most one charge is captured for a given order. This includes
      concurrent retry attempts and race conditions.
    type: security
    risk: high
    risk_rationale: >
      Impact: 3 — financial integrity, direct monetary loss.
      Frequency: 3 — retries happen across multiple failure types.
      Consequence: 3 — double charges require refunds, erode trust, may violate regulations.
      Detectability: 3 — double charges are often silent until customer reviews statement.
      Average: 3.0 → high.
    techniques:
      - error_guessing
      - cause_effect
      - state_transition
    technique_rationale: >
      Error guessing targets known concurrency and race conditions in payment
      processing. Cause-effect maps the relationship between concurrent requests
      and charge outcomes. State transition validates that only one path leads
      to charge capture.
    preconditions:
      - "Idempotency key system is in place"
      - "Payment gateway supports idempotent requests"
    examples:
      - input:
          scenario: "concurrent_retry"
          retry_request_1: "in_flight"
          retry_request_2: "in_flight"
          idempotency_key: "idem-concurrent-001"
        expected:
          total_charges: 1
          second_request_result: "idempotent_response"
          double_charge: false
        description: "Two concurrent retry requests — only one charge via idempotency."
      - input:
          scenario: "user_rapid_click"
          click_count: 3
          debounce_active: true
          idempotency_key: "idem-click-001"
        expected:
          payment_requests_sent: 1
          total_charges: 1
          double_charge: false
        description: "User clicks pay multiple times rapidly — client debounce prevents duplicates."
      - input:
          scenario: "3ds_re_auth_then_original_succeeds"
          original_auth_delayed: true
          re_auth_succeeds: true
          idempotency_key: "idem-3ds-001"
        expected:
          total_charges: 1
          double_charge: false
        description: "3DS re-auth succeeds while delayed original also completes — only one charge."
      - input:
          scenario: "network_retry_original_late_success"
          timeout_retry_succeeds: true
          original_request_late_success: true
          idempotency_key: "idem-late-001"
        expected:
          total_charges: 1
          reconciliation_entry_created: true
          double_charge: false
        description: "Retry succeeds and original late-arrives — idempotency prevents double charge."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - payment
      - no-double-charge
      - idempotency
      - concurrency
      - critical-path

  - name: "No double charges — client-side debounce on payment submission"
    description: >
      The payment submission UI must debounce rapid repeated clicks on the pay
      button to prevent multiple payment requests from being sent. Even if
      debounce fails, the server-side idempotency key must prevent double
      charges.
    type: edge_case
    risk: high
    risk_rationale: >
      Impact: 3 — financial integrity.
      Frequency: 3 — impatient users commonly double-click.
      Consequence: 3 — double charge.
      Detectability: 2 — user may or may not notice the double charge.
      Average: 2.75 → high.
    techniques:
      - error_guessing
      - boundary_value
    technique_rationale: >
      Error guessing targets the common user behavior of rapid clicking.
      Boundary value tests the debounce timing threshold.
    preconditions:
      - "Payment form is displayed to user"
      - "Pay button is enabled"
    examples:
      - input:
          clicks: 1
          time_between_clicks_ms: 0
        expected:
          requests_sent: 1
          button_disabled_after_first_click: true
        description: "Single click — normal flow."
      - input:
          clicks: 5
          time_between_clicks_ms: 50
        expected:
          requests_sent: 1
          button_disabled_after_first_click: true
          total_charges: 1
        description: "Five rapid clicks within 250ms — only one request sent."
      - input:
          clicks: 2
          time_between_clicks_ms: 100
          debounce_fails: true
        expected:
          requests_sent: 2
          total_charges: 1
          idempotency_key_prevents_duplicate: true
        description: "Debounce fails, two requests sent — server-side idempotency prevents double charge."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - payment
      - no-double-charge
      - ui
      - debounce
      - edge-case

  # ==========================================================================
  # S8 — User-Visible Messages (Cross-Cutting)
  # ==========================================================================
  - name: "User-visible messages are correct for each failure type"
    description: >
      Validates that each payment failure type produces the correct user-facing
      message. Messages must be clear, actionable, and must NOT reveal internal
      system details, especially for fraud rejections.
    type: combinatorial
    risk: high
    risk_rationale: >
      Impact: 3 — user experience and security (fraud info leakage).
      Frequency: 3 — every payment failure produces a message.
      Consequence: 2 — wrong message is confusing but not financial loss (except fraud leakage).
      Detectability: 1 — messages are immediately visible to users.
      Average: 2.25 → medium. Elevated to high due to fraud information leakage risk.
    techniques:
      - decision_table
      - equivalence_partitioning
    technique_rationale: >
      Decision table maps each failure type to its expected message. Equivalence
      partitioning ensures all failure categories are covered.
    preconditions:
      - "Payment has failed for a known reason"
    examples:
      - input:
          failure_type: "insufficient_funds"
        expected:
          user_message: "Your card does not have sufficient funds. Please try a different card or payment method."
          contains_internal_details: false
        description: "Insufficient funds message — actionable, suggests alternative."
      - input:
          failure_type: "declined_card"
          decline_reason_available: true
          decline_reason: "card_expired"
        expected:
          user_message: "Your card has expired. Please update your card details or contact your bank."
          contains_internal_details: false
        description: "Declined card with specific reason — reason shown."
      - input:
          failure_type: "network_timeout"
          retries_exhausted: true
        expected:
          user_message: "We were unable to process your payment due to a temporary issue. Please try again shortly."
          contains_internal_details: false
        description: "Network timeout — generic temporary issue message."
      - input:
          failure_type: "threeds_auth_failure"
          failure_reason: "incorrect_otp"
        expected:
          user_message: "Authentication failed. Please try again with the correct verification code."
          contains_internal_details: false
        description: "3DS failure — prompt to retry authentication."
      - input:
          failure_type: "fraud_rejection"
        expected:
          user_message: "We are unable to process your payment at this time. Please try again later or contact support."
          contains_internal_details: false
          contains_fraud_keywords: false
        description: "Fraud rejection — generic message, no fraud-related language."
    decision_table:
      conditions:
        - "failure_type"
        - "specific_reason_available"
      actions:
        - "message_template"
        - "suggest_alternative_method"
        - "suggest_contact_bank"
        - "reveal_internal_details"
