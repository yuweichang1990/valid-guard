      - decision-table
      - cross-cutting

  # ==========================================================================
  # S10 — Error Handling Edge Cases
  # ==========================================================================
  - name: "Payment gateway returns unknown error code"
    description: >
      The payment gateway returns an error code not in the known set of failure
      types. The system must handle this gracefully with a generic error
      message, log the unknown code for investigation, and transition the
      order to a safe state.
    type: error_handling
    risk: medium
    risk_rationale: >
      Impact: 2 — unknown errors need handling but are not a core flow.
      Frequency: 1 — rare, only when gateway sends unexpected codes.
      Consequence: 2 — unhandled error could crash or leave order in limbo.
      Detectability: 2 — user sees an error, ops may miss in logs.
      Average: 1.75 → medium.
    techniques:
      - equivalence_partitioning
      - error_guessing
    technique_rationale: >
      Equivalence partitioning treats unknown codes as a distinct invalid class.
      Error guessing anticipates gateway API changes introducing new codes.
    preconditions:
      - "Payment gateway is reachable"
      - "Gateway returns a code not in the known mapping"
    examples:
      - input:
          gateway_error_code: "UNKNOWN_XYZ_999"
          gateway_error_message: "Unrecognized internal error"
        expected:
          user_message: "We encountered an unexpected issue processing your payment. Please try again or contact support."
          order_state: "payment_failed"
          unknown_error_logged: true
          alert_triggered: true
        description: "Unknown error code — generic message, logged and alerted."
      - input:
          gateway_error_code: null
          gateway_error_message: null
        expected:
          user_message: "We encountered an unexpected issue processing your payment. Please try again or contact support."
          order_state: "payment_failed"
          null_response_logged: true
        description: "Null error code from gateway — handled gracefully."
    test_ref: ""
    status: uncovered
    priority: 2
    tags:
      - payment
      - error-handling
      - unknown-errors
      - defensive-coding

  - name: "Multiple failure types in sequence for the same order"
    description: >
      A single order experiences multiple failure types in sequence (e.g.,
      network timeout on first attempt, then insufficient funds on retry with
      new card). The system must handle the state transitions correctly and
      maintain accurate audit trail.
    type: edge_case
    risk: medium
    risk_rationale: >
      Impact: 2 — edge case in order lifecycle.
      Frequency: 1 — uncommon to have multiple distinct failure types.
      Consequence: 2 — state confusion could leave order stuck.
      Detectability: 2 — visible if order gets stuck, but root cause is hard to trace.
      Average: 1.75 → medium.
    techniques:
      - state_transition
      - error_guessing
    technique_rationale: >
      State transition validates multi-hop paths through the state machine.
      Error guessing anticipates state corruption from sequential failures.
    preconditions:
      - "Order has already experienced at least one payment failure"
    examples:
      - input:
          failure_sequence:
            - type: "network_timeout"
              retry_count: 3
            - type: "insufficient_funds"
              payment_method: "card_A"
            - type: "declined_card"
              payment_method: "card_B"
        expected:
          final_state: "payment_failed"
          total_charges: 0
          audit_trail_entries: 3
          cart_preserved: true
        description: "Three sequential failures with different types — no charge, full audit trail."
      - input:
          failure_sequence:
            - type: "threeds_auth_failure"
              auth_attempts: 2
            - type: "network_timeout"
              retry_count: 1
              retry_succeeds: true
        expected:
          final_state: "confirmed"
          total_charges: 1
          audit_trail_entries: 2
        description: "3DS failure followed by timeout retry that succeeds — order eventually confirmed."
    test_ref: ""
    status: uncovered
    priority: 2
    tags:
      - payment
      - edge-case
      - sequential-failures
      - state-machine

  - name: "Inventory hold expiration during payment failure recovery"
    description: >
      While the user is recovering from a payment failure (choosing a new card,
      re-authenticating 3DS), the inventory hold on their items may expire.
      The system must check inventory availability before re-attempting payment.
    type: edge_case
    risk: medium
    risk_rationale: >
      Impact: 2 — user experience, potential overselling.
      Frequency: 2 — depends on hold duration and recovery time.
      Consequence: 2 — overselling requires cancellation and refund.
      Detectability: 1 — user would see out-of-stock error on retry.
      Average: 1.75 → medium.
    techniques:
      - state_transition
      - error_guessing
    technique_rationale: >
      State transition covers the hold lifecycle. Error guessing anticipates
      the race condition between hold expiry and payment retry.
    preconditions:
      - "Order has an inventory hold on items"
      - "Payment has failed and user is recovering"
    examples:
      - input:
          hold_duration_minutes: 15
          recovery_time_minutes: 10
          items_still_available: true
        expected:
          hold_valid: true
          retry_allowed: true
        description: "Recovery within hold window — items still reserved."
      - input:
          hold_duration_minutes: 15
          recovery_time_minutes: 20
          items_still_available: true
        expected:
          hold_expired: true
          re_reservation_attempted: true
          retry_allowed: true
        description: "Recovery after hold expiry — items re-reserved if available."
      - input:
          hold_duration_minutes: 15
          recovery_time_minutes: 20
          items_still_available: false
        expected:
          hold_expired: true
          re_reservation_failed: true
          user_message: "Some items in your cart are no longer available."
          retry_allowed: false
        description: "Recovery after hold expiry, items sold out — user informed."
    test_ref: ""
    status: uncovered
    priority: 2
    tags:
      - payment
      - inventory
      - edge-case
      - hold-expiration

  - name: "Concurrent payment submissions for the same order"
    description: >
      Two payment requests arrive simultaneously for the same order (e.g.,
      user opens checkout in two tabs). The system must ensure only one payment
      is processed and the other is rejected with an appropriate error.
    type: edge_case
    risk: high
    risk_rationale: >
      Impact: 3 — double charge risk, financial integrity.
      Frequency: 2 — uncommon but reproducible by determined users.
      Consequence: 3 — double charge.
      Detectability: 3 — user may not notice until bank statement.
      Average: 2.75 → high.
    techniques:
      - error_guessing
      - state_transition
    technique_rationale: >
      Error guessing targets the concurrency race condition. State transition
      ensures mutual exclusion at the payment_processing state.
    preconditions:
      - "Order is in pending_payment state"
      - "Two concurrent payment requests arrive"
    examples:
      - input:
          concurrent_requests: 2
          order_id: "ORD-CONCURRENT-001"
          request_1_arrives_first: true
        expected:
          request_1_result: "payment_processing"
          request_2_result: "error"
          request_2_error: "PAYMENT_ALREADY_IN_PROGRESS"
          total_charges: 1
        description: "Second concurrent request rejected — only first processed."
      - input:
          concurrent_requests: 2
          order_id: "ORD-CONCURRENT-002"
          requests_arrive_simultaneously: true
        expected:
          exactly_one_succeeds: true
          total_charges: 1
          loser_receives_error: true
        description: "Truly simultaneous requests — exactly one wins, other gets error."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - payment
      - concurrency
      - no-double-charge
      - race-condition

# ===========================================================================
# Example Mapping
# ===========================================================================
example_mapping:
  story: >
    As an e-commerce customer, when my payment fails during checkout, I want
    the system to handle the failure gracefully, show me a clear message
    explaining what went wrong, and allow me to recover (retry, use a
    different method, or re-authenticate) so that I can complete my purchase
    without being double-charged.
  rules:
    - rule_name: "Insufficient funds triggers rollback and prompts for alternative payment"
      examples:
        - "Credit card with insufficient funds → user sees 'insufficient funds' message, prompted to use different card"
        - "Debit card with insufficient funds → same message, alternative payment methods shown"
        - "User retries with same insufficient-funds card → additional warning displayed"
        - "No partial authorization hold left on card after insufficient funds decline"

    - rule_name: "Declined card shows specific reason when available and suggests contacting bank"
      examples:
        - "Card expired → 'Your card has expired' message shown, suggest updating card or contacting bank"
        - "Do-not-honor decline → generic decline message, suggest contacting bank"
        - "No specific reason from gateway → fallback generic decline message"
        - "Sensitive reason (lost/stolen card) → generic message, sensitive details hidden"
        - "Order state transitions to payment_failed, cart preserved for retry"

    - rule_name: "Network timeout triggers exponential backoff retry up to 3 times"
      examples:
        - "First timeout → retry after 1000ms delay"
        - "Second timeout → retry after 2000ms delay"
        - "Third timeout → retry after 4000ms delay, then abort if still failing"
        - "Retry succeeds on second attempt → order confirmed, no double charge"
        - "Gateway processes original after client timeout → idempotency key prevents double charge"
        - "Missing idempotency key on retry → double charge risk, auto-refund triggered"

    - rule_name: "3D Secure failure allows re-authentication"
      examples:
        - "Wrong OTP entered → allow re-authentication, payment details preserved"
        - "3DS challenge times out → allow re-authentication"
        - "Bank rejects authentication → suggest contacting bank or alternative method"
        - "Second authentication attempt succeeds → proceed to payment processing"
        - "Max authentication attempts (3) reached → suggest different payment method"

    - rule_name: "Fraud check rejection flags order for manual review without revealing fraud detection"
      examples:
        - "Velocity check failure → generic message, order flagged internally for ops review"
        - "High risk score → same generic message, risk score logged"
        - "Address mismatch → same generic message, no hint about AVS"
        - "Error code indistinguishable from generic decline (no information leakage)"
        - "Response timing consistent with normal declines (no timing oracle)"
        - "No HTTP headers reveal fraud detection involvement"

    - rule_name: "No double charges occur during any retry or recovery scenario"
      examples:
        - "Concurrent retry requests use same idempotency key → only one charge"
        - "User clicks pay button multiple times rapidly → client debounce + server idempotency"
        - "3DS re-auth while delayed original succeeds → only one charge"
        - "Network retry succeeds while original late-arrives → only one charge"
        - "Two browser tabs submit payment for same order → only one processed"

    - rule_name: "Each failure type transitions the order to the correct state"
      examples:
        - "Insufficient funds → payment_failed (retryable)"
        - "Declined card → payment_failed (retryable)"
        - "Network timeout (retries remaining) → retry_pending"
        - "Network timeout (max retries) → payment_timeout"
        - "3DS failure → awaiting_authentication"
        - "Fraud rejection → manual_review"
        - "Invalid state transition (e.g., fail on confirmed order) → rejected"

