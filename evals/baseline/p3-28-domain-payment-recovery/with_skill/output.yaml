  # ==========================================================================
  # S9 — Backend Actions Per Failure Type
  # ==========================================================================
  - name: "Backend actions are correct for each failure type"
    description: >
      Each failure type triggers a specific backend action: rollback for
      insufficient funds and declined card, retry with exponential backoff
      for network timeout, hold for re-auth for 3DS failure, and flag for
      manual review for fraud rejection. Verifies correct action dispatching.
    type: combinatorial
    risk: high
    risk_rationale: >
      Impact: 3 — incorrect backend actions can cause financial loss or missed fraud.
      Frequency: 3 — every payment failure triggers a backend action.
      Consequence: 3 — wrong action (e.g., retry instead of flag for fraud) is severe.
      Detectability: 2 — backend actions are not visible to user, rely on monitoring.
      Average: 2.75 → high.
    techniques:
      - decision_table
      - equivalence_partitioning
    technique_rationale: >
      Decision table maps failure types to backend actions exhaustively.
      Equivalence partitioning ensures each failure category maps to exactly
      one action.
    preconditions:
      - "Payment failure has been classified"
    examples:
      - input:
          failure_type: "insufficient_funds"
        expected:
          backend_action: "rollback"
          authorization_voided: true
          retry_initiated: false
          fraud_flag: false
        description: "Insufficient funds — rollback, void authorization."
      - input:
          failure_type: "declined_card"
        expected:
          backend_action: "rollback"
          authorization_voided: true
          retry_initiated: false
          fraud_flag: false
        description: "Declined card — rollback, void authorization."
      - input:
          failure_type: "network_timeout"
          retry_count: 0
        expected:
          backend_action: "retry"
          retry_with_backoff: true
          idempotency_key_reused: true
          rollback: false
        description: "Network timeout (first) — retry with backoff, reuse idempotency key."
      - input:
          failure_type: "network_timeout"
          retry_count: 3
        expected:
          backend_action: "rollback"
          retry_with_backoff: false
          pending_charge_check: true
        description: "Network timeout (max retries) — rollback, check for pending charges."
      - input:
          failure_type: "threeds_auth_failure"
        expected:
          backend_action: "hold_for_re_auth"
          payment_intent_preserved: true
          new_3ds_challenge_prepared: true
        description: "3DS failure — hold payment intent for re-authentication."
      - input:
          failure_type: "fraud_rejection"
        expected:
          backend_action: "flag_for_review"
          manual_review_entry_created: true
          notification_sent_to_ops: true
          user_not_informed_of_fraud: true
        description: "Fraud rejection — flag for manual review, notify ops, hide reason from user."
    decision_table:
      conditions:
        - "failure_type"
        - "retry_count_for_timeout"
      actions:
        - "backend_action"
        - "void_authorization"
        - "retry"
        - "flag_for_review"
        - "preserve_payment_intent"
      rules:
        - description: "Insufficient funds"
          condition_values:
            failure_type: "insufficient_funds"
            retry_count_for_timeout: "n/a"
          expected_actions:
            backend_action: "rollback"
            void_authorization: true
            retry: false
            flag_for_review: false
            preserve_payment_intent: false
        - description: "Declined card"
          condition_values:
            failure_type: "declined_card"
            retry_count_for_timeout: "n/a"
          expected_actions:
            backend_action: "rollback"
            void_authorization: true
            retry: false
            flag_for_review: false
            preserve_payment_intent: false
        - description: "Network timeout — retries remaining"
          condition_values:
            failure_type: "network_timeout"
            retry_count_for_timeout: "<3"
          expected_actions:
            backend_action: "retry"
            void_authorization: false
            retry: true
            flag_for_review: false
            preserve_payment_intent: true
        - description: "Network timeout — max retries"
          condition_values:
            failure_type: "network_timeout"
            retry_count_for_timeout: ">=3"
          expected_actions:
            backend_action: "rollback"
            void_authorization: true
            retry: false
            flag_for_review: false
            preserve_payment_intent: false
        - description: "3DS authentication failure"
          condition_values:
            failure_type: "threeds_auth_failure"
            retry_count_for_timeout: "n/a"
          expected_actions:
            backend_action: "hold_for_re_auth"
            void_authorization: false
            retry: false
            flag_for_review: false
            preserve_payment_intent: true
        - description: "Fraud rejection"
          condition_values:
            failure_type: "fraud_rejection"
            retry_count_for_timeout: "n/a"
          expected_actions:
            backend_action: "flag_for_review"
