    type: edge_case
    risk: high
    risk_rationale: "Impact: 3, Frequency: 3, Consequence: 3, Detectability: 2. Average: 2.75 -> high. If the timer does not reset properly, active passengers get kicked out mid-workflow."
    techniques:
