  - name: "Complete kiosk state machine - all valid transitions"
    description: >
      Comprehensive state transition model covering all valid state
      transitions in the kiosk workflow, including happy path, cancel
      from every screen, timeout from every screen, PNR retry loop,
      and printer error transitions. This scenario provides 0-switch
      coverage of all valid transitions.
    type: state_transition
    risk: high
    risk_rationale: "Impact: 3, Frequency: 3, Consequence: 3, Detectability: 2. Average: 2.75 -> high. The state machine integrity is the foundation of the entire kiosk; any missing or incorrect transition breaks the workflow."
    techniques:
      - state_transition
    technique_rationale: >
      State transition is the primary technique for modeling the complete
      kiosk lifecycle. This provides 0-switch coverage of all valid
      transitions in the system.
    preconditions:
      - "Kiosk is operational"
    examples:
      - input:
          path: "start -> select_airline -> enter_pnr -> retrieve_booking -> confirm_details -> select_seats -> print_boarding_pass -> exit"
        expected:
          valid_path: true
          path_type: "happy_path_with_seats"
        description: "Full happy path with seat selection."
      - input:
          path: "start -> select_airline -> enter_pnr -> retrieve_booking -> confirm_details -> print_boarding_pass -> exit"
        expected:
          valid_path: true
          path_type: "happy_path_without_seats"
        description: "Full happy path skipping seat selection."
      - input:
          path: "enter_pnr -> pnr_error -> enter_pnr -> pnr_error -> enter_pnr -> pnr_error -> start"
        expected:
          valid_path: true
          path_type: "max_retry_exhaustion"
        description: "Three failed PNR attempts leading to forced return."
    state_transition:
      states:
        - "start"
        - "select_airline"
        - "enter_pnr"
        - "retrieve_booking"
        - "confirm_details"
        - "select_seats"
        - "print_boarding_pass"
        - "exit"
        - "pnr_error"
        - "printer_error"
      transitions:
        # Happy path transitions
        - from: "start"
          to: "select_airline"
          trigger: "passenger_begins"
          guard: "Kiosk is idle"
        - from: "select_airline"
          to: "enter_pnr"
          trigger: "airline_selected"
          guard: "Valid airline chosen"
        - from: "enter_pnr"
          to: "retrieve_booking"
          trigger: "valid_pnr_submitted"
          guard: "PNR format is valid"
        - from: "retrieve_booking"
          to: "confirm_details"
          trigger: "booking_found"
          guard: "Booking exists in airline system"
        - from: "confirm_details"
          to: "select_seats"
          trigger: "choose_seat_selection"
          guard: "Passenger opts to select seat"
        - from: "confirm_details"
          to: "print_boarding_pass"
          trigger: "skip_seat_selection"
          guard: "Passenger skips seat selection"
        - from: "select_seats"
          to: "print_boarding_pass"
          trigger: "seat_confirmed"
          guard: "Seat is available and assigned"
        - from: "print_boarding_pass"
          to: "exit"
          trigger: "print_successful"
          guard: "Boarding pass printed successfully"
        - from: "exit"
          to: "start"
          trigger: "session_complete"
          guard: "Passenger takes boarding pass"
        # Cancel transitions (every screen -> start)
        - from: "select_airline"
          to: "start"
          trigger: "cancel_pressed"
          guard: "Cancel button pressed"
        - from: "enter_pnr"
          to: "start"
          trigger: "cancel_pressed"
          guard: "Cancel button pressed"
        - from: "retrieve_booking"
          to: "start"
          trigger: "cancel_pressed"
          guard: "Cancel button pressed"
        - from: "confirm_details"
          to: "start"
          trigger: "cancel_pressed"
          guard: "Cancel button pressed"
        - from: "select_seats"
          to: "start"
          trigger: "cancel_pressed"
          guard: "Cancel button pressed"
        - from: "print_boarding_pass"
          to: "start"
          trigger: "cancel_pressed"
          guard: "Cancel button pressed"
        # Timeout transitions (every screen -> start)
        - from: "select_airline"
          to: "start"
          trigger: "inactivity_timeout"
          guard: "60 seconds without interaction"
        - from: "enter_pnr"
          to: "start"
          trigger: "inactivity_timeout"
          guard: "60 seconds without interaction"
        - from: "retrieve_booking"
          to: "start"
          trigger: "inactivity_timeout"
          guard: "60 seconds without interaction"
        - from: "confirm_details"
          to: "start"
          trigger: "inactivity_timeout"
          guard: "60 seconds without interaction"
        - from: "select_seats"
          to: "start"
          trigger: "inactivity_timeout"
          guard: "60 seconds without interaction"
        - from: "print_boarding_pass"
          to: "start"
          trigger: "inactivity_timeout"
          guard: "60 seconds without interaction"
        # PNR error transitions
        - from: "enter_pnr"
          to: "pnr_error"
          trigger: "invalid_pnr_submitted"
          guard: "PNR not found or invalid format"
        - from: "pnr_error"
          to: "enter_pnr"
          trigger: "retry_pnr"
          guard: "attempt_count < 3"
        - from: "pnr_error"
          to: "start"
          trigger: "max_attempts_exceeded"
          guard: "attempt_count >= 3"
        # Printer error transitions
        - from: "print_boarding_pass"
          to: "printer_error"
          trigger: "printer_failure"
          guard: "Printer reports jam, out of paper, or other hardware error"
        # Booking not found transition
        - from: "retrieve_booking"
          to: "pnr_error"
          trigger: "booking_not_found"
          guard: "PNR valid format but no matching booking"
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - state-machine
      - comprehensive
      - critical-path

