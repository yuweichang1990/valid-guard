          action: "view_seat_map"
        expected:
          message: "No seats available for selection. Your pre-assigned seat will be used."
          next_screen: "print_boarding_pass"
          seat_assigned: "pre-assigned"
        description: "No available seats skips selection and uses pre-assigned."
    test_ref: ""
    status: uncovered
    priority: 3
    tags:
      - seat-selection
      - edge-case

  - name: "Multiple passengers on same booking"
    description: >
      A PNR may contain multiple passengers (e.g., a family booking).
      The kiosk should display all passengers and allow check-in for
      each or all at once.
    type: edge_case
    risk: medium
    risk_rationale: "Impact: 2, Frequency: 2, Consequence: 2, Detectability: 2. Average: 2.00 -> medium. Group bookings are common and each passenger needs a boarding pass."
    techniques:
      - equivalence_partitioning
      - error_guessing
    technique_rationale: >
      Equivalence partitioning tests single-passenger vs multi-passenger
      bookings. Error guessing considers partial check-in failures.
    preconditions:
      - "PNR lookup returned a booking with multiple passengers"
    examples:
      - input:
          pnr: "FAM456"
          passenger_count: 3
          check_in_selection: "all"
        expected:
          boarding_passes_printed: 3
          all_passengers_checked_in: true
        description: "Family of 3 checks in together, 3 boarding passes printed."
      - input:
          pnr: "FAM456"
          passenger_count: 3
          check_in_selection: ["passenger_1", "passenger_3"]
        expected:
          boarding_passes_printed: 2
          passengers_checked_in: ["passenger_1", "passenger_3"]
        description: "Selective check-in for 2 of 3 passengers."
    test_ref: ""
    status: uncovered
    priority: 2
    tags:
      - multi-passenger
      - edge-case

  - name: "Session data cleanup on return to Start"
    description: >
      Whenever the kiosk returns to the Start screen (via cancel, timeout,
      max retries, or normal exit), all session data including PNR, passenger
      details, seat selections, and attempt counters must be completely purged
      to prevent data leakage to the next passenger.
    type: security
    risk: high
    risk_rationale: "Impact: 3, Frequency: 3, Consequence: 3, Detectability: 3. Average: 3.00 -> high. PII leakage between sessions is a serious privacy violation in a public kiosk."
    techniques:
      - state_transition
      - error_guessing
    technique_rationale: >
      State transition verifies cleanup on every path back to Start.
      Error guessing considers partial cleanup failures and data remnants.
    preconditions:
      - "Kiosk has been in use with passenger data loaded"
    examples:
      - input:
          return_trigger: "cancel"
          previous_data:
            pnr: "ABC123"
            passenger_name: "John Doe"
            seat: "14A"
        expected:
          pnr_in_memory: null
          passenger_data_in_memory: null
          seat_in_memory: null
          attempt_counter: 0
          screen_shows_no_data: true
        description: "Cancel clears all session data completely."
      - input:
          return_trigger: "timeout"
          previous_data:
            pnr: "XYZ789"
            passenger_name: "Jane Smith"
        expected:
          pnr_in_memory: null
          passenger_data_in_memory: null
          screen_shows_no_data: true
        description: "Timeout clears all session data completely."
      - input:
          return_trigger: "max_attempts"
          previous_data:
            attempt_count: 3
            partial_pnr: "INV"
        expected:
          attempt_counter: 0
          partial_pnr_in_memory: null
          screen_shows_no_data: true
        description: "Max attempts clears all data including attempt counter."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - security
      - privacy
      - data-cleanup
      - critical-path

  - name: "Concurrent timeout and cancel - race condition"
    description: >
      Passenger presses Cancel at the exact moment the 60-second inactivity
      timeout fires. The system must handle this race condition gracefully
      without duplicate transitions or errors.
    type: edge_case
    risk: medium
    risk_rationale: "Impact: 2, Frequency: 1, Consequence: 2, Detectability: 3. Average: 2.00 -> medium. Unlikely but could cause a crash or double-cleanup issue."
    techniques:
      - error_guessing
      - state_transition
    technique_rationale: >
      Error guessing anticipates the race condition between two events
      targeting the same transition. State transition verifies only one
      transition fires.
    preconditions:
      - "Kiosk is on any workflow screen"
      - "Inactivity timer is at ~60 seconds"
    examples:
      - input:
          current_screen: "confirm_details"
          inactivity_seconds: 60
          simultaneous_action: "cancel_pressed"
        expected:
          next_screen: "start"
          transitions_fired: 1
          no_error_thrown: true
          session_data_cleared: true
        description: "Simultaneous cancel and timeout results in single clean return to Start."
    test_ref: ""
    status: uncovered
    priority: 3
    tags:
      - race-condition
      - edge-case
      - concurrency

  - name: "Rapid repeated cancel presses"
    description: >
      Passenger rapidly presses the Cancel button multiple times. The
      system should handle debouncing and not cause multiple transitions
      or errors.
    type: edge_case
    risk: low
    risk_rationale: "Impact: 1, Frequency: 1, Consequence: 1, Detectability: 1. Average: 1.00 -> low. Minor UX concern; should not crash."
    techniques:
      - error_guessing
    technique_rationale: >
      Error guessing anticipates rapid input causing multiple event
      dispatches.
    preconditions:
      - "Kiosk is on any workflow screen"
    examples:
      - input:
          current_screen: "select_airline"
          action: "cancel_pressed_5_times_rapidly"
        expected:
          next_screen: "start"
          transitions_fired: 1
          no_error_thrown: true
        description: "Rapid cancel presses result in single clean return to Start."
    test_ref: ""
    status: uncovered
    priority: 4
    tags:
      - debounce
      - edge-case
      - ux

  - name: "Timeout countdown warning display"
    description: >
      Before the 60-second inactivity timeout fires, a warning should
      appear (e.g., at 45 seconds) asking if the passenger is still there,
      with an option to extend the session.
    type: edge_case
    risk: medium
    risk_rationale: "Impact: 2, Frequency: 2, Consequence: 2, Detectability: 1. Average: 1.75 -> medium. Without warning, passengers lose their progress unexpectedly."
    techniques:
      - boundary_value
      - state_transition
    technique_rationale: >
      Boundary value tests the warning threshold timing. State transition
      models the warning display as an intermediate state.
    preconditions:
      - "Kiosk is on any workflow screen"
      - "No user interaction for approaching 60 seconds"
    examples:
      - input:
          current_screen: "confirm_details"
          inactivity_seconds: 45
        expected:
          warning_displayed: true
          warning_message: "Are you still there? Session will end in 15 seconds."
          extend_button_visible: true
        description: "Warning appears at 45 seconds of inactivity."
      - input:
          current_screen: "confirm_details"
          inactivity_seconds: 45
          action: "extend_session"
        expected:
          timer_reset: true
          warning_dismissed: true
          screen_remains: "confirm_details"
        description: "Pressing extend resets the timer and dismisses warning."
      - input:
          current_screen: "confirm_details"
          inactivity_seconds: 44
        expected:
          warning_displayed: false
        description: "No warning at 44 seconds."
    test_ref: ""
    status: uncovered
    priority: 2
    tags:
      - timeout
      - ux
      - boundary

  - name: "Exit screen auto-returns to Start after delay"
    description: >
      After the boarding pass is printed and the Exit screen is shown,
      the kiosk should automatically return to Start after a short delay
      (e.g., 10 seconds) to be ready for the next passenger.
    type: state_transition
    risk: medium
    risk_rationale: "Impact: 2, Frequency: 3, Consequence: 1, Detectability: 1. Average: 1.75 -> medium. Kiosk must be ready for the next user without manual intervention."
    techniques:
      - state_transition
      - boundary_value
    technique_rationale: >
      State transition models the auto-return. Boundary value tests
      the exit-to-start delay threshold.
    preconditions:
      - "Kiosk is on the Exit screen after successful boarding pass print"
    examples:
      - input:
          current_screen: "exit"
          seconds_on_exit_screen: 10
        expected:
          next_screen: "start"
          auto_return: true
          session_data_cleared: true
        description: "After 10 seconds on exit screen, auto-returns to Start."
    state_transition:
      states:
        - "exit"
        - "start"
      transitions:
        - from: "exit"
          to: "start"
          trigger: "exit_timer_expired"
          guard: "Exit screen displayed for configured duration"
    test_ref: ""
    status: uncovered
    priority: 2
    tags:
      - exit
      - auto-return
      - state-machine

  - name: "Kiosk recovery after power interruption"
    description: >
      If the kiosk loses power and reboots during a session, it should
      boot into the Start state with no residual session data.
    type: error_handling
    risk: medium
    risk_rationale: "Impact: 2, Frequency: 1, Consequence: 3, Detectability: 2. Average: 2.00 -> medium. Power issues happen; residual data would be a privacy risk."
    techniques:
      - error_guessing
      - state_transition
    technique_rationale: >
      Error guessing covers hardware failure scenarios. State transition
      verifies boot-to-Start initialization.
    preconditions:
      - "Kiosk was mid-session with passenger data loaded"
      - "Power interruption occurred"
    examples:
      - input:
          event: "power_loss_during_confirm_details"
          previous_session_data: "John Doe booking ABC123"
        expected:
          boot_state: "start"
          residual_data: null
          self_test_passed: true
        description: "Kiosk boots clean after power loss with no residual data."
    test_ref: ""
    status: uncovered
    priority: 3
    tags:
      - reliability
      - hardware
      - recovery
      - security

  - name: "Accessibility - screen reader and touch target compliance"
    description: >
      All screens must be accessible: touch targets must meet minimum
      size requirements, text must be readable, and screen reader
      announcements must describe current state and available actions.
    type: edge_case
    risk: medium
    risk_rationale: "Impact: 2, Frequency: 2, Consequence: 2, Detectability: 2. Average: 2.00 -> medium. Accessibility compliance is a regulatory requirement in many jurisdictions."
    techniques:
      - equivalence_partitioning
      - error_guessing
    technique_rationale: >
      Equivalence partitioning tests different accessibility contexts
      (screen reader active vs. not, large text mode vs. standard).
      Error guessing covers missed accessibility requirements.
    preconditions:
      - "Kiosk accessibility features are enabled"
    examples:
      - input:
          screen: "select_airline"
          accessibility_mode: "screen_reader"
        expected:
          screen_announced: "Select your airline. 5 airlines available."
          all_buttons_labeled: true
          min_touch_target_mm: 10
        description: "Screen reader announces airline selection screen correctly."
      - input:
          screen: "enter_pnr"
          accessibility_mode: "large_text"
        expected:
          font_size_minimum_pt: 18
          contrast_ratio_minimum: 4.5
        description: "Large text mode meets minimum font size and contrast."
    test_ref: ""
    status: uncovered
    priority: 3
    tags:
      - accessibility
      - compliance
      - ux

# ===========================================================================
# Example Mapping
# ===========================================================================
example_mapping:
  story: >
    As an airport passenger, I want to use a self-service check-in kiosk to
    select my airline, enter my booking reference, confirm my details,
    optionally select a seat, and print my boarding pass, so that I can
    check in quickly without waiting at the manned counter.
  rules:
    - rule_name: "Workflow follows a defined sequence of screens"
      examples:
        - "Start -> Select Airline -> Enter PNR -> Retrieve Booking -> Confirm Details -> Select Seats -> Print -> Exit (full path)"
        - "Start -> Select Airline -> Enter PNR -> Retrieve Booking -> Confirm Details -> Print -> Exit (skip seats)"
        - "Cannot jump from Start to Print without intermediate steps"
        - "Cannot go backwards from Confirm Details to Select Airline"

    - rule_name: "Cancel button on every screen returns to Start"
      examples:
        - "Cancel on Select Airline -> Start (no data to clear)"
        - "Cancel on Enter PNR -> Start (partial PNR cleared)"
        - "Cancel on Retrieve Booking -> Start (API call aborted)"
        - "Cancel on Confirm Details -> Start (PII cleared from display)"
        - "Cancel on Select Seats -> Start (tentative seat released)"
        - "Cancel on Print Boarding Pass -> Start (print may be in progress)"

    - rule_name: "60-second inactivity timeout returns to Start"
      examples:
        - "No interaction for 60s on any workflow screen -> return to Start"
        - "Interaction at 59s resets timer -> no timeout"
        - "Warning displayed at 45s with option to extend"
        - "Timer resets on any touch, keypress, or interaction"
        - "Timeout clears all session data including PII"

    - rule_name: "Invalid PNR allows up to 3 attempts then returns to Start"
      examples:
        - "First invalid PNR -> error message, 2 attempts remaining"
        - "Second invalid PNR -> error message, 1 attempt remaining"
        - "Third invalid PNR -> forced return to Start"
        - "Valid PNR on second attempt -> proceed normally"
        - "Empty PNR submission -> format validation error"
        - "PNR with special characters -> format validation error"
        - "Network timeout during lookup -> does not count as an attempt"

    - rule_name: "Printer errors direct passenger to service counter"
      examples:
        - "Paper jam -> error screen with counter direction"
        - "Out of paper -> error screen with counter direction"
        - "Printer offline -> error screen with counter direction"
        - "Re-print attempt on error screen -> blocked"

    - rule_name: "Session data must be fully cleared on every return to Start"
      examples:
        - "Cancel clears PNR, passenger data, seat selection, attempt counter"
        - "Timeout clears all data including displayed PII"
        - "Max PNR attempts clears all data and resets counter"
        - "Normal exit clears all data after boarding pass printed"
        - "Power interruption: boot to Start with no residual data"

    - rule_name: "Seat selection is optional"
      examples:
        - "Passenger opts to select seat -> seat map displayed"
        - "Passenger skips seat selection -> proceeds to print with pre-assigned seat"
        - "No seats available -> message shown, proceeds with pre-assigned seat"

