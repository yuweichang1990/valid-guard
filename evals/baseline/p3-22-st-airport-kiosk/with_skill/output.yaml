            "PNR format valid": true
            "Booking exists in airline system": false
            "Attempt count < 3": false
          expected_actions:
            "Proceed to Confirm Details": false
            "Show error and allow retry": false
            "Show error and return to Start": true
            "Show format validation error": false
        - description: "Invalid format, retries remaining"
          condition_values:
            "PNR format valid": false
            "Booking exists in airline system": false
            "Attempt count < 3": true
          expected_actions:
            "Proceed to Confirm Details": false
            "Show error and allow retry": false
            "Show error and return to Start": false
            "Show format validation error": true
        - description: "Invalid format, no retries left"
          condition_values:
            "PNR format valid": false
            "Booking exists in airline system": false
            "Attempt count < 3": false
          expected_actions:
            "Proceed to Confirm Details": false
            "Show error and allow retry": false
            "Show error and return to Start": true
            "Show format validation error": false
        - description: "Valid PNR, booking found, even after retries (last attempt)"
