  # ==========================================================================
  # PNR VALIDATION AND ERROR HANDLING
  # ==========================================================================

  - name: "Invalid PNR entry - first attempt with error and re-entry"
    description: >
      Passenger enters an invalid PNR (not found in airline system). The
      kiosk displays an error message and allows the passenger to re-enter
      the PNR. This is the first failed attempt out of 3 allowed.
    type: error_handling
    risk: high
    risk_rationale: "Impact: 3, Frequency: 3, Consequence: 2, Detectability: 1. Average: 2.25 -> medium. But upgraded to high because PNR lookup is on the critical path and typos are extremely common."
    techniques:
      - equivalence_partitioning
      - error_guessing
      - boundary_value
    technique_rationale: >
      Equivalence partitioning categorizes PNR inputs (valid format/found,
      valid format/not found, invalid format). Error guessing anticipates
      common typo patterns. Boundary value tests the attempt counter.
    preconditions:
      - "Kiosk is on the Enter PNR screen"
      - "This is the first PNR entry attempt"
    examples:
      - input:
          pnr: "ZZZZZ9"
          attempt_number: 1
        expected:
          error_displayed: true
          error_message: "Booking not found. Please check your reference and try again."
          remaining_attempts: 2
          screen_remains: "enter_pnr"
          pnr_input_cleared: true
        description: "First invalid PNR shows error, allows re-entry, 2 attempts left."
      - input:
          pnr: ""
          attempt_number: 1
        expected:
          error_displayed: true
          error_message: "Please enter a valid booking reference."
          remaining_attempts: 2
          screen_remains: "enter_pnr"
        description: "Empty PNR submission shows validation error."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - pnr-validation
      - error-handling
      - critical-path

