  - name: "Inactivity timeout on Select Airline screen"
    description: >
      If the passenger does not interact with the Select Airline screen
      for 60 seconds, the kiosk automatically returns to the Start screen.
    type: state_transition
    risk: high
    risk_rationale: "Impact: 2, Frequency: 3, Consequence: 3, Detectability: 3. Average: 2.75 -> high. Without timeout, abandoned sessions block the kiosk for the next passenger, and may expose prior session data."
    techniques:
      - state_transition
      - boundary_value
    technique_rationale: >
      State transition models the timeout-triggered return. Boundary value
      tests the exact 60-second threshold (59s, 60s, 61s).
    preconditions:
      - "Kiosk is on the Select Airline screen"
      - "No user interaction occurring"
    examples:
      - input:
          current_screen: "select_airline"
          inactivity_seconds: 59
        expected:
          screen_remains: "select_airline"
          timeout_triggered: false
        description: "At 59 seconds of inactivity, kiosk remains on current screen."
      - input:
          current_screen: "select_airline"
          inactivity_seconds: 60
        expected:
          next_screen: "start"
          timeout_triggered: true
          session_data_cleared: true
        description: "At exactly 60 seconds, timeout fires and returns to Start."
      - input:
          current_screen: "select_airline"
          inactivity_seconds: 61
        expected:
          next_screen: "start"
          timeout_triggered: true
          session_data_cleared: true
        description: "At 61 seconds, timeout has already fired."
    state_transition:
      states:
        - "select_airline"
        - "start"
      transitions:
        - from: "select_airline"
          to: "start"
          trigger: "inactivity_timeout"
          guard: "60 seconds elapsed without user interaction"
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - timeout
      - security
      - boundary

