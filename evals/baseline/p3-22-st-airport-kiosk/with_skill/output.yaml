    type: error_handling
    risk: high
    risk_rationale: "Impact: 3, Frequency: 2, Consequence: 2, Detectability: 2. Average: 2.25 -> medium. Upgraded to high because failure here could leave the kiosk stuck or allow infinite retries."
    techniques:
      - boundary_value
      - state_transition
      - error_guessing
    technique_rationale: >
      Boundary value tests the exact 3-attempt limit. State transition
      models the forced return to Start. Error guessing considers what
      happens if the counter is not properly tracked.
    preconditions:
      - "Kiosk is on the Enter PNR screen"
