# Valid Guard Test Plan — Airport Self-Service Check-In Kiosk
# Generated: 2026-03-14T09:00:00Z
# Source: natural language

feature: "Airport Self-Service Check-In Kiosk"

feature_description: >
  A self-service airport check-in kiosk that guides passengers through a
  multi-step workflow: airline selection, PNR/booking reference entry,
  booking retrieval, passenger detail confirmation, optional seat selection,
  and boarding pass printing. Every screen features a Cancel button returning
  to Start. A 60-second inactivity timeout on any screen returns to Start.
  Invalid PNR entry allows up to 3 re-entry attempts before returning to
  Start. Printer jam errors direct the passenger to the service counter.

risk_level: high

entry_point: greenfield

source:
  type: natural_language
  path: ""

scenarios:
  # ==========================================================================
  # HAPPY PATH SCENARIOS
  # ==========================================================================

  - name: "Complete check-in workflow with seat selection"
    description: >
      Passenger completes the full workflow: Start -> Select Airline ->
      Enter PNR -> Retrieve Booking -> Confirm Passenger Details ->
      Select Seats -> Print Boarding Pass -> Exit. This is the primary
      end-to-end happy path including the optional seat selection step.
    type: happy_path
    risk: high
    risk_rationale: "Impact: 3, Frequency: 3, Consequence: 3, Detectability: 2. Average: 2.75 -> high. This is the core workflow every passenger uses; failure means nobody can check in."
    techniques:
      - state_transition
      - equivalence_partitioning
    technique_rationale: >
      State transition models the full multi-screen workflow lifecycle.
      Equivalence partitioning covers valid PNR formats and valid airline
      selections as representative valid-class inputs.
    preconditions:
      - "Kiosk is powered on and in idle (Start) state"
      - "Printer has paper and is operational"
      - "Network connectivity to airline booking system is available"
    examples:
      - input:
          airline: "Delta Air Lines"
          pnr: "ABC123"
          seat_selection: "14A"
        expected:
          boarding_pass_printed: true
          final_state: "exit"
          seat_assigned: "14A"
        description: "Full workflow with seat selection completes successfully."
    state_transition:
      states:
        - "start"
        - "select_airline"
        - "enter_pnr"
        - "retrieve_booking"
        - "confirm_details"
        - "select_seats"
        - "print_boarding_pass"
        - "exit"
      transitions:
        - from: "start"
          to: "select_airline"
          trigger: "passenger_touches_screen"
          guard: "Kiosk is idle"
        - from: "select_airline"
          to: "enter_pnr"
          trigger: "airline_selected"
          guard: "Valid airline chosen from list"
        - from: "enter_pnr"
          to: "retrieve_booking"
          trigger: "pnr_submitted"
          guard: "PNR format is valid"
        - from: "retrieve_booking"
          to: "confirm_details"
          trigger: "booking_found"
          guard: "PNR matches a valid booking in airline system"
        - from: "confirm_details"
          to: "select_seats"
          trigger: "details_confirmed_with_seat_selection"
          guard: "Passenger confirms details and chooses to select seat"
        - from: "confirm_details"
          to: "print_boarding_pass"
          trigger: "details_confirmed_skip_seats"
          guard: "Passenger confirms details and skips seat selection"
        - from: "select_seats"
          to: "print_boarding_pass"
          trigger: "seat_selected"
          guard: "Selected seat is available"
        - from: "print_boarding_pass"
          to: "exit"
          trigger: "boarding_pass_printed"
          guard: "Printer completes successfully"
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - smoke
      - critical-path
      - e2e

