      - 1-switch
      - smoke

  - name: "ST-05: Payment retry path (payment_failure then success)"
    description: >
      1-switch coverage: Tests the retry path — payment_processing ->
      checkout_in_progress (payment_failure) -> payment_processing
      (submit_payment) -> order_confirmed (payment_success). Ensures
      users can recover from payment failure.
    type: state_transition
    risk: high
    risk_rationale: >
      Impact: 3 — Recovery from payment failure is critical for revenue.
      Frequency: 2 — Occurs in 5-10% of transactions.
      Consequence: 3 — If retry path is broken, failed payments are
      permanently lost sales.
      Detectability: 2 — User sees error but retry behavior may be buggy.
      Average: 2.5 -> high.
    techniques:
      - state_transition
    technique_rationale: >
      1-switch state transition coverage for the failure-recovery loop.
    preconditions:
      - "Cart has items and has reached payment_processing"
      - "First payment attempt will fail"
    examples:
      - input:
          sequence:
            - { state: "payment_processing", event: "payment_failure", reason: "card_declined" }
            - { state: "checkout_in_progress", event: "submit_payment", amount: 89.99, new_card: true }
            - { state: "payment_processing", event: "payment_success" }
        expected:
          final_state: "order_confirmed"
          payment_attempts: 2
          cart_preserved_throughout: true
        description: "Failed payment, change card, retry, success."
    state_transition:
      states:
        - "payment_processing"
        - "checkout_in_progress"
        - "order_confirmed"
      transitions:
        - from: "payment_processing"
          to: "checkout_in_progress"
          trigger: "payment_failure"
        - from: "checkout_in_progress"
          to: "payment_processing"
          trigger: "submit_payment"
          guard: "payment amount matches cart total"
        - from: "payment_processing"
          to: "order_confirmed"
          trigger: "payment_success"
