  # ==========================================================================
  # INVALID STATE TRANSITIONS — Events fired in wrong states
  # ==========================================================================

  - name: "ST-07: Invalid transitions — events in wrong states"
    description: >
      Verifies that events are rejected when fired in states that should
      not accept them. The system must remain in its current state and
      return an appropriate error. Covers all invalid (state, event) pairs
      from the state transition table.
    type: error_handling
    risk: high
    risk_rationale: >
      Impact: 3 — Accepting invalid transitions can corrupt order state.
      Frequency: 2 — Edge cases triggered by UI bugs, API misuse, or
      race conditions.
      Consequence: 3 — Could lead to checkout on empty cart, double
      payment, or skipping payment.
      Detectability: 3 — Invalid transitions may be silent — state
      changes without visible error.
      Average: 2.75 -> high.
    techniques:
      - state_transition
      - error_guessing
    technique_rationale: >
      State transition testing for invalid transitions (negative testing).
      Error guessing anticipates likely API misuse and race conditions.
    preconditions:
      - "Cart system is initialized"
    examples:
      - input:
          current_state: "empty_cart"
          event: "click_checkout"
        expected:
          new_state: "empty_cart"
          error: "CART_EMPTY"
        description: "Cannot checkout from empty_cart — cart is empty."
      - input:
          current_state: "empty_cart"
          event: "update_quantity"
          sku: "SHIRT-M"
          new_qty: 2
        expected:
          new_state: "empty_cart"
          error: "INVALID_OPERATION"
        description: "Cannot update quantity in empty cart."
      - input:
          current_state: "empty_cart"
          event: "remove_item"
          sku: "SHIRT-M"
        expected:
          new_state: "empty_cart"
          error: "INVALID_OPERATION"
        description: "Cannot remove item from empty cart."
      - input:
          current_state: "empty_cart"
          event: "remove_all_items"
        expected:
          new_state: "empty_cart"
          error: "INVALID_OPERATION"
        description: "Cannot remove all items from empty cart."
      - input:
          current_state: "empty_cart"
          event: "submit_payment"
        expected:
          new_state: "empty_cart"
          error: "INVALID_STATE_TRANSITION"
        description: "Cannot submit payment from empty_cart."
      - input:
          current_state: "empty_cart"
          event: "payment_success"
        expected:
          new_state: "empty_cart"
          error: "INVALID_STATE_TRANSITION"
        description: "Cannot receive payment_success in empty_cart."
      - input:
          current_state: "empty_cart"
          event: "payment_failure"
        expected:
          new_state: "empty_cart"
          error: "INVALID_STATE_TRANSITION"
        description: "Cannot receive payment_failure in empty_cart."
      - input:
          current_state: "items_added"
          event: "submit_payment"
        expected:
          new_state: "items_added"
          error: "INVALID_STATE_TRANSITION"
        description: "Cannot submit payment directly from items_added (must checkout first)."
      - input:
          current_state: "items_added"
          event: "payment_success"
        expected:
          new_state: "items_added"
          error: "INVALID_STATE_TRANSITION"
        description: "Cannot receive payment_success in items_added."
      - input:
          current_state: "items_added"
          event: "payment_failure"
        expected:
          new_state: "items_added"
          error: "INVALID_STATE_TRANSITION"
        description: "Cannot receive payment_failure in items_added."
      - input:
          current_state: "checkout_in_progress"
          event: "add_product"
        expected:
          new_state: "checkout_in_progress"
          error: "INVALID_OPERATION"
        description: "Cannot add product during checkout (must go back to cart)."
      - input:
          current_state: "checkout_in_progress"
          event: "payment_success"
        expected:
          new_state: "checkout_in_progress"
          error: "INVALID_STATE_TRANSITION"
        description: "Cannot receive payment_success before submitting payment."
      - input:
          current_state: "checkout_in_progress"
          event: "payment_failure"
        expected:
          new_state: "checkout_in_progress"
          error: "INVALID_STATE_TRANSITION"
        description: "Cannot receive payment_failure before submitting payment."
      - input:
          current_state: "payment_processing"
          event: "add_product"
        expected:
          new_state: "payment_processing"
          error: "INVALID_OPERATION"
        description: "Cannot add product while payment is processing."
      - input:
          current_state: "payment_processing"
          event: "click_checkout"
        expected:
          new_state: "payment_processing"
          error: "INVALID_STATE_TRANSITION"
        description: "Cannot click checkout while payment is processing."
      - input:
          current_state: "payment_processing"
          event: "submit_payment"
        expected:
          new_state: "payment_processing"
          error: "INVALID_STATE_TRANSITION"
        description: "Cannot submit another payment while one is processing."
      - input:
          current_state: "order_confirmed"
          event: "add_product"
        expected:
          new_state: "order_confirmed"
          error: "INVALID_OPERATION"
        description: "Cannot add product to confirmed order."
      - input:
