# Valid Guard Test Plan
# Generated: 2026-03-14T12:00:00Z
# Source: natural language

feature: "E-Commerce Shopping Cart State Machine"

feature_description: >
  Shopping cart modeled as a finite state machine with five states
  (empty_cart, items_added, checkout_in_progress, payment_processing,
  order_confirmed) and eight events (add_product, update_quantity,
  remove_item, remove_all_items, click_checkout, submit_payment,
  payment_success, payment_failure). Guards enforce that the cart must
  not be empty for checkout, all items must be in stock, and the payment
  amount must match the cart total. Removing all items returns the cart
  to empty_cart. Payment failure returns to checkout_in_progress.

risk_level: high

entry_point: greenfield

source:
  type: natural_language
  path: ""

scenarios:
  # ==========================================================================
  # STATE TRANSITION — Full state machine coverage (0-switch)
  # ==========================================================================

  - name: "ST-01: Complete valid state transition table"
    description: >
      Verifies every valid transition in the shopping cart state machine.
      Covers the full state transition table: empty_cart -> items_added
      (add_product), items_added -> items_added (add_product, update_quantity,
      remove_item), items_added -> empty_cart (remove_all_items,
      remove_item when last item), items_added -> checkout_in_progress
      (click_checkout with guards), checkout_in_progress -> payment_processing
      (submit_payment with guards), payment_processing -> order_confirmed
      (payment_success), payment_processing -> checkout_in_progress
      (payment_failure).
    type: state_transition
    risk: high
    risk_rationale: >
      Impact: 3 — Core e-commerce flow; every purchase depends on correct
      state transitions. Frequency: 3 — Every user session involves cart
      state changes. Consequence: 3 — Invalid transitions can cause lost
      orders, stuck carts, or double charges. Detectability: 2 — Some
      transitions fail silently (e.g., stuck in payment_processing).
      Average: 2.75 -> high.
    techniques:
      - state_transition
    technique_rationale: >
      The shopping cart is explicitly defined as a state machine with
      discrete states and event-driven transitions. State transition
      testing is the primary technique for 0-switch coverage of all
      valid transitions.
    preconditions:
      - "Cart system is initialized and accessible"
      - "Product catalog is available with in-stock items"
    examples:
      - input:
          current_state: "empty_cart"
          event: "add_product"
          product: { sku: "SHIRT-M", qty: 1, price: 29.99 }
        expected:
          new_state: "items_added"
          cart_items: 1
        description: "Adding first product transitions empty_cart to items_added."
      - input:
          current_state: "items_added"
          event: "add_product"
          product: { sku: "PANTS-L", qty: 1, price: 49.99 }
        expected:
          new_state: "items_added"
          cart_items: 2
        description: "Adding another product stays in items_added state."
      - input:
          current_state: "items_added"
          event: "update_quantity"
          sku: "SHIRT-M"
          new_qty: 3
        expected:
          new_state: "items_added"
          updated_qty: 3
        description: "Updating quantity stays in items_added state."
      - input:
          current_state: "items_added"
          event: "remove_item"
          sku: "PANTS-L"
          remaining_items: 1
        expected:
          new_state: "items_added"
          cart_items: 1
        description: "Removing one item (others remain) stays in items_added."
      - input:
          current_state: "items_added"
          event: "remove_all_items"
        expected:
          new_state: "empty_cart"
          cart_items: 0
        description: "Removing all items returns cart to empty_cart."
      - input:
          current_state: "items_added"
          event: "click_checkout"
          cart_not_empty: true
          all_items_in_stock: true
        expected:
          new_state: "checkout_in_progress"
        description: "Clicking checkout with all guards satisfied transitions to checkout_in_progress."
      - input:
          current_state: "checkout_in_progress"
          event: "submit_payment"
          payment_amount: 79.98
          cart_total: 79.98
        expected:
          new_state: "payment_processing"
        description: "Submitting payment with matching amount transitions to payment_processing."
      - input:
          current_state: "payment_processing"
          event: "payment_success"
        expected:
          new_state: "order_confirmed"
        description: "Payment success transitions to order_confirmed."
      - input:
          current_state: "payment_processing"
          event: "payment_failure"
        expected:
          new_state: "checkout_in_progress"
        description: "Payment failure returns to checkout_in_progress."
    state_transition:
      states:
        - "empty_cart"
        - "items_added"
        - "checkout_in_progress"
        - "payment_processing"
        - "order_confirmed"
      transitions:
        - from: "empty_cart"
          to: "items_added"
          trigger: "add_product"
          guard: "product exists in catalog"
        - from: "items_added"
          to: "items_added"
          trigger: "add_product"
          guard: "product exists in catalog"
        - from: "items_added"
          to: "items_added"
          trigger: "update_quantity"
          guard: "new quantity > 0"
        - from: "items_added"
          to: "items_added"
          trigger: "remove_item"
          guard: "cart has more than one item remaining after removal"
        - from: "items_added"
          to: "empty_cart"
          trigger: "remove_item"
          guard: "cart has exactly one item and it is removed"
        - from: "items_added"
          to: "empty_cart"
          trigger: "remove_all_items"
          guard: "none"
        - from: "items_added"
          to: "checkout_in_progress"
          trigger: "click_checkout"
          guard: "cart is not empty AND all items are in stock"
        - from: "checkout_in_progress"
          to: "payment_processing"
          trigger: "submit_payment"
          guard: "payment amount matches cart total"
        - from: "payment_processing"
          to: "order_confirmed"
          trigger: "payment_success"
          guard: "none"
        - from: "payment_processing"
          to: "checkout_in_progress"
          trigger: "payment_failure"
          guard: "none"
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - state-machine
      - critical-path
      - 0-switch

  # ==========================================================================
  # STATE TRANSITION — Remove last item returns to empty_cart
  # ==========================================================================

  - name: "ST-02: Remove last item transitions items_added to empty_cart"
    description: >
      When the cart contains exactly one item and the user removes it via
      remove_item (not remove_all_items), the cart must transition back to
      empty_cart. This is a distinct transition from remove_all_items and
      must be tested separately.
    type: state_transition
    risk: high
    risk_rationale: >
      Impact: 3 — Incorrect state after removing last item could leave
      cart in items_added with zero items, breaking checkout guard.
      Frequency: 2 — Common scenario when users reconsider.
      Consequence: 3 — Stuck state or allowing checkout with empty cart.
      Detectability: 2 — May not be immediately obvious until checkout fails.
      Average: 2.5 -> high.
    techniques:
      - state_transition
      - equivalence_partitioning
    technique_rationale: >
      State transition verifies the correct state change. Equivalence
      partitioning distinguishes between remove_item with remaining items
      vs. remove_item of the last item (two distinct equivalence classes).
    preconditions:
      - "Cart is in items_added state"
      - "Cart contains exactly one item"
    examples:
      - input:
          current_state: "items_added"
          event: "remove_item"
          sku: "SHIRT-M"
          items_before_removal: 1
        expected:
          new_state: "empty_cart"
          cart_items: 0
        description: "Removing the sole item transitions to empty_cart."
      - input:
          current_state: "items_added"
          event: "remove_item"
          sku: "SHIRT-M"
          items_before_removal: 3
        expected:
          new_state: "items_added"
          cart_items: 2
        description: "Removing one of multiple items stays in items_added."
    state_transition:
      states:
        - "items_added"
        - "empty_cart"
      transitions:
        - from: "items_added"
          to: "empty_cart"
          trigger: "remove_item"
          guard: "item being removed is the only item in cart"
        - from: "items_added"
          to: "items_added"
          trigger: "remove_item"
          guard: "other items remain in cart after removal"
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - state-machine
      - edge-case

  # ==========================================================================
  # STATE TRANSITION — Payment failure returns to checkout_in_progress
  # ==========================================================================

  - name: "ST-03: Payment failure returns to checkout_in_progress"
    description: >
      When payment fails during payment_processing, the cart must return
      to checkout_in_progress so the user can retry or change payment
      method. Cart contents and totals must be preserved.
    type: state_transition
    risk: high
    risk_rationale: >
      Impact: 3 — Users must be able to retry payment without losing cart.
      Frequency: 2 — Payment failures occur in roughly 5-10% of attempts.
      Consequence: 3 — Lost cart or stuck in payment_processing means lost sale.
      Detectability: 2 — User sees an error but may not know cart state.
      Average: 2.5 -> high.
    techniques:
      - state_transition
      - error_guessing
    technique_rationale: >
      State transition validates the rollback transition. Error guessing
      anticipates failure modes (timeout, declined card, network error).
    preconditions:
      - "Cart is in payment_processing state"
      - "Payment attempt has been submitted"
    examples:
      - input:
          current_state: "payment_processing"
          event: "payment_failure"
          failure_reason: "card_declined"
        expected:
          new_state: "checkout_in_progress"
          cart_preserved: true
          error_message: "Payment was declined. Please try another method."
        description: "Card decline returns to checkout with cart preserved."
      - input:
          current_state: "payment_processing"
          event: "payment_failure"
          failure_reason: "gateway_timeout"
        expected:
          new_state: "checkout_in_progress"
          cart_preserved: true
          error_message: "Payment processing timed out. Please try again."
        description: "Gateway timeout returns to checkout safely."
      - input:
          current_state: "payment_processing"
          event: "payment_failure"
          failure_reason: "insufficient_funds"
        expected:
          new_state: "checkout_in_progress"
          cart_preserved: true
          user_can_change_payment: true
        description: "Insufficient funds allows user to change payment method."
    state_transition:
      states:
        - "payment_processing"
        - "checkout_in_progress"
      transitions:
        - from: "payment_processing"
          to: "checkout_in_progress"
          trigger: "payment_failure"
          guard: "none"
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - state-machine
      - payment
      - error-recovery

  # ==========================================================================
  # STATE TRANSITION — 1-switch coverage (common paths)
