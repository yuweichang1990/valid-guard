  - name: "EG-01: Stock changes between checkout start and payment"
    description: >
      Race condition: items are in stock when checkout starts, but go
      out of stock before payment is processed. The system must detect
      this and prevent the order from being confirmed.
    type: edge_case
    risk: high
    risk_rationale: >
      Impact: 3 — Overselling causes fulfillment failures and customer
      dissatisfaction.
      Frequency: 2 — Possible during high-demand sales events.
      Consequence: 3 — Overselling leads to cancellations and refunds.
      Detectability: 3 — Customer does not know stock changed until
      order is cancelled later.
      Average: 2.75 -> high.
    techniques:
      - error_guessing
      - state_transition
    technique_rationale: >
      Error guessing identifies the race condition between stock check
      at checkout and actual inventory at payment. State transition
      verifies the system handles this mid-flow state correctly.
    preconditions:
      - "Cart passes checkout guard (all items in stock)"
      - "Another purchase depletes stock between checkout and payment"
    examples:
      - input:
          cart: [{ sku: "LIMITED-1", qty: 1 }]
          stock_at_checkout: 1
          stock_at_payment: 0
        expected:
          payment_blocked: true
          error: "ITEMS_OUT_OF_STOCK"
          state: "checkout_in_progress"
        description: "Stock depleted after checkout — payment blocked."
      - input:
          cart: [{ sku: "POPULAR-1", qty: 5 }, { sku: "POPULAR-2", qty: 3 }]
          stock_at_checkout: [5, 3]
          stock_at_payment: [5, 1]
        expected:
          payment_blocked: true
          error: "INSUFFICIENT_STOCK"
