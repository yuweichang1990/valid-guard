    description: >
      Equivalence partitioning for the stock guard condition. Tests
      scenarios where all items are in stock, some are out of stock,
      and all are out of stock.
    type: error_handling
    risk: high
    risk_rationale: >
      Impact: 3 — Stock validation prevents overselling.
      Frequency: 3 — Checked on every checkout attempt.
      Consequence: 3 — Overselling causes fulfillment failures.
      Detectability: 2 — Out-of-stock may not be caught until fulfillment.
      Average: 2.75 -> high.
    techniques:
      - equivalence_partitioning
    technique_rationale: >
      The stock status of cart items partitions into three classes:
      all in stock, some out of stock, all out of stock.
    preconditions:
      - "Cart is in items_added state with multiple items"
    examples:
      - input:
          cart:
            - { sku: "ITEM-A", qty: 2, stock: 10 }
            - { sku: "ITEM-B", qty: 1, stock: 5 }
          event: "click_checkout"
        expected:
          checkout_allowed: true
          new_state: "checkout_in_progress"
        description: "All items in stock — checkout proceeds."
      - input:
          cart:
            - { sku: "ITEM-A", qty: 2, stock: 10 }
            - { sku: "ITEM-C", qty: 1, stock: 0 }
          event: "click_checkout"
        expected:
          checkout_allowed: false
          error: "ITEMS_OUT_OF_STOCK"
          out_of_stock_items: ["ITEM-C"]
        description: "One item out of stock — checkout blocked with specific item listed."
      - input:
          cart:
            - { sku: "ITEM-D", qty: 3, stock: 2 }
          event: "click_checkout"
        expected:
          checkout_allowed: false
          error: "INSUFFICIENT_STOCK"
          item: "ITEM-D"
          requested: 3
          available: 2
        description: "Requested quantity exceeds available stock — checkout blocked."
      - input:
          cart:
            - { sku: "ITEM-E", qty: 1, stock: 0 }
            - { sku: "ITEM-F", qty: 1, stock: 0 }
          event: "click_checkout"
        expected:
          checkout_allowed: false
          error: "ITEMS_OUT_OF_STOCK"
          out_of_stock_items: ["ITEM-E", "ITEM-F"]
        description: "All items out of stock — checkout blocked."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - equivalence-partitioning
      - stock-guard
      - checkout

  # ==========================================================================
  # STATE TRANSITION — Terminal state (order_confirmed)
  # ==========================================================================

  - name: "ST-08: Order confirmed is a terminal state"
    description: >
      Verifies that order_confirmed is a terminal (absorbing) state.
      No events should cause a transition out of order_confirmed.
      All events must be rejected.
    type: state_transition
    risk: high
    risk_rationale: >
      Impact: 3 — A confirmed order must not revert or mutate.
      Frequency: 1 — Only applicable after order is confirmed.
      Consequence: 3 — Reverting a confirmed order could cause
      double charges or fulfillment chaos.
      Detectability: 3 — State corruption in confirmed orders may
      not surface until fulfillment.
      Average: 2.5 -> high.
    techniques:
      - state_transition
      - error_guessing
    technique_rationale: >
      State transition testing for the terminal state — all events must
      be rejected. Error guessing anticipates attempts to re-process
      or modify confirmed orders.
    preconditions:
      - "Cart/order is in order_confirmed state"
    examples:
      - input:
          current_state: "order_confirmed"
          event: "add_product"
        expected:
          state_unchanged: true
          error: "ORDER_ALREADY_CONFIRMED"
        description: "Cannot add product to confirmed order."
      - input:
          current_state: "order_confirmed"
          event: "remove_all_items"
        expected:
          state_unchanged: true
          error: "ORDER_ALREADY_CONFIRMED"
        description: "Cannot clear a confirmed order."
      - input:
          current_state: "order_confirmed"
          event: "submit_payment"
        expected:
          state_unchanged: true
          error: "ORDER_ALREADY_CONFIRMED"
        description: "Cannot re-submit payment on confirmed order."
    state_transition:
      states:
        - "order_confirmed"
      transitions: []
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - state-machine
      - terminal-state
      - negative-testing

  # ==========================================================================
  # EDGE CASE — Empty cart guard enforcement
  # ==========================================================================

  - name: "ST-09: Empty cart cannot proceed to checkout"
    description: >
      Verifies the cart-not-empty guard by attempting checkout from
      empty_cart. The system must reject the transition and return
      a clear error message.
    type: error_handling
    risk: high
    risk_rationale: >
      Impact: 3 — Allowing checkout on empty cart corrupts order flow.
      Frequency: 2 — Can happen via direct API calls or race conditions.
      Consequence: 3 — Empty orders cause downstream processing errors.
      Detectability: 1 — Empty cart is immediately visible.
      Average: 2.25 -> medium.
    techniques:
      - equivalence_partitioning
      - state_transition
    technique_rationale: >
      Tests the empty class from equivalence partitioning of cart contents.
      State transition validates the guard prevents the transition.
    preconditions:
      - "Cart is in empty_cart state"
    examples:
      - input:
          current_state: "empty_cart"
          event: "click_checkout"
        expected:
          transition_blocked: true
          state: "empty_cart"
          error: "CART_EMPTY"
        description: "Checkout from empty cart — blocked by guard."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - guard
      - empty-cart
      - negative-testing

  # ==========================================================================
  # STATE TRANSITION — Self-transitions in items_added
  # ==========================================================================

  - name: "ST-10: Self-transitions within items_added state"
    description: >
      Verifies that add_product, update_quantity, and remove_item (when
      items remain) are valid self-transitions that keep the cart in
      items_added state while correctly updating cart contents.
    type: state_transition
    risk: medium
    risk_rationale: >
      Impact: 2 — Cart manipulation is core UX.
      Frequency: 3 — Users frequently modify cart contents.
      Consequence: 2 — Wrong state would be visible but not catastrophic.
      Detectability: 1 — Cart contents are displayed to the user.
      Average: 2.0 -> medium.
    techniques:
      - state_transition
      - equivalence_partitioning
    technique_rationale: >
      State transition for the self-loop transitions. Equivalence
      partitioning for the different cart operations within the same state.
    preconditions:
      - "Cart is in items_added state with at least 2 items"
    examples:
      - input:
          current_state: "items_added"
          event: "add_product"
          product: { sku: "NEW-ITEM", qty: 1 }
        expected:
          new_state: "items_added"
          item_count_increased: true
        description: "Adding product stays in items_added."
      - input:
          current_state: "items_added"
          event: "update_quantity"
          sku: "EXISTING-ITEM"
          new_qty: 3
        expected:
          new_state: "items_added"
          quantity_updated: true
        description: "Updating quantity stays in items_added."
      - input:
          current_state: "items_added"
          event: "remove_item"
          sku: "EXISTING-ITEM"
          remaining_items: 2
        expected:
          new_state: "items_added"
          item_count_decreased: true
        description: "Removing one of several items stays in items_added."
    state_transition:
      states:
        - "items_added"
      transitions:
        - from: "items_added"
          to: "items_added"
          trigger: "add_product"
          guard: "product exists in catalog"
        - from: "items_added"
          to: "items_added"
          trigger: "update_quantity"
          guard: "new quantity > 0 and <= stock"
        - from: "items_added"
          to: "items_added"
          trigger: "remove_item"
          guard: "more than one item remains after removal"
    test_ref: ""
    status: uncovered
    priority: 2
    tags:
      - state-machine
      - self-transition
      - cart-management

  # ==========================================================================
  # CAUSE-EFFECT — Guard interaction logic
  # ==========================================================================

  - name: "CE-01: Cause-effect graph for checkout eligibility"
    description: >
      Maps the logical dependencies between causes (cart state, stock
      status, payment readiness) and effects (checkout allowed, payment
      allowed, order confirmed) using cause-effect graphing.
    type: combinatorial
    risk: high
    risk_rationale: >
      Impact: 3 — Checkout eligibility is the gateway to revenue.
      Frequency: 3 — Evaluated on every purchase attempt.
      Consequence: 3 — Logic errors cause either blocked valid checkouts
      or allowed invalid ones.
      Detectability: 2 — Some cause-effect paths may only manifest
      under specific conditions.
      Average: 2.75 -> high.
    techniques:
      - cause_effect
      - decision_table
    technique_rationale: >
      Cause-effect graphing maps the logical AND/OR relationships between
      guard conditions. The resulting graph is converted to a decision
      table for systematic test generation.
    preconditions:
      - "Cart system is operational"
    examples:
      - input:
          causes:
            cart_has_items: true
            all_items_in_stock: true
            payment_amount_correct: true
            payment_method_valid: true
        expected:
          effects:
            checkout_proceeds: true
            payment_processes: true
            order_confirms: true
        description: "All causes true — all effects fire."
      - input:
          causes:
            cart_has_items: true
            all_items_in_stock: true
            payment_amount_correct: false
            payment_method_valid: true
        expected:
          effects:
            checkout_proceeds: true
            payment_processes: false
            order_confirms: false
        description: "Payment amount wrong — checkout OK but payment blocked."
      - input:
          causes:
            cart_has_items: false
            all_items_in_stock: false
            payment_amount_correct: false
            payment_method_valid: false
        expected:
          effects:
            checkout_proceeds: false
            payment_processes: false
            order_confirms: false
        description: "All causes false — everything blocked."
    decision_table:
      conditions:
        - "cart_has_items"
        - "all_items_in_stock"
        - "payment_amount_correct"
        - "payment_method_valid"
      actions:
        - "checkout_proceeds"
        - "payment_processes"
        - "order_confirms"
      rules:
        - description: "All conditions met"
          condition_values:
            cart_has_items: true
            all_items_in_stock: true
            payment_amount_correct: true
            payment_method_valid: true
          expected_actions:
            checkout_proceeds: true
            payment_processes: true
            order_confirms: true
        - description: "Cart empty — blocks everything"
          condition_values:
            cart_has_items: false
            all_items_in_stock: "N/A"
            payment_amount_correct: "N/A"
            payment_method_valid: "N/A"
          expected_actions:
            checkout_proceeds: false
            payment_processes: false
            order_confirms: false
        - description: "Items out of stock — blocks at checkout"
          condition_values:
            cart_has_items: true
            all_items_in_stock: false
            payment_amount_correct: "N/A"
            payment_method_valid: "N/A"
          expected_actions:
            checkout_proceeds: false
            payment_processes: false
            order_confirms: false
        - description: "Payment amount wrong — blocks at payment"
          condition_values:
            cart_has_items: true
            all_items_in_stock: true
            payment_amount_correct: false
            payment_method_valid: true
          expected_actions:
            checkout_proceeds: true
            payment_processes: false
            order_confirms: false
        - description: "Invalid payment method — blocks at payment"
          condition_values:
            cart_has_items: true
            all_items_in_stock: true
            payment_amount_correct: true
            payment_method_valid: false
          expected_actions:
            checkout_proceeds: true
            payment_processes: false
            order_confirms: false
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - cause-effect
      - guard-logic
      - combinatorial

# ===========================================================================
# Example Mapping
# ===========================================================================
example_mapping:
  story: >
    As an online shopper, I want to manage my shopping cart through a
    predictable state machine so that I can add items, proceed to checkout,
    make payment, and receive order confirmation with proper validation
    at each step.
  rules:
    - rule_name: "Cart state transitions follow defined state machine"
      examples:
        - "Adding a product to empty_cart transitions to items_added"
        - "Adding another product in items_added stays in items_added"
        - "Updating quantity in items_added stays in items_added"
        - "Removing one of several items stays in items_added"
        - "Removing the last item transitions to empty_cart"
        - "Removing all items transitions to empty_cart"
        - "Clicking checkout from items_added transitions to checkout_in_progress (with guards)"
        - "Submitting payment from checkout_in_progress transitions to payment_processing (with guards)"
        - "Payment success transitions to order_confirmed"
        - "Payment failure returns to checkout_in_progress"

    - rule_name: "Cart must not be empty to proceed to checkout"
      examples:
        - "Cart with 1 item -> click_checkout -> checkout_in_progress"
        - "Cart with 0 items -> click_checkout -> blocked with CART_EMPTY error"
        - "Cart where last item removed -> state becomes empty_cart -> checkout blocked"

    - rule_name: "All items must be in stock to proceed to checkout"
      examples:
        - "All items in stock -> checkout allowed"
        - "One item out of stock -> checkout blocked with ITEMS_OUT_OF_STOCK"
        - "Requested quantity exceeds available stock -> checkout blocked with INSUFFICIENT_STOCK"
        - "Stock depleted between checkout and payment -> payment blocked"

    - rule_name: "Payment amount must match cart total"
      examples:
        - "Payment amount equals cart total -> payment proceeds"
        - "Payment amount one cent below cart total -> payment rejected"
        - "Payment amount one cent above cart total -> payment rejected"
        - "Zero payment amount -> payment rejected"
        - "Negative payment amount -> payment rejected"

    - rule_name: "Invalid events are rejected in each state"
      examples:
        - "submit_payment in empty_cart -> INVALID_STATE_TRANSITION"
        - "payment_success in items_added -> INVALID_STATE_TRANSITION"
        - "add_product in checkout_in_progress -> INVALID_OPERATION"
        - "click_checkout in payment_processing -> INVALID_STATE_TRANSITION"
        - "Any event in order_confirmed -> ORDER_ALREADY_CONFIRMED"

    - rule_name: "Payment failure allows retry"
      examples:
        - "Card declined -> return to checkout_in_progress -> retry with different card -> success"
        - "Gateway timeout -> return to checkout_in_progress -> retry -> success"
        - "Multiple consecutive failures -> cart preserved, no partial charges"
        - "Five failures -> rate limiting or cooldown imposed"

    - rule_name: "Cart integrity during state transitions"
      examples:
        - "Cart contents preserved after payment failure"
        - "Cart total recalculated when catalog price changes"
        - "Duplicate add_product increments quantity instead of creating duplicate line"
        - "Concurrent cart modification in multiple tabs is handled safely"

