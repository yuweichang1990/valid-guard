          event: "submit_payment"
        expected:
          new_state: "order_confirmed"
          error: "INVALID_STATE_TRANSITION"
        description: "Cannot submit payment for confirmed order."
      - input:
          current_state: "order_confirmed"
          event: "payment_success"
        expected:
          new_state: "order_confirmed"
          error: "INVALID_STATE_TRANSITION"
        description: "Cannot re-confirm payment on confirmed order."
      - input:
          current_state: "order_confirmed"
          event: "payment_failure"
        expected:
