            - { event: "remove_all_items" }
        expected:
          final_state: "empty_cart"
          cart_items: 0
          cart_total: 0
        description: "Add two items then clear cart returns to empty_cart."
    state_transition:
      states:
        - "empty_cart"
        - "items_added"
      transitions:
        - from: "empty_cart"
          to: "items_added"
          trigger: "add_product"
        - from: "items_added"
          to: "items_added"
          trigger: "add_product"
        - from: "items_added"
          to: "empty_cart"
