  # ==========================================================================
  # GUARD CONDITIONS — Decision table for checkout guard
  # ==========================================================================

  - name: "DT-01: Checkout guard — cart not empty AND all items in stock"
    description: >
      Decision table for the click_checkout transition guard. Two
      conditions must both be true: cart must not be empty, and all items
      must be in stock. Tests all four combinations.
    type: combinatorial
    risk: high
    risk_rationale: >
      Impact: 3 — Guards prevent invalid checkouts; bypassing them
      causes downstream failures.
      Frequency: 3 — Every checkout attempt evaluates these guards.
      Consequence: 3 — Checking out with empty cart or out-of-stock
      items leads to failed orders and bad UX.
      Detectability: 2 — Out-of-stock may fail silently until fulfillment.
      Average: 2.75 -> high.
    techniques:
      - decision_table
      - state_transition
    technique_rationale: >
      Decision table enumerates all combinations of the two boolean
      guard conditions. State transition validates the guarded transition.
    preconditions:
      - "Cart is in items_added state"
    examples:
      - input:
          cart_not_empty: true
          all_items_in_stock: true
          event: "click_checkout"
        expected:
          transition_allowed: true
          new_state: "checkout_in_progress"
        description: "Both guards satisfied — checkout proceeds."
      - input:
          cart_not_empty: true
          all_items_in_stock: false
          event: "click_checkout"
        expected:
          transition_allowed: false
          error: "ITEMS_OUT_OF_STOCK"
          new_state: "items_added"
        description: "Cart has items but some are out of stock — blocked."
      - input:
          cart_not_empty: false
          all_items_in_stock: true
          event: "click_checkout"
        expected:
          transition_allowed: false
          error: "CART_EMPTY"
          new_state: "empty_cart"
        description: "Cart is empty (guard violation) — blocked."
      - input:
          cart_not_empty: false
          all_items_in_stock: false
          event: "click_checkout"
        expected:
          transition_allowed: false
          error: "CART_EMPTY"
          new_state: "empty_cart"
        description: "Cart empty and items out of stock — blocked (empty takes precedence)."
    decision_table:
      conditions:
        - "cart_not_empty"
        - "all_items_in_stock"
      actions:
        - "allow_checkout"
        - "error_message"
      rules:
        - description: "Both guards pass — allow checkout"
          condition_values:
            cart_not_empty: true
            all_items_in_stock: true
          expected_actions:
            allow_checkout: true
            error_message: "none"
