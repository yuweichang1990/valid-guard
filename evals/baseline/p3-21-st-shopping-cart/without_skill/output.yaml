    # =========================================================================
    # SECTION 4: End-to-End Path Tests
    # =========================================================================
    end_to_end_paths:

      - id: "TC-E2E-001"
        title: "Happy path - complete purchase flow"
        path: "empty_cart -> items_added -> checkout_in_progress -> payment_processing -> order_confirmed"
        transitions: ["T01", "T07", "T08", "T09"]
        preconditions:
          - "Cart starts in empty_cart state."
          - "Product A is in stock."
          - "Payment gateway is operational and will approve."
        steps:
          - "Add product A to cart."
          - "Click 'Checkout'."
          - "Enter valid payment details and submit."
          - "Wait for payment gateway approval."
        expected_results:
          - "Cart transitions: empty_cart -> items_added -> checkout_in_progress -> payment_processing -> order_confirmed."
          - "Order confirmation is displayed with order number."
        priority: "high"

      - id: "TC-E2E-002"
        title: "Payment failure and retry path"
        path: "empty_cart -> items_added -> checkout_in_progress -> payment_processing -> checkout_in_progress -> payment_processing -> order_confirmed"
        transitions: ["T01", "T07", "T08", "T10", "T08", "T09"]
        preconditions:
          - "Cart starts in empty_cart state."
          - "Product A is in stock."
          - "Payment gateway will fail on first attempt, succeed on second."
        steps:
          - "Add product A to cart."
          - "Click 'Checkout'."
          - "Submit payment (first attempt - will fail)."
          - "Observe payment failure message."
          - "Submit payment again (second attempt - will succeed)."
          - "Observe order confirmation."
        expected_results:
          - "First payment attempt fails; returns to checkout_in_progress."
          - "Second payment attempt succeeds; transitions to order_confirmed."
          - "Cart contents are preserved between retry attempts."
        priority: "high"

      - id: "TC-E2E-003"
        title: "Add items, remove all, add again, and purchase"
        path: "empty_cart -> items_added -> empty_cart -> items_added -> checkout_in_progress -> payment_processing -> order_confirmed"
        transitions: ["T01", "T06", "T01", "T07", "T08", "T09"]
        preconditions:
          - "Cart starts in empty_cart state."
          - "Products A and B are in stock."
        steps:
          - "Add product A to cart."
          - "Click 'Clear Cart'."
          - "Add product B to cart."
          - "Click 'Checkout'."
          - "Submit valid payment."
          - "Wait for payment gateway approval."
        expected_results:
          - "Cart correctly resets to empty_cart after clearing."
          - "Cart correctly transitions back to items_added on re-add."
          - "Order confirmed for product B only."
        priority: "medium"

      - id: "TC-E2E-004"
        title: "Modify cart during checkout then purchase"
        path: "empty_cart -> items_added -> checkout_in_progress -> checkout_in_progress -> checkout_in_progress -> payment_processing -> order_confirmed"
        transitions: ["T01", "T07", "T11", "T15", "T08", "T09"]
        preconditions:
          - "Cart starts in empty_cart state."
          - "Products A and C are in stock."
        steps:
          - "Add product A (qty 1) to cart."
          - "Click 'Checkout'."
          - "Update product A quantity to 3."
          - "Add product C to cart."
          - "Submit valid payment for updated total."
          - "Wait for payment gateway approval."
        expected_results:
          - "Cart total updates correctly during checkout modifications."
          - "Final order reflects product A (qty 3) and product C (qty 1)."
        priority: "medium"

      - id: "TC-E2E-005"
        title: "Remove last item during checkout returns to empty cart"
        path: "empty_cart -> items_added -> checkout_in_progress -> empty_cart"
        transitions: ["T01", "T07", "T13"]
        preconditions:
          - "Cart starts in empty_cart state."
          - "Product A is in stock."
        steps:
          - "Add product A to cart."
          - "Click 'Checkout'."
          - "Remove product A from order summary."
        expected_results:
          - "Cart transitions from checkout_in_progress to empty_cart."
          - "User is redirected from checkout page."
        priority: "medium"

      - id: "TC-E2E-006"
        title: "Multiple payment failures before success"
        path: "items_added -> checkout_in_progress -> payment_processing -> checkout_in_progress -> payment_processing -> checkout_in_progress -> payment_processing -> order_confirmed"
        transitions: ["T07", "T08", "T10", "T08", "T10", "T08", "T09"]
        preconditions:
          - "Cart is in items_added state with product A."
          - "Payment gateway fails twice, then succeeds."
        steps:
          - "Click 'Checkout'."
          - "Submit payment (fails)."
          - "Submit payment again (fails)."
          - "Submit payment a third time (succeeds)."
        expected_results:
          - "Each failure returns to checkout_in_progress."
          - "Cart contents preserved across all retries."
          - "Third attempt succeeds and order is confirmed."
        priority: "medium"

      - id: "TC-E2E-007"
        title: "Clear cart during checkout after payment failure"
        path: "items_added -> checkout_in_progress -> payment_processing -> checkout_in_progress -> empty_cart"
