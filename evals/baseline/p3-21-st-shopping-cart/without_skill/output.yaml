        expected_results:
          - "Cart is in items_added state with 500 items."
          - "Guard G2_all_items_in_stock evaluates all 500 items."
          - "Checkout transition completes within acceptable time."
        priority: "low"

      - id: "TC-EC-011"
        title: "Payment with floating point precision edge case"
        preconditions:
          - "Cart contains items totaling $33.33 + $33.33 + $33.34 = $100.00."
          - "Cart is in checkout_in_progress state."
        steps:
          - "Submit payment for $100.00."
        expected_results:
          - "Guard G3_payment_matches_total passes despite floating point arithmetic."
          - "Cart transitions to payment_processing."
        priority: "medium"

      - id: "TC-EC-012"
        title: "Remove item that does not exist in cart"
        preconditions:
          - "Cart is in items_added state with product A only."
