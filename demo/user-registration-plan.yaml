example_mapping:
  story: >
    As a new user, I want to register an account with my email and verify
    it so that I can securely access the application.
  rules:
    - rule_name: "Registration requires a unique email and a strong password"
      examples:
        - "Valid email + strong password + matching confirmation -> account created (unverified)"
        - "Duplicate email -> ambiguous success response (prevents enumeration)"
        - "Weak password (too short) -> 400, PASSWORD_TOO_SHORT"
        - "Password confirmation mismatch -> 400, PASSWORD_CONFIRMATION_MISMATCH"
        - "Empty email or password -> 400, field-specific error"
        - "SQL injection in email -> 400, INVALID_EMAIL_FORMAT"
    - rule_name: "Email must be syntactically valid"
      examples:
        - "Minimal valid email (a@b.co) -> accepted"
        - "Plus-addressing (user+tag@example.com) -> accepted"
        - "Missing @ sign -> INVALID_EMAIL_FORMAT"
    - rule_name: "Verification token activates the account within 24 hours"
      examples:
        - "Valid token at 23 hours -> account activated"
        - "Expired token at 24 hours -> TOKEN_EXPIRED, resend offered"
    - rule_name: "Verification resend is rate-limited to 3 per hour"
      examples:
        - "3rd resend in the hour -> allowed, quota exhausted"
        - "4th resend in the hour -> 429, RATE_LIMIT_EXCEEDED"
  questions:
    - "Should registration with a duplicate email return identical timing to prevent enumeration?"
    - "Should plus-addressing variants (user+a@, user+b@) be treated as the same account?"

