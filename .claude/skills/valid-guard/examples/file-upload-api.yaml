# Valid Guard Test Plan — File Upload API
# Design layer: risk, techniques, coverage tracking.
# Executable details: see file-upload-api.feature

feature: "File Upload API"

feature_description: >
  REST API for uploading files (documents, images, archives). Supports up
  to 100 MB, MIME validation, virus scanning, S3 storage, per-user throttle.

risk_level: medium
entry_point: greenfield

source:
  type: natural_language
  path: "docs/specs/file-upload-api.md"

scenarios:
  # ── Happy Path ──────────────────────────────────────────────
  - name: "Upload a valid image file"
    type: happy_path
    risk: medium
    risk_rationale: "Impact: 2, Frequency: 3, Consequence: 2, Detectability: 1. Average: 2.00 → medium."
    techniques: [equivalence_partitioning]
    gherkin_ref: "features/upload/file-upload-api.feature::Upload a valid image file"
    status: covered
    tags: [smoke, critical-path]

  - name: "Upload a valid PDF document"
    type: happy_path
    risk: medium
    risk_rationale: "Impact: 2, Frequency: 2, Consequence: 2, Detectability: 1. Average: 1.75 → medium."
    techniques: [equivalence_partitioning]
    gherkin_ref: "features/upload/file-upload-api.feature::Upload a valid PDF document"
    status: covered
    tags: [smoke]

  # ── Equivalence Partitioning — File Types ───────────────────
  - name: "File type validation — allowed and disallowed types"
    type: edge_case
    risk: high
    risk_rationale: "Impact: 3, Frequency: 2, Consequence: 3, Detectability: 2. Average: 2.50 → high."
    techniques: [equivalence_partitioning]
    gherkin_ref: "features/upload/file-upload-api.feature::File type validation"
    status: covered
    tags: [security, validation]

  - name: "MIME type spoofing — extension does not match content"
    type: security
    risk: high
    risk_rationale: "Impact: 3, Frequency: 1, Consequence: 3, Detectability: 3. Average: 2.50 → high."
    techniques: [error_guessing]
    gherkin_ref: ""
    status: uncovered
    tags: [security]

  # ── Boundary Values — File Size ─────────────────────────────
  - name: "File size at boundaries"
    type: boundary
    risk: medium
    risk_rationale: "Impact: 2, Frequency: 2, Consequence: 2, Detectability: 1. Average: 1.75 → medium."
    techniques: [boundary_value]
    gherkin_ref: "features/upload/file-upload-api.feature::File size boundaries"
    status: covered
    tags: [boundary, validation]

  # ── Concurrency ─────────────────────────────────────────────
  - name: "Concurrent uploads exceeding per-user throttle"
    type: boundary
    risk: medium
    risk_rationale: "Impact: 2, Frequency: 1, Consequence: 2, Detectability: 1. Average: 1.50 → medium."
    techniques: [boundary_value]
    gherkin_ref: ""
    status: uncovered
    tags: [concurrency, boundary]

  # ── Error Handling ──────────────────────────────────────────
  - name: "Upload with missing authentication"
    type: error_handling
    risk: medium
    risk_rationale: "Impact: 2, Frequency: 2, Consequence: 2, Detectability: 1. Average: 1.75 → medium."
    techniques: [equivalence_partitioning]
    gherkin_ref: "features/upload/file-upload-api.feature::Upload with missing authentication"
    status: covered
    tags: [security]

  - name: "Virus detected in uploaded file"
    type: error_handling
    risk: high
    risk_rationale: "Impact: 3, Frequency: 1, Consequence: 3, Detectability: 3. Average: 2.50 → high."
    techniques: [error_guessing]
    gherkin_ref: "features/upload/file-upload-api.feature::Virus detected in uploaded file"
    status: failing
    tags: [security, virus-scan]

  - name: "Storage backend unavailable (S3 outage)"
    type: error_handling
    risk: medium
    risk_rationale: "Impact: 2, Frequency: 1, Consequence: 2, Detectability: 2. Average: 1.75 → medium."
    techniques: [error_guessing]
    gherkin_ref: ""
    status: uncovered
    tags: [reliability, error-handling]

example_mapping:
  story: >
    As a user, I want to upload files to the platform so that I can share
    documents and images with my team.
  rules:
    - rule_name: "Only allowed file types are accepted"
      examples:
        - "JPEG image -> accepted"
        - "EXE executable -> rejected (415)"
        - "Spoofed extension (ELF as .jpg) -> rejected"
    - rule_name: "File size must be between 1 byte and 100 MB"
      examples:
        - "1 byte -> accepted"
        - "0 bytes -> rejected (EMPTY_FILE)"
        - "100 MB + 1 byte -> rejected (FILE_TOO_LARGE)"
    - rule_name: "Uploaded files must pass virus scan"
      examples:
        - "Clean file -> stored normally"
        - "Infected file -> quarantined"

