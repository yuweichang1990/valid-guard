# Valid Guard Test Plan — E-Commerce Checkout
# Design layer: risk, techniques, decision tables, state transitions.
# Executable details: see e-commerce-checkout.feature

feature: "E-Commerce Checkout"

feature_description: >
  End-to-end checkout flow: cart validation, pricing/discounts, payment
  processing, inventory reservation, and order lifecycle management.

risk_level: high
entry_point: greenfield

source:
  type: prd
  path: "docs/prd/checkout-v2.md"

scenarios:
  # ── Happy Path ──────────────────────────────────────────────
  - name: "Successful checkout with a single item"
    type: happy_path
    risk: high
    risk_rationale: "Impact: 3, Frequency: 3, Consequence: 3, Detectability: 1. Average: 2.50 → high."
    techniques: [equivalence_partitioning]
    gherkin_ref: "features/checkout/e-commerce-checkout.feature::Successful checkout with a single item"
    status: covered
    tags: [smoke, critical-path]

  - name: "Successful checkout with multiple items"
    type: happy_path
    risk: high
    risk_rationale: "Impact: 3, Frequency: 3, Consequence: 3, Detectability: 1. Average: 2.50 → high."
    techniques: [equivalence_partitioning]
    gherkin_ref: "features/checkout/e-commerce-checkout.feature::Successful checkout with multiple items"
    status: covered
    tags: [smoke, critical-path]

  - name: "Guest checkout without authentication"
    type: happy_path
    risk: medium
    risk_rationale: "Impact: 2, Frequency: 2, Consequence: 2, Detectability: 1. Average: 1.75 → medium."
    techniques: [equivalence_partitioning]
    gherkin_ref: "features/checkout/e-commerce-checkout.feature::Guest checkout without authentication"
    status: covered
    tags: [guest]

  # ── Edge Cases ──────────────────────────────────────────────
  - name: "Item goes out of stock during payment"
    type: edge_case
    risk: high
    risk_rationale: "Impact: 3, Frequency: 2, Consequence: 3, Detectability: 2. Average: 2.50 → high."
    techniques: [error_guessing, state_transition]
    gherkin_ref: ""
    status: uncovered
    tags: [concurrency, inventory]

  - name: "Empty cart checkout attempt"
    type: edge_case
    risk: low
    risk_rationale: "Impact: 1, Frequency: 1, Consequence: 1, Detectability: 1. Average: 1.00 → low."
    techniques: [equivalence_partitioning]
    gherkin_ref: "features/checkout/e-commerce-checkout.feature::Empty cart checkout attempt"
    status: covered
    tags: [validation]

  # ── Boundary Values ─────────────────────────────────────────
  - name: "Order total at minimum ($0.50)"
    type: boundary
    risk: medium
    risk_rationale: "Impact: 2, Frequency: 1, Consequence: 2, Detectability: 2. Average: 1.75 → medium."
    techniques: [boundary_value]
    gherkin_ref: "features/checkout/e-commerce-checkout.feature::Order total boundaries"
    status: covered
    tags: [pricing, boundary]

  - name: "Quantity per SKU at boundary (max 99)"
    type: boundary
    risk: low
    risk_rationale: "Impact: 1, Frequency: 1, Consequence: 1, Detectability: 1. Average: 1.00 → low."
    techniques: [boundary_value]
    gherkin_ref: "features/checkout/e-commerce-checkout.feature::Quantity per SKU boundaries"
    status: failing
    tags: [validation, boundary]

  # ── Error Handling ──────────────────────────────────────────
  - name: "Payment gateway timeout"
    type: error_handling
    risk: high
    risk_rationale: "Impact: 3, Frequency: 2, Consequence: 3, Detectability: 2. Average: 2.50 → high."
    techniques: [error_guessing]
    gherkin_ref: ""
    status: uncovered
    tags: [reliability, payment]

  - name: "Payment declined by issuer"
    type: error_handling
    risk: high
    risk_rationale: "Impact: 3, Frequency: 3, Consequence: 3, Detectability: 1. Average: 2.50 → high."
    techniques: [equivalence_partitioning, error_guessing]
    gherkin_ref: "features/checkout/e-commerce-checkout.feature::Payment declined by issuer"
    status: covered
    tags: [payment, error-handling]

  # ── State Transition ────────────────────────────────────────
  - name: "Order lifecycle state transitions"
    type: state_transition
    risk: high
    risk_rationale: "Impact: 3, Frequency: 3, Consequence: 3, Detectability: 2. Average: 2.75 → high."
    techniques: [state_transition]
    state_transition:
      states: [cart, pending_payment, payment_processing, confirmed, preparing, shipped, delivered, cancelled, refunded]
      transitions:
        - { from: cart, to: pending_payment, trigger: "checkout_initiated" }
        - { from: pending_payment, to: payment_processing, trigger: "payment_submitted" }
        - { from: payment_processing, to: confirmed, trigger: "payment_captured" }
        - { from: payment_processing, to: cancelled, trigger: "payment_failed", guard: "retry_count >= 3" }
        - { from: confirmed, to: cancelled, trigger: "customer_cancel", guard: "time < 30min" }
        - { from: delivered, to: refunded, trigger: "refund_approved", guard: "time < 30days" }
    gherkin_ref: "features/checkout/e-commerce-checkout.feature::Order lifecycle state transitions"
    status: covered
    tags: [state-machine, critical-path]

  # ── Combinatorial / Decision Table ──────────────────────────
  - name: "Discount calculation rules"
    type: combinatorial
    risk: high
    risk_rationale: "Impact: 3, Frequency: 3, Consequence: 3, Detectability: 2. Average: 2.75 → high."
    techniques: [decision_table, pairwise]
    decision_table:
      conditions: [valid_coupon, loyalty_tier, cart_total_above_100, promo_period_active]
      actions: [coupon_discount_pct, loyalty_discount_pct, free_shipping, promo_bonus_pct]
      rules:
        - description: "Gold + coupon + promo + large cart"
          condition_values: { valid_coupon: true, loyalty_tier: gold, cart_total_above_100: true, promo_period_active: true }
          expected_actions: { coupon_discount_pct: 15, loyalty_discount_pct: 10, free_shipping: true, promo_bonus_pct: 5 }
        - description: "No loyalty, no coupon, no promo, small cart"
          condition_values: { valid_coupon: false, loyalty_tier: none, cart_total_above_100: false, promo_period_active: false }
          expected_actions: { coupon_discount_pct: 0, loyalty_discount_pct: 0, free_shipping: false, promo_bonus_pct: 0 }
    gherkin_ref: "features/checkout/e-commerce-checkout.feature::Discount calculation rules"
    status: failing
    tags: [pricing, discounts, decision-table]

  # ── Security ────────────────────────────────────────────────
  - name: "Price tampering via modified cart payload"
    type: security
    risk: high
    risk_rationale: "Impact: 3, Frequency: 2, Consequence: 3, Detectability: 3. Average: 2.75 → high."
    techniques: [error_guessing]
    gherkin_ref: ""
    status: uncovered
    tags: [security, fraud]

  - name: "Replay attack with duplicate order submission"
    type: security
    risk: high
    risk_rationale: "Impact: 3, Frequency: 2, Consequence: 3, Detectability: 2. Average: 2.50 → high."
    techniques: [error_guessing]
    gherkin_ref: ""
    status: uncovered
    tags: [security, idempotency]

example_mapping:
  story: >
    As an online shopper, I want to complete a purchase through checkout
    so that I receive the items I selected.
  rules:
    - rule_name: "Cart must contain at least one in-stock item"
      examples:
        - "In-stock item -> proceed to payment"
        - "Out-of-stock item -> block with error"
        - "Empty cart -> block with CART_EMPTY"
    - rule_name: "Payment must be captured before order is confirmed"
      examples:
        - "Valid card -> captured -> confirmed"
        - "Declined card -> order stays pending"
        - "Gateway timeout -> reversal -> cart preserved"
    - rule_name: "Discounts stack based on coupon, loyalty, and promo"
      examples:
        - "Gold + coupon + promo -> all discounts"
        - "Expired coupon -> rejected"
        - "No qualifications -> full price"
    - rule_name: "Order cancellable within 30 minutes of confirmation"
      examples:
        - "Cancel at 15 min -> allowed"
        - "Cancel at 45 min -> rejected"
  questions:
    - "Can multiple coupon codes be stacked?"
    - "What happens to inventory holds after 5 minutes?"

