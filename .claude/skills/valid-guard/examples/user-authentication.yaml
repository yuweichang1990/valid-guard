  # ── State Transition — Account Lockout ──────────────────────
  - name: "Account lockout after failed login attempts"
    type: state_transition
    risk: high
    risk_rationale: "Impact: 3, Frequency: 2, Consequence: 3, Detectability: 3. Average: 2.75 → high."
    techniques: [state_transition, boundary_value]
    state_transition:
      states: [active, warning, locked, locked_permanent]
      transitions:
        - { from: active, to: warning, trigger: "failed_login", guard: "failed_count == 3" }
        - { from: warning, to: locked, trigger: "failed_login", guard: "failed_count == 5" }
        - { from: locked, to: active, trigger: "lockout_timer_expired", guard: "15 min elapsed" }
        - { from: locked, to: locked_permanent, trigger: "failed_login", guard: "locked_count >= 3" }
        - { from: locked_permanent, to: active, trigger: "admin_unlock" }
    gherkin_ref: "features/auth/user-authentication.feature::Account lockout after failed login attempts"
    status: covered
    tags: [security, state-machine, brute-force]

