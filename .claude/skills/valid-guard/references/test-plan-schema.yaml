$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "test-plan-schema-v2"  # Local identifier; no live URL
title: "Valid Guard Test Plan (BDD-Enhanced)"
description: >
  Schema for Valid Guard test plan YAML files. The YAML plan is the
  design-thinking layer (risk, techniques, coverage tracking). Executable
  test details live in Gherkin .feature files produced by /vg generate.
type: object

required:
  - feature
  - scenarios

properties:
  feature:
    type: string
    description: "Name of the feature under test."
    minLength: 1

  feature_description:
    type: string
    description: "Brief description of the feature's purpose and scope."

  risk_level:
    type: string
    description: "Overall risk level for this feature."
    enum:
      - high
      - medium
      - low

  entry_point:
    type: string
    description: "How this test plan was created."
    enum:
      - greenfield
      - brownfield

  source:
    type: object
    description: "Origin of the test plan."
    required:
      - type
    properties:
      type:
        type: string
        enum:
          - prd
          - natural_language
          - code_analysis
      path:
        type: string
        description: "File path to the source document or code entry point."
    additionalProperties: false

  scenarios:
    type: array
    description: "List of test scenarios for this feature."
    minItems: 1
    items:
      $ref: "#/$defs/scenario"

  example_mapping:
    $ref: "#/$defs/example_mapping"

  questions:
    type: array
    description: "Open questions or ambiguities that need human clarification."
    items:
      type: string

  metadata:
    $ref: "#/$defs/metadata"

additionalProperties: false

# ---------------------------------------------------------------------------
# Reusable definitions
# ---------------------------------------------------------------------------
$defs:
  risk_enum:
    type: string
    enum:
      - high
      - medium
      - low

  scenario_type_enum:
    type: string
    enum:
      - happy_path
      - edge_case
      - boundary
      - error_handling
      - state_transition
      - combinatorial
      - security
      - performance

  technique_enum:
    type: string
    enum:
      - equivalence_partitioning
      - boundary_value
      - decision_table
      - state_transition
      - pairwise
      - cause_effect
      - error_guessing

  status_enum:
    type: string
    enum:
      - uncovered
      - covered
      - partial
      - failing
      - skipped

  # ---- Scenario -----------------------------------------------------------
  scenario:
    type: object
    description: >
      Design-level scenario metadata. Executable Given/When/Then details
      live in the Gherkin .feature file referenced by gherkin_ref.
    required:
      - name
      - risk
    properties:
      name:
        type: string
        description: "Human-readable scenario name."
        minLength: 1

      description:
        type: string
        description: "Brief explanation (optional — Gherkin carries the detail)."

      type:
        $ref: "#/$defs/scenario_type_enum"

      risk:
        $ref: "#/$defs/risk_enum"

      risk_rationale:
        type: string
        description: "Numeric risk scores plus justification."

      techniques:
        type: array
        description: "Testing techniques applied to this scenario."
        items:
          $ref: "#/$defs/technique_enum"
        minItems: 1
        uniqueItems: true

      state_transition:
        $ref: "#/$defs/state_transition_def"

      decision_table:
        $ref: "#/$defs/decision_table_def"

      gherkin_ref:
        type: string
        description: "Path to .feature file and scenario name, e.g. features/auth/login.feature::Successful login"
        pattern: "^$|^.+::.+$"

      status:
        $ref: "#/$defs/status_enum"

      tags:
        type: array
        description: "Freeform labels for filtering and grouping."
        items:
          type: string
        uniqueItems: true

    additionalProperties: false

  # ---- State Transition ---------------------------------------------------
  state_transition_def:
    type: object
    description: "State transition model — design artifact that Gherkin cannot fully express."
    required:
      - states
      - transitions
    properties:
      states:
        type: array
        items:
          type: string
        minItems: 2
        uniqueItems: true
      transitions:
        type: array
        items:
          type: object
          required:
            - from
            - to
            - trigger
          properties:
            from:
              type: string
            to:
              type: string
            trigger:
              type: string
            guard:
              type: string
          additionalProperties: false
        minItems: 1
    additionalProperties: false

  # ---- Decision Table -----------------------------------------------------
  decision_table_def:
    type: object
    description: "Decision table — design artifact for combinatorial logic."
    required:
      - conditions
      - actions
      - rules
    properties:
      conditions:
        type: array
        items:
          type: string
        minItems: 1
      actions:
        type: array
        items:
          type: string
        minItems: 1
      rules:
        type: array
        items:
          type: object
          required:
            - condition_values
            - expected_actions
          properties:
            description:
              type: string
            condition_values:
              type: object
              additionalProperties: true
            expected_actions:
              type: object
              additionalProperties: true
          additionalProperties: false
        minItems: 1
    additionalProperties: false

  # ---- Example Mapping ----------------------------------------------------
  example_mapping:
    type: object
    description: >
      Example Mapping structure: story broken into rules with concrete
      examples. Derived from Matt Wynne's Example Mapping technique.
    required:
      - story
      - rules
    properties:
      story:
        type: string
      rules:
        type: array
        items:
          type: object
          required:
            - rule_name
            - examples
          properties:
            rule_name:
              type: string
            examples:
              type: array
              items:
                type: string
              minItems: 1
          additionalProperties: false
        minItems: 1
      questions:
        type: array
        description: "Open questions discovered during Example Mapping."
        items:
          type: string
    additionalProperties: false

  # ---- Metadata -----------------------------------------------------------
  metadata:
    type: object
    properties:
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
      created_by:
        type: string
      language:
        type: string
      bdd_framework:
        type: string
        description: "BDD framework used (e.g. behave, cucumber-js, cucumber-jvm, cucumber)."
    additionalProperties: false
