    type: edge_case
    risk: high
    risk_rationale: >
      Impact: 3 — floating-point bugs cause incorrect charges. Frequency: 2 —
      certain amount combinations always trigger IEEE 754 issues. Consequence: 3 —
      systematic over/undercharging. Detectability: 1 — errors are fractional
      and extremely hard to notice. Average: 2.25 -> medium, elevated to high
      due to systematic nature.
    techniques:
      - error_guessing
    technique_rationale: >
      Error guessing specifically targets known IEEE 754 floating-point problem
      values that cause precision loss in binary representation.
    preconditions:
