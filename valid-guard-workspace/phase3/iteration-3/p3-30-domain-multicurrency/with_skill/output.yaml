  # ==========================================================================
  # 6. CURRENCY CONVERSION RATE CHANGES (RATE DRIFT)
  # ==========================================================================

  - name: "Rate drift between cart display and payment submission"
    description: >
      The exchange rate displayed to the user when they view the cart may differ
      from the rate available when the payment is actually processed. The system
      must handle this drift — either by locking the rate at cart time, applying
      the current rate, or rejecting if drift exceeds a threshold.
    type: edge_case
    risk: high
    risk_rationale: >
      Impact: 3 — charging a different amount than displayed violates consumer
      trust and potentially regulations. Frequency: 2 — exchange rates change
      continuously; any delay between display and submission creates drift.
      Consequence: 3 — overcharging triggers chargebacks; undercharging causes
      losses. Detectability: 1 — small drift amounts go unnoticed by both
      parties. Average: 2.25 -> medium, elevated to high due to regulatory and
      financial implications.
    techniques:
      - state_transition
      - error_guessing
      - cause_effect
    technique_rationale: >
      State transition models the payment lifecycle from rate-quoted to
      rate-applied. Error guessing anticipates the timing gap issue. Cause-effect
      maps the relationship between drift magnitude and system response.
    preconditions:
      - "Multi-currency support is enabled"
      - "Cart was displayed with exchange rate R1"
      - "Payment is submitted when exchange rate has changed to R2"
    examples:
      - input:
          cart_display_rate: 1.0800
          payment_submission_rate: 1.0810
          amount_in_display_currency: 100.00
          display_currency: "EUR"
          charge_currency: "USD"
          card_token: "tok_valid_visa"
          rate_lock_enabled: true
        expected:
          http_status: 200
          charged_amount_usd: 108.00
          rate_used: 1.0800
          rate_source: "locked_at_cart_time"
        description: "Rate locked at cart display time — customer charged the displayed amount."
      - input:
          cart_display_rate: 1.0800
          payment_submission_rate: 1.1200
          amount_in_display_currency: 100.00
          display_currency: "EUR"
          charge_currency: "USD"
          card_token: "tok_valid_visa"
          rate_lock_enabled: false
          drift_threshold_pct: 2.0
        expected:
          http_status: 409
          error_code: "RATE_DRIFT_EXCEEDED"
          error_message: "Exchange rate has changed by 3.7% since cart was displayed. Please review the updated price."
          updated_rate: 1.1200
          updated_total_usd: 112.00
        description: "Rate drift exceeds 2% threshold — payment blocked, user must re-confirm."
      - input:
          cart_display_rate: 1.0800
          payment_submission_rate: 1.0815
          amount_in_display_currency: 100.00
          display_currency: "EUR"
          charge_currency: "USD"
          card_token: "tok_valid_visa"
          rate_lock_enabled: false
          drift_threshold_pct: 2.0
        expected:
          http_status: 200
          charged_amount_usd: 108.15
          rate_used: 1.0815
          rate_source: "current_market_rate"
        description: "Rate drift within threshold — payment proceeds at current rate."
    state_transition:
      states:
        - "rate_quoted"
        - "rate_locked"
        - "rate_validated"
        - "payment_processed"
        - "rate_expired"
        - "re_quote_required"
      transitions:
        - from: "rate_quoted"
          to: "rate_locked"
          trigger: "checkout_initiated"
          guard: "rate_lock_enabled == true"
        - from: "rate_quoted"
          to: "rate_validated"
          trigger: "payment_submitted"
          guard: "rate_lock_enabled == false AND drift <= threshold"
        - from: "rate_quoted"
          to: "re_quote_required"
          trigger: "payment_submitted"
          guard: "rate_lock_enabled == false AND drift > threshold"
        - from: "rate_locked"
          to: "payment_processed"
          trigger: "payment_captured"
        - from: "rate_locked"
          to: "rate_expired"
          trigger: "lock_timeout"
          guard: "time_since_lock > lock_duration"
        - from: "rate_validated"
          to: "payment_processed"
          trigger: "payment_captured"
        - from: "re_quote_required"
          to: "rate_quoted"
          trigger: "new_rate_displayed"
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - currency-conversion
      - rate-drift
      - state-machine
      - edge-case

  - name: "Rate lock expiration during slow checkout"
    description: >
      If rate locking is enabled, the locked rate should have a time-to-live.
      If the customer takes too long to complete checkout, the locked rate
      expires and a new rate must be fetched.
    type: state_transition
    risk: medium
    risk_rationale: >
      Impact: 2 — expired rate lock is an inconvenience but not a financial
      error. Frequency: 2 — common when users are distracted during checkout.
      Consequence: 2 — user must re-confirm price, may abandon cart.
      Detectability: 3 — the re-quote prompt is visible to the user.
      Average: 2.25 -> medium.
    techniques:
      - state_transition
      - boundary_value
    technique_rationale: >
      State transition covers the rate lifecycle. Boundary value tests the
      exact lock expiration boundary.
    preconditions:
      - "Rate lock is enabled with a 15-minute TTL"
      - "Exchange rate was locked at checkout initiation"
    examples:
      - input:
          rate_locked_at: "2026-03-14T08:00:00Z"
          payment_submitted_at: "2026-03-14T08:14:59Z"
          lock_ttl_minutes: 15
          locked_rate: 1.0800
          current_rate: 1.0900
          amount: 100.00
          currency: "EUR"
          card_token: "tok_valid_visa"
        expected:
          http_status: 200
          rate_used: 1.0800
          charged_amount: 108.00
        description: "Payment submitted 1 second before lock expires — uses locked rate."
      - input:
          rate_locked_at: "2026-03-14T08:00:00Z"
          payment_submitted_at: "2026-03-14T08:15:01Z"
          lock_ttl_minutes: 15
          locked_rate: 1.0800
          current_rate: 1.0900
          amount: 100.00
          currency: "EUR"
          card_token: "tok_valid_visa"
        expected:
          http_status: 409
          error_code: "RATE_LOCK_EXPIRED"
          error_message: "The quoted exchange rate has expired. Please review the updated price."
          new_rate: 1.0900
          new_total: 109.00
        description: "Payment submitted 1 second after lock expires — must re-quote."
    state_transition:
      states:
        - "rate_locked"
        - "rate_expired"
        - "payment_processed"
      transitions:
        - from: "rate_locked"
          to: "payment_processed"
          trigger: "payment_submitted"
          guard: "time_since_lock < lock_ttl"
        - from: "rate_locked"
          to: "rate_expired"
          trigger: "payment_submitted"
          guard: "time_since_lock >= lock_ttl"
    test_ref: ""
    status: uncovered
    priority: 2
    tags:
      - currency-conversion
      - rate-lock
      - state-machine
      - boundary

