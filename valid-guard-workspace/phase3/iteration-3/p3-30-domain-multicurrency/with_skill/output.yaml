          charged_amount: 33.33
        description: "33.33 USD — repeating decimal in binary."
      - input:
          amount: 19.99
          currency: "USD"
          card_token: "tok_valid_visa"
        expected:
          http_status: 200
          charged_amount: 19.99
        description: "19.99 USD — common retail price that is imprecise in IEEE 754."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - precision
      - floating-point
      - edge-case

  - name: "Concurrent payment submissions with same card token"
    description: >
      Two payment requests arrive simultaneously for the same card token.
      The API must handle this without double-charging — either via idempotency
      keys or request deduplication.
    type: edge_case
    risk: high
    risk_rationale: >
      Impact: 3 — double charging a customer is a serious financial and trust
      issue. Frequency: 2 — possible from network retries, double-clicks, or
      aggressive client-side retry logic. Consequence: 3 — financial loss,
      chargebacks, customer churn. Detectability: 1 — duplicate charges may
      not be caught until statement review. Average: 2.25 -> medium, elevated
      to high due to financial impact.
    techniques:
      - error_guessing
      - state_transition
    technique_rationale: >
      Error guessing targets the concurrency/race condition. State transition
      models the payment state to ensure only one transition to 'charged'
      occurs per idempotency key.
    preconditions:
      - "Payment API is available"
      - "Idempotency mechanism is in place"
    examples:
      - input:
          request_1:
            amount: 100.00
            currency: "USD"
            card_token: "tok_valid_visa"
            idempotency_key: "idem-key-001"
          request_2:
            amount: 100.00
            currency: "USD"
            card_token: "tok_valid_visa"
            idempotency_key: "idem-key-001"
          submission_delay_ms: 0
        expected:
          request_1_status: 200
          request_2_status: 200
          total_charges: 1
          request_2_body: "original_transaction"
        description: "Duplicate request with same idempotency key — only one charge created."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - concurrency
      - idempotency
      - security

  - name: "Special characters and injection in currency field"
    description: >
      Malicious input in the currency field such as SQL injection, script tags,
      or control characters must be safely rejected without executing.
    type: security
    risk: high
    risk_rationale: >
      Impact: 3 — injection attacks can compromise the entire system.
      Frequency: 1 — targeted attacks are infrequent but automated scanners
      are common. Consequence: 3 — data breach, system compromise.
      Detectability: 1 — successful injections are often silent.
      Average: 2.0 -> medium, elevated to high due to catastrophic worst case.
    techniques:
      - error_guessing
    technique_rationale: >
      Error guessing applies domain knowledge about common injection attack
      patterns targeting string input fields.
    preconditions:
      - "Payment API is available"
    examples:
      - input:
          amount: 100.00
          currency: "'; DROP TABLE payments; --"
          card_token: "tok_valid_visa"
        expected:
          http_status: 400
          error_code: "INVALID_CURRENCY"
        description: "SQL injection attempt in currency field — safely rejected."
      - input:
          amount: 100.00
          currency: "<script>alert('xss')</script>"
          card_token: "tok_valid_visa"
        expected:
          http_status: 400
          error_code: "INVALID_CURRENCY"
        description: "XSS attempt in currency field — safely rejected."
      - input:
          amount: 100.00
          currency: "US\x00D"
          card_token: "tok_valid_visa"
        expected:
          http_status: 400
          error_code: "INVALID_CURRENCY"
        description: "Null byte injection in currency field — safely rejected."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - security
      - injection
      - currency

# ===========================================================================
# Example Mapping
# ===========================================================================
example_mapping:
  story: >
    As a customer making an international purchase, I want to pay in my preferred
    currency so that I know exactly how much I am being charged, with the API
    correctly validating currency codes, enforcing decimal precision rules, and
    handling cross-currency conversion transparently.
  rules:
    - rule_name: "Currency code must be a valid ISO 4217 alphabetic code"
      examples:
        - "USD, EUR, GBP, JPY -> accepted"
        - "XXX (ISO test code) -> rejected with INVALID_CURRENCY"
        - "ZZZ (non-existent) -> rejected with INVALID_CURRENCY"
        - "Empty string -> rejected with MISSING_CURRENCY"
        - "Numeric 840 -> rejected with INVALID_CURRENCY_TYPE"
        - "Lowercase 'usd' -> rejected (or normalized; document behavior)"
        - "Null or missing field -> rejected with MISSING_CURRENCY"
        - "SQL injection string -> rejected with INVALID_CURRENCY"

    - rule_name: "Payment amount must be non-negative"
      examples:
        - "Positive amount (49.99 USD) -> payment processed"
        - "Negative amount (-0.01 USD) -> rejected with INVALID_AMOUNT"
        - "Large negative (-99999999999.99) -> rejected with INVALID_AMOUNT"

    - rule_name: "Zero-amount transactions follow merchant configuration"
      examples:
        - "Amount 0 with zero-auth enabled and processor supports it -> card verified"
        - "Amount 0 with zero-auth enabled but processor does not support -> 502 error"
        - "Amount 0 with zero-auth disabled -> rejected with zero_amount_not_allowed"

    - rule_name: "Decimal precision must match currency-specific rules"
      examples:
        - "USD/EUR with 2 decimal places -> accepted"
        - "USD with 3 decimal places (10.999) -> rejected with INVALID_PRECISION"
        - "JPY as whole number (1000) -> accepted"
        - "JPY with decimals (1000.50) -> rejected with INVALID_PRECISION"
        - "BHD with 3 decimal places (10.123) -> accepted"
        - "BHD with 4 decimal places (10.1234) -> rejected with INVALID_PRECISION"

    - rule_name: "Amounts must not exceed system maximum limits"
      examples:
        - "At maximum limit (999999.99 USD) -> accepted"
        - "One cent above limit (1000000.00 USD) -> rejected with AMOUNT_TOO_LARGE"
        - "Integer overflow value (21474836.48 USD = 2^31 cents) -> rejected"
        - "Near 64-bit overflow -> rejected with AMOUNT_TOO_LARGE"

    - rule_name: "Currency conversion rate drift must be managed"
      examples:
        - "Rate locked at cart time, small drift -> charged at locked rate"
        - "Rate not locked, drift > threshold -> 409 RATE_DRIFT_EXCEEDED, re-confirm required"
        - "Rate not locked, drift < threshold -> charged at current rate"
        - "Rate lock expired after TTL -> 409 RATE_LOCK_EXPIRED, re-quote required"

    - rule_name: "Mixed-currency carts are converted to payment currency"
      examples:
        - "All EUR items, payment in USD -> each item converted, total in USD"
        - "Items in EUR, GBP, JPY, payment in USD -> all converted individually"
        - "One item in unsupported currency -> entire payment rejected"
        - "Rounding strategy preserves accuracy across multiple conversions"

