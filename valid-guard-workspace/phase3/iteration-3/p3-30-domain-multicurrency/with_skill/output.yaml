# Valid Guard Test Plan — Multi-Currency Payment API
# Generated: 2026-03-14T09:00:00Z
# Source: natural language

feature: "Multi-Currency Payment API"

feature_description: >
  REST API endpoint POST /payments that processes multi-currency transactions.
  Accepts a JSON payload with {amount, currency, card_token}. Must validate
  currency codes against ISO 4217, enforce currency-specific decimal precision
  rules (e.g., USD=2, JPY=0, BHD=3), handle boundary amounts including zero
  and extremely large values, and correctly manage currency conversion scenarios
  including rate drift and mixed-currency carts.

risk_level: high

entry_point: greenfield

source:
  type: natural_language
  path: ""

scenarios:
  # ==========================================================================
  # 1. INVALID CURRENCY CODES
  # ==========================================================================

  - name: "Reject non-existent ISO 4217 currency code"
    description: >
      Submitting a currency code that is syntactically valid (3 uppercase letters)
      but does not exist in ISO 4217 (e.g., 'XXX', 'ZZZ') must return a 400 error
      with a clear message identifying the invalid currency.
    type: error_handling
    risk: high
    risk_rationale: >
      Impact: 3 — accepting an invalid currency could lead to unrecoverable
      payment processing errors. Frequency: 2 — can happen via API integrations
      or misconfigured clients. Consequence: 3 — financial data corruption or
      silent payment failures. Detectability: 2 — may not be immediately visible
      if the error is swallowed downstream. Average: 2.5 -> high.
    techniques:
      - equivalence_partitioning
      - error_guessing
    technique_rationale: >
      Equivalence partitioning divides currency codes into valid ISO 4217 codes
      and invalid codes. Error guessing targets commonly confused or placeholder
      codes like XXX (which ISO 4217 reserves for testing) and ZZZ (which does
      not exist at all).
    preconditions:
      - "Payment API is available and accepting requests"
      - "A valid card_token exists for the test account"
    examples:
      - input:
          amount: 100.00
          currency: "XXX"
          card_token: "tok_valid_visa"
        expected:
          http_status: 400
          error_code: "INVALID_CURRENCY"
          error_message: "Currency code 'XXX' is not a supported ISO 4217 currency."
        description: "XXX is an ISO 4217 reserved code for testing, not a real currency."
      - input:
          amount: 50.00
          currency: "ZZZ"
          card_token: "tok_valid_visa"
        expected:
          http_status: 400
          error_code: "INVALID_CURRENCY"
          error_message: "Currency code 'ZZZ' is not a supported ISO 4217 currency."
        description: "ZZZ does not exist in any ISO standard."
      - input:
          amount: 25.00
          currency: "ABC"
          card_token: "tok_valid_visa"
        expected:
          http_status: 400
          error_code: "INVALID_CURRENCY"
          error_message: "Currency code 'ABC' is not a supported ISO 4217 currency."
        description: "Random three-letter code that is not a valid currency."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - validation
      - currency
      - error-handling

  - name: "Reject empty string as currency code"
    description: >
      Submitting an empty string for the currency field must be rejected.
      The API should not attempt to process a payment without knowing
      the currency.
    type: error_handling
    risk: high
    risk_rationale: >
      Impact: 3 — missing currency could cause the payment processor to assume
      a default currency, leading to incorrect charges. Frequency: 2 — possible
      from malformed API requests or incomplete form submissions. Consequence: 3 —
      customer charged in wrong currency. Detectability: 2 — might appear to
      succeed if a default is silently applied. Average: 2.5 -> high.
    techniques:
      - equivalence_partitioning
      - boundary_value
    technique_rationale: >
      Equivalence partitioning identifies the empty string as a distinct invalid
      class. Boundary value analysis treats the empty string as the minimum-length
      boundary for the currency field (length 0 vs. required length 3).
    preconditions:
      - "Payment API is available"
    examples:
      - input:
          amount: 100.00
          currency: ""
          card_token: "tok_valid_visa"
        expected:
          http_status: 400
          error_code: "MISSING_CURRENCY"
          error_message: "Currency code is required and cannot be empty."
        description: "Empty string currency must be rejected."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - validation
      - currency
      - boundary

  - name: "Reject numeric value as currency code"
    description: >
      Submitting a numeric value (e.g., 840 for USD's ISO 4217 numeric code,
      or arbitrary numbers like 123) as the currency field must be rejected.
      The API expects alphabetic ISO 4217 codes, not numeric codes.
    type: error_handling
    risk: medium
    risk_rationale: >
      Impact: 2 — type mismatch would be caught by most serialization layers.
      Frequency: 1 — uncommon, but possible if a client uses the numeric ISO
      code variant. Consequence: 2 — payment would fail, but no silent corruption.
      Detectability: 3 — error would be immediately visible. Average: 2.0 -> medium.
    techniques:
      - equivalence_partitioning
      - error_guessing
    technique_rationale: >
      Equivalence partitioning classifies numeric values as a distinct invalid
      type class. Error guessing anticipates confusion between ISO 4217 alpha
      codes and numeric codes (e.g., 840 = USD).
    preconditions:
      - "Payment API is available"
    examples:
      - input:
          amount: 100.00
          currency: 840
          card_token: "tok_valid_visa"
        expected:
          http_status: 400
          error_code: "INVALID_CURRENCY_TYPE"
          error_message: "Currency must be a 3-letter ISO 4217 alphabetic code, not a number."
        description: "ISO 4217 numeric code 840 (USD) submitted instead of 'USD'."
      - input:
          amount: 50.00
          currency: 123
          card_token: "tok_valid_visa"
        expected:
          http_status: 400
          error_code: "INVALID_CURRENCY_TYPE"
          error_message: "Currency must be a 3-letter ISO 4217 alphabetic code, not a number."
        description: "Arbitrary numeric value as currency."
      - input:
          amount: 75.00
          currency: "123"
          card_token: "tok_valid_visa"
        expected:
          http_status: 400
          error_code: "INVALID_CURRENCY"
          error_message: "Currency code '123' is not a supported ISO 4217 currency."
        description: "Numeric string (not a valid alpha code)."
    test_ref: ""
    status: uncovered
    priority: 2
    tags:
      - validation
      - currency
      - type-safety

  - name: "Reject lowercase and mixed-case currency codes"
    description: >
      ISO 4217 currency codes are uppercase. Submitting 'usd', 'Usd', or 'usD'
      tests whether the API enforces or normalizes casing. The expected behavior
      should be documented: either reject with an error or normalize to uppercase.
    type: edge_case
    risk: low
    risk_rationale: >
      Impact: 1 — if the API normalizes casing, no harm; if it rejects, the
      error is clear. Frequency: 2 — common user input variation.
      Consequence: 1 — minor inconvenience, easily corrected. Detectability: 3 —
      immediately visible error. Average: 1.75 -> medium, but downgraded to low
      because the failure mode is benign.
    techniques:
      - equivalence_partitioning
    technique_rationale: >
      Equivalence partitioning distinguishes valid uppercase codes from case
      variants as a separate input class.
    preconditions:
      - "Payment API is available"
    examples:
      - input:
          amount: 10.00
          currency: "usd"
          card_token: "tok_valid_visa"
        expected:
          http_status: 400
          error_code: "INVALID_CURRENCY"
          error_message: "Currency code must be uppercase ISO 4217 format (e.g., 'USD')."
        description: "All lowercase currency code rejected (or accepted if API normalizes; document which)."
      - input:
          amount: 10.00
          currency: "Eur"
          card_token: "tok_valid_visa"
        expected:
          http_status: 400
          error_code: "INVALID_CURRENCY"
          error_message: "Currency code must be uppercase ISO 4217 format (e.g., 'EUR')."
        description: "Mixed-case currency code."
    test_ref: ""
    status: uncovered
    priority: 4
    tags:
      - validation
      - currency
      - normalization

  - name: "Reject null and missing currency field"
    description: >
      Submitting a request with currency set to null or with the currency field
      entirely omitted must return a clear validation error.
    type: error_handling
    risk: high
    risk_rationale: >
      Impact: 3 — missing currency can cause undefined behavior in payment
      processing. Frequency: 2 — possible from incomplete API integrations.
      Consequence: 3 — payment could be processed in a default or wrong currency.
      Detectability: 2 — might silently default. Average: 2.5 -> high.
    techniques:
      - equivalence_partitioning
      - error_guessing
    technique_rationale: >
      Equivalence partitioning identifies null/missing as distinct invalid input
      classes. Error guessing anticipates the common mistake of omitting required
      fields.
    preconditions:
      - "Payment API is available"
    examples:
      - input:
          amount: 100.00
          currency: null
          card_token: "tok_valid_visa"
        expected:
          http_status: 400
          error_code: "MISSING_CURRENCY"
          error_message: "Currency code is required."
        description: "Null currency value."
      - input:
          amount: 100.00
          card_token: "tok_valid_visa"
        expected:
          http_status: 400
          error_code: "MISSING_CURRENCY"
          error_message: "Currency code is required."
        description: "Currency field entirely omitted from payload."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - validation
      - currency
      - required-fields

  # ==========================================================================
  # 2. NEGATIVE PAYMENT AMOUNTS
  # ==========================================================================

  - name: "Reject negative payment amount"
    description: >
      Negative amounts must be rejected. Payment amounts represent charges to
      the customer and must be non-negative. Refunds use a separate endpoint or
      mechanism.
    type: error_handling
    risk: high
    risk_rationale: >
      Impact: 3 — a negative amount could trigger a credit/refund instead of a
      charge, causing direct financial loss. Frequency: 2 — possible from
      malicious API callers or arithmetic bugs in client code. Consequence: 3 —
      financial loss, potential for exploitation. Detectability: 1 — a refund
      processed as a payment might not be caught quickly. Average: 2.25 -> medium,
      but elevated to high due to financial consequence severity.
    techniques:
      - equivalence_partitioning
      - boundary_value
      - error_guessing
    technique_rationale: >
      Equivalence partitioning separates positive, zero, and negative amount
      classes. Boundary value analysis tests -0.01 (just below zero). Error
      guessing targets large negative values and edge cases like -1.
    preconditions:
      - "Payment API is available"
    examples:
      - input:
          amount: -0.01
          currency: "USD"
          card_token: "tok_valid_visa"
        expected:
          http_status: 400
          error_code: "INVALID_AMOUNT"
          error_message: "Payment amount must be greater than or equal to zero."
        description: "Smallest negative amount — one cent below zero in USD."
      - input:
          amount: -100.00
          currency: "USD"
          card_token: "tok_valid_visa"
        expected:
          http_status: 400
          error_code: "INVALID_AMOUNT"
          error_message: "Payment amount must be greater than or equal to zero."
        description: "Typical negative amount."
      - input:
          amount: -99999999999.99
          currency: "USD"
          card_token: "tok_valid_visa"
        expected:
          http_status: 400
          error_code: "INVALID_AMOUNT"
          error_message: "Payment amount must be greater than or equal to zero."
        description: "Extremely large negative value."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - validation
      - amount
      - security

  # ==========================================================================
  # 3. ZERO-AMOUNT TRANSACTIONS
  # ==========================================================================

  - name: "Zero-amount transaction for card authorization"
    description: >
      Some payment processors support $0.00 authorization to validate a card
      without charging. The API should either accept $0 for auth purposes or
      reject it with a specific error, depending on business rules. Both
      behaviors must be explicitly tested.
    type: boundary
    risk: high
    risk_rationale: >
      Impact: 3 — $0 auth is a legitimate use case for card verification.
      Frequency: 2 — used in subscription sign-ups and card-on-file flows.
      Consequence: 3 — rejecting valid $0 auth blocks onboarding; accepting
      unintended $0 charges wastes processing fees. Detectability: 2 — behavior
      may differ by processor. Average: 2.5 -> high.
    techniques:
      - boundary_value
      - equivalence_partitioning
      - decision_table
    technique_rationale: >
      Boundary value analysis tests the zero boundary. Equivalence partitioning
      separates zero-amount as a distinct class from positive amounts. Decision
      table captures the conditional logic: whether $0 auth is allowed depends
      on merchant configuration and processor capabilities.
    preconditions:
      - "Payment API is available"
      - "Merchant account is configured (test both $0-auth-enabled and disabled configurations)"
    examples:
      - input:
          amount: 0
          currency: "USD"
          card_token: "tok_valid_visa"
        expected:
          http_status: 200
          transaction_type: "authorization"
          charged_amount: 0.00
          card_verified: true
        description: "Zero-amount USD authorization succeeds when $0 auth is enabled."
      - input:
          amount: 0.00
          currency: "EUR"
          card_token: "tok_valid_visa"
        expected:
          http_status: 200
          transaction_type: "authorization"
          charged_amount: 0.00
          card_verified: true
        description: "Zero-amount EUR authorization with explicit decimal."
      - input:
          amount: 0
          currency: "JPY"
          card_token: "tok_valid_visa"
        expected:
          http_status: 200
          transaction_type: "authorization"
          charged_amount: 0
          card_verified: true
        description: "Zero-amount JPY authorization (JPY has no decimal places)."
    decision_table:
      conditions:
        - "amount_is_zero"
        - "zero_auth_enabled"
        - "processor_supports_zero_auth"
      actions:
        - "http_status"
        - "transaction_outcome"
      rules:
        - description: "Zero amount, zero-auth enabled, processor supports it"
          condition_values:
            amount_is_zero: true
            zero_auth_enabled: true
            processor_supports_zero_auth: true
          expected_actions:
            http_status: 200
            transaction_outcome: "card_verified"
        - description: "Zero amount, zero-auth enabled, processor does NOT support it"
          condition_values:
            amount_is_zero: true
            zero_auth_enabled: true
            processor_supports_zero_auth: false
          expected_actions:
            http_status: 502
            transaction_outcome: "processor_unsupported"
        - description: "Zero amount, zero-auth disabled"
          condition_values:
            amount_is_zero: true
            zero_auth_enabled: false
            processor_supports_zero_auth: true
          expected_actions:
            http_status: 400
            transaction_outcome: "zero_amount_not_allowed"
        - description: "Zero amount, zero-auth disabled, processor does not support"
          condition_values:
            amount_is_zero: true
            zero_auth_enabled: false
            processor_supports_zero_auth: false
          expected_actions:
            http_status: 400
            transaction_outcome: "zero_amount_not_allowed"
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - boundary
      - amount
      - card-verification
      - decision-table

  # ==========================================================================
  # 4. DECIMAL PRECISION MISMATCHES BY CURRENCY
  # ==========================================================================

  - name: "USD payment with correct 2-decimal precision"
    description: >
      USD uses 2 decimal places. A payment of $99.99 should be accepted.
      This is the happy-path baseline for decimal precision validation.
    type: happy_path
    risk: high
    risk_rationale: >
      Impact: 3 — core payment flow. Frequency: 3 — every USD transaction.
      Consequence: 3 — incorrect amount processing. Detectability: 2 — may
      not be noticed if rounding silently occurs. Average: 2.75 -> high.
    techniques:
      - equivalence_partitioning
    technique_rationale: >
      Equivalence partitioning confirms that a standard 2-decimal USD amount
      belongs to the valid input class.
    preconditions:
      - "Payment API is available"
    examples:
      - input:
          amount: 99.99
          currency: "USD"
          card_token: "tok_valid_visa"
        expected:
          http_status: 200
          charged_amount: 99.99
          currency: "USD"
        description: "Standard USD payment with 2 decimal places."
      - input:
          amount: 1.50
          currency: "USD"
          card_token: "tok_valid_visa"
        expected:
          http_status: 200
          charged_amount: 1.50
          currency: "USD"
        description: "USD payment with 1 significant decimal digit (trailing zero)."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - precision
      - currency
      - happy-path

  - name: "Reject USD amount with more than 2 decimal places"
    description: >
      USD has 2 decimal places. Amounts like 10.999 or 49.001 have excess
      precision and must be rejected. Silent rounding could cause discrepancies
      between displayed and charged amounts.
    type: error_handling
    risk: high
    risk_rationale: >
      Impact: 3 — incorrect charge amount is a financial integrity issue.
      Frequency: 2 — can occur from floating-point arithmetic in client code.
      Consequence: 3 — overcharge or undercharge relative to what was displayed.
      Detectability: 1 — rounding errors are notoriously hard to detect.
      Average: 2.25 -> medium, elevated to high due to silent failure risk.
    techniques:
      - boundary_value
      - equivalence_partitioning
      - error_guessing
    technique_rationale: >
      Boundary value analysis tests at the precision boundary (2 vs. 3 decimal
      places). Equivalence partitioning separates valid-precision from excess-
      precision classes. Error guessing targets floating-point artifacts like
      10.005 which may result from arithmetic.
    preconditions:
      - "Payment API is available"
    examples:
      - input:
          amount: 10.999
          currency: "USD"
          card_token: "tok_valid_visa"
        expected:
          http_status: 400
          error_code: "INVALID_PRECISION"
          error_message: "USD amounts must have at most 2 decimal places. Received 3."
        description: "Three decimal places for USD — exceeds allowed precision."
      - input:
          amount: 49.001
          currency: "USD"
          card_token: "tok_valid_visa"
        expected:
          http_status: 400
          error_code: "INVALID_PRECISION"
          error_message: "USD amounts must have at most 2 decimal places. Received 3."
        description: "Trailing sub-cent precision in USD."
      - input:
          amount: 0.125
          currency: "EUR"
          card_token: "tok_valid_visa"
        expected:
          http_status: 400
          error_code: "INVALID_PRECISION"
          error_message: "EUR amounts must have at most 2 decimal places. Received 3."
        description: "EUR also uses 2 decimal places — 3 decimals rejected."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - precision
      - currency
      - validation

  - name: "JPY payment with zero decimal places"
    description: >
      Japanese Yen (JPY) has 0 decimal places — amounts must be whole numbers.
      Submitting 1000 should succeed; submitting 1000.50 must be rejected.
    type: boundary
    risk: high
    risk_rationale: >
      Impact: 3 — JPY is a major world currency with high transaction volume.
      Frequency: 2 — all JPY transactions are affected. Consequence: 3 —
      rounding a JPY amount silently could create a discrepancy. Detectability: 1 —
      a 1-yen rounding error is very hard to detect. Average: 2.25 -> medium,
      elevated to high due to volume and silent failure mode.
    techniques:
      - boundary_value
      - equivalence_partitioning
      - error_guessing
    technique_rationale: >
      Boundary value analysis tests the precision boundary at 0 decimals.
      Equivalence partitioning divides JPY amounts into integers (valid) and
      fractional (invalid). Error guessing targets the common mistake of applying
      USD-style cents to JPY.
    preconditions:
      - "Payment API is available"
    examples:
      - input:
          amount: 1000
          currency: "JPY"
          card_token: "tok_valid_visa"
        expected:
          http_status: 200
          charged_amount: 1000
          currency: "JPY"
        description: "Valid JPY payment — whole number."
      - input:
          amount: 1000.50
          currency: "JPY"
          card_token: "tok_valid_visa"
        expected:
          http_status: 400
          error_code: "INVALID_PRECISION"
          error_message: "JPY amounts must be whole numbers with no decimal places. Received 1 decimal place(s)."
        description: "JPY with decimal — rejected."
      - input:
          amount: 1000.00
          currency: "JPY"
          card_token: "tok_valid_visa"
        expected:
          http_status: 200
          charged_amount: 1000
          currency: "JPY"
        description: "JPY with .00 trailing — should be accepted as it equals a whole number."
      - input:
          amount: 1
          currency: "JPY"
          card_token: "tok_valid_visa"
        expected:
          http_status: 200
          charged_amount: 1
          currency: "JPY"
        description: "Minimum meaningful JPY amount — 1 yen."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - precision
      - currency
      - jpy
      - boundary

  - name: "BHD payment with 3 decimal places"
    description: >
      Bahraini Dinar (BHD) uses 3 decimal places (fils). The API must accept
      amounts with up to 3 decimal places and reject amounts with 4 or more.
    type: boundary
    risk: medium
    risk_rationale: >
      Impact: 3 — incorrect precision handling causes financial errors.
      Frequency: 1 — BHD transactions are relatively rare outside MENA region.
      Consequence: 3 — over/undercharge. Detectability: 1 — rounding errors
      are silent. Average: 2.0 -> medium.
    techniques:
      - boundary_value
      - equivalence_partitioning
    technique_rationale: >
      Boundary value analysis tests at the 3-decimal boundary. Equivalence
      partitioning separates valid 3-decimal amounts from invalid 4-decimal
      amounts.
    preconditions:
      - "Payment API is available"
      - "BHD is a supported currency"
    examples:
      - input:
          amount: 10.500
          currency: "BHD"
          card_token: "tok_valid_visa"
        expected:
          http_status: 200
          charged_amount: 10.500
          currency: "BHD"
        description: "Valid BHD payment with 3 decimal places."
      - input:
          amount: 10.123
          currency: "BHD"
          card_token: "tok_valid_visa"
        expected:
          http_status: 200
          charged_amount: 10.123
          currency: "BHD"
        description: "BHD with 3 significant decimal digits."
      - input:
          amount: 10.1234
          currency: "BHD"
          card_token: "tok_valid_visa"
        expected:
          http_status: 400
          error_code: "INVALID_PRECISION"
          error_message: "BHD amounts must have at most 3 decimal places. Received 4."
        description: "BHD with 4 decimal places — exceeds allowed precision."
      - input:
          amount: 10.1
          currency: "BHD"
          card_token: "tok_valid_visa"
        expected:
          http_status: 200
          charged_amount: 10.100
          currency: "BHD"
        description: "BHD with fewer than 3 decimal places — valid, padded to 3."
    test_ref: ""
    status: uncovered
    priority: 2
    tags:
      - precision
      - currency
      - bhd
      - boundary

  - name: "Decimal precision validation across multiple currencies"
    description: >
      Combinatorial test verifying that the correct decimal precision rule is
      applied based on the currency code. Covers the interaction between currency
      selection and amount validation.
    type: combinatorial
    risk: high
    risk_rationale: >
      Impact: 3 — affects all currencies. Frequency: 3 — every transaction.
      Consequence: 3 — financial precision errors. Detectability: 1 — rounding
      errors are silent. Average: 2.5 -> high.
    techniques:
      - decision_table
      - pairwise
    technique_rationale: >
      Decision table maps each currency to its allowed decimal places and
      expected behavior for amounts at and beyond precision boundaries. Pairwise
      covers the currency x precision x amount-format parameter space.
    preconditions:
      - "Payment API is available"
    examples:
      - input:
          amount: 10.99
          currency: "USD"
          card_token: "tok_valid_visa"
        expected:
          http_status: 200
          accepted: true
        description: "USD with 2 decimals — accepted."
      - input:
          amount: 10.999
          currency: "USD"
          card_token: "tok_valid_visa"
        expected:
          http_status: 400
          error_code: "INVALID_PRECISION"
        description: "USD with 3 decimals — rejected."
      - input:
          amount: 1000
          currency: "JPY"
          card_token: "tok_valid_visa"
        expected:
          http_status: 200
          accepted: true
        description: "JPY integer — accepted."
      - input:
          amount: 1000.5
          currency: "JPY"
          card_token: "tok_valid_visa"
        expected:
          http_status: 400
          error_code: "INVALID_PRECISION"
        description: "JPY with decimals — rejected."
      - input:
          amount: 5.123
          currency: "BHD"
          card_token: "tok_valid_visa"
        expected:
          http_status: 200
          accepted: true
        description: "BHD with 3 decimals — accepted."
      - input:
          amount: 5.1234
          currency: "BHD"
          card_token: "tok_valid_visa"
        expected:
          http_status: 400
          error_code: "INVALID_PRECISION"
        description: "BHD with 4 decimals — rejected."
    decision_table:
      conditions:
        - "currency"
        - "decimal_places_in_amount"
      actions:
        - "http_status"
        - "outcome"
      rules:
        - description: "USD with <= 2 decimal places"
          condition_values:
            currency: "USD"
            decimal_places_in_amount: "<=2"
          expected_actions:
            http_status: 200
            outcome: "accepted"
        - description: "USD with > 2 decimal places"
          condition_values:
            currency: "USD"
            decimal_places_in_amount: ">2"
          expected_actions:
            http_status: 400
            outcome: "INVALID_PRECISION"
        - description: "JPY with 0 decimal places"
          condition_values:
            currency: "JPY"
            decimal_places_in_amount: "0"
          expected_actions:
            http_status: 200
            outcome: "accepted"
