            - item_id: "item_001"
              price: 33.33
              currency: "EUR"
            - item_id: "item_002"
              price: 33.33
              currency: "EUR"
            - item_id: "item_003"
              price: 33.34
              currency: "EUR"
          payment_currency: "USD"
          eur_to_usd_rate: 1.0800
          card_token: "tok_valid_visa"
        expected:
          http_status: 200
          total_charged_usd: 108.00
          rounding_strategy: "per_item_then_sum"
        description: "Three EUR items that sum to 100.00 EUR; verify rounding strategy does not create drift."
