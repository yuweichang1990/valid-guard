  - name: "Mixed-currency cart with items in EUR and payment in USD"
    description: >
      Cart contains items priced in EUR, but the customer pays in USD. The API
      must convert all item prices to USD using the applicable exchange rate,
      sum the converted amounts, and charge the total in USD.
    type: edge_case
    risk: high
    risk_rationale: >
      Impact: 3 — incorrect conversion produces wrong total charge. Frequency: 2 —
      common in international e-commerce platforms. Consequence: 3 — financial
      discrepancy between displayed and charged amounts. Detectability: 1 —
      rounding across multiple conversions can hide errors. Average: 2.25 ->
      medium, elevated to high due to cumulative rounding risk across items.
    techniques:
      - equivalence_partitioning
      - error_guessing
      - cause_effect
    technique_rationale: >
      Equivalence partitioning tests same-currency vs. mixed-currency carts.
      Error guessing targets rounding accumulation across multiple line items.
      Cause-effect maps: (item_currencies differ from payment_currency) AND
      (exchange_rate_available) -> conversion applied.
    preconditions:
      - "Multi-currency cart support is enabled"
      - "Exchange rates are available for EUR->USD"
    examples:
      - input:
          cart_items:
            - item_id: "item_001"
              price: 50.00
              currency: "EUR"
