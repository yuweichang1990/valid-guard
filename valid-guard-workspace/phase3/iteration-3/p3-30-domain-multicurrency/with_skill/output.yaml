  # ==========================================================================
  # 5. INTEGER OVERFLOW WITH EXTREMELY LARGE AMOUNTS
  # ==========================================================================

  - name: "Reject extremely large payment amount exceeding system limits"
    description: >
      Extremely large amounts (e.g., 99999999999.99) may exceed integer storage
      limits when converted to minor currency units (cents), cause arithmetic
      overflow, or violate business-rule maximum transaction limits. The API
      must reject these with a clear error.
    type: boundary
    risk: high
    risk_rationale: >
      Impact: 3 — integer overflow can cause wrap-around to negative or zero
      values, resulting in free transactions or credits. Frequency: 1 — rare
      but possible from malicious input. Consequence: 3 — financial loss from
      overflow exploitation. Detectability: 1 — overflow errors are notoriously
      silent. Average: 2.0 -> medium, elevated to high due to catastrophic
      failure potential.
    techniques:
      - boundary_value
      - error_guessing
    technique_rationale: >
      Boundary value analysis tests at the maximum representable amount. Error
      guessing targets values that would overflow when multiplied by 100 (cents
      conversion), specifically values near 2^31, 2^53, and 2^63 boundaries.
    preconditions:
      - "Payment API is available"
    examples:
      - input:
          amount: 99999999999.99
          currency: "USD"
          card_token: "tok_valid_visa"
        expected:
          http_status: 400
          error_code: "AMOUNT_TOO_LARGE"
          error_message: "Payment amount exceeds the maximum allowed limit."
        description: "11-digit amount with cents — likely exceeds processor limits."
      - input:
          amount: 21474836.48
          currency: "USD"
          card_token: "tok_valid_visa"
        expected:
          http_status: 400
          error_code: "AMOUNT_TOO_LARGE"
          error_message: "Payment amount exceeds the maximum allowed limit."
        description: "Amount that, when converted to cents (2147483648), overflows signed 32-bit integer."
      - input:
          amount: 92233720368547758.07
          currency: "USD"
          card_token: "tok_valid_visa"
        expected:
          http_status: 400
          error_code: "AMOUNT_TOO_LARGE"
          error_message: "Payment amount exceeds the maximum allowed limit."
        description: "Amount near 64-bit signed integer max in cents."
      - input:
          amount: 9999999999999999
          currency: "JPY"
          card_token: "tok_valid_visa"
        expected:
          http_status: 400
          error_code: "AMOUNT_TOO_LARGE"
          error_message: "Payment amount exceeds the maximum allowed limit."
        description: "Extremely large JPY amount (no cents conversion but still exceeds limits)."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - boundary
      - overflow
      - security
      - amount

  - name: "Payment at maximum allowed transaction amount"
    description: >
      Tests the exact boundary of the maximum allowed transaction amount.
      Values at the limit should succeed; values one unit above should fail.
    type: boundary
    risk: high
    risk_rationale: >
      Impact: 3 — off-by-one at the max limit could allow or block legitimate
      transactions. Frequency: 1 — large transactions are rare but high value.
      Consequence: 3 — blocking a legitimate large payment loses revenue;
      allowing an oversized one risks fraud. Detectability: 2 — boundary errors
      are found when a high-value transaction is attempted. Average: 2.25 -> medium,
      elevated to high because each occurrence involves large money.
    techniques:
      - boundary_value
    technique_rationale: >
      Classic boundary value analysis at the maximum threshold: test at limit,
      limit-1, and limit+1.
    preconditions:
      - "Payment API is available"
      - "Maximum transaction limit is configured (e.g., $999,999.99 for USD)"
    examples:
      - input:
          amount: 999999.99
          currency: "USD"
          card_token: "tok_valid_visa"
        expected:
          http_status: 200
          charged_amount: 999999.99
        description: "Exactly at maximum allowed USD amount — accepted."
      - input:
          amount: 999999.98
          currency: "USD"
          card_token: "tok_valid_visa"
        expected:
          http_status: 200
          charged_amount: 999999.98
