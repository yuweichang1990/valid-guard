# ==============================================================================
# BOUNDARY AND EDGE CASES
# ==============================================================================

boundary_edge_cases:
  - id: BEC-01
    title: "PIN attempt counter boundary at exactly 3"
    description: "Verify the system blocks on exactly the 3rd failed attempt, not before or after"
    related_tests: [VTC-04, ITC-03]

  - id: BEC-02
    title: "Correct PIN on the boundary (3rd attempt)"
    description: "Verify the system accepts a correct PIN on the very last allowed attempt"
    related_tests: [VTC-03]

  - id: BEC-03
    title: "Rapid repeated incorrect PIN entries"
    description: "Enter incorrect PINs in rapid succession to verify counter increments correctly"
    related_tests: [VTC-04]

  - id: BEC-04
    title: "Cancel at each failure boundary"
    description: "Verify cancel works at every point: 0 failures, 1 failure, 2 failures"
    related_tests: [VTC-05, VTC-06, VTC-07]

  - id: BEC-05
    title: "Same incorrect PIN entered all 3 times"
    description: "Verify the system counts each attempt even when the same wrong PIN is repeated"
    steps:
      - "Insert card"
      - "Enter '0000' (incorrect) - attempt 1"
      - "Enter '0000' (incorrect) - attempt 2"
      - "Enter '0000' (incorrect) - attempt 3"
    expected_result: "Card confiscated after 3rd entry of '0000'"

  - id: BEC-06
    title: "ATM state after power cycle during PIN entry"
    description: "If ATM loses power during waiting_for_pin, verify it returns to idle on reboot and ejects the card"
    expected_result: "ATM boots to idle state; card is ejected if physically present"

