      - security
      - counter-logic

  # ==========================================================================
  # ERROR GUESSING — Anticipated Defects
  # ==========================================================================

  - name: "Rapid repeated PIN entry (race condition prevention)"
    description: >
      User rapidly presses enter multiple times or enters PINs faster than
      the system can process. The system must process each PIN entry
      sequentially and not skip counter decrements or allow double-processing.
    type: edge_case
    risk: high
    risk_rationale: >
      Impact: 3 (race condition could skip counter decrement or double-process correct PIN).
      Frequency: 1 (rare in normal use but exploitable by attackers).
      Consequence: 3 (could bypass attempt limit or cause duplicate transactions).
      Detectability: 1 (race conditions are notoriously hard to detect in testing).
      Average: 2.00 -> medium, but elevated to high due to exploitability.
    techniques:
      - error_guessing
      - state_transition
    technique_rationale: >
      Error guessing for concurrency/race condition scenarios that formal
      techniques may not systematically uncover. State transition verifies
      that the state machine processes events serially.
    preconditions:
      - "ATM is in waiting_for_pin state"
    examples:
      - input:
          current_state: "waiting_for_pin"
          events:
            - pin: "0000"
              timestamp_ms: 0
            - pin: "0000"
              timestamp_ms: 50
        expected:
          pins_processed: 1
          remaining_attempts: 2
          second_input_queued_or_rejected: true
