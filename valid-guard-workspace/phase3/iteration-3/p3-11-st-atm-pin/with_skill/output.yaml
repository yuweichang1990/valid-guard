  # ==========================================================================
  # COMPREHENSIVE STATE TRANSITION TABLE (All States x All Events)
  # ==========================================================================

  - name: "Full state transition table — all states x all events"
    description: >
      Comprehensive decision table mapping every possible (state, event)
      combination to verify completeness of the state machine. Includes
      all valid transitions and all invalid transitions to ensure no
      undefined behavior exists.
    type: combinatorial
    risk: high
    risk_rationale: >
      Impact: 3 (undefined state transitions can crash the ATM or create security holes).
      Frequency: 3 (covers all possible event combinations).
      Consequence: 3 (unhandled state+event pair = undefined behavior).
      Detectability: 1 (undefined behavior may manifest as subtle bugs).
      Average: 2.50 -> high.
    techniques:
      - state_transition
      - decision_table
    technique_rationale: >
      Decision table enumerates all (state, event) combinations. State
      transition validates each combination against the expected behavior.
      This ensures 0-switch coverage completeness.
    preconditions:
      - "ATM system is operational"
    decision_table:
      conditions:
        - "current_state"
        - "event"
      actions:
        - "next_state"
        - "response"
      rules:
        - description: "idle + card_inserted (valid card)"
          condition_values:
            current_state: "idle"
            event: "card_inserted"
          expected_actions:
            next_state: "waiting_for_pin"
            response: "prompt_for_pin"
        - description: "idle + card_inserted (blocked account)"
          condition_values:
            current_state: "idle"
            event: "card_inserted_blocked"
          expected_actions:
            next_state: "idle"
            response: "reject_and_eject"
        - description: "idle + pin_entered"
          condition_values:
            current_state: "idle"
            event: "pin_entered"
          expected_actions:
            next_state: "idle"
            response: "ignored"
        - description: "idle + timeout"
          condition_values:
            current_state: "idle"
            event: "timeout"
          expected_actions:
            next_state: "idle"
            response: "no_action"
        - description: "waiting_for_pin + correct_pin (attempts > 0)"
          condition_values:
            current_state: "waiting_for_pin"
            event: "correct_pin_entered"
          expected_actions:
            next_state: "account_access"
            response: "grant_access"
        - description: "waiting_for_pin + wrong_pin (attempts > 1)"
          condition_values:
            current_state: "waiting_for_pin"
            event: "wrong_pin_attempts_remaining"
          expected_actions:
            next_state: "waiting_for_pin"
            response: "decrement_counter_retry"
        - description: "waiting_for_pin + wrong_pin (attempts == 1, final)"
          condition_values:
            current_state: "waiting_for_pin"
            event: "wrong_pin_final_attempt"
          expected_actions:
            next_state: "card_confiscated"
            response: "confiscate_and_block"
        - description: "waiting_for_pin + card_removed"
          condition_values:
            current_state: "waiting_for_pin"
            event: "card_removed"
          expected_actions:
            next_state: "idle"
            response: "cancel_session"
        - description: "waiting_for_pin + timeout"
          condition_values:
            current_state: "waiting_for_pin"
            event: "timeout"
          expected_actions:
            next_state: "idle"
            response: "eject_card_timeout"
        - description: "waiting_for_pin + card_inserted"
          condition_values:
            current_state: "waiting_for_pin"
            event: "card_inserted"
          expected_actions:
            next_state: "waiting_for_pin"
            response: "rejected"
        - description: "account_access + session_complete"
          condition_values:
            current_state: "account_access"
            event: "session_complete"
          expected_actions:
            next_state: "idle"
            response: "eject_card"
        - description: "account_access + inactivity_timeout"
          condition_values:
            current_state: "account_access"
            event: "inactivity_timeout"
          expected_actions:
            next_state: "idle"
            response: "eject_card_timeout"
        - description: "account_access + card_inserted"
          condition_values:
            current_state: "account_access"
            event: "card_inserted"
          expected_actions:
            next_state: "account_access"
            response: "rejected"
        - description: "account_access + pin_entered"
          condition_values:
            current_state: "account_access"
            event: "pin_entered"
          expected_actions:
            next_state: "account_access"
            response: "ignored"
        - description: "card_confiscated + confiscation_complete"
          condition_values:
            current_state: "card_confiscated"
            event: "confiscation_complete"
          expected_actions:
            next_state: "idle"
            response: "return_to_idle"
        - description: "card_confiscated + pin_entered"
          condition_values:
            current_state: "card_confiscated"
            event: "pin_entered"
          expected_actions:
            next_state: "card_confiscated"
            response: "ignored"
        - description: "card_confiscated + card_inserted"
          condition_values:
            current_state: "card_confiscated"
            event: "card_inserted"
          expected_actions:
            next_state: "card_confiscated"
            response: "rejected"
    examples:
      - input:
          test_type: "state_event_matrix"
