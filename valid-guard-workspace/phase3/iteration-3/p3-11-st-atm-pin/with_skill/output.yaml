      Frequency: 1 (hardware failures are rare).
      Consequence: 2 (user cannot complete transaction but card should be ejected safely).
      Detectability: 3 (immediately obvious — PIN pad unresponsive).
      Average: 2.00 -> medium.
    techniques:
