  - name: "Attempt counter resets after card removal and re-insertion"
    description: >
      If a user removes their card (or it times out) after 1-2 failed
      attempts, then re-inserts the same card, the attempt counter should
      reset to 3 (or persist based on security policy). This test verifies
      the counter reset behavior.
    type: security
    risk: high
    risk_rationale: >
      Impact: 3 (if counter resets on re-insertion, attacker gets unlimited 3-attempt windows).
      Frequency: 2 (an attacker would exploit this deliberately).
      Consequence: 3 (effectively bypasses the 3-attempt lockout security control).
      Detectability: 1 (silent — no visible indication that brute-force protection is defeated).
      Average: 2.25 -> medium, but elevated to high due to security bypass potential.
    techniques:
      - state_transition
      - error_guessing
    technique_rationale: >
      State transition tests the idle -> waiting_for_pin cycle with counter
      persistence. Error guessing anticipates the brute-force bypass attack
      vector of repeated card insertion/removal.
    preconditions:
      - "Card has had 2 failed PIN attempts in a previous session"
      - "Card was ejected (timeout or user removal)"
      - "Same card is re-inserted"
    examples:
      - input:
          card_id: "card_123"
          previous_failed_attempts: 2
          event: "card_reinserted"
        expected:
          remaining_attempts: 1
          counter_persisted: true
        description: "Counter persists across card removal/reinsertion — only 1 attempt left (security policy: persist counter)."
      - input:
          card_id: "card_456"
          previous_failed_attempts: 0
          event: "card_inserted"
        expected:
          remaining_attempts: 3
          counter_persisted: false
