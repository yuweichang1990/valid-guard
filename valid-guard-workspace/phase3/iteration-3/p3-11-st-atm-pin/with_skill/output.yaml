    type: error_handling
    risk: high
    risk_rationale: >
      Impact: 3 (treating network error as wrong PIN unfairly decrements counter; treating it as correct PIN is a security breach).
      Frequency: 2 (network issues occur periodically).
      Consequence: 3 (incorrect handling leads to security breach or false lockout).
      Detectability: 1 (user cannot distinguish network error from wrong PIN if error handling is poor).
      Average: 2.25 -> medium, but elevated to high due to dual-failure consequence.
    techniques:
      - error_guessing
      - state_transition
    technique_rationale: >
      Error guessing for infrastructure failure. State transition verifies
      the system stays in waiting_for_pin without decrementing the counter.
    preconditions:
      - "ATM is in waiting_for_pin state"
      - "Bank network is unreachable"
    examples:
      - input:
          current_state: "waiting_for_pin"
          pin_entered: "1234"
          network_status: "timeout"
        expected:
          next_state: "waiting_for_pin"
          remaining_attempts_changed: false
          display: "Unable to verify PIN. Please try again."
          counter_decremented: false
        description: "Network timeout during verification — no counter change, user can retry."
      - input:
          current_state: "waiting_for_pin"
          pin_entered: "1234"
          network_status: "timeout"
          consecutive_network_failures: 3
        expected:
          next_state: "idle"
