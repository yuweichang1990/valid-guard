  # ==========================================================================
  # BOUNDARY VALUE — Attempt Counter Boundaries
  # ==========================================================================

  - name: "Attempt counter boundary — exactly 0 remaining triggers confiscation"
    description: >
      Verifies the exact boundary condition: when remaining_attempts reaches
      0 (after 3rd failure), confiscation is triggered. Tests for off-by-one
      errors in the counter logic.
    type: boundary
    risk: high
    risk_rationale: >
      Impact: 3 (off-by-one in counter = security bypass or premature lockout).
      Frequency: 2 (every 3-failure sequence hits this boundary).
      Consequence: 3 (allows 4th attempt or confiscates on 2nd — both critical bugs).
      Detectability: 1 (counter logic is internal, not visible to user until effect occurs).
      Average: 2.25 -> medium, but elevated to high due to security criticality.
    techniques:
      - boundary_value
      - state_transition
    technique_rationale: >
      Boundary value analysis at the attempt counter threshold. Testing
      values: remaining_attempts = 2 (above boundary, should allow retry),
      remaining_attempts = 1 (at boundary, last chance), remaining_attempts
      = 0 (below boundary, confiscation should have occurred).
    preconditions:
      - "ATM is in waiting_for_pin state"
    examples:
      - input:
          remaining_attempts: 2
          pin_correct: false
        expected:
          action: "allow_retry"
          remaining_attempts_after: 1
          confiscated: false
        description: "2 attempts remaining, wrong PIN — allow retry, 1 left."
      - input:
          remaining_attempts: 1
          pin_correct: false
        expected:
          action: "confiscate"
          remaining_attempts_after: 0
          confiscated: true
          account_blocked: true
        description: "1 attempt remaining, wrong PIN — confiscate card, block account."
      - input:
          remaining_attempts: 1
          pin_correct: true
        expected:
          action: "grant_access"
          confiscated: false
        description: "1 attempt remaining, correct PIN — grant access (boundary: last valid attempt)."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
