    type: error_handling
    risk: medium
    risk_rationale: >
      Impact: 2 (no security risk but blocks legitimate user).
      Frequency: 2 (damaged cards are moderately common).
      Consequence: 1 (user can go to bank branch or use another ATM).
      Detectability: 3 (immediately visible — card ejected with error).
      Average: 2.00 -> medium.
    techniques:
      - equivalence_partitioning
      - error_guessing
    technique_rationale: >
      Equivalence partitioning separates readable vs. unreadable cards.
      Error guessing covers various card failure modes (demagnetized,
