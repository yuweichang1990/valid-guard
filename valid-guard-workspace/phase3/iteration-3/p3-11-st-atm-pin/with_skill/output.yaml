  # ==========================================================================
  # SECURITY SCENARIOS
  # ==========================================================================

  - name: "Blocked account card insertion is rejected immediately"
    description: >
      If a card belonging to a previously blocked account is inserted, the
      ATM should reject it immediately without prompting for a PIN, display
      a message directing the user to contact their bank, and return to idle.
    type: security
    risk: high
    risk_rationale: >
      Impact: 3 (blocked accounts must not be accessible under any circumstances).
      Frequency: 1 (rare — only blocked card holders attempt this).
      Consequence: 3 (security breach if blocked account can re-authenticate).
      Detectability: 1 (if PIN prompt appears, attacker has unlimited attempts on blocked account).
      Average: 2.00 -> medium, but elevated to high due to critical security implication.
    techniques:
      - state_transition
      - equivalence_partitioning
      - error_guessing
    technique_rationale: >
      State transition tests the idle -> idle (rejected) path. Equivalence
      partitioning separates blocked cards from active cards. Error guessing
      considers whether the block status is checked before or after card
      read — timing matters for race conditions.
    preconditions:
      - "ATM is in idle state"
      - "Inserted card belongs to a blocked account"
    examples:
      - input:
          current_state: "idle"
          event: "card_inserted"
          account_status: "blocked"
        expected:
          next_state: "idle"
          card_ejected: true
          pin_prompt_shown: false
          display: "This card has been blocked. Please contact your bank."
        description: "Blocked account card — rejected immediately without PIN prompt."
    state_transition:
      states:
        - "idle"
      transitions:
        - from: "idle"
          to: "idle"
          trigger: "card_inserted"
          guard: "Card account is blocked — reject and eject immediately"
