    type: edge_case
    risk: medium
    risk_rationale: >
      Impact: 2 (failure to timeout leaves ATM stuck with card inserted).
      Frequency: 2 (users do walk away or get distracted).
      Consequence: 2 (stuck ATM requires manual intervention; card left in reader is a security risk).
      Detectability: 2 (next customer would notice).
      Average: 2.00 -> medium.
    techniques:
      - state_transition
      - boundary_value
      - error_guessing
    technique_rationale: >
      State transition covers the timeout path. Boundary value tests the
      exact timeout threshold. Error guessing considers network delays
      that might interfere with timeout logic.
    preconditions:
      - "ATM is in waiting_for_pin state"
      - "No PIN entered within timeout period"
    examples:
