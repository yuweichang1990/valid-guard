  # ==========================================================================
  # EDGE CASES
  # ==========================================================================

  - name: "Card removal during waiting_for_pin state (user cancellation)"
    description: >
      User removes their card while the ATM is waiting for PIN entry. The
      system should cancel the authentication process and return to idle.
    type: edge_case
    risk: medium
    risk_rationale: >
      Impact: 2 (failure to reset could lock the ATM in waiting_for_pin).
      Frequency: 2 (users do cancel mid-process).
      Consequence: 2 (ATM stuck in wrong state until manual reset).
      Detectability: 2 (next user would discover it).
      Average: 2.00 -> medium.
    techniques:
      - state_transition
