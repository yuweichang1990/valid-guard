feature: "ATM PIN Entry System"

feature_description: >
  ATM card-based authentication system with PIN entry workflow. The system
  starts in an idle state. When a card is inserted, it transitions to a
  waiting_for_pin state. The user has up to 3 attempts to enter the correct
  PIN. A correct PIN grants account access. Each incorrect PIN decrements the
  remaining attempts. After 3 consecutive incorrect PINs, the card is
  physically confiscated (retained by the machine) and the associated account
  is blocked, requiring manual intervention to unblock.

risk_level: high

entry_point: greenfield

source:
  type: natural_language
  path: ""

