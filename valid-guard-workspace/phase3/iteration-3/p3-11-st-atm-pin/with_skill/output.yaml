      - state-machine
      - decision-table

# ===========================================================================
# Example Mapping
# ===========================================================================
example_mapping:
  story: >
    As an ATM user, I want to authenticate using my card and PIN so that I
    can securely access my bank account at the ATM.
  rules:
    - rule_name: "Card insertion transitions ATM from idle to PIN entry"
      examples:
        - "Valid card inserted while idle -> transition to waiting_for_pin, prompt for PIN"
        - "Invalid/unreadable card inserted -> reject, eject card, stay idle"
        - "Expired card inserted -> reject with expiry message, eject, stay idle"
        - "Blocked account card inserted -> reject immediately without PIN prompt, eject, stay idle"
        - "Card inserted while already processing another card -> reject second card"

    - rule_name: "Correct PIN grants account access"
      examples:
        - "Correct PIN on 1st attempt -> grant access (3 remaining attempts)"
        - "Correct PIN on 2nd attempt -> grant access (2 remaining attempts, after 1 failure)"
        - "Correct PIN on 3rd attempt -> grant access (1 remaining attempt, after 2 failures)"

    - rule_name: "Incorrect PIN decrements attempt counter"
      examples:
        - "1st wrong PIN -> stay in waiting_for_pin, 2 attempts remaining"
        - "2nd wrong PIN -> stay in waiting_for_pin, 1 attempt remaining, show final warning"
        - "Counter correctly tracks failures across consecutive wrong entries"

    - rule_name: "3 consecutive incorrect PINs confiscates card and blocks account"
      examples:
        - "3rd wrong PIN -> card confiscated, account blocked, display contact-bank message"
        - "After confiscation, ATM returns to idle for next customer"
        - "Confiscation is irreversible at the ATM — requires bank intervention"
        - "Counter persists across card removal/reinsertion to prevent brute-force bypass"

    - rule_name: "ATM returns to idle after session completion or cancellation"
      examples:
        - "User completes transactions -> card ejected, return to idle"
        - "User removes card during PIN entry -> session cancelled, return to idle"
        - "PIN entry timeout -> card ejected, return to idle"
