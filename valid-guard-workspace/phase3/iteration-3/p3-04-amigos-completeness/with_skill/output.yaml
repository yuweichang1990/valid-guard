# Example Mapping — Three Amigos Output
# ---------------------------------------------------------------------------
example_mapping:
  story: >
    As a purchasing manager, I want to approve purchase orders so that
    vendors receive notifications and accounting can process payments.
  rules:
    - rule_name: "Only authorized managers can approve POs"
      examples:
        - "Purchasing manager approves PO within their threshold -> PO approved"
        - "Requester or viewer role attempts approval -> 403 unauthorized"
        - "Manager approves PO above their threshold -> escalated to next level"
        - "Manager attempts to approve their own PO -> self-approval blocked"
        - "Delegated manager approves during original manager's absence -> approved with delegate audit entry"

    - rule_name: "Approval routing depends on PO amount and manager level"
      examples:
        - "PO <= $5,000 -> junior manager can approve"
        - "PO $5,001-$50,000 -> requires senior manager"
        - "PO $50,001-$500,000 -> requires director"
        - "PO > $500,000 -> requires VP approval"
        - "PO at exact threshold boundary ($5,000.00) -> lower-level manager can approve"
        - "PO one cent above threshold ($5,000.01) -> must escalate"

    - rule_name: "Vendor must be notified after approval"
      examples:
        - "Approval triggers email notification to vendor with PO details"
        - "Vendor without email receives portal notification"
        - "Email notification bounces -> retry scheduled, manager alerted"
        - "All retries exhausted -> escalate to procurement team"
        - "Notification includes PO number, delivery date, and payment terms"

    - rule_name: "Accounting must receive payment request after approval"
      examples:
        - "Approval creates payment request with correct amount and terms"
        - "Net-30 terms -> payment due date set 30 days from approval"
        - "Immediate terms -> same-day payment scheduled"
        - "Accounting system unavailable -> payment queued for retry"
        - "Queued payment processed when accounting system recovers"

    - rule_name: "PO follows a defined lifecycle with valid state transitions"
      examples:
        - "Draft -> pending_approval (on submit)"
        - "Pending -> approved (on manager approval)"
        - "Pending -> rejected (on rejection with reason)"
        - "Rejected -> draft (on revise and resubmit)"
        - "Approved -> cancelled (only if no goods received)"
        - "Cannot approve a PO in draft status"
        - "Cannot cancel a PO after goods received"

    - rule_name: "Rejection requires a reason and notifies requester"
      examples:
        - "Manager rejects with reason -> PO set to rejected, requester notified"
        - "Manager rejects with empty reason -> validation error"
        - "Manager rejects with whitespace-only reason -> validation error"

    - rule_name: "Duplicate and concurrent actions are handled safely"
      examples:
        - "Approving already-approved PO -> idempotent rejection, no duplicate side effects"
        - "Concurrent approve + reject on same PO -> only one succeeds, other gets conflict error"

    - rule_name: "All actions are recorded in an immutable audit trail"
      examples:
        - "Approval recorded with timestamp, actor, action, PO ID"
        - "Rejection recorded with reason"
        - "Delegated approval recorded with delegate identity"
        - "Audit entries cannot be modified or deleted"

# ---------------------------------------------------------------------------
# Open Questions (Ambiguities identified during Three Amigos)
# ---------------------------------------------------------------------------
# These questions capture real ambiguities that require human clarification
# before the test plan can be finalized:
#
# Q1: What are the exact approval threshold amounts for each manager level?
#     The plan assumes $5K/$50K/$500K tiers — is this correct, or are
#     thresholds configurable per organization?
#
# Q2: Is segregation of duties enforced? Can the person who creates a PO
#     also approve it, or must a different manager approve?
#
# Q3: What notification channels are supported for vendors — email only,
#     or also EDI, portal, SMS, webhook?
#
# Q4: What happens if the vendor has no notification channel configured
#     at all? Is the PO still approved, or is it blocked?
#
# Q5: What payment terms are supported? Is this a fixed enum (net-30,
#     net-60, immediate) or free-form?
#
# Q6: Is delegation of approval authority supported? If so, are there
#     time limits, and does the delegate inherit the original manager's
#     threshold or their own?
#
# Q7: Can a PO be amended after approval? If so, does it require
#     re-approval? What if goods have already been partially received?
#
# Q8: Is bulk approval of multiple POs supported? If so, is it
#     all-or-nothing or does partial success apply?
#
# Q9: What is the retry policy for failed vendor notifications?
#     How many retries? What interval? What happens after exhaustion?
#
# Q10: What is the retry policy for accounting system unavailability?
#      How long do we queue? Is there a dead-letter mechanism?
#
# Q11: Is multi-level sequential approval required for high-value POs,
#      or can a higher-level manager approve directly without lower-level
#      sign-off?
#
# Q12: What currency is used for threshold comparison? Are POs in
#      multiple currencies supported, and if so, what exchange rate
#      is used for threshold evaluation?
#
# Q13: What constitutes a "valid PO" for submission? Must it have
#      line items, a vendor, a delivery date, and payment terms?
#
# Q14: Are there any time-based auto-approval or auto-escalation rules
#      (e.g., if not acted on within 48 hours, escalate)?
#
# Q15: Should the vendor notification happen synchronously (blocking the
#      approval response) or asynchronously (fire-and-forget with retry)?
#
# Q16: Is there a maximum PO amount? Can a PO be for $10 million or is
#      there a system-level cap?

