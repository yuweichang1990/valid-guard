example_mapping:
  story: >
    As an applicant, I want to check my eligibility based on my age and income
    so that I know whether my application will be approved or rejected.
  rules:
    - rule_name: "Applicant must be at least 18 years old"
      examples:
        - "Age 25 with valid income -> approved"
        - "Age 18 with valid income -> approved (minimum accepted age)"
        - "Age 17 with valid income -> rejected (one below minimum)"
        - "Age 10 with very high income -> rejected (age alone disqualifies)"
        - "Age 0 -> rejected"
        - "Negative age -> rejected"

    - rule_name: "Applicant must have income strictly greater than 30000"
      examples:
        - "Income 50000 with valid age -> approved"
        - "Income 30001 with valid age -> approved (minimum accepted income)"
        - "Income 30000 with valid age -> rejected (not strictly greater)"
        - "Income 29999 with valid age -> rejected"
        - "Income 0 with valid age -> rejected"
        - "Negative income with valid age -> rejected"

    - rule_name: "Both conditions must be satisfied (AND logic)"
      examples:
        - "Age 25 and income 50000 -> approved (both valid)"
        - "Age 25 and income 20000 -> rejected (only age valid)"
        - "Age 15 and income 50000 -> rejected (only income valid)"
        - "Age 15 and income 20000 -> rejected (neither valid)"
        - "Age 18 and income 30001 -> approved (both at minimum boundary)"
        - "Age 17 and income 30001 -> rejected (age just below, income just above)"
        - "Age 18 and income 30000 -> rejected (age just at boundary, income at boundary)"

