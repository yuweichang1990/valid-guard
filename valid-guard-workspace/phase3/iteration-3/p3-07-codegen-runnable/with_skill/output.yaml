          """Scenario S38: Discount can change shipping fee — decision table. (DT)

          Decision table:
            Condition: subtotal_before_discount >= 50 | subtotal_after_discount >= 50
            Rule 1: True  | True  → shipping stays 0
            Rule 2: True  | False → shipping changes from 0 to 5.99
            Rule 3: False | False → shipping stays 5.99
            Rule 4: False | True  → impossible (discount reduces subtotal)
          """

          @pytest.mark.risk_high
          def test_discount_drops_subtotal_below_free_shipping(self, processor):
              """Scenario S38a: DT Rule 2 — subtotal drops below $50 after discount."""
              # subtotal = 50.00 (exactly at threshold → free shipping initially)
              processor.create_order("ORD-DSC-SHIP", {"widget": 5})
              original = processor.orders["ORD-DSC-SHIP"]
              assert original["shipping"] == Decimal("0")  # 50 >= 50

              # 10% discount → new subtotal = 45.00 < 50 → shipping = 5.99
              order = processor.apply_discount("ORD-DSC-SHIP", Decimal("10"))
              assert order["shipping"] == Decimal("5.99")
              assert order["subtotal"] == Decimal("45.00")

          @pytest.mark.risk_medium
          def test_discount_keeps_subtotal_above_free_shipping(self, processor):
              """Scenario S38b: DT Rule 1 — subtotal stays above $50 after discount."""
              # subtotal = 99.99 (premium_widget)
              processor.create_order("ORD-DSC-KEEP", {"premium_widget": 1})
              assert processor.orders["ORD-DSC-KEEP"]["shipping"] == Decimal("0")

              order = processor.apply_discount("ORD-DSC-KEEP", Decimal("10"))
              # new subtotal = 89.991 → still >= 50
              assert order["shipping"] == Decimal("0")

          @pytest.mark.risk_medium
          def test_discount_on_order_already_below_threshold(self, processor):
              """Scenario S38c: DT Rule 3 — subtotal already below $50, stays below."""
              # subtotal = 10.00 (1 widget) → shipping = 5.99
              processor.create_order("ORD-DSC-LOW", {"widget": 1})
              assert processor.orders["ORD-DSC-LOW"]["shipping"] == Decimal("5.99")

              order = processor.apply_discount("ORD-DSC-LOW", Decimal("50"))
              # new subtotal = 5.00 < 50 → shipping still 5.99
              assert order["shipping"] == Decimal("5.99")


      # =========================================================================
      # S39-S45: Cross-cutting — Tax, Shipping, Precision
      # =========================================================================

      class TestShippingThresholdBVA:
          """Scenario S39-S41: FREE_SHIPPING_THRESHOLD=50.00 boundary analysis."""

          @pytest.mark.risk_high
          @pytest.mark.parametrize("items,expected_shipping,desc", [
              ({"widget": 4, "gizmo": 2}, Decimal("0"),    "subtotal=47.00, below threshold"),
              ({"widget": 5},              Decimal("0"),    "subtotal=50.00, exactly at threshold"),
              ({"gadget": 2, "widget": 1}, Decimal("0"),    "subtotal=60.00, above threshold"),
          ], ids=["below_50_shipping_fee", "exactly_50_free", "above_50_free"])
          def test_shipping_threshold_boundary(self, processor, items, expected_shipping, desc):
              """Scenario S39-S41: Shipping fee at/around $50 boundary. (BVA)"""
              order = processor.create_order("ORD-SHIP-BVA", items)
              # For subtotal=47.00, shipping should be 5.99
              if order["subtotal"] < Decimal("50.00"):
                  assert order["shipping"] == Decimal("5.99"), f"Expected shipping fee for {desc}"
              else:
                  assert order["shipping"] == Decimal("0"), f"Expected free shipping for {desc}"

          @pytest.mark.risk_high
          def test_shipping_just_below_threshold(self, processor):
              """Scenario S39b: BVA off-point — $49.99 subtotal. Shipping = $5.99."""
              # 14 gizmos = 14 * 3.50 = 49.00 < 50 → shipping
              processor.pricing["micro_item"] = Decimal("49.99")
              processor.inventory["micro_item"] = 10
              order = processor.create_order("ORD-SHIP-49", {"micro_item": 1})
              assert order["subtotal"] == Decimal("49.99")
              assert order["shipping"] == Decimal("5.99")

          @pytest.mark.risk_high
          def test_shipping_just_at_threshold(self, processor):
              """Scenario S40b: BVA on-point — exactly $50.00. Free shipping."""
              order = processor.create_order("ORD-SHIP-50", {"widget": 5})
              assert order["subtotal"] == Decimal("50.00")
              assert order["shipping"] == Decimal("0")


      class TestTaxCalculation:
          """Scenario S42-S43: TAX_RATE=0.08 tax calculations with Decimal precision."""

          @pytest.mark.risk_high
          def test_tax_is_8_percent_of_subtotal(self, processor):
              """Scenario S42: Tax = subtotal * 0.08 verified with Decimal arithmetic."""
              order = processor.create_order("ORD-TAX-001", {"gadget": 4})
              expected_subtotal = Decimal("100.00")
              expected_tax = Decimal("8.00")

              assert order["subtotal"] == expected_subtotal
              assert order["tax"] == expected_tax

          @pytest.mark.risk_medium
          def test_tax_with_fractional_subtotal(self, processor):
              """Scenario S43: Tax on non-round subtotal preserves Decimal precision."""
              order = processor.create_order("ORD-TAX-FRAC", {"gizmo": 3})
              # subtotal = 3 * 3.50 = 10.50
              # tax = 10.50 * 0.08 = 0.84
              assert order["subtotal"] == Decimal("10.50")
              assert order["tax"] == Decimal("0.8400")

          @pytest.mark.risk_high
          def test_total_equals_subtotal_plus_tax_plus_shipping(self, processor):
              """Scenario S43b: Total = subtotal + tax + shipping invariant. (EG: consistency)"""
              order = processor.create_order("ORD-TOTAL", {"widget": 3, "gizmo": 7})
              # subtotal = 30 + 24.50 = 54.50
              assert order["total"] == order["subtotal"] + order["tax"] + order["shipping"]


      class TestDecimalPrecision:
          """Scenario S44-S45: Ensure no floating point errors in monetary calculations."""

          @pytest.mark.risk_high
          def test_no_floating_point_drift(self, processor):
              """Scenario S44: Repeated operations maintain Decimal precision. (EG)"""
              order = processor.create_order("ORD-PREC", {"gizmo": 7})
              # 7 * 3.50 = 24.50
              # tax = 24.50 * 0.08 = 1.9600
              # shipping = 5.99 (24.50 < 50)
              # total = 24.50 + 1.96 + 5.99 = 32.45
              assert order["total"] == order["subtotal"] + order["tax"] + order["shipping"]
              # Verify individual Decimal types
              assert isinstance(order["subtotal"], Decimal)
              assert isinstance(order["tax"], Decimal)
              assert isinstance(order["total"], Decimal)

          @pytest.mark.risk_medium
          def test_discount_then_verify_precision(self, processor):
              """Scenario S45: Discount + tax + shipping maintains Decimal consistency."""
              processor.create_order("ORD-DISC-PREC", {"premium_widget": 1})
              order = processor.apply_discount("ORD-DISC-PREC", Decimal("33.33"))

              # Verify the invariant: total = subtotal + tax + shipping
              recalc_total = order["subtotal"] + order["tax"] + order["shipping"]
              assert order["total"] == recalc_total

