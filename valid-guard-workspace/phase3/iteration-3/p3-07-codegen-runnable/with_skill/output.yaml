              expected_subtotal = Decimal("60.00")   # 10 + 50
              expected_tax = Decimal("4.80")          # 60 * 0.08
              expected_shipping = Decimal("0")        # 60 >= 50 → free shipping
              expected_total = Decimal("64.80")       # 60 + 4.80 + 0

              assert order["subtotal"] == expected_subtotal
              assert order["tax"] == expected_tax
              assert order["shipping"] == expected_shipping
              assert order["total"] == expected_total

