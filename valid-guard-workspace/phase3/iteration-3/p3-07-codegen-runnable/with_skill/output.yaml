          @pytest.mark.risk_high
          def test_create_single_item_order_calculates_correctly(self, processor):
              """Scenario S01: Single-item order — subtotal, tax, shipping, total verified."""
              order = processor.create_order("ORD-101", {"widget": 3})

              expected_subtotal = Decimal("30.00")  # 3 * 10.00
              expected_tax = Decimal("2.40")         # 30.00 * 0.08
              expected_shipping = Decimal("0")       # 30.00 < 50.00 → shipping applies? No: 30 < 50 → fee
              # Correction: 30.00 < 50.00 → shipping = 5.99
              expected_shipping = Decimal("5.99")
              expected_total = expected_subtotal + expected_tax + expected_shipping  # 38.39

              assert order["id"] == "ORD-101"
              assert order["subtotal"] == expected_subtotal
              assert order["tax"] == expected_tax
              assert order["shipping"] == expected_shipping
              assert order["total"] == expected_total
              assert order["status"] == OrderStatus.PENDING
              assert isinstance(order["created_at"], datetime)
              assert isinstance(order["updated_at"], datetime)

          @pytest.mark.risk_high
          def test_create_multi_item_order(self, processor):
              """Scenario S02: Multiple items — subtotal is sum of (price * qty)."""
