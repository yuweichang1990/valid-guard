      class TestApplyDiscountHappyPath:
          """Scenario S30-S31: Successful discount application."""

          @pytest.mark.risk_high
          def test_apply_10_percent_discount(self, processor):
              """Scenario S30: 10% discount recalculates subtotal, tax, shipping, total."""
              processor.create_order("ORD-DSC-001", {"gadget": 3})
              # subtotal = 75.00, tax = 6.00, shipping = 0 (75 >= 50)

              order = processor.apply_discount("ORD-DSC-001", Decimal("10"))

              expected_discount = Decimal("7.500")       # 75 * 10 / 100
              expected_subtotal = Decimal("67.500")      # 75 - 7.5
              expected_tax = Decimal("5.4000")           # 67.5 * 0.08
              expected_shipping = Decimal("0")           # 67.5 >= 50 → free
              expected_total = expected_subtotal + expected_tax + expected_shipping

              assert order["discount"] == expected_discount
              assert order["subtotal"] == expected_subtotal
              assert order["tax"] == expected_tax
              assert order["shipping"] == expected_shipping
              assert order["total"] == expected_total

          @pytest.mark.risk_high
          def test_apply_100_percent_discount(self, processor):
              """Scenario S31: 100% discount — full free order. (BVA: upper boundary)"""
              processor.create_order("ORD-DSC-100", {"widget": 2})
