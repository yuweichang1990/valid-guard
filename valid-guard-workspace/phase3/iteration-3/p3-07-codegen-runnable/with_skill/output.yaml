      class TestValidStateTransitions:
          """Scenario S11-S17: All valid transitions in the state machine. (ST)"""

          @pytest.mark.risk_high
          def test_full_happy_path_lifecycle(self, processor):
              """Scenario S11: PENDING → CONFIRMED → PROCESSING → SHIPPED → DELIVERED."""
              processor.create_order("ORD-ST-001", {"widget": 1})

              order = processor.transition_status("ORD-ST-001", OrderStatus.CONFIRMED)
              assert order["status"] == OrderStatus.CONFIRMED

              order = processor.transition_status("ORD-ST-001", OrderStatus.PROCESSING)
              assert order["status"] == OrderStatus.PROCESSING

              order = processor.transition_status("ORD-ST-001", OrderStatus.SHIPPED)
              assert order["status"] == OrderStatus.SHIPPED

              order = processor.transition_status("ORD-ST-001", OrderStatus.DELIVERED)
              assert order["status"] == OrderStatus.DELIVERED

          @pytest.mark.risk_high
          @pytest.mark.parametrize("cancel_from", [
              OrderStatus.PENDING,
              OrderStatus.CONFIRMED,
              OrderStatus.PROCESSING,
          ], ids=["cancel_from_pending", "cancel_from_confirmed", "cancel_from_processing"])
          def test_cancellation_from_cancellable_states(self, processor, cancel_from):
              """Scenario S12-S14: Cancellation allowed from PENDING, CONFIRMED, PROCESSING."""
              processor.create_order("ORD-ST-CXL", {"widget": 1})
              # Advance to the required state
              transitions_to = {
                  OrderStatus.PENDING: [],
                  OrderStatus.CONFIRMED: [OrderStatus.CONFIRMED],
                  OrderStatus.PROCESSING: [OrderStatus.CONFIRMED, OrderStatus.PROCESSING],
              }
              for status in transitions_to[cancel_from]:
                  processor.transition_status("ORD-ST-CXL", status)

              order = processor.transition_status("ORD-ST-CXL", OrderStatus.CANCELLED)
              assert order["status"] == OrderStatus.CANCELLED

          @pytest.mark.risk_high
          def test_delivered_to_refunded_via_transition(self, processor, delivered_order):
              """Scenario S15: DELIVERED → REFUNDED is a valid transition."""
              order = processor.transition_status("ORD-DLVR-001", OrderStatus.REFUNDED)
              assert order["status"] == OrderStatus.REFUNDED

          @pytest.mark.risk_high
          def test_transition_updates_timestamp(self, processor):
              """Scenario S16: Each transition updates updated_at timestamp."""
              processor.create_order("ORD-ST-TS", {"widget": 1})
              original_updated = processor.orders["ORD-ST-TS"]["updated_at"]

              order = processor.transition_status("ORD-ST-TS", OrderStatus.CONFIRMED)
              assert order["updated_at"] >= original_updated


