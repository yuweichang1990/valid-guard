      Impact: 3, Frequency: 3, Consequence: 3, Detectability: 2.
      Average: 2.75 -> high. Off-by-one at this boundary would cause cells
      to die when they should survive or vice versa, corrupting all patterns.
    techniques:
      - boundary_value
    technique_rationale: >
      BVA is essential because the survival rule has a sharp threshold at
      neighbor_count = 2. Testing at, below, and above this boundary catches
      off-by-one errors in comparison operators (< vs <=).
    preconditions:
      - "Cell is alive"
    examples:
      - input:
