          neighbor_count: 1
        expected:
          next_state: "dead"
        description: "BVA below boundary: 1 neighbor (boundary-1) -> dies"
      - input:
          cell_state: "alive"
          neighbor_count: 2
        expected:
          next_state: "alive"
        description: "BVA at boundary: 2 neighbors (on-point) -> survives"
      - input:
          cell_state: "alive"
          neighbor_count: 3
        expected:
          next_state: "alive"
        description: "BVA above boundary: 3 neighbors (boundary+1) -> survives"
