  # SCENARIO 1: Full Decision Table — cell_state x neighbor_count (18 rules)
  # ==========================================================================
  - name: "Decision table: alive/dead cell x neighbor count 0-8"
    description: >
      Exhaustive decision table covering all 18 combinations of cell state
      (alive, dead) and neighbor count (0 through 8). This is the core logic
      of Conway's Game of Life and must be tested completely. With only 2 x 9
      = 18 combinations, full enumeration is feasible and required.
    type: combinatorial
    risk: high
    risk_rationale: >
      Impact: 3, Frequency: 3, Consequence: 3, Detectability: 2.
      Average: 2.75 -> high. This is the core game logic executed for every
      cell on every generation. Any defect produces visually wrong behavior
      but may not be immediately obvious for specific neighbor counts.
    techniques:
      - decision_table
      - equivalence_partitioning
    technique_rationale: >
      Decision table is the primary technique because the outcome depends on
      two discrete conditions (cell_state and neighbor_count) combining to
      determine the result. Equivalence partitioning groups neighbor counts
      into classes: underpopulation (0-1), survival (2-3), overpopulation
      (4-8) for alive cells; and inert (0-2), reproduction (3), overcrowded
      (4-8) for dead cells.
    preconditions:
      - "A grid of cells exists with defined neighbor relationships"
      - "Each cell has a state (alive or dead) and a computable neighbor count (0-8)"
    decision_table:
      conditions:
        - "cell_state"
        - "neighbor_count"
      actions:
        - "next_state"
        - "transition_reason"
      rules:
        # --- Alive cells ---
        - description: "Alive cell with 0 neighbors dies (underpopulation)"
          condition_values:
            cell_state: "alive"
            neighbor_count: 0
          expected_actions:
            next_state: "dead"
            transition_reason: "underpopulation"
        - description: "Alive cell with 1 neighbor dies (underpopulation)"
          condition_values:
            cell_state: "alive"
            neighbor_count: 1
          expected_actions:
            next_state: "dead"
            transition_reason: "underpopulation"
        - description: "Alive cell with 2 neighbors survives (stable)"
          condition_values:
            cell_state: "alive"
            neighbor_count: 2
          expected_actions:
            next_state: "alive"
            transition_reason: "survival"
        - description: "Alive cell with 3 neighbors survives (stable)"
          condition_values:
            cell_state: "alive"
            neighbor_count: 3
          expected_actions:
            next_state: "alive"
            transition_reason: "survival"
        - description: "Alive cell with 4 neighbors dies (overpopulation)"
          condition_values:
            cell_state: "alive"
            neighbor_count: 4
          expected_actions:
            next_state: "dead"
            transition_reason: "overpopulation"
        - description: "Alive cell with 5 neighbors dies (overpopulation)"
          condition_values:
            cell_state: "alive"
            neighbor_count: 5
          expected_actions:
            next_state: "dead"
            transition_reason: "overpopulation"
        - description: "Alive cell with 6 neighbors dies (overpopulation)"
          condition_values:
            cell_state: "alive"
            neighbor_count: 6
          expected_actions:
            next_state: "dead"
            transition_reason: "overpopulation"
        - description: "Alive cell with 7 neighbors dies (overpopulation)"
          condition_values:
            cell_state: "alive"
            neighbor_count: 7
          expected_actions:
            next_state: "dead"
            transition_reason: "overpopulation"
        - description: "Alive cell with 8 neighbors dies (overpopulation)"
          condition_values:
            cell_state: "alive"
            neighbor_count: 8
          expected_actions:
            next_state: "dead"
            transition_reason: "overpopulation"
        # --- Dead cells ---
        - description: "Dead cell with 0 neighbors stays dead"
          condition_values:
            cell_state: "dead"
            neighbor_count: 0
          expected_actions:
            next_state: "dead"
            transition_reason: "insufficient_neighbors"
        - description: "Dead cell with 1 neighbor stays dead"
          condition_values:
            cell_state: "dead"
            neighbor_count: 1
          expected_actions:
            next_state: "dead"
            transition_reason: "insufficient_neighbors"
        - description: "Dead cell with 2 neighbors stays dead"
          condition_values:
            cell_state: "dead"
            neighbor_count: 2
          expected_actions:
            next_state: "dead"
            transition_reason: "insufficient_neighbors"
        - description: "Dead cell with 3 neighbors becomes alive (reproduction)"
          condition_values:
            cell_state: "dead"
            neighbor_count: 3
          expected_actions:
            next_state: "alive"
            transition_reason: "reproduction"
        - description: "Dead cell with 4 neighbors stays dead"
