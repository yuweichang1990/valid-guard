  # ==========================================================================
  # SCENARIO 7: State Transition — Cell lifecycle
  # ==========================================================================
  - name: "State transition: cell lifecycle (alive <-> dead)"
    description: >
      Models the cell as a two-state machine (alive, dead) with transitions
      governed by the Game of Life rules. Tests valid transitions in both
      directions and verifies that the state machine is complete.
    type: state_transition
    risk: high
    risk_rationale: >
      Impact: 3, Frequency: 3, Consequence: 3, Detectability: 2.
      Average: 2.75 -> high. The state transition model is the fundamental
      abstraction. Missing or incorrect transitions break the entire game.
    techniques:
      - state_transition
    technique_rationale: >
      State transition testing models the cell as a finite state machine
      with two states. This ensures all valid transitions are covered and
      that no invalid transitions exist.
    preconditions:
      - "Cell exists on the grid"
      - "Neighbor count has been computed for the current generation"
    state_transition:
      states:
        - "alive"
        - "dead"
      transitions:
        - from: "alive"
          to: "alive"
          trigger: "next_generation"
          guard: "neighbor_count == 2 OR neighbor_count == 3"
        - from: "alive"
          to: "dead"
          trigger: "next_generation"
          guard: "neighbor_count < 2 OR neighbor_count > 3"
        - from: "dead"
          to: "alive"
          trigger: "next_generation"
          guard: "neighbor_count == 3"
        - from: "dead"
          to: "dead"
          trigger: "next_generation"
          guard: "neighbor_count != 3"
    examples:
      - input:
          initial_state: "alive"
          neighbor_count: 2
        expected:
          next_state: "alive"
          transition: "alive -> alive (survival)"
        description: "Alive cell with 2 neighbors stays alive"
      - input:
          initial_state: "alive"
          neighbor_count: 1
        expected:
          next_state: "dead"
          transition: "alive -> dead (underpopulation)"
        description: "Alive cell with 1 neighbor dies"
      - input:
          initial_state: "dead"
          neighbor_count: 3
        expected:
          next_state: "alive"
          transition: "dead -> alive (reproduction)"
        description: "Dead cell with 3 neighbors becomes alive"
      - input:
          initial_state: "dead"
          neighbor_count: 2
        expected:
          next_state: "dead"
          transition: "dead -> dead (stays dead)"
        description: "Dead cell with 2 neighbors stays dead"
    test_ref: ""
    status: uncovered
