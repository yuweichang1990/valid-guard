feature: "Conway's Game of Life Cell Survival Logic"

feature_description: >
  Implementation of Conway's Game of Life cellular automaton rules. A living cell
  survives if it has exactly 2 or 3 neighbors (stable neighborhood). A dead cell
  becomes alive if it has exactly 3 neighbors (reproduction). All other live cells
  die (underpopulation with 0-1 neighbors, overpopulation with 4-8 neighbors).
  The grid updates all cells simultaneously each generation.

risk_level: high

entry_point: greenfield

source:
  type: natural_language
  path: ""

