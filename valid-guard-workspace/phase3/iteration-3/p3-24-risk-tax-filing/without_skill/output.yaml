      budget_pct: 25
    - feature: "F6: Payment Gateway Integration"
      risk_score: 9
      risk_tier: "Critical"
      budget_pct: 20
    - feature: "F3: Data Encryption for PII"
      risk_score: 6
      risk_tier: "High"
      budget_pct: 15
    - feature: "F2: E-Signature for Form Submission"
      risk_score: 6
      risk_tier: "High"
      budget_pct: 12
    - feature: "F7: Accessibility (WCAG 2.1 AA)"
      risk_score: 6
      risk_tier: "High"
      budget_pct: 8
    - feature: "F5: PDF Generation"
      risk_score: 4
