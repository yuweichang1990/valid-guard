  visual_risk_matrix:
    description: >
      3x3 grid mapping each feature by Likelihood (rows) and Impact (columns).
    matrix:
      high_likelihood_high_impact:
        risk_score: 9
        features: ["F1: Tax Calculation Engine", "F6: Payment Gateway"]
      high_likelihood_medium_impact:
