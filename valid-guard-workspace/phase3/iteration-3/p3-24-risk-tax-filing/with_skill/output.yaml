        expected:
          save_triggered_on_blur: true
          data_persisted: true
        description: "Draft saved when user navigates away from tab"
    state_transition:
      states:
        - "unsaved_changes"
        - "saving"
        - "saved"
        - "save_failed"
        - "stale"
      transitions:
        - from: "unsaved_changes"
          to: "saving"
          trigger: "Auto-save interval elapsed or field blur"
          guard: "Changes detected since last save"
        - from: "saving"
          to: "saved"
          trigger: "Server acknowledges save"
          guard: "Response status 200"
        - from: "saving"
          to: "save_failed"
          trigger: "Server error or network failure"
          guard: "Error response or timeout"
        - from: "saved"
          to: "unsaved_changes"
          trigger: "User makes additional edits"
          guard: "New input detected"
        - from: "save_failed"
          to: "saving"
          trigger: "Retry timer expires"
          guard: "Retry count < max retries"
    test_ref: ""
    status: uncovered
    priority: 2
    tags:
      - "auto-save"
      - "draft"
      - "medium-risk"

  - name: "F8-S02: Draft recovery after session interruption"
    description: >
      Verify that a user can resume their tax return from the last auto-saved
      draft after browser crash, session timeout, accidental navigation, or
      power loss. All previously saved data must be accurately restored.
    type: edge_case
    risk: medium
    risk_rationale: >
      Impact: 2 (lost progress causes significant user frustration).
      Frequency: 2 (browser crashes and timeouts happen occasionally).
      Consequence: 2 (user must re-enter data — time loss but no financial harm).
      Detectability: 1 (user immediately sees whether draft was recovered or not).
      Average: 1.75 → medium.
    techniques:
      - state_transition
      - error_guessing
    technique_rationale: >
      ST models session lifecycle (active → interrupted → recovered);
      EG anticipates partial saves, corrupted drafts, and concurrent session conflicts.
    preconditions:
      - "User had an active draft with auto-saved data"
      - "Session was interrupted"
    examples:
      - input:
          scenario: "browser crash during form entry"
          last_auto_save: "2 minutes ago"
        expected:
          draft_available_on_login: true
          data_matches_last_save: true
          prompt_to_resume: true
        description: "Draft recovered after browser crash"
      - input:
          scenario: "session timeout after 30 minutes idle"
        expected:
          draft_preserved: true
          re_authentication_required: true
          data_intact_after_login: true
        description: "Draft survives session timeout"
      - input:
          scenario: "two browser tabs editing same return"
        expected:
          conflict_detected: true
          most_recent_save_wins: true
          user_notified_of_conflict: true
        description: "Concurrent edit conflict detection"
    test_ref: ""
    status: uncovered
    priority: 2
    tags:
      - "auto-save"
      - "recovery"
      - "medium-risk"

  - name: "F8-S03: Auto-save with network failure"
    description: >
      Verify that auto-save handles network disconnection gracefully: queues
      changes locally, retries when connection restores, and clearly indicates
      save status to the user.
    type: error_handling
    risk: medium
    risk_rationale: >
      Impact: 2 (offline data could be lost if user closes browser).
      Frequency: 2 (network interruptions occur occasionally).
      Consequence: 2 (data loss limited to unsaved changes since last successful save).
      Detectability: 2 (save status indicator should show, but user may not notice).
      Average: 2.0 → medium.
    techniques:
      - error_guessing
      - state_transition
    technique_rationale: >
      EG anticipates network failure modes (intermittent, full disconnect, slow);
      ST models the online/offline save state machine.
    preconditions:
      - "User is editing a return and network connectivity is unstable"
    examples:
      - input:
          network_status: "disconnected"
          unsaved_changes: true
        expected:
          local_queue_active: true
          status_indicator: "Offline — changes queued"
          data_not_lost: true
        description: "Changes queued locally during network outage"
      - input:
          network_status: "restored"
          queued_changes: 5
        expected:
          auto_sync_triggered: true
          all_changes_saved: true
          status_indicator: "All changes saved"
        description: "Queued changes sync when network restores"
    test_ref: ""
    status: uncovered
    priority: 2
    tags:
      - "auto-save"
      - "offline"
      - "error-handling"
      - "medium-risk"

  # ===========================================================================
  # FEATURE 9: Multi-language Support (English/Spanish)
  # Risk Matrix Position: High Likelihood x Low Impact
  # QA Budget: 5%
  # ===========================================================================

  - name: "F9-S01: Complete UI translation for Spanish"
    description: >
      Verify that all UI elements — labels, buttons, error messages, help text,
      tooltips, and system notifications — are correctly translated to Spanish
      when the user selects Spanish as their language preference.
    type: happy_path
    risk: medium
    risk_rationale: >
      Impact: 2 (incomplete translation confuses Spanish-speaking users).
      Frequency: 3 (Spanish is the second most common language — many users rely on it).
      Consequence: 1 (English fallback available — inconvenience, not blocker).
      Detectability: 1 (untranslated strings are immediately visible).
      Average: 1.75 → medium.
    techniques:
      - equivalence_partitioning
      - error_guessing
    technique_rationale: >
      EP partitions UI element types to ensure coverage across all translatable content;
      EG anticipates missing translations, untranslated error messages, and
      hardcoded English strings.
    preconditions:
      - "Spanish language pack is loaded"
      - "User has selected Spanish as preferred language"
    examples:
      - input:
          language: "es"
          page: "login"
        expected:
          all_labels_in_spanish: true
          no_english_fallback_visible: true
        description: "Login page fully translated to Spanish"
      - input:
          language: "es"
          action: "trigger validation error"
        expected:
          error_message_in_spanish: true
        description: "Validation error messages displayed in Spanish"
      - input:
          language: "es"
          page: "tax_form_1040"
        expected:
          field_labels_in_spanish: true
          help_tooltips_in_spanish: true
          legal_text_in_spanish: true
        description: "Tax form 1040 fully translated including help text"
    test_ref: ""
    status: uncovered
    priority: 3
    tags:
      - "multi-language"
      - "i18n"
      - "medium-risk"

  - name: "F9-S02: Language switching preserves form data"
    description: >
      Verify that switching language mid-session (English to Spanish or vice
      versa) preserves all entered form data and does not trigger form resets,
      data loss, or navigation away from the current page.
    type: edge_case
    risk: medium
    risk_rationale: >
      Impact: 2 (data loss on language switch would be very frustrating).
      Frequency: 2 (some users may switch languages during a session).
      Consequence: 2 (lost form data requires re-entry).
      Detectability: 1 (user immediately notices if data disappears).
      Average: 1.75 → medium.
    techniques:
      - state_transition
      - error_guessing
    technique_rationale: >
      ST models the language state (en → es → en); EG anticipates page reload
      data loss and form state reset on language change.
    preconditions:
      - "User has entered data in a form"
    examples:
      - input:
          current_language: "en"
          switch_to: "es"
          form_data_entered:
            income: 50000
            name: "John Smith"
        expected:
          language_changed: true
          form_data_preserved: true
          page_not_reloaded: true
        description: "Language switch preserves all entered form data"
    state_transition:
      states:
        - "english"
        - "spanish"
      transitions:
        - from: "english"
          to: "spanish"
          trigger: "User selects Spanish from language picker"
          guard: "Spanish language pack loaded"
        - from: "spanish"
          to: "english"
          trigger: "User selects English from language picker"
          guard: "English language pack loaded"
    test_ref: ""
    status: uncovered
    priority: 3
    tags:
      - "multi-language"
      - "i18n"
      - "edge-case"
      - "medium-risk"

  - name: "F9-S03: Spanish text layout and rendering"
    description: >
      Verify that Spanish translations do not break UI layouts. Spanish text
      is typically 20-30% longer than English equivalents, which may cause
      button overflow, label truncation, or layout shifts.
    type: edge_case
    risk: low
    risk_rationale: >
      Impact: 1 (layout issues are cosmetic and do not block functionality).
      Frequency: 2 (affects all Spanish users but only visually).
      Consequence: 1 (truncated labels are confusing but workarounds exist).
      Detectability: 1 (layout issues are immediately visible).
      Average: 1.25 → low.
    techniques:
      - error_guessing
    technique_rationale: >
      EG anticipates text overflow and layout break issues common in localized
      UIs where translated strings are longer than source language.
    preconditions:
      - "UI is rendered in Spanish"
    examples:
      - input:
          language: "es"
          component: "submit button"
          english_text: "Submit"
          spanish_text: "Enviar declaracion de impuestos"
        expected:
          button_text_fully_visible: true
          no_overflow: true
          no_truncation: true
        description: "Longer Spanish button text does not overflow"
    test_ref: ""
    status: uncovered
    priority: 4
    tags:
      - "multi-language"
      - "i18n"
      - "layout"
      - "low-risk"

# =============================================================================
# Example Mapping
# =============================================================================
example_mapping:
  story: >
    As a QA lead for a government tax filing portal, I need to classify 9 features
    into a 3x3 risk matrix (likelihood x impact) and allocate testing effort
    proportional to risk so that the highest-risk features receive the most
    thorough testing coverage.
  rules:
    - rule_name: "High Likelihood x High Impact = Highest Risk (Budget: 40%)"
      examples:
        - "Tax Calculation Engine (22%): Core business logic used by every filer — errors cause incorrect tax amounts, IRS compliance violations, and financial harm. Silent failures mean users trust wrong numbers. Testing must cover all brackets, deduction types, credits, edge cases, and rounding."
        - "Data Encryption for PII (18%): Every record contains SSNs and income data that must be encrypted at rest and in transit. Breach consequences include FISMA violations, identity theft at scale, and catastrophic reputational damage. Testing must cover encryption algorithms, key management, log masking, and TLS configuration."
    - rule_name: "Medium Likelihood x High Impact = High Risk (Budget: 27%)"
      examples:
        - "Payment Gateway Integration (15%): Financial transactions with real money. Double-charges, lost payments, and gateway failures have direct financial impact. Idempotency, timeout handling, and amount validation are critical. Not every filer owes taxes, reducing likelihood."
        - "E-signature for Form Submission (12%): Creates legally binding documents. Invalid signatures mean rejected filings. Non-repudiation and audit trail are legal requirements. Each filer signs once, reducing frequency."
    - rule_name: "High Likelihood x Medium Impact = Medium-High Risk (Budget: 18%)"
      examples:
        - "Accessibility WCAG 2.1 AA (10%): Government portals are legally required to be accessible (Section 508). Every page, every interaction must comply. Impact is medium because alternative filing channels exist, but compliance violations invite lawsuits."
        - "Auto-save Draft Returns (8%): Used by every filer during every session. Failure means lost work but not lost filings. Network failure, concurrent edits, and session recovery are key scenarios."
    - rule_name: "Medium Likelihood x Medium Impact = Medium Risk (Budget: 7%)"
      examples:
        - "PDF Generation (7%): Most filers download a PDF copy. Accuracy matters for record-keeping but the actual IRS filing is separate. Edge cases include large returns, special characters, and metadata security."
    - rule_name: "High Likelihood x Low Impact = Low-Medium Risk (Budget: 5%)"
      examples:
        - "Multi-language Support English/Spanish (5%): Many users rely on Spanish, but English fallback always available. Layout issues and missing translations are annoying but not blocking. Translation completeness is the primary concern."
    - rule_name: "Medium Likelihood x Low Impact = Low Risk (Budget: 3%)"
      examples:
        - "Seasonal Holiday Banner (3%): Pure cosmetic feature with zero functional impact. Only displays a few weeks per year. Only risk is if it obscures critical UI elements, which is immediately visible. Minimal testing sufficient."

