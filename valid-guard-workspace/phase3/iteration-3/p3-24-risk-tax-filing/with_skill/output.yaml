  - name: "F6-S01: Successful tax payment via credit/debit card"
    description: >
      Verify that a taxpayer can successfully pay owed taxes via credit or
      debit card through the integrated payment gateway. Payment amount must
      exactly match the computed tax owed. Confirmation number must be returned.
    type: happy_path
    risk: high
    risk_rationale: >
      Impact: 3 (payment processing involves real money — errors cause financial harm).
      Frequency: 2 (not all filers owe taxes, but those who do rely on this).
      Consequence: 3 (double-charging, under-payment, or lost payments have direct financial impact).
      Detectability: 2 (confirmation number provides some visibility, but backend errors may be silent).
      Average: 2.5 → high.
    techniques:
      - state_transition
      - equivalence_partitioning
      - error_guessing
    technique_rationale: >
      ST models payment lifecycle (initiated → processing → completed/failed);
      EP partitions payment methods (credit, debit, ACH); EG anticipates
      gateway timeouts, double charges, and partial failures.
    preconditions:
      - "Tax return shows amount owed > $0"
      - "Payment gateway is configured and accessible"
    examples:
      - input:
          amount_owed: 5000
          payment_method: "credit_card"
          card_number: "4111111111111111"
          expiry: "12/27"
          cvv: "123"
        expected:
          payment_status: "completed"
          confirmation_number_returned: true
          amount_charged: 5000
          irs_payment_recorded: true
        description: "Successful credit card payment for exact tax owed"
      - input:
          amount_owed: 5000
          payment_method: "ach_direct_debit"
          routing_number: "021000021"
          account_number: "123456789"
        expected:
          payment_status: "pending"
          ach_initiated: true
        description: "ACH direct debit payment initiated"
    state_transition:
      states:
        - "not_initiated"
        - "payment_initiated"
        - "processing"
        - "completed"
        - "failed"
        - "refunded"
      transitions:
        - from: "not_initiated"
          to: "payment_initiated"
          trigger: "User submits payment form"
          guard: "Amount > 0 and payment details valid"
        - from: "payment_initiated"
          to: "processing"
          trigger: "Gateway accepts payment request"
          guard: "Gateway connectivity confirmed"
        - from: "processing"
          to: "completed"
          trigger: "Gateway returns success response"
          guard: "Charge amount matches requested amount"
        - from: "processing"
          to: "failed"
          trigger: "Gateway returns failure or timeout"
          guard: "Error code received or timeout exceeded"
        - from: "completed"
          to: "refunded"
          trigger: "Refund requested and approved"
          guard: "Within refund eligibility window"
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - "payment-gateway"
      - "financial"
      - "high-risk"

  - name: "F6-S02: Payment gateway failure and retry handling"
    description: >
      Verify correct behavior when the payment gateway returns errors: declined
      card, insufficient funds, network timeout, gateway downtime. The system
      must never charge the user without recording the payment, and must never
      record a payment that was not charged.
    type: error_handling
    risk: high
    risk_rationale: >
      Impact: 3 (payment errors directly affect user finances).
      Frequency: 2 (gateway errors are infrequent but inevitable).
      Consequence: 3 (double-charge or lost payment is severe financial harm).
      Detectability: 2 (user sees error, but charge-without-record is silent).
      Average: 2.5 → high.
    techniques:
      - error_guessing
      - state_transition
      - equivalence_partitioning
    technique_rationale: >
      EG anticipates specific gateway failure modes (timeout, 5xx, declined);
      ST verifies no money-losing state transitions; EP partitions error types.
    preconditions:
      - "User is on payment submission step"
    examples:
      - input:
          gateway_response: "card_declined"
          decline_code: "insufficient_funds"
        expected:
          payment_status: "failed"
          user_charged: false
          error_message: "Card declined — insufficient funds"
          retry_allowed: true
        description: "Declined card — user not charged, clear error shown"
      - input:
          gateway_response: "timeout"
          timeout_ms: 30000
        expected:
          payment_status: "unknown"
          idempotency_key_preserved: true
          auto_query_status: true
        description: "Gateway timeout — system queries status before retrying"
      - input:
          action: "user clicks pay twice quickly"
        expected:
          idempotency_enforced: true
          single_charge_only: true
        description: "Double-click protection via idempotency key"
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - "payment-gateway"
      - "error-handling"
      - "idempotency"
