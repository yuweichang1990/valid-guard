  - name: "F3-S03: Encryption key management and rotation"
    description: >
      Verify that encryption keys are stored in a hardware security module (HSM)
      or cloud KMS, never in source code or environment variables. Key rotation
      must re-encrypt existing data without downtime or data loss.
    type: security
    risk: high
    risk_rationale: >
      Impact: 3 (key compromise means all encrypted PII is exposed).
      Frequency: 1 (key rotation is infrequent — monthly or quarterly).
      Consequence: 3 (total breach of all encrypted records).
      Detectability: 3 (key leakage is silent until exploited).
      Average: 2.5 → high.
    techniques:
      - state_transition
      - error_guessing
    technique_rationale: >
      ST models key lifecycle (active → rotating → retired → destroyed);
      EG anticipates key leakage vectors and rotation failures.
    preconditions:
      - "Key management service is configured"
      - "Data has been encrypted with current key version"
    examples:
