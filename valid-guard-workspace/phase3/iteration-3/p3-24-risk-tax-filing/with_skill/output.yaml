        - from: "rotating"
          to: "active"
          trigger: "All data re-encrypted with new key"
          guard: "Re-encryption complete and verified"
        - from: "active"
          to: "retired"
          trigger: "Key rotation policy triggers retirement"
          guard: "No data encrypted with this key version"
        - from: "retired"
          to: "destroyed"
          trigger: "Key retention period expired"
          guard: "Compliance retention requirements met"
