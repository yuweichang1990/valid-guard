  type: natural_language
  path: "User prompt — QA lead risk matrix classification for 9 tax filing portal features"

scenarios:
  # ===========================================================================
  # FEATURE 1: Tax Calculation Engine (Income Tax, Deductions, Credits)
  # Risk Matrix Position: High Likelihood x High Impact
  # QA Budget: 22%
  # ===========================================================================

  - name: "F1-S01: Correct income tax computation for standard single filer"
    description: >
      Verify that the tax calculation engine correctly computes federal income tax
      for a single filer with W-2 income, applying the progressive tax bracket
      schedule (10%, 12%, 22%, 24%, 32%, 35%, 37%).
    type: happy_path
    risk: high
    risk_rationale: >
      Impact: 3 (core business logic — incorrect tax amounts cause financial harm).
      Frequency: 3 (every single user triggers tax calculation on every filing).
      Consequence: 3 (financial loss, IRS compliance violations, potential legal liability).
      Detectability: 3 (silent failure — user trusts the portal's math, may not verify).
      Average: 3.0 → high.
    techniques:
      - equivalence_partitioning
      - boundary_value
      - decision_table
    technique_rationale: >
      EP partitions income levels into tax brackets; BVA tests bracket boundaries
      (e.g., $11,600 boundary between 10% and 12%); DT captures bracket-filing status
      combinations.
    preconditions:
      - "Tax year rates and brackets are configured for current filing year"
      - "User has entered valid gross income"
    examples:
      - input:
          filing_status: "single"
          gross_income: 50000
          standard_deduction: 14600
          taxable_income: 35400
        expected:
          tax_owed: 4002
          effective_rate: "8.0%"
        description: "Single filer with $50K income — spans 10% and 12% brackets"
      - input:
          filing_status: "single"
          gross_income: 11600
          standard_deduction: 14600
          taxable_income: 0
        expected:
          tax_owed: 0
          effective_rate: "0%"
        description: "Income at or below standard deduction — zero tax owed"
      - input:
          filing_status: "single"
          gross_income: 615351
          standard_deduction: 14600
          taxable_income: 600751
        expected:
          bracket: "37%"
          tax_exceeds_threshold: true
        description: "Income crossing into highest 37% bracket boundary"
    decision_table:
      conditions:
        - "Filing status (single/married_joint/married_separate/head_of_household)"
        - "Taxable income bracket"
        - "Standard vs itemized deduction"
      actions:
        - "Apply correct tax rate schedule"
        - "Compute progressive tax"
        - "Apply correct standard deduction amount"
      rules:
        - description: "Single filer, 10% bracket, standard deduction"
          condition_values:
            filing_status: "single"
            taxable_income_bracket: "10%"
            deduction_type: "standard"
          expected_actions:
            tax_rate: "10%"
            deduction_amount: 14600
        - description: "Married filing jointly, 22% bracket, itemized deduction"
          condition_values:
            filing_status: "married_joint"
            taxable_income_bracket: "22%"
            deduction_type: "itemized"
          expected_actions:
            tax_rate: "22%"
            deduction_amount: "varies"
        - description: "Head of household, 12% bracket, standard deduction"
          condition_values:
            filing_status: "head_of_household"
            taxable_income_bracket: "12%"
            deduction_type: "standard"
          expected_actions:
            tax_rate: "12%"
            deduction_amount: 21900
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - "tax-calculation"
      - "core-business"
      - "high-risk"
      - "compliance"

  - name: "F1-S02: Tax bracket boundary transitions"
    description: >
      Verify correct tax computation at exact bracket boundary values where
      taxable income transitions from one marginal rate to the next. Off-by-one
      errors here cause incorrect tax for millions of filers.
    type: boundary
    risk: high
    risk_rationale: >
      Impact: 3 (bracket misclassification directly changes tax owed).
      Frequency: 3 (many filers have income near bracket boundaries).
      Consequence: 3 (financial loss, IRS audit risk, compliance violation).
      Detectability: 3 (small dollar differences are invisible to filers).
      Average: 3.0 → high.
    techniques:
      - boundary_value
      - equivalence_partitioning
    technique_rationale: >
      BVA is essential for testing at exact bracket thresholds (boundary - 1,
      boundary, boundary + 1). EP ensures each bracket class is represented.
    preconditions:
      - "Tax bracket schedule is loaded for the correct filing year"
    examples:
      - input:
          filing_status: "single"
          taxable_income: 11600
        expected:
          marginal_rate: "10%"
          tax_owed: 1160
        description: "Exact top of 10% bracket for single filer"
      - input:
          filing_status: "single"
          taxable_income: 11601
        expected:
          marginal_rate: "12%"
          tax_on_first_11600: 1160
          tax_on_remainder: 0.12
        description: "One dollar into 12% bracket — boundary + 1"
      - input:
          filing_status: "single"
          taxable_income: 11599
        expected:
          marginal_rate: "10%"
        description: "One dollar below 12% bracket — boundary - 1"
      - input:
          filing_status: "single"
          taxable_income: 0
        expected:
          tax_owed: 0
        description: "Zero taxable income boundary"
      - input:
          filing_status: "single"
          taxable_income: -1
        expected:
          tax_owed: 0
          validation_error: true
        description: "Negative taxable income — invalid boundary"
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - "tax-calculation"
      - "boundary"
      - "high-risk"

  - name: "F1-S03: Deduction calculation — standard vs itemized"
    description: >
      Verify correct computation when taxpayer chooses standard deduction vs.
      itemized deductions. Ensure system correctly applies the higher of the
      two when auto-selecting, and handles itemized categories (mortgage interest,
      state/local tax SALT cap, charitable contributions).
    type: combinatorial
    risk: high
    risk_rationale: >
      Impact: 3 (deductions directly reduce tax liability — errors affect every filer).
      Frequency: 3 (every filer must choose or be auto-assigned a deduction type).
      Consequence: 3 (over-deduction or under-deduction both cause compliance issues).
      Detectability: 2 (some filers may notice unexpectedly high/low refunds).
      Average: 2.75 → high.
    techniques:
      - decision_table
      - equivalence_partitioning
      - boundary_value
      - cause_effect
    technique_rationale: >
      DT captures combinations of deduction types and categories; EP partitions
      deduction types; BVA tests SALT cap ($10K limit); CE maps causal logic
      (itemized > standard → use itemized).
    preconditions:
      - "User has entered income and deduction details"
      - "SALT cap is configured at $10,000"
    examples:
      - input:
          filing_status: "single"
          standard_deduction: 14600
          itemized_total: 20000
          mortgage_interest: 12000
          salt: 8000
        expected:
          deduction_used: "itemized"
          deduction_amount: 20000
        description: "Itemized exceeds standard — itemized auto-selected"
      - input:
          filing_status: "single"
          standard_deduction: 14600
          itemized_total: 10000
        expected:
          deduction_used: "standard"
          deduction_amount: 14600
        description: "Itemized below standard — standard auto-selected"
      - input:
          salt_claimed: 15000
        expected:
          salt_applied: 10000
          salt_capped: true
        description: "SALT deduction capped at $10,000"
    decision_table:
      conditions:
        - "Itemized total > Standard deduction"
        - "SALT claimed > $10,000 cap"
        - "Charitable contributions present"
        - "Mortgage interest present"
      actions:
        - "Select deduction type"
        - "Apply SALT cap"
        - "Compute total deduction"
      rules:
        - description: "Itemized exceeds standard, SALT over cap"
          condition_values:
            itemized_gt_standard: true
            salt_over_cap: true
            charitable: true
            mortgage: true
          expected_actions:
            deduction_type: "itemized"
            salt_capped: true
            total_deduction: "sum of capped components"
        - description: "Itemized below standard, no SALT issue"
          condition_values:
            itemized_gt_standard: false
            salt_over_cap: false
            charitable: false
            mortgage: false
          expected_actions:
            deduction_type: "standard"
            salt_capped: false
            total_deduction: "standard deduction amount"
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - "tax-calculation"
      - "deductions"
      - "high-risk"
      - "compliance"

  - name: "F1-S04: Tax credit application (Child Tax Credit, EITC, education)"
    description: >
      Verify that tax credits are correctly applied after tax computation.
      Refundable credits (EITC, Additional Child Tax Credit) can reduce tax below
      zero resulting in a refund; non-refundable credits cannot. Phase-out
      thresholds must be correctly enforced.
    type: combinatorial
    risk: high
    risk_rationale: >
      Impact: 3 (credits are often thousands of dollars — errors significantly affect filers).
      Frequency: 3 (majority of filers claim at least one credit).
      Consequence: 3 (incorrect credits trigger IRS audits and clawbacks).
      Detectability: 3 (silent — filers trust the computed refund amount).
      Average: 3.0 → high.
    techniques:
      - decision_table
      - boundary_value
      - equivalence_partitioning
      - cause_effect
    technique_rationale: >
      DT covers credit eligibility combinations; BVA tests income phase-out
      thresholds; EP partitions credit types (refundable vs non-refundable);
      CE maps eligibility conditions to credit amounts.
    preconditions:
      - "Tax liability has been computed"
      - "Dependent and income information is available"
    examples:
      - input:
          tax_owed_before_credits: 5000
          child_tax_credit_eligible: 2
          children_ages: [5, 10]
          agi: 75000
        expected:
          child_tax_credit: 4000
          tax_after_credits: 1000
        description: "Two qualifying children — $2K credit each, non-refundable portion"
      - input:
          agi: 200001
          filing_status: "single"
          child_tax_credit_eligible: 1
        expected:
          credit_phaseout_applies: true
          credit_reduced: true
        description: "AGI above phase-out threshold — credit begins reducing"
      - input:
          tax_owed_before_credits: 500
          eitc_eligible: true
          eitc_amount: 3000
        expected:
          tax_after_credits: 0
          refund_from_eitc: 2500
        description: "Refundable EITC exceeds tax liability — generates refund"
    decision_table:
      conditions:
        - "Has qualifying children"
        - "AGI below phase-out threshold"
        - "Credit type (refundable/non-refundable)"
        - "Tax liability > 0"
      actions:
        - "Apply credit amount"
        - "Apply phase-out reduction"
        - "Generate refund (if refundable and credit > liability)"
      rules:
        - description: "Qualifying children, below threshold, non-refundable, has liability"
          condition_values:
            has_children: true
            below_phaseout: true
            credit_type: "non-refundable"
            has_liability: true
          expected_actions:
            apply_credit: "full amount"
            phaseout: "none"
            refund: "no"
        - description: "Qualifying children, above threshold, refundable"
          condition_values:
            has_children: true
            below_phaseout: false
            credit_type: "refundable"
            has_liability: true
          expected_actions:
            apply_credit: "reduced amount"
            phaseout: "applied"
            refund: "possible"
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - "tax-calculation"
      - "credits"
      - "high-risk"
      - "compliance"

  - name: "F1-S05: Tax calculation with invalid or missing inputs"
    description: >
      Verify the tax calculation engine gracefully handles missing, malformed,
      or nonsensical inputs: null income, negative values, non-numeric strings,
      extremely large numbers, and incomplete form data.
    type: error_handling
    risk: high
    risk_rationale: >
      Impact: 3 (corrupt calculations from bad input could be filed to IRS).
      Frequency: 2 (not every user enters bad data, but form errors are common).
      Consequence: 3 (garbage-in-garbage-out could produce legally binding incorrect filings).
      Detectability: 2 (validation errors should be visible, but silent corruption is the risk).
      Average: 2.5 → high.
    techniques:
      - equivalence_partitioning
      - error_guessing
      - boundary_value
    technique_rationale: >
      EP partitions inputs into valid/invalid classes; EG anticipates common data
      entry errors (nulls, negatives, overflow); BVA tests max income value limits.
    preconditions:
      - "User is on the tax computation form"
    examples:
      - input:
          gross_income: null
        expected:
          validation_error: "Income is required"
          calculation_blocked: true
        description: "Null income should block calculation"
      - input:
          gross_income: -50000
        expected:
          validation_error: "Income cannot be negative"
        description: "Negative income rejected"
      - input:
          gross_income: "abc"
        expected:
          validation_error: "Income must be a number"
        description: "Non-numeric input rejected"
      - input:
          gross_income: 999999999999
        expected:
          validation_error: "Income exceeds maximum allowed value"
        description: "Extremely large income value boundary"
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - "tax-calculation"
      - "error-handling"
      - "high-risk"
      - "input-validation"

  - name: "F1-S06: Tax calculation rounding and precision"
    description: >
      Verify that all monetary calculations use proper rounding (IRS requires
      rounding to whole dollars on filed returns) and that floating-point
      precision errors do not accumulate across bracket computations.
    type: edge_case
    risk: high
    risk_rationale: >
      Impact: 3 (rounding errors on tax returns are compliance violations).
      Frequency: 3 (every calculation involves rounding).
      Consequence: 2 (small rounding errors unlikely to cause large financial harm).
      Detectability: 3 (penny-level errors are invisible to users).
      Average: 2.75 → high.
    techniques:
      - boundary_value
      - error_guessing
    technique_rationale: >
      BVA tests values that produce half-penny boundaries requiring rounding decisions;
      EG anticipates floating-point precision issues common in financial software.
    preconditions:
      - "Tax calculation engine is processing monetary values"
    examples:
      - input:
          taxable_income: 33333
          rate: 0.12
        expected:
          raw_tax: 3999.96
          rounded_tax: 4000
        description: "Tax amount rounds up to nearest dollar per IRS rules"
      - input:
          taxable_income: 33334
          rate: 0.12
        expected:
          raw_tax: 4000.08
          rounded_tax: 4000
        description: "Tax amount rounds down"
      - input:
          computation: "0.1 + 0.2"
        expected:
          result_not: 0.30000000000000004
          result: 0.30
        description: "Floating-point precision handled correctly"
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - "tax-calculation"
      - "precision"
      - "high-risk"
      - "edge-case"

  # ===========================================================================
  # FEATURE 2: E-signature for Form Submission
  # Risk Matrix Position: Medium Likelihood x High Impact
  # QA Budget: 12%
  # ===========================================================================

  - name: "F2-S01: Successful e-signature application to tax return"
    description: >
      Verify that a valid e-signature (PIN-based or identity-verified) is
      successfully applied to the tax return, creating a legally binding
      submission. The signature must be timestamped, associated with the
      filer's identity, and stored as an immutable audit record.
    type: happy_path
    risk: high
    risk_rationale: >
      Impact: 3 (e-signature creates a legally binding document — failure means invalid filing).
      Frequency: 2 (each filer signs once per filing, not repeated action).
      Consequence: 3 (unsigned returns are rejected by IRS — compliance failure).
      Detectability: 2 (user sees confirmation, but backend recording could silently fail).
      Average: 2.5 → high.
    techniques:
      - state_transition
      - equivalence_partitioning
      - error_guessing
    technique_rationale: >
      ST models the return's lifecycle (draft → signed → submitted); EP partitions
      signature types (PIN, identity-verified, prior-year AGI); EG anticipates
      signature tampering and replay attacks.
    preconditions:
      - "Tax return is complete and validated"
      - "User identity has been verified"
    examples:
      - input:
          signature_method: "5-digit PIN"
          pin: "12345"
          identity_verified: true
          return_complete: true
        expected:
          signature_applied: true
          timestamp_recorded: true
          audit_trail_created: true
        description: "Valid PIN-based e-signature on complete return"
      - input:
          signature_method: "prior_year_agi"
          agi_match: true
        expected:
          signature_applied: true
          identity_confirmed: true
        description: "Prior-year AGI identity verification succeeds"
    state_transition:
      states:
        - "draft"
        - "validated"
        - "signature_pending"
        - "signed"
        - "submitted"
        - "rejected"
      transitions:
        - from: "draft"
          to: "validated"
          trigger: "Return passes all validation checks"
          guard: "All required fields populated"
        - from: "validated"
          to: "signature_pending"
          trigger: "User initiates e-signature"
          guard: "Identity verification started"
        - from: "signature_pending"
          to: "signed"
          trigger: "Valid PIN or identity verification provided"
          guard: "Signature credentials verified"
        - from: "signed"
          to: "submitted"
          trigger: "User confirms submission"
          guard: "Signature is valid and timestamped"
        - from: "signature_pending"
          to: "rejected"
          trigger: "Invalid PIN or failed identity verification"
          guard: "Maximum retry attempts exceeded"
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - "e-signature"
      - "legal-compliance"
      - "high-risk"

  - name: "F2-S02: E-signature with invalid or expired credentials"
    description: >
      Verify that the system rejects invalid PINs, expired identity tokens,
      and mismatched prior-year AGI values, preventing unauthorized signatures
      on tax returns.
    type: error_handling
    risk: high
    risk_rationale: >
      Impact: 3 (accepting an invalid signature creates a fraudulent filing).
      Frequency: 2 (some users will mistype PINs or have expired tokens).
      Consequence: 3 (fraudulent or unauthorized filings have severe legal consequences).
      Detectability: 2 (user sees rejection, but false acceptance is silent).
      Average: 2.5 → high.
    techniques:
      - equivalence_partitioning
      - error_guessing
      - boundary_value
    technique_rationale: >
      EP partitions credential types (valid/invalid/expired/revoked); EG anticipates
      replay attacks and brute-force PIN guessing; BVA tests PIN length boundaries
      and retry count limits.
    preconditions:
      - "User is at the e-signature step"
    examples:
      - input:
          pin: "00000"
          valid_pin: "12345"
        expected:
          signature_rejected: true
          error_message: "Invalid PIN"
          remaining_attempts: 2
        description: "Wrong PIN entered — rejection with retry counter"
      - input:
          pin_attempts: 3
        expected:
          account_locked: true
          lockout_duration: "30 minutes"
        description: "Maximum PIN attempts exceeded — lockout enforced"
      - input:
          identity_token_expired: true
        expected:
          signature_rejected: true
          error_message: "Session expired, please re-verify identity"
        description: "Expired identity verification token"
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - "e-signature"
      - "security"
      - "high-risk"
      - "error-handling"

  - name: "F2-S03: E-signature non-repudiation and audit trail"
    description: >
      Verify that once an e-signature is applied, the system creates an
      immutable, timestamped audit record that cannot be altered. The filer
      cannot later deny having signed the return.
    type: security
    risk: high
    risk_rationale: >
      Impact: 3 (non-repudiation is a legal requirement for e-filed returns).
      Frequency: 2 (audit trail created once per signature).
      Consequence: 3 (without audit trail, IRS cannot prove the filer signed).
      Detectability: 3 (audit trail failures are invisible until a dispute arises).
      Average: 2.75 → high.
    techniques:
      - state_transition
      - error_guessing
    technique_rationale: >
      ST verifies the signed state cannot transition back to unsigned;
      EG anticipates tampering, deletion, and time manipulation attacks.
    preconditions:
      - "E-signature has been successfully applied"
    examples:
      - input:
          action: "attempt to modify return after signing"
        expected:
          modification_blocked: true
          error_message: "Cannot modify a signed return"
        description: "Signed return is immutable"
      - input:
          action: "query audit log for signature"
        expected:
          audit_record_present: true
          fields_present:
            - "signer_identity"
            - "timestamp"
            - "ip_address"
            - "document_hash"
        description: "Audit trail contains all required non-repudiation fields"
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - "e-signature"
      - "non-repudiation"
      - "security"
      - "high-risk"

  # ===========================================================================
  # FEATURE 3: Data Encryption for PII (SSN, Income)
  # Risk Matrix Position: High Likelihood x High Impact
  # QA Budget: 18%
  # ===========================================================================

  - name: "F3-S01: PII encryption at rest"
    description: >
      Verify that all personally identifiable information (SSN, income figures,
      bank account numbers) is encrypted at rest using AES-256 or equivalent.
      Data must never be stored in plaintext in any database, log file, or
      temporary storage.
    type: security
    risk: high
    risk_rationale: >
      Impact: 3 (PII exposure is a catastrophic security breach under federal law).
      Frequency: 3 (every single filer's data must be encrypted — 100% of records).
      Consequence: 3 (data breach triggers FISMA/FedRAMP violations, lawsuits, identity theft).
      Detectability: 3 (plaintext storage is silent until a breach occurs).
      Average: 3.0 → high.
    techniques:
      - equivalence_partitioning
      - error_guessing
    technique_rationale: >
      EP partitions PII types (SSN, income, bank info) and storage locations
      (database, cache, logs, temp files); EG anticipates common encryption
      failures (key leakage, algorithm downgrade, log exposure).
    preconditions:
      - "System has stored user PII data"
      - "Encryption keys are managed by a key management service"
    examples:
      - input:
          data_type: "SSN"
          value: "123-45-6789"
          storage: "database"
        expected:
          stored_value_encrypted: true
          plaintext_not_present: true
          encryption_algorithm: "AES-256"
        description: "SSN stored encrypted in database — plaintext never appears"
      - input:
          data_type: "SSN"
          value: "123-45-6789"
          storage: "application_logs"
        expected:
          plaintext_not_in_logs: true
          log_contains_masked: "***-**-6789"
        description: "SSN never appears in plaintext in application logs"
      - input:
          data_type: "income"
          value: 85000
          storage: "redis_cache"
        expected:
          cached_value_encrypted: true
        description: "Income data encrypted in cache layer"
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - "encryption"
      - "pii"
      - "security"
      - "high-risk"
      - "compliance"

  - name: "F3-S02: PII encryption in transit (TLS)"
    description: >
      Verify that all data transmission between client and server uses TLS 1.2+
      with strong cipher suites. No PII should be transmitted over unencrypted
      channels. Verify HSTS headers and certificate pinning.
    type: security
    risk: high
    risk_rationale: >
      Impact: 3 (intercepted PII in transit enables identity theft).
      Frequency: 3 (every HTTP request/response carries potential PII).
      Consequence: 3 (man-in-the-middle exposure of SSNs/income is catastrophic).
      Detectability: 3 (users cannot tell if TLS is improperly configured).
      Average: 3.0 → high.
    techniques:
      - equivalence_partitioning
      - error_guessing
    technique_rationale: >
