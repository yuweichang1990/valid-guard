test_plan:
  title: "Airport Self-Service Check-In Kiosk - State Transition Test Plan"
  system_under_test: "Self-Service Check-In Kiosk"
  technique: "State Transition Testing"
  version: "1.0"
  created: "2026-03-14"

  description: >
    Comprehensive test plan for an airport self-service check-in kiosk covering
    the complete workflow from start through boarding pass printing, including
    all error paths, timeout guards, cancel behavior, and hardware failure scenarios.

  # ---------------------------------------------------------------------------
  # STATE MODEL
  # ---------------------------------------------------------------------------
  states:
    - id: S0_START
      name: "Start / Welcome Screen"
      description: "Initial idle screen displayed when kiosk is not in use."
      entry_action: "Display welcome message and language selection options."
      is_initial: true

    - id: S1_SELECT_AIRLINE
      name: "Select Airline"
      description: "Passenger selects their airline from the list."
      entry_action: "Display airline logo grid; start 60-second inactivity timer."

    - id: S2_ENTER_PNR
      name: "Enter PNR / Booking Reference"
      description: "Passenger enters their PNR or booking reference code."
      entry_action: "Display alphanumeric keypad; reset attempt counter if first visit; start 60-second inactivity timer."
      internal_data:
        - name: "attempt_count"
          type: "integer"
          initial_value: 0
          max_value: 3

    - id: S3_RETRIEVING_BOOKING
      name: "Retrieve Booking (Loading)"
      description: "System queries the airline backend to retrieve the booking."
      entry_action: "Show loading spinner; send PNR lookup request to airline system."

    - id: S4_PNR_ERROR
      name: "Invalid PNR Error"
      description: "PNR was not found or is invalid. Passenger may retry."
      entry_action: "Display error message with remaining attempts; start 60-second inactivity timer."

    - id: S5_CONFIRM_DETAILS
      name: "Confirm Passenger Details"
      description: "Display retrieved passenger and flight details for confirmation."
      entry_action: "Show passenger name, flight number, date, route; start 60-second inactivity timer."

    - id: S6_SELECT_SEATS
      name: "Select Seats (Optional)"
      description: "Seat map displayed for optional seat selection or change."
      entry_action: "Display aircraft seat map with available seats highlighted; start 60-second inactivity timer."

    - id: S7_PRINTING
      name: "Print Boarding Pass"
      description: "System sends boarding pass data to the printer."
      entry_action: "Display printing progress indicator; send print job to printer hardware."

    - id: S8_PRINTER_ERROR
      name: "Printer Error"
      description: "Printer hardware failure detected (jam, out of paper, etc.)."
      entry_action: "Display error message directing passenger to service counter; log hardware fault."

    - id: S9_COMPLETE
      name: "Exit / Completion"
      description: "Boarding pass printed successfully. Brief thank-you screen before returning to start."
      entry_action: "Display success message and collect boarding pass prompt; start 10-second auto-return timer."

  # ---------------------------------------------------------------------------
  # TRANSITIONS
  # ---------------------------------------------------------------------------
  transitions:
    # --- Happy path ---
    - id: T01
      from: S0_START
      to: S1_SELECT_AIRLINE
      trigger: "Passenger taps the screen or presses Start"
      guard: null
      action: "Initialize session; start inactivity timer"

    - id: T02
      from: S1_SELECT_AIRLINE
      to: S2_ENTER_PNR
      trigger: "Passenger selects an airline"
      guard: "Valid airline selected"
      action: "Store selected airline; reset PNR attempt counter to 0"

    - id: T03
      from: S2_ENTER_PNR
      to: S3_RETRIEVING_BOOKING
      trigger: "Passenger submits PNR"
      guard: "PNR format is valid (non-empty, correct length/characters)"
      action: "Increment attempt_count; send lookup request"

    - id: T04
      from: S3_RETRIEVING_BOOKING
      to: S5_CONFIRM_DETAILS
      trigger: "Booking retrieved successfully"
      guard: "Backend returns valid booking data"
      action: "Parse and display passenger and flight details"

    - id: T05
      from: S5_CONFIRM_DETAILS
      to: S6_SELECT_SEATS
      trigger: "Passenger confirms details and chooses to select seats"
      guard: null
      action: "Load seat map for the flight"

    - id: T06
      from: S5_CONFIRM_DETAILS
      to: S7_PRINTING
      trigger: "Passenger confirms details and skips seat selection"
      guard: null
      action: "Prepare boarding pass data with pre-assigned seat"

    - id: T07
      from: S6_SELECT_SEATS
      to: S7_PRINTING
      trigger: "Passenger confirms seat selection or skips"
      guard: null
      action: "Finalize seat assignment; prepare boarding pass data"

    - id: T08
      from: S7_PRINTING
      to: S9_COMPLETE
      trigger: "Boarding pass printed successfully"
      guard: "Printer reports success"
      action: "Display success screen with boarding pass collection instructions"

    - id: T09
      from: S9_COMPLETE
      to: S0_START
      trigger: "Passenger collects boarding pass or 10-second auto-return timer expires"
      guard: null
      action: "Clear session data; reset kiosk to idle state"

    # --- PNR error path ---
    - id: T10
      from: S3_RETRIEVING_BOOKING
      to: S4_PNR_ERROR
      trigger: "Backend returns PNR not found or invalid"
      guard: "attempt_count < 3"
      action: "Display error with remaining attempts count"

    - id: T11
      from: S4_PNR_ERROR
      to: S2_ENTER_PNR
      trigger: "Passenger acknowledges error and chooses to retry"
      guard: "attempt_count < 3"
      action: "Return to PNR entry screen preserving attempt_count"

    - id: T12
      from: S3_RETRIEVING_BOOKING
      to: S0_START
      trigger: "Backend returns PNR not found or invalid"
      guard: "attempt_count >= 3"
      action: "Display max attempts reached message; clear session after brief delay"

    # --- Printer error path ---
    - id: T13
      from: S7_PRINTING
      to: S8_PRINTER_ERROR
      trigger: "Printer reports jam, out of paper, or hardware fault"
      guard: null
      action: "Display error directing passenger to service counter; log incident"

    - id: T14
      from: S8_PRINTER_ERROR
      to: S0_START
      trigger: "Passenger acknowledges printer error or 60-second timeout"
      guard: null
      action: "Clear session data; reset kiosk; send maintenance alert"

    # --- Cancel transitions (from every interactive screen) ---
    - id: T15
      from: S1_SELECT_AIRLINE
      to: S0_START
      trigger: "Passenger presses Cancel button"
      guard: null
      action: "Clear session data; reset kiosk"

    - id: T16
      from: S2_ENTER_PNR
      to: S0_START
      trigger: "Passenger presses Cancel button"
      guard: null
      action: "Clear session data; reset kiosk"

    - id: T17
      from: S4_PNR_ERROR
      to: S0_START
      trigger: "Passenger presses Cancel button"
      guard: null
      action: "Clear session data; reset kiosk"

    - id: T18
      from: S5_CONFIRM_DETAILS
      to: S0_START
      trigger: "Passenger presses Cancel button"
      guard: null
      action: "Clear session data; reset kiosk"

    - id: T19
      from: S6_SELECT_SEATS
      to: S0_START
      trigger: "Passenger presses Cancel button"
      guard: null
      action: "Clear session data; reset kiosk"

    # --- Inactivity timeout transitions (60-second guard) ---
    - id: T20
      from: S1_SELECT_AIRLINE
      to: S0_START
      trigger: "60-second inactivity timeout"
      guard: "No user interaction for 60 seconds"
      action: "Display timeout warning briefly; clear session data; reset kiosk"

    - id: T21
      from: S2_ENTER_PNR
      to: S0_START
      trigger: "60-second inactivity timeout"
      guard: "No user interaction for 60 seconds"
      action: "Display timeout warning briefly; clear session data; reset kiosk"

    - id: T22
      from: S4_PNR_ERROR
      to: S0_START
      trigger: "60-second inactivity timeout"
      guard: "No user interaction for 60 seconds"
      action: "Clear session data; reset kiosk"

    - id: T23
      from: S5_CONFIRM_DETAILS
      to: S0_START
      trigger: "60-second inactivity timeout"
      guard: "No user interaction for 60 seconds"
      action: "Clear session data; reset kiosk"

    - id: T24
      from: S6_SELECT_SEATS
      to: S0_START
      trigger: "60-second inactivity timeout"
      guard: "No user interaction for 60 seconds"
      action: "Clear session data; reset kiosk"

  # ---------------------------------------------------------------------------
  # STATE TRANSITION TABLE
  # ---------------------------------------------------------------------------
  state_transition_table:
    description: >
      Matrix showing all valid state-event combinations. Each cell references
      the transition ID or indicates the event is not applicable in that state.
    rows:
      - current_state: S0_START
        events:
          tap_start: {next_state: S1_SELECT_AIRLINE, transition: T01}
          select_airline: N/A
          submit_pnr: N/A
          booking_found: N/A
          booking_not_found: N/A
          confirm_details_with_seats: N/A
          confirm_details_skip_seats: N/A
          confirm_seat: N/A
          print_success: N/A
          print_failure: N/A
          cancel: N/A
          inactivity_timeout: N/A

      - current_state: S1_SELECT_AIRLINE
        events:
          tap_start: N/A
          select_airline: {next_state: S2_ENTER_PNR, transition: T02}
          submit_pnr: N/A
          booking_found: N/A
          booking_not_found: N/A
          confirm_details_with_seats: N/A
          confirm_details_skip_seats: N/A
          confirm_seat: N/A
          print_success: N/A
          print_failure: N/A
          cancel: {next_state: S0_START, transition: T15}
          inactivity_timeout: {next_state: S0_START, transition: T20}

      - current_state: S2_ENTER_PNR
        events:
          tap_start: N/A
          select_airline: N/A
          submit_pnr: {next_state: S3_RETRIEVING_BOOKING, transition: T03}
          booking_found: N/A
          booking_not_found: N/A
          confirm_details_with_seats: N/A
          confirm_details_skip_seats: N/A
          confirm_seat: N/A
          print_success: N/A
          print_failure: N/A
          cancel: {next_state: S0_START, transition: T16}
          inactivity_timeout: {next_state: S0_START, transition: T21}

      - current_state: S3_RETRIEVING_BOOKING
        events:
          tap_start: N/A
          select_airline: N/A
          submit_pnr: N/A
          booking_found: {next_state: S5_CONFIRM_DETAILS, transition: T04}
          booking_not_found_under_limit: {next_state: S4_PNR_ERROR, transition: T10}
          booking_not_found_at_limit: {next_state: S0_START, transition: T12}
          confirm_details_with_seats: N/A
          confirm_details_skip_seats: N/A
          confirm_seat: N/A
          print_success: N/A
          print_failure: N/A
          cancel: N/A
          inactivity_timeout: N/A

      - current_state: S4_PNR_ERROR
        events:
          tap_start: N/A
          select_airline: N/A
          retry_pnr: {next_state: S2_ENTER_PNR, transition: T11}
          booking_found: N/A
          booking_not_found: N/A
          confirm_details_with_seats: N/A
          confirm_details_skip_seats: N/A
          confirm_seat: N/A
          print_success: N/A
          print_failure: N/A
          cancel: {next_state: S0_START, transition: T17}
          inactivity_timeout: {next_state: S0_START, transition: T22}

      - current_state: S5_CONFIRM_DETAILS
        events:
          tap_start: N/A
          select_airline: N/A
          submit_pnr: N/A
          booking_found: N/A
          booking_not_found: N/A
          confirm_details_with_seats: {next_state: S6_SELECT_SEATS, transition: T05}
          confirm_details_skip_seats: {next_state: S7_PRINTING, transition: T06}
          confirm_seat: N/A
          print_success: N/A
          print_failure: N/A
          cancel: {next_state: S0_START, transition: T18}
          inactivity_timeout: {next_state: S0_START, transition: T23}

      - current_state: S6_SELECT_SEATS
        events:
          tap_start: N/A
          select_airline: N/A
          submit_pnr: N/A
          booking_found: N/A
          booking_not_found: N/A
          confirm_details_with_seats: N/A
          confirm_details_skip_seats: N/A
          confirm_seat: {next_state: S7_PRINTING, transition: T07}
          print_success: N/A
          print_failure: N/A
          cancel: {next_state: S0_START, transition: T19}
          inactivity_timeout: {next_state: S0_START, transition: T24}

      - current_state: S7_PRINTING
        events:
          tap_start: N/A
          select_airline: N/A
          submit_pnr: N/A
          booking_found: N/A
          booking_not_found: N/A
          confirm_details_with_seats: N/A
          confirm_details_skip_seats: N/A
          confirm_seat: N/A
          print_success: {next_state: S9_COMPLETE, transition: T08}
          print_failure: {next_state: S8_PRINTER_ERROR, transition: T13}
          cancel: N/A
          inactivity_timeout: N/A

      - current_state: S8_PRINTER_ERROR
        events:
          tap_start: N/A
          select_airline: N/A
          submit_pnr: N/A
          booking_found: N/A
          booking_not_found: N/A
          confirm_details_with_seats: N/A
          confirm_details_skip_seats: N/A
          confirm_seat: N/A
          print_success: N/A
          print_failure: N/A
          acknowledge_error: {next_state: S0_START, transition: T14}
          inactivity_timeout: {next_state: S0_START, transition: T14}

      - current_state: S9_COMPLETE
        events:
          tap_start: N/A
          select_airline: N/A
          submit_pnr: N/A
          booking_found: N/A
          booking_not_found: N/A
          confirm_details_with_seats: N/A
          confirm_details_skip_seats: N/A
          confirm_seat: N/A
          print_success: N/A
          print_failure: N/A
          cancel: N/A
          auto_return_timeout: {next_state: S0_START, transition: T09}

  # ---------------------------------------------------------------------------
  # TEST CASES
  # ---------------------------------------------------------------------------
  test_cases:
    # =========================================================================
    # SECTION 1: HAPPY PATH TESTS
    # =========================================================================
    - id: TC-001
      title: "Happy path - complete check-in with seat selection"
      category: "Happy Path"
      priority: "Critical"
      description: >
        Verify the full end-to-end check-in flow where the passenger selects
        an airline, enters a valid PNR, confirms details, selects a seat,
        and prints a boarding pass.
      preconditions:
        - "Kiosk is at the Start screen (S0_START)"
        - "Printer is operational with paper loaded"
        - "Airline backend is reachable"
        - "A valid booking exists with PNR 'ABC123'"
      path: "S0 -> S1 -> S2 -> S3 -> S5 -> S6 -> S7 -> S9 -> S0"
      transitions_covered: [T01, T02, T03, T04, T05, T07, T08, T09]
      steps:
        - step: 1
          action: "Tap the screen to begin"
          expected_state: S1_SELECT_AIRLINE
          expected_result: "Airline selection grid is displayed"
        - step: 2
          action: "Select 'Demo Airlines' from the list"
          expected_state: S2_ENTER_PNR
          expected_result: "PNR entry screen with alphanumeric keypad is shown"
        - step: 3
          action: "Enter PNR 'ABC123' and press Submit"
          expected_state: S3_RETRIEVING_BOOKING
          expected_result: "Loading spinner is displayed while booking is retrieved"
        - step: 4
          action: "Wait for booking retrieval"
          expected_state: S5_CONFIRM_DETAILS
          expected_result: "Passenger name, flight number, date, and route are displayed correctly"
        - step: 5
          action: "Press 'Select Seats' button"
          expected_state: S6_SELECT_SEATS
          expected_result: "Aircraft seat map is displayed with available seats highlighted"
        - step: 6
          action: "Select seat 14A and confirm"
          expected_state: S7_PRINTING
          expected_result: "Printing progress indicator is displayed"
        - step: 7
          action: "Wait for print completion"
          expected_state: S9_COMPLETE
          expected_result: "Success message displayed; boarding pass dispensed"
        - step: 8
          action: "Collect boarding pass; wait for auto-return"
          expected_state: S0_START
          expected_result: "Kiosk returns to welcome screen; session data cleared"

    - id: TC-002
      title: "Happy path - complete check-in without seat selection"
      category: "Happy Path"
      priority: "Critical"
      description: >
        Verify the check-in flow where the passenger skips the optional
        seat selection step.
      preconditions:
        - "Kiosk is at the Start screen (S0_START)"
        - "Printer is operational"
        - "A valid booking exists with PNR 'XYZ789'"
      path: "S0 -> S1 -> S2 -> S3 -> S5 -> S7 -> S9 -> S0"
      transitions_covered: [T01, T02, T03, T04, T06, T08, T09]
      steps:
        - step: 1
          action: "Tap the screen to begin"
          expected_state: S1_SELECT_AIRLINE
          expected_result: "Airline selection grid is displayed"
        - step: 2
          action: "Select airline"
          expected_state: S2_ENTER_PNR
          expected_result: "PNR entry screen is shown"
        - step: 3
          action: "Enter PNR 'XYZ789' and press Submit"
          expected_state: S3_RETRIEVING_BOOKING
          expected_result: "Loading spinner displayed"
        - step: 4
          action: "Wait for booking retrieval"
          expected_state: S5_CONFIRM_DETAILS
          expected_result: "Passenger and flight details displayed correctly"
        - step: 5
          action: "Press 'Skip Seat Selection' / 'Continue' button"
          expected_state: S7_PRINTING
          expected_result: "Boarding pass printed with pre-assigned seat"
        - step: 6
          action: "Wait for print completion"
          expected_state: S9_COMPLETE
          expected_result: "Success message; boarding pass dispensed"
        - step: 7
          action: "Wait for auto-return timer"
          expected_state: S0_START
          expected_result: "Kiosk returns to idle"

    # =========================================================================
    # SECTION 2: PNR ERROR PATH TESTS
    # =========================================================================
    - id: TC-003
      title: "Invalid PNR - single retry then success"
      category: "Error Path - PNR"
      priority: "High"
      description: >
        Verify that an invalid PNR shows an error, allows retry, and
        the passenger successfully checks in on the second attempt.
      preconditions:
        - "Kiosk is at the Start screen"
        - "PNR 'INVALID1' does not exist; PNR 'VALID01' exists"
      path: "S0 -> S1 -> S2 -> S3 -> S4 -> S2 -> S3 -> S5 -> S7 -> S9 -> S0"
      transitions_covered: [T01, T02, T03, T10, T11, T03, T04, T06, T08, T09]
      steps:
        - step: 1
          action: "Navigate to PNR entry (tap start, select airline)"
          expected_state: S2_ENTER_PNR
          expected_result: "PNR entry screen displayed; attempt_count = 0"
        - step: 2
          action: "Enter invalid PNR 'INVALID1' and submit"
          expected_state: S3_RETRIEVING_BOOKING
          expected_result: "System attempts to retrieve booking"
        - step: 3
          action: "Wait for backend response"
          expected_state: S4_PNR_ERROR
          expected_result: "Error message displayed: 'PNR not found. 2 attempts remaining.'"
        - step: 4
          action: "Press 'Try Again' button"
          expected_state: S2_ENTER_PNR
          expected_result: "PNR entry screen displayed; attempt_count preserved at 1"
        - step: 5
          action: "Enter valid PNR 'VALID01' and submit"
          expected_state: S3_RETRIEVING_BOOKING
          expected_result: "System retrieves booking"
        - step: 6
          action: "Wait for backend response"
          expected_state: S5_CONFIRM_DETAILS
          expected_result: "Passenger details displayed correctly"
        - step: 7
          action: "Confirm and skip seats; print boarding pass"
          expected_state: S9_COMPLETE
          expected_result: "Boarding pass printed successfully"

    - id: TC-004
      title: "Invalid PNR - two retries then success on third attempt"
      category: "Error Path - PNR"
      priority: "High"
      description: >
        Verify the passenger can fail twice and succeed on the third (final) attempt.
      preconditions:
        - "PNR 'BAD001' and 'BAD002' do not exist; 'GOOD01' exists"
      path: "S0 -> S1 -> S2 -> S3 -> S4 -> S2 -> S3 -> S4 -> S2 -> S3 -> S5 -> ..."
      transitions_covered: [T01, T02, T03, T10, T11, T03, T10, T11, T03, T04]
      steps:
        - step: 1
          action: "Navigate to PNR entry screen"
          expected_state: S2_ENTER_PNR
          expected_result: "PNR entry displayed; attempt_count = 0"
        - step: 2
          action: "Enter 'BAD001' and submit"
          expected_state: S4_PNR_ERROR
          expected_result: "Error: '2 attempts remaining'"
        - step: 3
          action: "Press 'Try Again'; enter 'BAD002' and submit"
          expected_state: S4_PNR_ERROR
          expected_result: "Error: '1 attempt remaining'"
        - step: 4
          action: "Press 'Try Again'; enter 'GOOD01' and submit"
          expected_state: S5_CONFIRM_DETAILS
          expected_result: "Booking retrieved and details displayed"

    - id: TC-005
      title: "Invalid PNR - maximum 3 failed attempts forces return to start"
      category: "Error Path - PNR"
      priority: "Critical"
      description: >
        Verify that after 3 consecutive invalid PNR entries, the kiosk
        automatically returns to the start screen.
      preconditions:
        - "PNR 'WRONG1', 'WRONG2', 'WRONG3' all do not exist"
      path: "S0 -> S1 -> S2 -> S3 -> S4 -> S2 -> S3 -> S4 -> S2 -> S3 -> S0"
      transitions_covered: [T01, T02, T03, T10, T11, T03, T10, T11, T03, T12]
      steps:
        - step: 1
          action: "Navigate to PNR entry"
          expected_state: S2_ENTER_PNR
          expected_result: "PNR entry displayed"
        - step: 2
          action: "Enter 'WRONG1' and submit"
          expected_state: S4_PNR_ERROR
          expected_result: "Error shown; 2 attempts remaining"
        - step: 3
          action: "Retry with 'WRONG2'"
          expected_state: S4_PNR_ERROR
          expected_result: "Error shown; 1 attempt remaining"
        - step: 4
          action: "Retry with 'WRONG3'"
          expected_state: S0_START
          expected_result: "Maximum attempts reached message shown briefly; kiosk returns to start; session cleared"

    - id: TC-006
      title: "Invalid PNR format rejected at entry screen"
      category: "Error Path - PNR"
      priority: "Medium"
      description: >
        Verify that a PNR with invalid format (e.g., special characters,
        too short, too long) is rejected before sending to the backend.
      preconditions:
        - "Kiosk is at the PNR entry screen"
      path: "S2 -> S2 (no state change)"
      transitions_covered: []
      steps:
        - step: 1
          action: "Enter empty PNR and press Submit"
          expected_state: S2_ENTER_PNR
          expected_result: "Inline validation error: 'Please enter a valid booking reference'"
        - step: 2
          action: "Enter '@#$%^' and press Submit"
          expected_state: S2_ENTER_PNR
          expected_result: "Inline validation error; submit is not processed; attempt_count not incremented"
        - step: 3
          action: "Enter a single character 'A' and press Submit"
          expected_state: S2_ENTER_PNR
          expected_result: "Validation error for length requirement"

    # =========================================================================
    # SECTION 3: CANCEL BUTTON TESTS
    # =========================================================================
    - id: TC-007
      title: "Cancel from Airline Selection screen"
      category: "Cancel Path"
      priority: "High"
      description: "Verify Cancel button on airline selection returns to start."
      preconditions:
        - "Kiosk is at S1_SELECT_AIRLINE"
      path: "S1 -> S0"
      transitions_covered: [T15]
      steps:
        - step: 1
          action: "Press Cancel button on airline selection screen"
          expected_state: S0_START
          expected_result: "Kiosk returns to welcome screen; session data cleared"

    - id: TC-008
      title: "Cancel from PNR Entry screen"
      category: "Cancel Path"
      priority: "High"
      description: "Verify Cancel button on PNR entry returns to start."
      preconditions:
        - "Kiosk is at S2_ENTER_PNR; passenger has partially typed a PNR"
      path: "S2 -> S0"
      transitions_covered: [T16]
      steps:
        - step: 1
          action: "Press Cancel button while PNR is partially entered"
          expected_state: S0_START
          expected_result: "Kiosk returns to start; partial PNR input discarded; session cleared"

    - id: TC-009
      title: "Cancel from PNR Error screen"
      category: "Cancel Path"
      priority: "High"
      description: "Verify Cancel button on error screen returns to start."
      preconditions:
        - "Kiosk is at S4_PNR_ERROR after a failed PNR lookup"
      path: "S4 -> S0"
      transitions_covered: [T17]
      steps:
        - step: 1
          action: "Press Cancel button on the PNR error screen"
          expected_state: S0_START
