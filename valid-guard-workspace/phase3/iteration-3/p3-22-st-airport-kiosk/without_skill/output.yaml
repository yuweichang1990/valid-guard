          expected_result: "No Cancel button visible; only printing progress indicator shown"

    - id: TC-026
      title: "Session data isolation between consecutive users"
      category: "Security"
      priority: "Critical"
      description: >
        Verify that after one passenger completes check-in (or cancels/times out),
        no personal data from the previous session is visible to the next user.
      preconditions:
