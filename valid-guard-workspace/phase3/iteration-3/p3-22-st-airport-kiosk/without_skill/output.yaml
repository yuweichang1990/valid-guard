      path: "S9 -> S0 -> S1 -> S2"
      transitions_covered: [T09, T01, T02]
      steps:
        - step: 1
          action: "Complete a full check-in for passenger 'John Doe'"
          expected_state: S0_START
          expected_result: "Kiosk returns to start after completion"
        - step: 2
          action: "Start a new session; navigate to PNR entry"
          expected_state: S2_ENTER_PNR
          expected_result: >
            PNR field is empty; no previous passenger data visible;
            airline selection was not pre-filled from previous session
        - step: 3
          action: "Verify memory/logs do not expose previous passenger's PNR or details"
          expected_state: S2_ENTER_PNR
          expected_result: "No residual data from previous session accessible"

