example_mapping:
  story: >
    As a developer, I want to throttle function execution so that expensive
    operations (API calls, DOM updates, event handlers) are rate-limited to
    fire at most once per specified delay period.
  rules:
    - rule_name: "Immediate first execution"
      examples:
        - "First call with delay=200ms fires callback immediately"
        - "First call with delay=0 fires callback immediately"
        - "No calls made — callback never fires"

    - rule_name: "Subsequent calls are suppressed within the delay window"
      examples:
        - "Call at 50ms after first (delay=200ms) — suppressed"
        - "Call at 199ms after first (delay=200ms) — suppressed"
        - "100 rapid calls in 100ms (delay=200ms) — only first fires"
        - "Arguments from suppressed calls are discarded"

    - rule_name: "Callback fires again after delay expires"
      examples:
        - "Call at 200ms after first (delay=200ms) — fires"
        - "Call at 201ms after first (delay=200ms) — fires"
        - "Three calls at 0ms, 300ms, 600ms (delay=200ms) — all three fire"
        - "Timer restarts after each execution"

    - rule_name: "Zero or negative delay disables throttling"
      examples:
        - "delay=0 — all 5 rapid calls fire"
        - "delay=-1 — all 3 rapid calls fire"
        - "delay=-1000 — all calls fire"

    - rule_name: "Callback interface contract"
      examples:
        - "Arguments are forwarded to callback on executed calls"
        - "Return value is propagated on executed calls"
        - "this-context is preserved when called as object method"
        - "Callback exception does not break throttle state"

    - rule_name: "Instance isolation"
      examples:
        - "Two throttled wrappers with different delays have independent timers"
        - "Invoking one throttled wrapper does not affect the other"

