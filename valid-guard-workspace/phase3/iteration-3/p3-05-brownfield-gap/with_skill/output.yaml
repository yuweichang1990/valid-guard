  - name: "Terminal states reject all transitions"
    description: >
      CANCELLED and REFUNDED are terminal states with no valid outgoing
      transitions. Any transition attempt must raise InvalidTransitionError.
    type: state_transition
    risk: medium
    risk_rationale: "Impact: 2, Frequency: 1, Consequence: 3, Detectability: 2. Average: 2.0 -> medium."
    techniques:
