      - error_guessing
    technique_rationale: >
      State transition verifies terminal state enforcement. Error guessing
      targets attempts to re-activate cancelled/refunded orders.
    preconditions:
      - "Order is in CANCELLED or REFUNDED state"
    examples:
      - input:
          current_status: "CANCELLED"
          attempt: "PENDING"
        expected:
          raises: "InvalidTransitionError"
        description: "Cannot transition from CANCELLED to PENDING."
      - input:
          current_status: "CANCELLED"
          attempt: "CONFIRMED"
        expected:
          raises: "InvalidTransitionError"
        description: "Cannot transition from CANCELLED to CONFIRMED."
      - input:
          current_status: "REFUNDED"
          attempt: "DELIVERED"
        expected:
          raises: "InvalidTransitionError"
        description: "Cannot transition from REFUNDED to any state."
    status: uncovered
    priority: 2
    tags:
