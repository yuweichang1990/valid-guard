  - name: "Full valid state transition chain: PENDING through DELIVERED"
    description: >
      Walk the entire happy path: PENDING -> CONFIRMED -> PROCESSING ->
      SHIPPED -> DELIVERED. Only PENDING->CONFIRMED is currently tested.
    type: state_transition
    risk: high
