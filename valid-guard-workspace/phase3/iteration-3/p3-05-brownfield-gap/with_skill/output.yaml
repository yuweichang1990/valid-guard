          order_id: "NONEXISTENT"
        expected:
          raises: "KeyError"
        description: "Nonexistent order_id triggers KeyError."
    status: uncovered
    priority: 3
    tags:
      - refund
      - error-handling

  - name: "Refund restores inventory for all items"
    description: >
      After a successful refund, inventory for each item in the order must
      be restored by the ordered quantity.
    type: happy_path
    risk: high
    risk_rationale: "Impact: 3, Frequency: 2, Consequence: 3, Detectability: 1. Average: 2.25 -> medium."
    techniques:
      - equivalence_partitioning
      - error_guessing
    technique_rationale: >
      EP covers the standard multi-item refund. Error guessing checks
      that partial inventory state is handled (e.g., item was removed
      from inventory dict but .get defaults to 0).
    preconditions:
      - "Order is DELIVERED and within refund window"
    examples:
      - input:
          order_items: {"widget": 3, "gadget": 1}
          inventory_before_refund: {"widget": 7, "gadget": 4}
        expected:
          inventory_after_refund: {"widget": 10, "gadget": 5}
        description: "All items restored to pre-order levels."
    status: uncovered
    priority: 1
    tags:
      - refund
      - inventory
      - side-effect

  # ==========================================================================
  # apply_discount — UNCOVERED gap scenarios
  # ==========================================================================

  - name: "Discount boundary at 0% (exclusive) raises ValueError"
    description: >
      Discount must be between 0 (exclusive) and 100 (inclusive). 0% must
      be rejected. The existing test only checks 10%.
    type: boundary
    risk: medium
    risk_rationale: "Impact: 2, Frequency: 1, Consequence: 2, Detectability: 3. Average: 2.0 -> medium."
    techniques:
      - boundary_value
    technique_rationale: "BVA at the lower boundary of the discount range (0 exclusive)."
    preconditions:
      - "Order exists in PENDING status"
    examples:
      - input:
          discount_percent: "0"
        expected:
          raises: "ValueError"
          message_contains: "between 0 (exclusive) and 100"
        description: "0% discount is not allowed (exclusive lower bound)."
      - input:
          discount_percent: "-5"
        expected:
          raises: "ValueError"
        description: "Negative discount rejected."
      - input:
          discount_percent: "0.01"
        expected:
          succeeds: true
        description: "Smallest valid discount just above 0."
    status: uncovered
    priority: 2
    tags:
      - discount
      - boundary
      - validation

  - name: "Discount boundary at 100% (inclusive)"
    description: >
      100% discount is the upper boundary and must be accepted. Values
      above 100% must be rejected.
    type: boundary
    risk: medium
    risk_rationale: "Impact: 2, Frequency: 1, Consequence: 3, Detectability: 2. Average: 2.0 -> medium."
    techniques:
      - boundary_value
    technique_rationale: "BVA at the upper boundary of the discount range (100 inclusive)."
    preconditions:
      - "Order exists in PENDING status"
    examples:
      - input:
          discount_percent: "100"
        expected:
          succeeds: true
          new_subtotal: "0"
        description: "100% discount is valid, subtotal becomes 0."
      - input:
          discount_percent: "100.01"
        expected:
          raises: "ValueError"
        description: "100.01% exceeds maximum."
      - input:
          discount_percent: "150"
        expected:
          raises: "ValueError"
        description: "150% is clearly invalid."
    status: uncovered
    priority: 2
    tags:
      - discount
      - boundary
      - validation

  - name: "Discount on non-PENDING order raises InvalidTransitionError"
    description: >
      apply_discount only works on PENDING orders. Applying to CONFIRMED,
      PROCESSING, or other statuses must raise InvalidTransitionError.
    type: error_handling
    risk: medium
    risk_rationale: "Impact: 2, Frequency: 1, Consequence: 3, Detectability: 2. Average: 2.0 -> medium."
    techniques:
      - equivalence_partitioning
    technique_rationale: "All non-PENDING statuses form one invalid equivalence class."
    preconditions:
      - "Order exists in non-PENDING status"
    examples:
      - input:
          order_status: "CONFIRMED"
          discount_percent: "10"
        expected:
          raises: "InvalidTransitionError"
          message_contains: "only apply discount to pending orders"
        description: "Discount on CONFIRMED order rejected."
      - input:
          order_status: "DELIVERED"
          discount_percent: "10"
        expected:
          raises: "InvalidTransitionError"
        description: "Discount on DELIVERED order rejected."
    status: uncovered
    priority: 2
    tags:
      - discount
      - error-handling

  - name: "Discount recalculates tax, shipping, and total correctly"
    description: >
      After applying a discount, the order's tax, shipping, and total must
      all be recomputed. The existing test only verifies the discount
      amount, not the cascading effects.
    type: happy_path
    risk: high
    risk_rationale: "Impact: 3, Frequency: 2, Consequence: 3, Detectability: 1. Average: 2.25 -> medium."
    techniques:
      - equivalence_partitioning
      - cause_effect
    technique_rationale: >
      EP tests typical discount scenarios. Cause-effect captures the chain:
      discount -> new subtotal -> new tax -> new shipping -> new total.
    preconditions:
      - "Order exists in PENDING status"
    examples:
      - input:
          original_subtotal: "75.00"
          discount_percent: "10"
        expected:
          new_subtotal: "67.50"
          new_tax: "5.40"
          new_shipping: "0"
          new_total: "72.90"
        description: "10% off $75: new subtotal $67.50, still above $50 so free shipping."
    status: uncovered
    priority: 1
    tags:
      - discount
      - financial
      - cascading-effect

  - name: "Discount causes subtotal to drop below free shipping threshold"
    description: >
      If a discount reduces the subtotal from above $50 to below $50, the
      shipping fee must be added. This is a critical interaction between
      discount and shipping logic.
    type: edge_case
    risk: high
    risk_rationale: "Impact: 3, Frequency: 2, Consequence: 3, Detectability: 1. Average: 2.25 -> medium."
    techniques:
      - boundary_value
      - cause_effect
    technique_rationale: >
      BVA targets the $50 threshold crossing. Cause-effect maps the chain:
      high discount + borderline subtotal -> shipping fee appears.
    preconditions:
      - "Order subtotal is near $50 before discount"
    decision_table:
      conditions:
        - "original_subtotal"
        - "discount_percent"
      actions:
        - "new_subtotal"
        - "shipping_fee"
      rules:
        - description: "Subtotal stays above threshold after discount"
          condition_values:
            original_subtotal: "60.00"
            discount_percent: "10"
          expected_actions:
            new_subtotal: "54.00"
            shipping_fee: "0"
        - description: "Subtotal drops below threshold after discount"
          condition_values:
            original_subtotal: "60.00"
            discount_percent: "20"
          expected_actions:
            new_subtotal: "48.00"
            shipping_fee: "5.99"
        - description: "Subtotal exactly at threshold after discount"
          condition_values:
            original_subtotal: "100.00"
            discount_percent: "50"
          expected_actions:
            new_subtotal: "50.00"
            shipping_fee: "0"
    examples:
      - input:
          items: {"gadget": 2, "widget": 1}
          discount_percent: "20"
        expected:
          original_subtotal: "60.00"
          new_subtotal: "48.00"
          shipping: "5.99"
        description: "20% off $60 = $48 subtotal, now below $50 threshold, $5.99 shipping added."
    status: uncovered
    priority: 1
    tags:
      - discount
      - shipping
      - boundary
      - interaction

  - name: "Discount for nonexistent order raises KeyError"
    description: "apply_discount with unknown order_id must raise KeyError."
    type: error_handling
    risk: low
    risk_rationale: "Impact: 1, Frequency: 1, Consequence: 1, Detectability: 3. Average: 1.5 -> medium."
    techniques:
      - error_guessing
    technique_rationale: "Standard lookup-miss scenario."
    preconditions: []
    examples:
      - input:
          order_id: "NONEXISTENT"
          discount_percent: "10"
        expected:
          raises: "KeyError"
        description: "Nonexistent order_id triggers KeyError."
    status: uncovered
    priority: 4
    tags:
      - discount
      - error-handling

  # ==========================================================================
  # Cross-cutting concerns — UNCOVERED
  # ==========================================================================

  - name: "Order stored in processor.orders after creation"
    description: >
      After create_order, the order must be retrievable from
      self.orders[order_id]. No test verifies this state mutation.
    type: happy_path
    risk: medium
    risk_rationale: "Impact: 2, Frequency: 3, Consequence: 2, Detectability: 2. Average: 2.25 -> medium."
    techniques:
      - error_guessing
    technique_rationale: "Verifying internal state storage is an error-guessing concern."
    preconditions: []
    examples:
      - input:
          order_id: "ORD-1"
          items: {"widget": 1}
        expected:
          stored: true
          order_id_in_orders: true
        description: "Order is stored and accessible by ID."
    status: uncovered
    priority: 3
    tags:
      - create-order
      - state

  - name: "Inventory not decremented when create_order fails validation"
    description: >
      If create_order raises an error (e.g., empty items, unknown item),
      inventory must remain unchanged. Tests error path side effects.
    type: error_handling
    risk: high
    risk_rationale: "Impact: 3, Frequency: 1, Consequence: 3, Detectability: 1. Average: 2.0 -> medium."
    techniques:
      - error_guessing
    technique_rationale: >
      Error guessing targets the atomicity concern: does a failed order
      corrupt inventory state?
    preconditions:
      - "Known initial inventory"
    examples:
      - input:
          initial_inventory: {"widget": 10}
          items: {}
        expected:
          raises: "ValueError"
          inventory_unchanged: {"widget": 10}
        description: "Empty items fails, inventory untouched."
      - input:
          initial_inventory: {"widget": 10}
          items: {"widget": 999}
        expected:
          raises: "InsufficientStockError"
          inventory_unchanged: {"widget": 10}
        description: "Insufficient stock fails, inventory untouched."
    status: uncovered
    priority: 2
    tags:
      - create-order
      - inventory
      - atomicity

  - name: "Item in inventory but not in pricing (or vice versa)"
    description: >
      Edge case where an item exists in inventory but not in pricing, or
      exists in pricing but has zero inventory. These asymmetric states
      should be handled correctly.
    type: edge_case
    risk: low
    risk_rationale: "Impact: 1, Frequency: 1, Consequence: 2, Detectability: 3. Average: 1.75 -> medium."
    techniques:
      - error_guessing
    technique_rationale: "Data asymmetry between inventory and pricing dicts is a common config error."
    preconditions:
      - "Inventory and pricing have mismatched keys"
    examples:
      - input:
          inventory: {"widget": 10}
          pricing: {}
          items: {"widget": 1}
        expected:
          raises: "ValueError"
          message_contains: "Unknown item"
        description: "Item in inventory but not in pricing raises ValueError."
      - input:
          inventory: {}
          pricing: {"widget": "10.00"}
          items: {"widget": 1}
        expected:
          raises: "InsufficientStockError"
        description: "Item in pricing but not in inventory raises InsufficientStockError."
    status: uncovered
    priority: 4
    tags:
      - create-order
      - edge-case
      - config

# ===========================================================================
# Example Mapping
# ===========================================================================
example_mapping:
  story: >
    As an order management system, I process orders with accurate financial
    calculations, enforce valid state transitions, handle refunds within
    policy windows, and apply discounts with cascading recalculation.
  rules:
    - rule_name: "Order creation validates items, calculates subtotal, tax, shipping, and total"
      examples:
        - "Single item order: subtotal = price * qty, tax = subtotal * 0.08"
        - "Multi-item order: subtotal sums all (price * qty), tax computed on sum"
        - "Subtotal >= $50: free shipping ($0)"
        - "Subtotal < $50: shipping = $5.99"
        - "Total = subtotal + tax + shipping"
        - "Empty items dict: ValueError"
        - "Total items > 100: ValueError"
        - "Quantity <= 0: ValueError"
        - "Unknown item: ValueError"
        - "Insufficient stock: InsufficientStockError"
        - "Inventory decremented on success, unchanged on failure"

    - rule_name: "Order status transitions follow a strict state machine"
      examples:
        - "PENDING -> CONFIRMED or CANCELLED"
        - "CONFIRMED -> PROCESSING or CANCELLED"
        - "PROCESSING -> SHIPPED or CANCELLED"
        - "SHIPPED -> DELIVERED only"
        - "DELIVERED -> REFUNDED only"
        - "CANCELLED -> no transitions (terminal)"
        - "REFUNDED -> no transitions (terminal)"
        - "Invalid transition raises InvalidTransitionError"
        - "Cancellation from any allowed state restores inventory"

    - rule_name: "Refunds require DELIVERED status and 30-day window"
      examples:
        - "DELIVERED order at day 5: refund succeeds, status -> REFUNDED"
        - "DELIVERED order at day 30: refund still succeeds (> not >=)"
        - "DELIVERED order at day 31: ValueError (window expired)"
        - "Non-DELIVERED order: InvalidTransitionError"
        - "Refund sets refund_amount = total"
        - "Refund restores inventory for all items"

    - rule_name: "Discounts apply only to PENDING orders with valid percentage"
      examples:
        - "10% discount: subtotal reduced, tax/shipping/total recalculated"
        - "100% discount: subtotal becomes 0, valid"
        - "0% discount: rejected (exclusive lower bound)"
        - ">100% discount: rejected"
        - "Non-PENDING order: InvalidTransitionError"
        - "Discount crossing $50 threshold causes shipping fee to appear"

    - rule_name: "Financial calculations use Decimal precision"
      examples:
        - "Tax on $10.50: 10.50 * 0.08 = 0.84 (exact)"
        - "No floating-point rounding errors in subtotal, tax, or total"

