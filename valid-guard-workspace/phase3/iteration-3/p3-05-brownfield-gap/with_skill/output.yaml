    techniques:
      - state_transition
    technique_rationale: "Full path traversal of the order lifecycle state machine."
    preconditions:
      - "Order exists in PENDING status"
    state_transition:
      states:
        - "PENDING"
        - "CONFIRMED"
        - "PROCESSING"
        - "SHIPPED"
        - "DELIVERED"
        - "CANCELLED"
        - "REFUNDED"
      transitions:
        - from: "PENDING"
          to: "CONFIRMED"
          trigger: "transition_status(CONFIRMED)"
        - from: "CONFIRMED"
          to: "PROCESSING"
          trigger: "transition_status(PROCESSING)"
        - from: "PROCESSING"
          to: "SHIPPED"
          trigger: "transition_status(SHIPPED)"
        - from: "SHIPPED"
          to: "DELIVERED"
          trigger: "transition_status(DELIVERED)"
        - from: "DELIVERED"
          to: "REFUNDED"
          trigger: "transition_status(REFUNDED)"
        - from: "PENDING"
          to: "CANCELLED"
          trigger: "transition_status(CANCELLED)"
        - from: "CONFIRMED"
          to: "CANCELLED"
          trigger: "transition_status(CANCELLED)"
        - from: "PROCESSING"
          to: "CANCELLED"
          trigger: "transition_status(CANCELLED)"
    examples:
      - input:
          transitions: ["CONFIRMED", "PROCESSING", "SHIPPED", "DELIVERED"]
        expected:
          final_status: "DELIVERED"
        description: "Walk the full happy path from PENDING to DELIVERED."
      - input:
          transitions: ["CONFIRMED", "PROCESSING"]
        expected:
          final_status: "PROCESSING"
        description: "Partial chain stops at PROCESSING."
    status: uncovered
