        description: "Analytics Pipeline deprioritized — lowest risk across all dimensions"
    decision_table:
      conditions:
        - "code_changed"
        - "financial_impact_high"
        - "has_external_dependency_change"
        - "user_facing"
        - "blast_radius_high"
      actions:
        - "assign_full_regression"
        - "assign_smoke_test"
        - "assign_deprioritized"
      rules:
        - description: "Code changed + high financial impact → full regression"
          condition_values:
