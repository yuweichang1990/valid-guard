    technique_rationale: >
      DT maps the multi-factor prioritization decision. CE models the causal
      relationships between risk factors and prioritization outcomes.
    preconditions:
      - "Sprint change log is available"
      - "Service dependency map is documented"
      - "QA bandwidth constraint is known (2 full, 2 smoke, 1 skip)"
    examples:
      - input:
          service: "Payment Service"
          code_changed: true
          financial_impact: "high"
          external_dependencies: "payment_gateway"
          user_facing: true
          blast_radius: "high"
        expected:
          priority_tier: "tier_1_full_regression"
          rationale: "Direct code changes to financial-critical retry logic and new payment method"
        description: "Payment Service assigned to full regression due to code changes, financial impact, and blast radius"
      - input:
          service: "Order Fulfillment"
          code_changed: true
          financial_impact: "medium"
          external_dependencies: "shipping_carriers"
          user_facing: true
          blast_radius: "medium"
        expected:
          priority_tier: "tier_1_full_regression"
          rationale: "Direct code changes to external carrier integration affecting delivery SLA"
        description: "Order Fulfillment assigned to full regression due to code changes and external dependency risk"
      - input:
          service: "Product Catalog"
          code_changed: false
          financial_impact: "medium"
          external_dependencies: "inventory_service_updated"
          user_facing: true
          blast_radius: "medium"
        expected:
          priority_tier: "tier_2_smoke_test"
          rationale: "No code change but upstream dependency updated — verify data contract"
        description: "Product Catalog assigned to smoke test due to upstream dependency change"
      - input:
          service: "User Dashboard"
          code_changed: false
          financial_impact: "low"
          external_dependencies: "all_services"
          user_facing: true
          blast_radius: "low"
        expected:
          priority_tier: "tier_2_smoke_test"
          rationale: "No code change but consumes data from all modified services — verify display"
        description: "User Dashboard assigned to smoke test as downstream aggregator of all changed services"
      - input:
