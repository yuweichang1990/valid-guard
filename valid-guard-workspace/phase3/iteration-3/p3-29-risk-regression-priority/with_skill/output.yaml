  - name: "Shipping rate calculation — accurate rates with updated carrier"
    description: >
      Verify that shipping rate calculations return correct rates from the updated
      carrier, considering package dimensions, weight, destination, and service
      level. Rates must match carrier's published rates within acceptable tolerance.
    type: happy_path
    risk: high
    risk_rationale: >
      Impact: 3 (incorrect rates = financial loss or customer overcharge).
      Frequency: 3 (rate calculation happens for every order).
      Consequence: 3 (undercharging erodes margin, overcharging loses customers).
      Detectability: 1 (slight rate discrepancies may go unnoticed for weeks).
      Average: 2.5 → high.
    techniques:
      - boundary_value
      - equivalence_partitioning
      - decision_table
    technique_rationale: >
      BVA tests weight and dimension thresholds that trigger rate tier changes. EP
      partitions service levels and destination zones. DT maps the combinatorial
      rate calculation logic.
    preconditions:
      - "Updated carrier rate tables are loaded"
      - "Rate calculation service is accessible"
    examples:
      - input:
          weight_kg: 0.5
          dimensions_cm: [10, 10, 10]
          destination_zone: "local"
          service_level: "standard"
        expected:
          rate_matches_carrier: true
          rate_tolerance_percent: 0.01
        description: "Light small package — correct standard rate"
      - input:
          weight_kg: 30.0
          dimensions_cm: [100, 60, 60]
          destination_zone: "remote"
          service_level: "express"
        expected:
          rate_matches_carrier: true
          dimensional_weight_applied: true
        description: "Heavy oversized package — dimensional weight pricing applied"
    decision_table:
      conditions:
        - "weight_exceeds_standard_limit"
        - "dimensions_exceed_standard_limit"
        - "destination_is_remote"
        - "service_is_express"
      actions:
        - "surcharge_applied"
        - "dimensional_weight_used"
        - "remote_fee_added"
        - "express_premium_added"
      rules:
        - description: "Standard light local package — no surcharges"
          condition_values:
            weight_exceeds_standard_limit: false
            dimensions_exceed_standard_limit: false
            destination_is_remote: false
            service_is_express: false
          expected_actions:
            surcharge_applied: false
            dimensional_weight_used: false
            remote_fee_added: false
            express_premium_added: false
        - description: "Overweight express remote — all surcharges"
          condition_values:
            weight_exceeds_standard_limit: true
            dimensions_exceed_standard_limit: true
            destination_is_remote: true
            service_is_express: true
          expected_actions:
            surcharge_applied: true
            dimensional_weight_used: true
            remote_fee_added: true
            express_premium_added: true
        - description: "Oversized but local standard — dimensional weight only"
          condition_values:
            weight_exceeds_standard_limit: false
            dimensions_exceed_standard_limit: true
            destination_is_remote: false
            service_is_express: false
          expected_actions:
            surcharge_applied: false
            dimensional_weight_used: true
            remote_fee_added: false
            express_premium_added: false
