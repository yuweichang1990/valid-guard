            assign_smoke_test: false
            assign_deprioritized: false
        - description: "No code change + upstream dependency changed + user facing → smoke test"
          condition_values:
            code_changed: false
            financial_impact_high: false
            has_external_dependency_change: true
            user_facing: true
            blast_radius_high: false
          expected_actions:
            assign_full_regression: false
            assign_smoke_test: true
            assign_deprioritized: false
        - description: "No code change + downstream consumer only + not user facing → deprioritized"
          condition_values:
            code_changed: false
            financial_impact_high: false
            has_external_dependency_change: false
            user_facing: false
            blast_radius_high: false
          expected_actions:
            assign_full_regression: false
            assign_smoke_test: false
            assign_deprioritized: true
