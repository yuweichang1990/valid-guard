  # ===========================================================================

  - name: "Shipping carrier integration — successful shipment creation with updated carrier API"
    description: >
      Verify that the updated shipping carrier integration correctly creates
      shipments, generates tracking numbers, and returns estimated delivery dates
      using the new carrier API version or newly integrated carrier.
    type: happy_path
    risk: high
    risk_rationale: >
      Impact: 3 (shipping is core fulfillment path).
      Frequency: 3 (every fulfilled order requires carrier integration).
      Consequence: 3 (failed shipment creation blocks delivery).
      Detectability: 2 (fulfillment team sees failed shipments in queue).
      Average: 2.75 → high.
    techniques:
      - equivalence_partitioning
      - error_guessing
    technique_rationale: >
      EP partitions carrier types (domestic, international, express, freight). EG
      anticipates API version incompatibilities and response format changes.
    preconditions:
      - "Updated carrier integration is deployed"
      - "Carrier sandbox/test environment is available"
      - "Order is in 'paid' status ready for fulfillment"
    examples:
      - input:
          carrier: "updated_carrier"
          destination: "domestic"
          package_weight_kg: 2.5
          service_level: "standard"
        expected:
          shipment_created: true
          tracking_number_format: "valid"
          estimated_delivery_present: true
        description: "Standard domestic shipment created successfully with updated carrier"
      - input:
          carrier: "updated_carrier"
          destination: "international"
          package_weight_kg: 5.0
          service_level: "express"
        expected:
          shipment_created: true
          customs_declaration_generated: true
        description: "International express shipment with customs handling"
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - "order-fulfillment"
      - "carrier-integration"
      - "full-regression"
      - "tier-1"
      - "code-changed"

  - name: "Shipping carrier integration — carrier API error handling"
    description: >
      Verify that the updated integration handles carrier API errors gracefully:
      rate limit exceeded, invalid address, service unavailable, authentication
      failure, and malformed responses. Orders should not be stuck in limbo.
    type: error_handling
    risk: high
    risk_rationale: >
      Impact: 3 (carrier errors block fulfillment).
      Frequency: 2 (carrier APIs have periodic issues).
      Consequence: 3 (stuck orders, missed SLAs, customer complaints).
      Detectability: 2 (monitoring should catch fulfillment queue backlog).
      Average: 2.5 → high.
    techniques:
      - equivalence_partitioning
      - error_guessing
      - state_transition
    technique_rationale: >
      EP partitions error types (transient vs. permanent, client vs. server). EG
      anticipates real-world carrier failure modes. ST tracks order state through
      carrier failures.
    preconditions:
      - "Carrier API can be mocked to return various error responses"
    examples:
      - input:
          carrier_response: "429_rate_limited"
        expected:
          order_status: "pending_fulfillment"
          retry_scheduled: true
          alert_sent: false
        description: "Rate-limited response triggers automatic retry"
      - input:
          carrier_response: "400_invalid_address"
        expected:
          order_status: "address_validation_required"
          customer_notified: true
        description: "Invalid address triggers customer notification for correction"
      - input:
          carrier_response: "500_internal_error"
        expected:
          order_status: "pending_fulfillment"
          retry_scheduled: true
          alert_sent: true
        description: "Carrier server error triggers retry and ops alert"
      - input:
          carrier_response: "401_auth_failure"
        expected:
          order_status: "fulfillment_blocked"
          critical_alert: true
        description: "Auth failure blocks fulfillment and sends critical alert"
    state_transition:
      states: ["paid", "pending_fulfillment", "shipping_requested", "shipped", "fulfillment_blocked", "address_validation_required"]
      transitions:
        - from: "paid"
          to: "pending_fulfillment"
          trigger: "initiate_fulfillment"
          guard: "payment confirmed"
        - from: "pending_fulfillment"
          to: "shipping_requested"
          trigger: "carrier_api_call"
          guard: "valid address and items"
        - from: "shipping_requested"
          to: "shipped"
          trigger: "carrier_confirms_pickup"
          guard: "tracking number assigned"
        - from: "shipping_requested"
          to: "pending_fulfillment"
          trigger: "transient_carrier_error"
          guard: "retry count < max"
        - from: "shipping_requested"
          to: "fulfillment_blocked"
          trigger: "permanent_carrier_error"
          guard: "non-recoverable error"
        - from: "shipping_requested"
          to: "address_validation_required"
          trigger: "address_rejected"
          guard: "carrier returns invalid address"
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - "order-fulfillment"
      - "carrier-integration"
      - "error-handling"
      - "full-regression"
      - "tier-1"

