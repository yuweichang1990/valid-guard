  - name: "Inventory reservation consistency — product catalog shows correct availability during concurrent orders"
    description: >
      Verify that when the updated Inventory Service processes concurrent stock
      reservations, the Product Catalog reflects accurate availability. This tests
      the indirect impact of Inventory Service changes on Product Catalog's data
      accuracy under load.
    type: edge_case
    risk: medium
    risk_rationale: >
      Impact: 2 (incorrect stock display, potential overselling).
      Frequency: 2 (concurrent orders happen during sales events).
      Consequence: 2 (overselling requires cancellation and customer disappointment).
      Detectability: 2 (overselling detected at fulfillment time).
      Average: 2.0 → medium.
    techniques:
      - error_guessing
      - boundary_value
    technique_rationale: >
      EG anticipates race conditions in inventory updates. BVA tests the stock
      count boundary (last item, zero stock transition).
    preconditions:
      - "Product has limited stock (e.g., 2 units)"
      - "Multiple concurrent order requests can be simulated"
    examples:
      - input:
          product_stock: 2
          concurrent_orders: 3
        expected:
          orders_accepted: 2
          orders_rejected: 1
          catalog_shows_out_of_stock: true
        description: "Concurrent orders for limited stock — only available quantity fulfilled"
      - input:
          product_stock: 1
          concurrent_orders: 2
        expected:
          orders_accepted: 1
          orders_rejected: 1
          no_negative_stock: true
        description: "Last item race condition — exactly one order succeeds"
    test_ref: ""
    status: uncovered
    priority: 2
    tags:
      - "product-catalog"
      - "inventory"
      - "concurrency"
      - "smoke-test"
      - "tier-2"

example_mapping:
  story: >
    As a QA lead with limited bandwidth after a sprint, I need to determine which
    microservices to fully regression test, smoke test, or deprioritize, so that
    I maximize defect detection for the highest-risk changes while respecting the
    constraint of 2 full regressions and 2 smoke tests.
  rules:
    - rule_name: "Services with direct code changes get highest priority"
      examples:
        - "Payment Service has refactored retry logic AND new payment method → Tier 1 full regression"
        - "Order Fulfillment has updated carrier integration → Tier 1 full regression"
        - "Product Catalog has no code change → not Tier 1 even though it is user-facing"
    - rule_name: "Financial impact elevates priority within the same tier"
      examples:
        - "Payment Service handles money directly → higher priority than Order Fulfillment within Tier 1"
        - "Order Fulfillment affects delivery cost calculation → financial but secondary to payment"
        - "Analytics Pipeline has zero financial impact → lowest priority"
    - rule_name: "External dependency changes require at minimum smoke testing"
      examples:
        - "Product Catalog depends on updated Inventory Service → Tier 2 smoke test to verify data contract"
        - "Order Fulfillment depends on external carriers (integration changed) → amplifies Tier 1 need"
    - rule_name: "User-facing services take priority over internal services"
      examples:
        - "User Dashboard is user-facing but no code change → Tier 2 smoke test to verify display"
        - "Analytics Pipeline is internal, non-user-facing → Tier 3 deprioritized"
    - rule_name: "Blast radius determines scope of testing when in the same priority band"
      examples:
        - "Payment Service changes affect Order Fulfillment, Dashboard, and Analytics → high blast radius"
        - "Order Fulfillment changes affect Dashboard and Analytics → medium blast radius"
        - "Analytics Pipeline changes affect nothing downstream → zero blast radius"
    - rule_name: "Deprioritized services must still have monitoring and alerting"
      examples:
        - "Analytics Pipeline skipped for regression but monitored via data quality dashboards"
        - "If analytics data drift detected post-deployment, ad-hoc testing can be triggered"
    - rule_name: "Cross-service integration tests cover boundary interactions between Tier 1 services"
      examples:
        - "E2E test from payment (new method) through fulfillment (updated carrier) validates both changes"
        - "Compensation flow test for payment-success/fulfillment-failure validates failure mode handling"

