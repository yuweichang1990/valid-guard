    type: happy_path
    risk: high
    risk_rationale: >
      Impact: 3 (regression in existing payment methods affects all revenue).
      Frequency: 3 (every existing customer uses existing payment methods).
      Consequence: 3 (broken existing payment = immediate revenue loss).
      Detectability: 2 (users notice payment failures immediately).
      Average: 2.75 → high.
    techniques:
      - equivalence_partitioning
      - error_guessing
    technique_rationale: >
      EP ensures each existing payment method class is tested post-change. EG
      anticipates shared code path regressions introduced by the new method.
    preconditions:
      - "All existing payment methods remain configured"
      - "New payment method code is deployed alongside existing methods"
    examples:
      - input:
          payment_method: "credit_card"
          amount: 99.99
        expected:
          payment_status: "completed"
          regression: false
        description: "Credit card payment still works after new method added"
      - input:
          payment_method: "paypal"
          amount: 45.00
        expected:
          payment_status: "completed"
          regression: false
        description: "PayPal payment still works after new method added"
      - input:
          payment_method: "bank_transfer"
          amount: 200.00
        expected:
          payment_status: "completed"
          regression: false
        description: "Bank transfer still works after new method added"
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - "payment-service"
      - "regression"
      - "existing-methods"
      - "full-regression"
      - "tier-1"

  - name: "Payment retry — exponential backoff timing and configuration"
    description: >
      Verify that the refactored retry logic applies correct backoff strategy
      (e.g., exponential backoff with jitter) between retries, respects configured
      timeout limits, and does not overwhelm the payment gateway.
    type: edge_case
    risk: medium
    risk_rationale: >
      Impact: 2 (backoff timing affects system stability, not direct financial loss).
      Frequency: 2 (triggered during gateway instability).
      Consequence: 2 (wrong backoff could cause gateway throttling or SLA breach).
      Detectability: 2 (timing issues require monitoring to detect).
      Average: 2.0 → medium.
    techniques:
      - boundary_value
      - error_guessing
    technique_rationale: >
      BVA tests backoff intervals at configured boundaries (min delay, max delay).
      EG anticipates clock skew, jitter overflow, and zero-delay edge cases.
    preconditions:
      - "Retry backoff configuration is defined (base delay, max delay, jitter)"
    examples:
      - input:
          base_delay_ms: 100
          max_delay_ms: 5000
          retry_attempt: 1
        expected:
          actual_delay_range: [100, 200]
        description: "First retry uses base delay with bounded jitter"
      - input:
          base_delay_ms: 100
          max_delay_ms: 5000
          retry_attempt: 10
        expected:
          actual_delay_capped_at: 5000
        description: "High retry count caps delay at max_delay_ms"
    test_ref: ""
    status: uncovered
    priority: 2
    tags:
      - "payment-service"
      - "retry-logic"
      - "backoff"
      - "full-regression"
      - "tier-1"

  - name: "Payment retry — concurrent payment requests during retry window"
    description: >
      Verify that if a second payment request arrives for the same order while a
      retry is in progress, the system prevents double-processing and returns an
      appropriate conflict or in-progress response.
    type: edge_case
    risk: high
    risk_rationale: >
      Impact: 3 (concurrent payment = potential double charge).
      Frequency: 1 (rare race condition).
      Consequence: 3 (double charge, financial discrepancy).
      Detectability: 1 (silent — both requests may succeed independently).
      Average: 2.0 → elevated to high due to financial severity.
    techniques:
      - error_guessing
      - state_transition
    technique_rationale: >
      EG targets race conditions in concurrent payment processing. ST verifies
      the payment lock/mutex state prevents concurrent transitions.
    preconditions:
      - "Payment system supports concurrent requests"
      - "Locking mechanism exists for in-flight payments"
    examples:
      - input:
          order_id: "ORD-001"
          concurrent_payment_request: true
          first_request_status: "retrying"
        expected:
          second_request_result: "conflict_409"
          total_charges: 1
        description: "Concurrent payment rejected while retry in progress"
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - "payment-service"
      - "concurrency"
      - "race-condition"
      - "full-regression"
      - "tier-1"

  # ===========================================================================
  # TIER 1 — FULL REGRESSION: ORDER FULFILLMENT SERVICE
  # Rationale: Direct code changes to shipping carrier integration. External
  # dependency on third-party carriers. Failures directly affect delivery SLA
