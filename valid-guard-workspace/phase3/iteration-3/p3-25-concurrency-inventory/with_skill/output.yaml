feature: "Inventory Race Condition Prevention in E-Commerce Checkout"

feature_description: >
  Ensures that when a product has limited stock (specifically the last unit),
  concurrent checkout attempts by multiple users are handled correctly. Only
  one order must succeed; all others must receive an out-of-stock error. Covers
  race condition detection, overselling prevention mechanisms, locking strategies
  (pessimistic vs optimistic), cart-to-inventory consistency validation, and
  database transaction isolation levels.

risk_level: high

entry_point: greenfield

source:
  type: natural_language
  path: ""

