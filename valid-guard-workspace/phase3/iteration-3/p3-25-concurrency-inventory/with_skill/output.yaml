  - name: "Two simultaneous checkouts for the last unit — only one succeeds"
    description: >
      Product has exactly 1 unit in stock. User A and User B both have it in
      their carts and click Place Order at the same instant. The system must
      guarantee that exactly one order is confirmed and the other receives an
      out-of-stock error. No overselling may occur.
    type: edge_case
    risk: high
    risk_rationale: >
      Impact: 3 — core business logic and data integrity (inventory correctness).
      Frequency: 2 — occurs during flash sales and limited-edition drops.
      Consequence: 3 — overselling causes financial loss, fulfillment failure, and customer trust erosion.
      Detectability: 3 — silent failure; oversold orders appear normal until fulfillment fails.
      Average: 2.75 → high.
    techniques:
      - error_guessing
      - state_transition
      - cause_effect
    technique_rationale: >
      Error guessing targets the known concurrency pitfall of simultaneous last-unit
      checkout. State transition models the inventory-to-order lifecycle. Cause-effect
      captures the logical dependency between stock availability and order outcome.
    preconditions:
      - "Product SKU-LAST-1 has exactly 1 unit in inventory"
      - "User A has SKU-LAST-1 in cart with qty 1"
      - "User B has SKU-LAST-1 in cart with qty 1"
      - "Both users are authenticated"
      - "No inventory reservation mechanism has pre-locked stock at cart-add time"
    examples:
      - input:
          product_sku: "SKU-LAST-1"
          initial_stock: 1
          user_a_action: "place_order"
          user_b_action: "place_order"
          timing: "simultaneous"
        expected:
          successful_orders: 1
          failed_orders: 1
          final_stock: 0
          failed_order_error: "OUT_OF_STOCK"
        description: "Exactly one order succeeds, the other fails with out-of-stock. Final stock is zero."
      - input:
          product_sku: "SKU-LAST-1"
          initial_stock: 1
          user_a_action: "place_order"
          user_b_action: "place_order"
          timing: "user_b_50ms_after_user_a"
        expected:
          successful_orders: 1
          failed_orders: 1
          final_stock: 0
          failed_order_error: "OUT_OF_STOCK"
        description: "Near-simultaneous with slight delay — same correctness guarantee."
    state_transition:
      states:
        - "in_stock_1"
        - "reserved"
        - "sold"
        - "out_of_stock"
      transitions:
        - from: "in_stock_1"
          to: "reserved"
          trigger: "first_checkout_acquires_lock"
          guard: "stock >= requested_quantity"
        - from: "reserved"
          to: "sold"
          trigger: "payment_captured"
          guard: "reservation_valid"
        - from: "reserved"
          to: "in_stock_1"
          trigger: "payment_failed_or_timeout"
          guard: "reservation_expired"
        - from: "in_stock_1"
          to: "out_of_stock"
          trigger: "second_checkout_attempts_lock"
          guard: "stock < requested_quantity"
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - concurrency
      - race-condition
      - last-unit
      - critical-path

