  # ==========================================================================
  # S2: OVERSELLING PREVENTION MECHANISMS
  # ==========================================================================

  - name: "Stock counter never goes negative after concurrent decrements"
    description: >
      Verifies that the inventory count is protected by atomic operations and
      can never become negative, regardless of concurrency level. After all
      concurrent checkout attempts resolve, stock must be >= 0.
    type: edge_case
    risk: high
    risk_rationale: >
      Impact: 3 — negative stock is a data integrity violation.
      Frequency: 2 — occurs under concurrent load.
      Consequence: 3 — negative stock means orders were created for non-existent inventory.
      Detectability: 3 — negative values may persist silently in the database.
      Average: 2.75 → high.
    techniques:
      - boundary_value
      - error_guessing
    technique_rationale: >
      Boundary value tests the zero-stock boundary. Error guessing targets the
      classic non-atomic read-then-write pattern that allows negative stock.
    preconditions:
      - "Product has N units in stock (test with N=1, 5, 10)"
      - "M > N concurrent checkout attempts are made"
    examples:
      - input:
          initial_stock: 1
          concurrent_checkouts: 5
          qty_per_checkout: 1
        expected:
          final_stock: 0
          final_stock_non_negative: true
          successful_orders: 1
        description: "5 attempts on 1 unit — stock must never go below zero."
      - input:
          initial_stock: 5
          concurrent_checkouts: 20
          qty_per_checkout: 1
        expected:
          final_stock: 0
          final_stock_non_negative: true
          successful_orders: 5
        description: "20 attempts on 5 units — exactly 5 succeed, stock reaches zero."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
