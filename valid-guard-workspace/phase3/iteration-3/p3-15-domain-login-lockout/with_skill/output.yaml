# Valid Guard Test Plan
# Generated: 2026-03-14T09:00:00Z
# Source: natural language

feature: "Login Page Authentication"

feature_description: >
  Login page authentication system covering valid login with correct credentials,
  rejection of invalid credentials with generic error messages that prevent username
  enumeration, and account lockout after consecutive failed login attempts to
  mitigate brute-force attacks.

risk_level: high

entry_point: greenfield

source:
  type: natural_language
  path: ""

scenarios:
  # ==========================================================================
  # HAPPY PATH — Valid Login
  # ==========================================================================
  - name: "Successful login with valid username and password"
    description: >
      A registered user submits the correct username (or email) and password.
      The system authenticates the user and grants access, returning an
      authenticated session or token.
    type: happy_path
    risk: high
    risk_rationale: >
      Impact: 3, Frequency: 3, Consequence: 3, Detectability: 2. Average: 2.75 -> high.
      This is the core authentication gate. If valid users cannot log in,
      the entire application is inaccessible.
    techniques:
      - equivalence_partitioning
    technique_rationale: >
      Equivalence partitioning separates inputs into valid credential pairs
      (correct username + correct password) versus all invalid classes.
      This scenario covers the single valid equivalence class.
    preconditions:
      - "User account exists in the system and is active"
      - "User account is not locked"
      - "Login page is accessible"
    examples:
      - input:
          username: "alice@example.com"
          password: "C0rrect!Pass#2026"
        expected:
          status: 200
          authenticated: true
          redirect: "/dashboard"
          session_token: "non-empty"
        description: "Standard successful login with valid credentials."
      - input:
          username: "bob.smith@company.org"
          password: "V4lid$ecure!99"
        expected:
          status: 200
          authenticated: true
          session_token: "non-empty"
        description: "Another valid user logs in successfully to confirm class coverage."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - smoke
      - critical-path
      - authentication

  - name: "Successful login resets failed attempt counter"
    description: >
      A user who has accumulated some failed login attempts (below the lockout
      threshold) logs in successfully. The failed attempt counter resets to zero.
    type: happy_path
    risk: high
    risk_rationale: >
      Impact: 3, Frequency: 2, Consequence: 3, Detectability: 2. Average: 2.5 -> high.
      If the counter does not reset, a user who occasionally mistypes their
      password will eventually be locked out, causing a denial-of-service.
    techniques:
      - equivalence_partitioning
      - state_transition
    technique_rationale: >
      Equivalence partitioning identifies the class of users with 1..N-1 failed
      attempts. State transition verifies the counter-reset event moves the
      account back to a clean active state.
    preconditions:
      - "User account has 1-4 failed login attempts recorded"
      - "Account is not locked"
    examples:
      - input:
          username: "alice@example.com"
          password: "C0rrect!Pass#2026"
          prior_failed_attempts: 3
        expected:
          authenticated: true
          failed_attempt_count: 0
          account_state: "active"
        description: "3 prior failures, then correct password resets counter to 0."
      - input:
          username: "alice@example.com"
          password: "C0rrect!Pass#2026"
          prior_failed_attempts: 4
        expected:
          authenticated: true
          failed_attempt_count: 0
          account_state: "active"
        description: "4 prior failures (one below lockout), correct password resets counter."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - critical-path
      - authentication
      - lockout

  # ==========================================================================
  # ERROR HANDLING — Invalid Credentials
  # ==========================================================================
  - name: "Login with incorrect password for existing user"
    description: >
      A user submits a valid username but an incorrect password. The system
      rejects the attempt and returns a generic error message that does not
      reveal whether the username exists.
    type: error_handling
    risk: high
    risk_rationale: >
      Impact: 3, Frequency: 3, Consequence: 3, Detectability: 1. Average: 2.5 -> high.
      A specific error like 'wrong password' confirms the username exists,
      enabling enumeration attacks. This is a silent failure from the
      attacker's reconnaissance perspective.
    techniques:
      - equivalence_partitioning
      - error_guessing
    technique_rationale: >
      Equivalence partitioning: wrong password is the primary invalid class for
      the password input. Error guessing anticipates that developers may
      accidentally return a specific error message or different HTTP status
      code that leaks information.
    preconditions:
      - "User account exists and is active"
      - "Account is not locked"
    examples:
      - input:
          username: "alice@example.com"
          password: "Wr0ng!Password#1"
        expected:
          status: 401
          authenticated: false
          error_message: "Invalid username or password."
          session_token: null
        description: "Incorrect password returns generic error, not 'wrong password'."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - security
      - enumeration-prevention
      - authentication

  - name: "Login with non-existent username"
    description: >
      A user submits a username that does not exist in the system. The error
      message and response timing must be indistinguishable from the
      wrong-password case to prevent username enumeration.
    type: error_handling
    risk: high
    risk_rationale: >
      Impact: 3, Frequency: 3, Consequence: 3, Detectability: 1. Average: 2.5 -> high.
      A different response (different message, different HTTP status, or
      measurably different timing) enables username enumeration, which is
      a precursor to targeted attacks.
    techniques:
      - equivalence_partitioning
      - error_guessing
    technique_rationale: >
      Equivalence partitioning: non-existent username is the invalid class for
      the username input. Error guessing targets timing side-channels — if the
      system skips password hashing for non-existent users, the response is
      faster, leaking information.
    preconditions:
      - "No account exists with the submitted username"
    examples:
      - input:
          username: "nonexistent@example.com"
          password: "AnyPass!123"
        expected:
          status: 401
          authenticated: false
          error_message: "Invalid username or password."
          response_time_delta_ms: "<50"
        description: "Same generic error and similar response time as wrong-password case."
      - input:
          username: "totallyFake_user_99"
          password: "Random!Pass#456"
        expected:
          status: 401
          authenticated: false
          error_message: "Invalid username or password."
        description: "Non-email username format also returns generic error."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - security
      - enumeration-prevention
      - timing-attack

  - name: "Error message consistency between invalid username and invalid password"
    description: >
      Verifies that the error response for a wrong password on an existing
      account is byte-identical to the error response for a non-existent
      account. This is a direct enumeration-prevention control.
    type: security
    risk: high
    risk_rationale: >
      Impact: 3, Frequency: 3, Consequence: 3, Detectability: 1. Average: 2.5 -> high.
      If error messages differ in any way (message text, error code, HTTP
      status, response headers, or response body structure), automated
      tools can distinguish them and enumerate valid usernames.
    techniques:
      - equivalence_partitioning
      - error_guessing
      - cause_effect
    technique_rationale: >
      Equivalence partitioning compares the two invalid input classes.
      Error guessing anticipates subtle differences (extra fields in JSON,
      different capitalization, different response body length).
      Cause-effect maps the logical relationship: both causes (wrong password
      for real user, any password for fake user) must produce the same effect.
    preconditions:
      - "At least one valid user account exists"
    examples:
      - input:
          scenario_a:
            username: "alice@example.com"
            password: "WrongPass!1"
          scenario_b:
            username: "nobody@example.com"
            password: "WrongPass!1"
        expected:
          response_body_identical: true
          status_code_identical: true
          response_time_within_ms: 50
        description: "Both scenarios produce byte-identical response bodies and matching status codes."
    test_ref: ""
    status: uncovered
    priority: 1
    tags:
      - security
      - enumeration-prevention
      - critical-path

